<title>Officina dell'Inventore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECEAE6; --surface:#F8F7F5; --surface2:#E0DCD5; --line:#CBC5BB;
  --ink:#1E1C19; --muted:#655F56; --accent:#7A4E1D; --accent-ink:#FFFFFF;
  --bronze:#8A6A2E; --cond:#B3121B; --good:#2E6B4A; --warn:#9A5B12;
  --mark:#EFE3CF; --adv:#1E7A1E;
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --surface:#1E2125; --surface2:#2A2E33; --line:#3A3F46;
    --ink:#E9E6E1; --muted:#A39D94; --accent:#D9A15A; --accent-ink:#1A140C;
    --bronze:#D0AE6B; --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A;
    --mark:#3A2F20; --adv:#5FBF5F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1E2125; --surface2:#2A2E33; --line:#3A3F46;
  --ink:#E9E6E1; --muted:#A39D94; --accent:#D9A15A; --accent-ink:#1A140C;
  --bronze:#D0AE6B; --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A;
  --mark:#3A2F20; --adv:#5FBF5F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px 80px}
.wrap{max-width:760px;margin:0 auto;min-width:0}
html,body{overflow-x:hidden}
.featRow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.pgSel{max-width:60vw;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:600 .85rem var(--f-body)}
.hsub{color:var(--muted);font-size:.8rem;margin-top:4px}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;padding:9px 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 .8rem var(--f-body);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:grid;gap:18px;padding-top:16px}
h2{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0 0 8px;letter-spacing:.03em;color:var(--bronze)}
h3{font-size:.95rem;margin:0}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.grid6{display:grid;gap:8px;grid-template-columns:repeat(6,1fr)}
@media (max-width:420px){.grid6{grid-template-columns:repeat(3,1fr)}}
.field{display:grid;gap:3px;min-width:0}
.field input,.field select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-mono)}
.field select{font-family:var(--f-body);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;margin-top:2px}
.banner{background:var(--mark);border-radius:8px;padding:8px 12px;font-size:.85rem}
.banner.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .85rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--cond);border-color:var(--cond)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .82rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;cursor:pointer;color:var(--ink);font-family:var(--f-body)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.list{display:grid;gap:6px}
.tag{font:500 .7rem var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.tag.cb{background:var(--bronze);color:var(--surface)}
.tag.no{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.kv b{display:block;font:500 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.kv small{display:block;color:var(--muted);font-size:.72rem}
.txt{font-size:.9rem}
.txt p{margin:4px 0}
.atk{display:grid;gap:4px;font-size:.9rem}
.atk .l{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:4px}
.atk .l span:last-child{font-family:var(--f-mono);text-align:right}
.note{font-size:.82rem;color:var(--muted)}
.warnT{color:var(--warn)}
.cond{color:var(--cond);font-weight:600}
.adv{background:var(--adv);color:#fff;padding:0 3px;border-radius:3px}
.dis{background:var(--cond);color:#fff;padding:0 3px;border-radius:3px}
.overlay{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.overlay .card{width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
details+details{margin-top:6px}
details summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▸";color:var(--muted);font-weight:400}
details[open] summary::after{content:"▾"}
details .txt{margin-top:6px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.opt.bad{border-color:var(--warn)}
.opt.dim{opacity:.55}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:1px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.slot .lv{font:600 .95rem var(--f-mono);color:var(--bronze);text-align:center}
.slot select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .85rem var(--f-body)}
.slot.bad{border-color:var(--warn)}
.ctr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ctr .pips{display:flex;gap:6px;align-items:center}
.ctr b{font:600 1.05rem var(--f-mono);min-width:54px;text-align:center}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.low{background:var(--cond)}
.nodi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--mark)}
.nodi b{font:600 1.1rem var(--f-mono)}
.nodi.over{background:transparent;border:1px solid var(--cond);color:var(--cond)}
table.t{width:100%;border-collapse:collapse;font-size:.82rem}
table.t th,table.t td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:center}
table.t th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
table.t td:last-child,table.t th:last-child{text-align:left}
table.t tr.cur td{background:var(--mark)}
.hl{background:var(--mark);border-radius:6px;padding:2px 6px}
@media (prefers-reduced-motion: no-preference){.overlay .card{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
<header class="top">
  <div class="brand">
    <h1>Officina dell'Inventore</h1>
    <span class="row" style="gap:6px"><label class="label" for="pgSel">Personaggio</label><select id="pgSel" class="pgSel"></select></span>
  </div>
  <div class="hsub" id="hdrSub"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="inv">Inventore</button>
    <button role="tab" aria-selected="false" data-tab="mech">Mechanus</button>
    <button role="tab" aria-selected="false" data-tab="mer">Meraviglie</button>
    <button role="tab" aria-selected="false" data-tab="gad">Gadget</button>
    <button role="tab" aria-selected="false" data-tab="gioco">In gioco</button>
  </nav>
</header>
<main id="main"></main>
</div>
<div id="modal"></div>

<script>
const D = __DATI__;
const AR = __ARMI__;

/* ---------- utilità ---------- */
const mod=v=>Math.floor(((+v||10)-10)/2);
const sg=n=>(n>=0?'+':'')+n;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CONDIZIONI=['Azzoppat','Colt[oaie] alla sprovvista','Offuscat','Affaticat','Abbagliat','Accecat','Accovacciat','Affascinat','Assordat','Barcollant','Confus','Esaust','Frastornat','Immobilizzat','Impreparat','[Ii]n [Ll]otta','Inabil','Incorpore','Indifes','Inferm','Intralciat','Invisibil','Morent','Nauseat','Paralizzat','Scoss','Spaventat','In Preda al Panico','Pietrificat','Privo di Sensi','Priv[oaie] di sensi','Pron[oaie]','Rott','Sanguinant','Scheggiat','Stabilizzat','Stordit','Sempre pront','Trattenut'];
const COND_RE=new RegExp('\\b('+CONDIZIONI.join('|')+')([a-z]*)\\b','gi');
function rich(s){
  let h=esc(s);
  h=h.replace(COND_RE,m=>'<span class="cond">'+m+'</span>');
  h=h.replace(/\bSvantaggio\b/gi,m=>'<span class="dis">'+m+'</span>').replace(/\b(?<!s)[Vv]antaggio\b/g,m=>'<span class="adv">'+m+'</span>');
  return h.split('\n').map(p=>'<p>'+p+'</p>').join('');
}
const CAR=['For','Des','Cos','Int','Sag','Car'];
const ORD=n=>n+'°';
const DADI_SU={'1d2':'1d3','1d3':'1d4','1d4':'1d6','1d6':'1d8','1d8':'2d6','1d10':'2d8','1d12':'3d6','2d4':'2d6','2d6':'3d6','2d8':'3d8','3d6':'4d6','3d8':'4d8','4d6':'6d6'};
const DADI_GIU=Object.fromEntries(Object.entries(DADI_SU).map(([a,b])=>[b,a]));
const stepD=(d,n)=>{let x=d;for(let i=0;i<Math.abs(n);i++)x=(n>0?DADI_SU:DADI_GIU)[x]||x;return x;};
const TAGLIE=['Piccolissima','Minuta','Minuscola','Piccola','Media','Grande','Enorme','Mastodontica','Colossale'];
const TAGLIA=Object.fromEntries(Object.entries({Piccolissima:[8,8,8,-8],Minuta:[4,6,6,-4],Minuscola:[2,4,4,-3],Piccola:[1,2,2,-2],Media:[0,0,0,0],Grande:[-1,-2,-2,2],Enorme:[-2,-4,-4,3],Mastodontica:[-4,-6,-6,4],Colossale:[-8,-8,-8,8]}).map(([k,v])=>[k,{ca:v[0],txc:v[0],furt:v[1],vol:v[2],bmc:v[3]}]));
const tagliaPiu=(t,n)=>TAGLIE[Math.max(0,Math.min(8,TAGLIE.indexOf(t)+n))];
const passiTaglia=t=>TAGLIE.indexOf(t)-4;
/* modificatori temporanei e permanenti (come nell'app dei compagni) */
const MODCAMPI=[['ca','CA'],['caCont','CA di contatto'],['caImpr','CA impreparato'],['tpc','Tiri per colpire'],['danni','Danni'],['T','Tempra'],['R','Riflessi'],['V','Volontà'],['bmc','BMC'],['dmc','DMC'],['vel','Velocità (m)'],['iniz','Iniziativa'],['pfTemp','PF temporanei'],['taglia','Taglia (passi)']];
const CAR_N={For:'Forza',Des:'Destrezza',Cos:'Costituzione',Int:'Intelligenza',Sag:'Saggezza',Car:'Carisma'};
const effLista=ch=>ch==='aut'?(S.effettiAut=S.effettiAut||[]):(S.effetti=S.effetti||[]);
const effAttivi=ch=>effLista(ch).filter(e=>e.attivo);
const effSomma=(ch,k)=>effAttivi(ch).reduce((a,e)=>a+(+e[k]||0),0);
const effCar=(ch,k)=>effAttivi(ch).reduce((a,e)=>a+(+(e.car||{})[k]||0)+(+(e.carT||{})[k]||0),0);
const babList=s=>String(s).split('/').map(x=>parseInt(x));
const MECH=Object.fromEntries(D.mechanus.elenco.map(m=>[m.id,m]));
const TMOD=Object.fromEntries(D.tecno.mods.map(m=>[m.id,m]));
const EMOD=Object.fromEntries(D.eso.mods.map(m=>[m.id,m]));
const GAD=Object.fromEntries(D.gadget.elenco.map(g=>[g.id,g]));
const DOTE=Object.fromEntries(D.doti.map(d=>[d.id,d]));
const ARCH=Object.fromEntries(D.archetipi.map(a=>[a.id,a]));
const ARN=Object.fromEntries(D.arnesi.map(a=>[a.id,a]));
const ARM=Object.fromEntries(D.eso.armature.map(a=>[a.id,a]));
const OPT=[...D.tecno.optional.map(o=>({...o,ramo:'tecno'})),...D.automaton.optional.map(o=>({...o,ramo:'automaton'})),...D.eso.optional.map(o=>({...o,ramo:'eso'}))].map(o=>({...o,key:o.ramo+':'+o.id}));
const OPTK=Object.fromEntries(OPT.map(o=>[o.key,o]));
const RAMO_N={tecno:'Tecno-armi',automaton:'Automaton',eso:'Esoscheletri'};
const dividiPF=pf=>({fat:Math.floor(pf/2),fer:Math.ceil(pf/2)});

/* ---------- stato ---------- */
const VUOTO_GIOCO={indossa:'',attiviT:[],attiviE:[],rip:0,mech:[0,0,0,0,0,0],jolly:0,argus:0,tecnoC:0,esoC:{L:0,P:0},emett:0,gadget:{},overdrive:0,pfFat:null,pfFer:null,autPF:null,autTemp:null,tesla:0,note:''};
const DEFAULT={esempio:true,nome:'Esempio — Tessa Ingranaggi',livello:8,taglia:'Media',car:{For:12,Des:14,Cos:14,Int:18,Sag:10,Car:8},archetipi:[],spec:'',
  scelte:{1:{k:'gadget',id:'scanner'},2:{k:'optional',id:'tecno:modulo_di_penetrazione_da_cantiere'},3:{k:'gadget',id:'torretta_automatica'},4:{k:'dote',id:'mechanus_potenziati'},5:{k:'gadget',id:'lente_analitica'},6:{k:'optional',id:'automaton:riparazione_automatica'},7:{k:'gadget',id:'ragno_meccanico'},8:{k:'dote',id:'riparazioni_extra'}},
  mechConosciuti:['criogenico','elettrificante','generatore_di_campo','puntatore','lanciarazzi','analizzatore','ingrassatore','occultante','congelante','killer_cercatore','intrappolante','crampi_elettro_muscolari','assordante','marcatore','accecante','folgorante','idrante','impallinatore'],
  tecno:{arma:'mazzuolo',man:{nome:'Arma',dado:'1d8',critico:'x2',tipo:'C',cat:'una'},pot:1,accurata:false,mods:['chip_di_combattimento_assistito_superiore']},
  aut:{modello:'destructor',grande:false,incArma:1,incScocca:1,optimus:false},
  esoTipo:'P',esos:{L:{armatura:'giaco_di_maglia',pot:0,mods:[]},P:{armatura:'mezza_armatura',pot:0,mods:['potenziamento_strutturale_2_P','scocca_anti_urto_P']}},
  sint:{armi:'a',armiSlot:0,arm:'a',armSlot:0},cap:{tecno:[],esoL:[],esoP:[],autArma:[],autScocca:[]},scoperte:[],innesti:[],armaturaNormale:'corpetto_di_cuoio_borchiato',scudo:0,bonus:{ca:0,colpire:0,danni:0,tempra:0,rif:0,vol:0},pfMan:'',
  gioco:JSON.parse(JSON.stringify(VUOTO_GIOCO)),effetti:[{id:'e1',nome:'Anello di protezione +1',perm:true,attivo:true,ca:1,caCont:1,caImpr:1,car:{},carT:{}},{id:'e2',nome:'Forza del toro',perm:false,attivo:false,car:{For:4},carT:{}}],effettiAut:[],tab:'inv',sub:'tecno'};
function nuovoPg(n){const s=JSON.parse(JSON.stringify(DEFAULT));return Object.assign(s,{esempio:false,nome:n||'Nuovo inventore',livello:1,scelte:{},mechConosciuti:[],effetti:[],effettiAut:[],
  tecno:{arma:'',man:{nome:'Arma',dado:'1d6',critico:'x2',tipo:'C',cat:'una'},pot:0,accurata:false,mods:[]},aut:{modello:'destructor',grande:false,incArma:0,incScocca:0,optimus:false},
  esos:{L:{armatura:'',pot:0,mods:[]},P:{armatura:'',pot:0,mods:[]}},armaturaNormale:'',car:{For:10,Des:12,Cos:12,Int:16,Sag:10,Car:10}});}
const KEY='officina-inventore-v1';
let G=loadG(), S=fill(G.dati[G.attivo]);
function loadG(){
  try{const r=localStorage.getItem(KEY);if(r){const g=JSON.parse(r);if(g&&g.dati&&g.dati[g.attivo])return g;}}catch(e){}
  const id='p'+Date.now();return {attivo:id,dati:{[id]:JSON.parse(JSON.stringify(DEFAULT))}};
}
function save(){G.dati[G.attivo]=S;try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}}
function fill(s){for(const k in DEFAULT)if(s[k]===undefined)s[k]=JSON.parse(JSON.stringify(DEFAULT[k]));for(const k in VUOTO_GIOCO)if(s.gioco[k]===undefined)s.gioco[k]=JSON.parse(JSON.stringify(VUOTO_GIOCO[k]));return s;}

/* ---------- regole di classe ---------- */
const lv=()=>Math.max(1,Math.min(20,+S.livello||1));
const INT=()=>mod(S.car.Int);
const has=a=>S.archetipi.includes(a);
const perde=k=>S.archetipi.some(a=>ARCH[a].perde.includes(k));
const haTecno=()=>!perde('tecno');
const haAut=()=>lv()>=3&&!perde('automaton');
const haEso=()=>!perde('eso')&&(lv()>=5||(has('cibernetico')&&lv()>=3));
const haMech=()=>!perde('mechanus');
const cd=()=>10+Math.floor(lv()/2)+INT();
function tocca(a){
  const out=new Set();
  for(const c of ARCH[a].capacita)for(const s of [c.sost,c.mod]){
    if(!s)continue;
    if(/^Riparazioni/.test(s))out.add('riparazioni');
    else if(/^Fabbro/.test(s))out.add('fabbro');
    else if(/^Mechanus/.test(s))out.add('mechanus');
    else if(/^Tecno-armi/.test(s))out.add('tecno');
    else if(/^Automaton/.test(s))out.add('automaton');
    else if(/^Esoscheletri/.test(s))out.add('eso');
    else if(/^Aggiornamento finale/.test(s))out.add('aggfinale');
    else if(/^Gadget/.test(s))(s.match(/\d+/g)||[]).forEach(n=>out.add('slot'+n));
  }
  return out;
}
function conflitti(id){const t=tocca(id);return S.archetipi.filter(a=>a!==id&&[...tocca(a)].some(x=>t.has(x)));}
function slotArchetipo(){const m={};for(const a of S.archetipi)for(const n of ARCH[a].slot)m[n]=a;return m;}
function slots(){
  const L=lv(),sa=slotArchetipo(),out=[];
  for(let n=1;n<=L;n++){
    const tipo=(n%2&&n<=11)?'gadget':(n%2===0&&n<=18)?'libero':null;
    if(!tipo)continue;
    out.push({liv:n,tipo,arch:sa[n]||null});
  }
  return out;
}

  }else{

    att2.push({nome:'Schianto',txc:bab.map(b=>b+mF+T.txc+(alpha?1:0)),dan:d+sg(mF+(alpha&&L>=5?2:0)+istrice).replace('+0',''),crit:'20/x2',tipo:'C',nota:'non incantabile'});
    const ric=st>=1;const lista=bab.map(b=>b+mD+bonusTxc+odG);if(ric)lista.unshift(bab[0]+mD+bonusTxc+odG);
    att2.push({nome:'Sparaculei',txc:lista,dan:stepD('1d8',passiTaglia(tg))+sg(Math.floor(mD/2)+bonusDan+odG).replace('+0',''),crit:critUp('20/x3'),tipo:autOpt('aculei_differenziati')?'P, C o T':'P',nota:'gittata '+(30+(ric?6:0))+' m (x5)'+(ric?' · colpo extra con attacco completo':'')});
  }
  let vel=6+(alpha?3:0)+(odA&&od?3:0)+effSomma('aut','vel');
  let portata={Grande:3,Enorme:4.5,Mastodontica:6,Colossale:9}[tg]||1.5;if(alpha)portata+=1.5;
  const bmc=bab[0]+mF+T.bmc+effSomma('aut','bmc'),dmc=10+bab[0]+mF+mD+T.bmc+effSomma('aut','dmc');
  const inc=ab;
  return {r,M0,tg,For,Des,mF,mD,ca,pf,temp,bab,att:att2,vel,portata,bmc,dmc,inc,st,alpha,
    ts:{tempra:r.tempra+effSomma('aut','T'),rif:r.rif+mD+effSomma('aut','R'),vol:r.vol+effSomma('aut','V')},pfTempEff:effSomma('aut','pfTemp'),rd:st>=3?'RD 10/adamantio':'',ri:alpha&&L>=10?11+L:0};
}

function problemaScelta(n,x){
  if(!x)return '';
  const altri=Object.entries(S.scelte).filter(([k,v])=>+k!==n&&+k<=lv()&&scelta(+k)&&v.k===x.k&&v.id===x.id);
  if(x.k==='gadget'){const g=GAD[x.id];if(!g)return 'gadget sconosciuto';if(g.req>n)return 'richiede il '+ORD(g.req)+' livello';if(altri.length||gadgetBonus().some(b=>b.id===x.id))return 'già posseduto';
    if(/Pilotare/.test(g.reqExtra||''))return '';return '';}
  if(x.k==='dote'){const d=DOTE[x.id];if(!d)return 'dote sconosciuta';if(d.req>n)return 'richiede il '+ORD(d.req)+' livello';if(altri.length||(has('skitari')&&x.id==='competenza_nelle_armi_sperimentali'))return 'già scelta';
    for(const p of d.prereq){const ok=Object.entries(S.scelte).some(([k,v])=>+k<n&&scelta(+k)&&v.k==='dote'&&v.id===p);if(!ok)return 'richiede '+(DOTE[p]?DOTE[p].nome:p);}return '';}
  if(x.k==='optional'){const o=OPTK[x.id];if(!o)return 'optional sconosciuto';if(o.req>n)return 'richiede il '+ORD(o.req)+' livello';if(altri.length)return 'già scelto';
    if(o.ramo==='tecno'&&!haTecno())return 'l\'archetipo non ha tecno-armi';if(o.ramo==='automaton'&&perde('automaton'))return 'l\'archetipo non ha automaton';if(o.ramo==='eso'&&perde('eso'))return 'l\'archetipo non ha esoscheletri';
    for(const p of o.prereq||[]){const ok=Object.entries(S.scelte).some(([k,v])=>+k<n&&scelta(+k)&&v.k==='optional'&&v.id===o.ramo+':'+p);if(!ok)return 'richiede '+p.replace(/_/g,' ');}return '';}
  return '';
}
function rigaSlot(s){
  if(s.arch){const a=ARCH[s.arch];const c=a.capacita.find(c=>(c.sost||'').includes(s.liv+'°'));
    return '<div class="slot"><span class="lv">'+ORD(s.liv)+'</span><div><span class="note">Sostituito da </span><b>'+esc(c?c.nome:a.nome)+'</b> <span class="tag">'+esc(a.nome)+'</span></div></div>';}
  const x=S.scelte[s.liv];const pb=problemaScelta(s.liv,x);
  let o='<option value="">— scegli —</option>';
  const val=x?x.k+'|'+x.id:'';
  const opzG=D.gadget.elenco.map(g=>'<option value="gadget|'+g.id+'"'+(val==='gadget|'+g.id?' selected':'')+(g.req>s.liv?' disabled':'')+'>'+esc(g.nome)+(g.req>1?' ('+ORD(g.req)+')':'')+'</option>').join('');
  if(s.tipo==='gadget')o+=opzG;
  else{
    o+='<optgroup label="Gadget">'+opzG+'</optgroup>';
    for(const r of ['tecno','automaton','eso'])o+='<optgroup label="Optional — '+RAMO_N[r]+'">'+OPT.filter(p=>p.ramo===r).map(p=>'<option value="optional|'+p.key+'"'+(val==='optional|'+p.key?' selected':'')+(p.req>s.liv?' disabled':'')+'>'+esc(p.nome)+(p.req>1?' ('+ORD(p.req)+')':'')+'</option>').join('')+'</optgroup>';
    o+='<optgroup label="Doti da inventore">'+D.doti.map(d=>'<option value="dote|'+d.id+'"'+(val==='dote|'+d.id?' selected':'')+(d.req>s.liv?' disabled':'')+'>'+esc(d.nome)+(d.req>1?' ('+ORD(d.req)+')':'')+'</option>').join('')+'</optgroup>';
  }
  return '<div class="slot'+(pb?' bad':'')+'"><span class="lv">'+ORD(s.liv)+'</span><div><select data-slot="'+s.liv+'" aria-label="Scelta del '+ORD(s.liv)+' livello">'+o+'</select>'+(pb?'<div class="note warnT">'+esc(pb)+'</div>':'')+'</div></div>';
}

/* =================== TAB MERAVIGLIE =================== */
function rMer(){
  const subs=[];if(haTecno())subs.push(['tecno','Tecno-arma']);if(haAut()||(!perde('automaton')))subs.push(['aut','Automaton']);if(!perde('eso'))subs.push(['eso','Esoscheletro']);if(has('tecnomante'))subs.push(['emett','Emettitore']);
  if(!subs.some(s=>s[0]===S.sub))S.sub=subs[0]?subs[0][0]:'';
  let h='<section class="panel"><div class="seg">'+subs.map(([k,n])=>'<button data-sub="'+k+'" aria-pressed="'+(S.sub===k)+'">'+n+'</button>').join('')+'</div>';
  h+=({tecno:mTecno,aut:mAut,eso:mEso,emett:mEmett}[S.sub]||(()=>''))();
  h+='</section>';
  main.innerHTML=h;
  onAll('[data-sub]','click',el=>{S.sub=el.dataset.sub;render();});
  ({tecno:bTecno,aut:bAut,eso:bEso,emett:()=>{}}[S.sub]||(()=>{}))();
}
/* --- tecno-arma --- */

    '<div class="note" style="margin-top:8px">'+esc(w.nome)+': '+esc(C.dado)+', '+esc(w.critico)+', '+esc(w.tipo)+(w.speciale&&w.speciale!=='—'?', '+esc(w.speciale):'')+(w.gittata&&w.gittata!=='—'?', gittata '+esc(w.gittata):'')+'.</div></div>';

  h+='<div class="card"><h2>Tecno-arma</h2><div class="kv">'+kv('Cariche',caricheTecno(),'½ liv. + Int'+(hasOpt('tecno:riciclatore_energetico_per_tecno_armi')?' + 2':'')+(has('ingegnere_da_campo')?' + 1':''))+kv('Stadio',STADIO_TL[st]+'°',STADIO_N[st])+kv('Nodi',usati+'/'+nm,'limite: stadio e Int')+'</div>'+

/* --- automaton --- */

  if(L<3)return '<div class="card"><h2>Automaton</h2><p>L\'inventore impara a costruire gli automaton al 3° livello.</p></div>';

    '<div class="txt note" style="margin-top:8px">'+D.automaton.modelli[A.modello].righe.map(rich).join('')+'</div>'+
    '<div class="note" style="margin-top:8px">Sintonia meccanica: arma e scocca hanno bonus di potenziamento <b>+'+X.inc+'</b> (+1 dal 3°, +2 dal 10°; con la specializzazione +3 dal 15°, +4 dal 17°, +5 al 20°).'+(A.modello==='sagittar'?' Lo schianto del Sagittar non riceve il bonus né capacità speciali.':'')+'</div>'+

    (X.alpha&&L>=20?'<label class="check" style="margin-top:8px"><input type="checkbox" id="a-op"'+(A.optimus?' checked':'')+'>Scocca “Optimus prime”: Enorme</label>':'')+'</div>';
  const pf=X.pf;
  h+='<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+(X.alpha?'Automaton alpha':'Automaton')+' '+esc(X.M0.nome)+'</h2><span class="tag">'+X.tg+' · costrutto</span></div><div class="kv" style="margin-top:10px">'+
    kv('PF',pf,'10 + 6/DV + bonus'+(X.temp?' · +'+X.temp+' temp.':''))+kv('CA',X.ca)+kv('DV',X.r.dv)+kv('BAB',esc(X.r.bab))+
    kv('Tempra',sg(X.ts.tempra))+kv('Riflessi',sg(X.ts.rif))+kv('Volontà',sg(X.ts.vol))+
    kv('For',X.For,sg(X.mF))+kv('Des',X.Des,sg(X.mD))+kv('BMC / DMC',sg(X.bmc)+' / '+X.dmc)+kv('Velocità',X.vel+' m')+kv('Portata',String(X.portata).replace('.',',')+' m')+
    (X.ri?kv('RI',X.ri):'')+(X.rd?kv('RD','10/adam.'):'')+'</div>'+
    '<div class="atk" style="margin-top:10px">'+X.att.map(a=>'<div class="l"><span>'+esc(a.nome)+(a.nota?' <span class="note">'+esc(a.nota)+'</span>':'')+'</span><span>'+a.txc.map(sg).join('/')+' ('+esc(a.dan)+' '+esc(a.tipo)+'; '+esc(a.crit)+')</span></div>').join('')+'</div>'+
    '<div class="note" style="margin-top:6px">Gli attacchi dell\'automaton funzionano come armi: attacchi multipli secondo il BAB; lo schianto del Destructor è a due mani (1½ × For), gli altri usano la For intera. A 0 PF è <span class="cond">barcollante</span>, a −15 PF è distrutto. Car 1, immune a Tempra (salvo effetti su oggetti).</div></div>';
  h+=pannelloCap('autArma',A.modello==='sagittar'?'distanza':'mischia',X.inc,'Capacità speciali: '+(A.modello==='destructor'?'Schianto idraulico':A.modello==='defensor'?'Schianto meccanico':'Sparaculei'),true);
  h+=pannelloCap('autScocca','armatura',X.inc,'Capacità speciali: scocca',false);
  h+=cardModificatori('aut');
  // stadi

    const blocco=s>st;
    h+='<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+STN[s]+'</h2><span class="tag'+(blocco?'':' acc')+'">'+(blocco?(s>=2&&L>=15?'solo specializzazione':'dal '+ORD(STADIO_AL[s])):'attivo')+'</span></div><div style="margin-top:8px">'+v.map(x=>det(esc(x.nome),rich(x.testo))).join('')+'</div></div>';

  if(X.alpha){const AL=ARCH.mechautarca.capacita.find(c=>c.nome==='Automaton alpha');h+='<div class="card"><h2>Migliorie alpha</h2>'+det('Automaton alpha',rich(AL.testo),'',true)+'</div>';}

  h+='<div class="card"><h2>Regole</h2>'+D.automaton.regole.map(r=>det(esc(r.nome),rich(r.testo))).join('')+'</div>';

      for(const m of el){

          '<details style="border:0;padding:0;background:none"><summary><span>'+esc(m.nome)+(m.passiva?' <span class="tag">passiva</span>':'')+(m.sempre?' <span class="tag">sempre attiva</span>':'')+(scop?' <span class="tag acc">scoperta</span>':'')+'</span></summary><div class="txt">'+rich(m.testo)+(m.incompatSpeciale?'<p class="note">Non si combina con la capacità speciale '+esc(m.incompatSpeciale)+' dell\'armatura base.</p>':'')+'</div></details><span class="tag cb">'+m.nodi+' n</span></div>';

  }

function gadTag(g){const L=lv();const m=g.migliorie.filter(x=>x<=L+(hasDote('fanatico_dei_gadget')?2:0));return m.length?'<span class="tag acc">migliorie: '+m.map(ORD).join(', ')+'</span>':'';}
function gadInfo(g){
  const r=[];
  if(g.req>1)r.push('Requisito: '+ORD(g.req)+' livello'+(g.reqExtra?', '+g.reqExtra:''));
  else if(g.reqExtra)r.push('Requisito: '+g.reqExtra);
  if(g.sperimentale){r.push('Arma sperimentale'+(hasDote('competenza_nelle_armi_sperimentali')?'':' — serve la dote Competenza nelle armi sperimentali'));
    if(has('skitari')){const L=lv();r.push('Skitari: conta come livello '+(L+(L>=10?2:1))+', '+(L>=16?3:2)+' attivazioni al giorno (1 ora tra una e l\'altra), CD '+(cd()+(L>=7?2:L>=4?1:0)));}
    else r.push('CD '+cd());}
  const ch=caricheGad(g);if(ch)r.push('Cariche: '+ch);
  if(g.usi)r.push(g.usi+' attivazioni al giorno');
  return r.length?'<p class="note">'+r.map(esc).join(' · ')+'</p>':'';
}
function caricheGad(g){
  const I=Math.max(0,INT());
  if(g.id==='scanner'){if(has('tecno_infiltratore')&&lv()>=5)return 5+I;return 3+I;}
  if(g.id==='lente_analitica')return 3+I;
  if(g.id==='voltometro_a_campo_logico')return 3+2*I;
  return 0;
}

    '<div class="pips"><button class="btn sm" data-ctr="'+key+'" data-d="1"'+(left<=0?' disabled':'')+' aria-label="Usa">−</button><b>'+left+'/'+max+'</b><button class="btn sm" data-ctr="'+key+'" data-d="-1"'+(used<=0?' disabled':'')+' aria-label="Recupera">+</button></div></div>';

/* ---------- modificatori ---------- */
function riassuntoEff(e){
  const p=[];
  for(const [k,l] of MODCAMPI)if(+e[k])p.push(l.replace(' (m)','').replace(' (passi)','')+' '+sg(+e[k])+(k==='vel'?' m':''));
  for(const k of CAR){const v=(+(e.car||{})[k]||0)+(+(e.carT||{})[k]||0);if(v)p.push(k+' '+sg(v));}
  return p.join(', ')||'nessun valore';
}
function cardModificatori(ch){
  const l=effLista(ch);
  return '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Modificatori'+(ch==='aut'?' dell\'automaton':'')+'</h2><button class="btn sm pri" data-modbtn="'+ch+'">Gestisci</button></div>'+
    (l.length?'<div class="chips" style="margin-top:8px">'+l.map((e,i)=>'<button class="chip" data-tog="'+ch+'|'+i+'" aria-pressed="'+!!e.attivo+'">'+esc(e.nome)+(e.perm?' · perm.':'')+'</button>').join('')+'</div><p class="note">Tocca un modificatore per attivarlo o disattivarlo. I valori li includono già.</p>':
     '<p class="note">Nessun modificatore. Aggiungi incantesimi, effetti o oggetti magici con Gestisci.</p>')+'</div>';
}
function bindModificatori(){
  onAll('[data-modbtn]','click',el=>apriModificatori(el.dataset.modbtn));
  onAll('[data-tog]','click',el=>{const [ch,i]=el.dataset.tog.split('|');const e=effLista(ch)[+i];e.attivo=!e.attivo;render();});
}
function apriModificatori(ch){
  const L2=effLista(ch);
  const blocco=perm=>{
    const l=L2.map((e,i)=>({e,i})).filter(x=>!!x.e.perm===perm);
    return '<h3 style="margin:14px 0 6px">'+(perm?'Permanenti (oggetti magici e simili)':'Temporanei (incantesimi ed effetti)')+'</h3><div class="list">'+
      (l.length?l.map(({e,i})=>'<div class="featRow"><label class="check" style="flex:1"><input type="checkbox" data-matt="'+i+'"'+(e.attivo?' checked':'')+'><span><b>'+esc(e.nome)+'</b><br><span class="note">'+esc(riassuntoEff(e))+'</span></span></label><button class="btn sm" data-med="'+i+'">Modifica</button></div>').join(''):'<p class="note">Nessuno.</p>')+
      '</div><button class="btn sm" data-mnuovo="'+(perm?1:0)+'" style="margin-top:8px">Aggiungi '+(perm?'permanente':'temporaneo')+'</button>';
  };
  modal('<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Modificatori'+(ch==='aut'?' dell\'automaton':' dell\'inventore')+'</h2><button class="btn sm" data-close>Chiudi</button></div><p class="note">Si sommano ai valori della scheda. Le tre CA sono separate: un bonus di deviazione va messo su tutte e tre, un bonus di armatura naturale su CA e impreparato. La taglia sposta anche i dadi di danno e i modificatori di taglia; le caratteristiche dovute al cambio di taglia si scelgono a mano.</p>'+blocco(false)+blocco(true)+
    (L2.some(e=>!e.perm&&e.attivo)?'<div class="row" style="margin-top:14px"><button class="btn" id="mspegni">Disattiva tutti i temporanei</button></div>':'')+'</div>');
  M.querySelectorAll('[data-matt]').forEach(x=>x.addEventListener('change',()=>{L2[+x.dataset.matt].attivo=x.checked;render();apriModificatori(ch);}));
  M.querySelectorAll('[data-med]').forEach(x=>x.addEventListener('click',()=>editaEffetto(ch,+x.dataset.med)));
  M.querySelectorAll('[data-mnuovo]').forEach(x=>x.addEventListener('click',()=>{L2.push({id:'e'+Date.now(),nome:x.dataset.mnuovo==='1'?'Nuovo oggetto':'Nuovo effetto',perm:x.dataset.mnuovo==='1',attivo:true,car:{},carT:{}});save();editaEffetto(ch,L2.length-1);}));
  const sp=document.getElementById('mspegni');if(sp)sp.addEventListener('click',()=>{L2.forEach(e=>{if(!e.perm)e.attivo=false;});render();apriModificatori(ch);});
}
function editaEffetto(ch,i){
  const e=effLista(ch)[i];e.car=e.car||{};e.carT=e.carT||{};
  const campi=ch==='aut'?MODCAMPI.filter(([k])=>!['caCont','caImpr','iniz'].includes(k)):MODCAMPI;
  const inp=(id,v,lab)=>'<div class="field"><label class="label" for="'+id+'">'+lab+'</label><input id="'+id+'" type="number" inputmode="numeric" value="'+(+v||0)+'"></div>';
  modal('<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+(e.perm?'Modificatore permanente':'Modificatore temporaneo')+'</h2><button class="btn sm" id="edOk">Fatto</button></div>'+
    '<div class="grid" style="margin-top:10px"><div class="field" style="grid-column:1/-1"><label class="label" for="ed-nome">Nome</label><input id="ed-nome" value="'+esc(e.nome)+'"></div>'+
    '<label class="check" style="grid-column:1/-1"><input type="checkbox" id="ed-att"'+(e.attivo?' checked':'')+'><span>Attivo</span></label>'+
    '<label class="check" style="grid-column:1/-1"><input type="checkbox" id="ed-perm"'+(e.perm?' checked':'')+'><span>Permanente (oggetto magico o effetto di lunga durata)</span></label></div>'+
    '<h3 style="margin:14px 0 6px">Valori</h3><div class="grid">'+campi.map(([k,l])=>inp('ed-'+k,e[k],l)).join('')+'</div>'+
    '<h3 style="margin:14px 0 6px">Caratteristiche dovute al cambio di taglia</h3><div class="grid">'+['For','Des','Cos'].map(k=>inp('ed-t'+k,e.carT[k],CAR_N[k])).join('')+'</div>'+
    '<h3 style="margin:14px 0 6px">Altre modifiche alle caratteristiche</h3><div class="grid">'+(ch==='aut'?['For','Des']:CAR).map(k=>inp('ed-c'+k,e.car[k],CAR_N[k])).join('')+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn pri" id="edOk2">Salva</button><button class="btn danger" id="edDel">Elimina</button></div></div>');
  const salva=()=>{
    e.nome=document.getElementById('ed-nome').value||'Senza nome';
    e.attivo=document.getElementById('ed-att').checked;e.perm=document.getElementById('ed-perm').checked;
    for(const [k] of campi)e[k]=+document.getElementById('ed-'+k).value||0;
    for(const k of ['For','Des','Cos'])e.carT[k]=+document.getElementById('ed-t'+k).value||0;
    for(const k of (ch==='aut'?['For','Des']:CAR))e.car[k]=+document.getElementById('ed-c'+k).value||0;
    render();apriModificatori(ch);
  };
  document.getElementById('edOk').addEventListener('click',salva);document.getElementById('edOk2').addEventListener('click',salva);
  document.getElementById('edDel').addEventListener('click',()=>{effLista(ch).splice(i,1);render();apriModificatori(ch);});
}

/* ---------- finestre ---------- */
const M=document.getElementById('modal');
function modal(h){M.innerHTML='<div class="overlay" role="dialog" aria-modal="true">'+h+'</div>';M.querySelector('.overlay').addEventListener('click',e=>{if(e.target.classList.contains('overlay')||e.target.hasAttribute('data-close'))closeModal();});}
function closeModal(){M.innerHTML='';}
function conferma(testo,ok,fn){modal('<div class="card"><p>'+esc(testo)+'</p><div class="row"><button class="btn danger" id="okC">'+ok+'</button><button class="btn" data-close>Annulla</button></div></div>');document.getElementById('okC').addEventListener('click',()=>{closeModal();fn();});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
