<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Officina dell'Inventore</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="icon" href="icona.png">
<style>
:root{
  --bg:#ECEAE6; --surface:#F8F7F5; --surface2:#E0DCD5; --line:#CBC5BB;
  --ink:#1E1C19; --muted:#655F56; --accent:#7A4E1D; --accent-ink:#FFFFFF;
  --bronze:#8A6A2E; --cond:#B3121B; --good:#2E6B4A; --warn:#9A5B12;
  --mark:#EFE3CF; --adv:#1E7A1E;
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --surface:#1E2125; --surface2:#2A2E33; --line:#3A3F46;
    --ink:#E9E6E1; --muted:#A39D94; --accent:#D9A15A; --accent-ink:#1A140C;
    --bronze:#D0AE6B; --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A;
    --mark:#3A2F20; --adv:#5FBF5F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1E2125; --surface2:#2A2E33; --line:#3A3F46;
  --ink:#E9E6E1; --muted:#A39D94; --accent:#D9A15A; --accent-ink:#1A140C;
  --bronze:#D0AE6B; --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A;
  --mark:#3A2F20; --adv:#5FBF5F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px 80px}
.wrap{max-width:760px;margin:0 auto;min-width:0}
html,body{overflow-x:hidden}
.featRow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.pgSel{max-width:60vw;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:600 .85rem var(--f-body)}
.hsub{color:var(--muted);font-size:.8rem;margin-top:4px}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;padding:9px 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 .8rem var(--f-body);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:grid;gap:18px;padding-top:16px}
h2{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0 0 8px;letter-spacing:.03em;color:var(--bronze)}
h3{font-size:.95rem;margin:0}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.grid6{display:grid;gap:8px;grid-template-columns:repeat(6,1fr)}
@media (max-width:420px){.grid6{grid-template-columns:repeat(3,1fr)}}
.field{display:grid;gap:3px;min-width:0}
.field input,.field select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-mono)}
.field select{font-family:var(--f-body);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;margin-top:2px}
.banner{background:var(--mark);border-radius:8px;padding:8px 12px;font-size:.85rem}
.banner.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .85rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--cond);border-color:var(--cond)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .82rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;cursor:pointer;color:var(--ink);font-family:var(--f-body)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.list{display:grid;gap:6px}
.tag{font:500 .7rem var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.tag.cb{background:var(--bronze);color:var(--surface)}
.tag.no{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.kv b{display:block;font:500 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.kv small{display:block;color:var(--muted);font-size:.72rem}
.txt{font-size:.9rem}
.txt p{margin:4px 0}
.atk{display:grid;gap:4px;font-size:.9rem}
.atk .l{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:4px}
.atk .l span:last-child{font-family:var(--f-mono);text-align:right}
.note{font-size:.82rem;color:var(--muted)}
.warnT{color:var(--warn)}
.cond{color:var(--cond);font-weight:600}
.adv{background:var(--adv);color:#fff;padding:0 3px;border-radius:3px}
.dis{background:var(--cond);color:#fff;padding:0 3px;border-radius:3px}
.overlay{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.overlay .card{width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px}
details+details{margin-top:6px}
details summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▸";color:var(--muted);font-weight:400}
details[open] summary::after{content:"▾"}
details .txt{margin-top:6px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.opt.bad{border-color:var(--warn)}
.opt.dim{opacity:.55}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:1px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.slot .lv{font:600 .95rem var(--f-mono);color:var(--bronze);text-align:center}
.slot select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .85rem var(--f-body)}
.slot.bad{border-color:var(--warn)}
.ctr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ctr .pips{display:flex;gap:6px;align-items:center}
.ctr b{font:600 1.05rem var(--f-mono);min-width:54px;text-align:center}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.low{background:var(--cond)}
.nodi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--mark)}
.nodi b{font:600 1.1rem var(--f-mono)}
.nodi.over{background:transparent;border:1px solid var(--cond);color:var(--cond)}
table.t{width:100%;border-collapse:collapse;font-size:.82rem}
table.t th,table.t td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:center}
table.t th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
table.t td:last-child,table.t th:last-child{text-align:left}
table.t tr.cur td{background:var(--mark)}
.hl{background:var(--mark);border-radius:6px;padding:2px 6px}
@media (prefers-reduced-motion: no-preference){.overlay .card{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <h1>Officina dell'Inventore</h1>
    <span class="row" style="gap:6px"><label class="label" for="pgSel">Personaggio</label><select id="pgSel" class="pgSel"></select></span>
  </div>
  <div class="hsub" id="hdrSub"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="inv">Inventore</button>
    <button role="tab" aria-selected="false" data-tab="mech">Mechanus</button>
    <button role="tab" aria-selected="false" data-tab="mer">Meraviglie</button>
    <button role="tab" aria-selected="false" data-tab="gad">Gadget</button>
    <button role="tab" aria-selected="false" data-tab="gioco">In gioco</button>
  </nav>
</header>
<main id="main"></main>
</div>
<div id="modal"></div>

<script>
const D = {"fonte":"Inventore_v2.4_FINALE.txt","tabella":[{"liv":1,"bab":"+0","tempra":2,"rif":0,"vol":2,"privilegi":"Fabbro esperto, Libro dei brevetti, Riparazioni 1d6, Mechanus, Gadget, Tecno-armi"},{"liv":2,"bab":"+1","tempra":3,"rif":0,"vol":3,"privilegi":"Gadget, optional o dote da inventore"},{"liv":3,"bab":"+2","tempra":3,"rif":1,"vol":3,"privilegi":"Automaton, Gadget"},{"liv":4,"bab":"+3","tempra":4,"rif":1,"vol":4,"privilegi":"Gadget, optional o dote da inventore"},{"liv":5,"bab":"+3","tempra":4,"rif":1,"vol":4,"privilegi":"Gadget, Esoscheletri, Aggiornamento #1 delle meraviglie"},{"liv":6,"bab":"+4","tempra":5,"rif":2,"vol":5,"privilegi":"Gadget, optional o dote da inventore"},{"liv":7,"bab":"+5","tempra":5,"rif":2,"vol":5,"privilegi":"Gadget"},{"liv":8,"bab":"+6/+1","tempra":6,"rif":2,"vol":6,"privilegi":"Gadget, optional o dote da inventore"},{"liv":9,"bab":"+6/+1","tempra":6,"rif":3,"vol":6,"privilegi":"Gadget, Pensiero tecnologico"},{"liv":10,"bab":"+7/+2","tempra":7,"rif":3,"vol":7,"privilegi":"Gadget, optional o dote da inventore, Aggiornamento #2 delle meraviglie"},{"liv":11,"bab":"+8/+3","tempra":7,"rif":3,"vol":7,"privilegi":"Gadget"},{"liv":12,"bab":"+9/+4","tempra":8,"rif":4,"vol":8,"privilegi":"Gadget, optional o dote da inventore"},{"liv":13,"bab":"+9/+4","tempra":8,"rif":4,"vol":8,"privilegi":"Razziatore esperto"},{"liv":14,"bab":"+10/+5","tempra":9,"rif":4,"vol":9,"privilegi":"Gadget, optional o dote da inventore"},{"liv":15,"bab":"+11/+6/+1","tempra":9,"rif":5,"vol":9,"privilegi":"Specializzazione, Aggiornamento #3 delle meraviglie"},{"liv":16,"bab":"+12/+7/+2","tempra":10,"rif":5,"vol":10,"privilegi":"Gadget, optional o dote da inventore"},{"liv":17,"bab":"+12/+7/+2","tempra":10,"rif":5,"vol":10,"privilegi":"Officina mobile"},{"liv":18,"bab":"+13/+8/+3","tempra":11,"rif":6,"vol":11,"privilegi":"Gadget, optional o dote da inventore"},{"liv":19,"bab":"+14/+9/+4","tempra":11,"rif":6,"vol":11,"privilegi":"Maestria delle modifiche"},{"liv":20,"bab":"+15/+10/+5","tempra":12,"rif":6,"vol":12,"privilegi":"Aggiornamento finale delle meraviglie"}],"privilegi":[{"nome":"Fabbro esperto","testo":"Al 1° livello, un inventore ottiene bonus +3 alle prove di Valutare (oggetti di metallo). Inoltre, può riparare gli oggetti di metallo rotti anche in viaggio, come se avesse sempre con sé un'officina. Infine, può usare Conoscenze (ingegneria) per identificare i costrutti."},{"nome":"Libro dei brevetti","testo":"Al 1° livello, un inventore ottiene un tomo al quale annota i propri studi su gadget, mechanus, meraviglie e relativi optional. Il libro dei brevetti è un oggetto personale e simbolico dell'inventore, contenente schemi, appunti e annotazioni che testimoniano i suoi traguardi nella ricerca scientifica. Se l'inventore dovesse perdere il proprio libro, potrà ricostruirne uno nuovo tramite 1 giorno di lavoro per livello di inventore."},{"nome":"Riparazioni","testo":"Al 1° livello, come azione standard che provoca attacchi di opportunità, un inventore può effettuare veloci riparazioni temporanee su un costrutto o un gadget adiacente, riparando un numero di danni pari a 1d6 + 1d6 ogni due livelli oltre il 1°. Se un inventore usa questa capacità su un costrutto o un gadget che non ha costruito egli stesso (o su sé stesso, se è un forgiato), l'ammontare di danni curati viene dimezzato. Si può usare questa capacità per un numero di volte al giorno pari a 2 + bonus di Intelligenza."},{"nome":"Mechanus","testo":"Al 1° livello, un inventore impara come creare i mechanus. Vedi sezione dedicata per le regole complete e l'elenco dei mechanus disponibili."},{"nome":"Gadget","testo":"Al 1°, 3°, 5°, 7°, 9° e 11° livello, un inventore impara a costruire un nuovo gadget a sua scelta tra quelli disponibili, di cui soddisfa i requisiti. Ai livelli pari dal 2° al 18° sceglie invece un gadget, un optional o una dote da inventore. Vedi sezione dedicata per le regole complete e l'elenco dei gadget."},{"nome":"Tecno-armi","testo":"Al 1° livello, un inventore impara come creare le tecno-armi. Vedi sezione dedicata per le regole complete, le modifiche e gli optional disponibili."},{"nome":"Automaton","testo":"Al 3° livello, un inventore impara come creare gli automaton. Vedi sezione dedicata per i modelli, le regole complete, gli aggiornamenti progressivi e gli optional disponibili."},{"nome":"Esoscheletri","testo":"Al 5° livello, un inventore impara come creare gli esoscheletri. Vedi sezione dedicata per i due tipi (leggero e pesante), le regole complete, gli aggiornamenti progressivi e gli optional disponibili."},{"nome":"Pensiero tecnologico","testo":"Al 9° livello, un inventore ottiene bonus di competenza pari a metà livello (arrotondato per difetto) alle prove di Conoscenze (ingegneria) e Conoscenze (scientifiche). Inoltre, può effettuare queste prove anche senza essere addestrato e considera entrambe le abilità come abilità di classe ai fini delle sinergie."},{"nome":"Razziatore esperto","testo":"Al 13° livello, un inventore ha sviluppato un occhio raffinato per smantellare e recuperare componenti utili. Può usare Conoscenze (ingegneria) invece di Percezione per razziare costrutti o meraviglie distrutte e recuperare materiale utile (da vendere o utilizzare per altri scopi a discrezione del GM) o informazioni importanti. Inoltre, ottiene bonus +4 alle prove di Valutare per stimare il valore di oggetti tecnologici o di metallo."},{"nome":"Specializzazione","testo":"Al 15° livello (in concomitanza con l'Aggiornamento #3 delle meraviglie), un inventore deve scegliere una delle proprie meraviglie come specializzazione: tecno-armi, automaton o esoscheletri. Solo la meraviglia scelta beneficia degli Aggiornamenti #3 (15° livello) e finale (20° livello); le altre meraviglie rimangono fissate all'Aggiornamento #2. Questa scelta non può essere modificata."},{"nome":"Officina mobile","testo":"Al 17° livello, l'esperienza dell'inventore gli consente di lavorare con un'efficienza eccezionale. Il tempo richiesto per costruire, smantellare, modificare o aggiornare qualsiasi creazione (mechanus esclusi) viene ridotto del 25%. Inoltre, l'inventore può lavorare fino a 12 ore al giorno (invece delle normali 8) ai propri progetti senza penalità."},{"nome":"Maestria delle modifiche","testo":"Al 19° livello, l'inventore ha così tanta familiarità con le sue creazioni da poterle azionare quasi senza pensarci. Una volta per round, l'inventore può attivare una modifica di una tecno-arma o di un esoscheletro senza spendere cariche. Questa capacità non si applica alle modifiche con costo in cariche maggiore di 1."},{"nome":"Aggiornamento delle meraviglie","testo":"Ai livelli 5°, 10°, 15° e 20°, un inventore migliora le proprie meraviglie aggiungendo nodi disponibili e accedendo a nuove modifiche. Gli Aggiornamenti #3 (15° livello) e finale (20° livello) si applicano solo alla meraviglia scelta come Specializzazione. Vedi le sezioni dedicate alle singole meraviglie per i dettagli."}],"daSapere":["1. Brevetti: il libro dei brevetti annota le creazioni dell'inventore (gadget, mechanus, meraviglie, optional, ecc.), ma non è un gating meccanico. Le creazioni vengono apprese automaticamente al raggiungere il livello appropriato.","2. Tipi di meraviglia: tecno-armi, automaton e esoscheletri. Ogni inventore impara progressivamente a costruirne tutti i tipi, ma deve specializzarsi in uno solo al 15° livello per accedere agli Aggiornamenti #3 e finale.","3. Creazioni limitate: fatta eccezione per i mechanus, un inventore può dar vita a una sola meraviglia dello stesso tipo e a un solo gadget dello stesso tipo. Se supera il limite, il più vecchio si distrugge automaticamente.","4. Tiri Salvezza (regola generale): qualsiasi Tiro Salvezza provocato da gadget, tecno-armi, automaton, esoscheletri e capacità di questa classe ha una CD pari a 10 + metà livello di inventore + bonus di Intelligenza. La CD di un Tiro Salvezza provocato da un mechanus è invece pari a 10 + il livello del mechanus + bonus di Intelligenza.","5. Aggiornamenti: gli aggiornamenti delle meraviglie sono progressivi e devono essere eseguiti in ordine. Quando installa un nuovo aggiornamento, un inventore può riconfigurare le vecchie decisioni effettuate negli aggiornamenti precedenti (sostituendo modifiche, riassegnando nodi, ecc.)."],"arnesi":[{"id":"accetta","nome":"Accetta","cat":"Armi da mischia leggere","costo":"6 mo","dP":"1d4","dM":"1d6","gittata":"6 m (x3)","critico":"x3","tipo":"T","speciale":"Da lancio","eq":"Armi leggere taglienti"},{"id":"cacciavite_elettrico","nome":"Cacciavite elettrico","cat":"Armi da mischia leggere","costo":"9 mo","dP":"1d4","dM":"1d6","gittata":"—","critico":"19-20/x2","tipo":"P","speciale":"—","eq":"Armi leggere perforanti"},{"id":"girabulloni","nome":"Girabulloni","cat":"Armi da mischia leggere","costo":"6 mo","dP":"1d4","dM":"1d6","gittata":"6 m (x3)","critico":"x2","tipo":"C","speciale":"Da lancio","eq":"Armi leggere contundenti"},{"id":"mazzuolo","nome":"Mazzuolo","cat":"Armi da mischia a una mano","costo":"21 mo","dP":"1d6","dM":"1d8","gittata":"—","critico":"x3","tipo":"C","speciale":"Versatile","eq":"Armi a una mano contundenti"},{"id":"tagliatrice_elettrica","nome":"Tagliatrice elettrica","cat":"Armi da mischia a una mano","costo":"21 mo","dP":"1d6","dM":"1d8","gittata":"—","critico":"x3","tipo":"T","speciale":"—","eq":"Armi a una mano taglienti"},{"id":"trapano_elettrico","nome":"Trapano elettrico","cat":"Armi da mischia a una mano","costo":"21 mo","dP":"1d4","dM":"1d6","gittata":"—","critico":"x4","tipo":"P","speciale":"Versatile","eq":"Armi a una mano perforanti"},{"id":"grandi_tenaglie","nome":"Grandi tenaglie","cat":"Armi da mischia a due mani","costo":"15 mo","dP":"1d2","dM":"1d3","gittata":"—","critico":"x2","tipo":"T","speciale":"Portata, Imprigionare","eq":"Armi a due mani taglienti"},{"id":"mazzuolo_pesante","nome":"Mazzuolo pesante","cat":"Armi da mischia a due mani","costo":"42 mo","dP":"1d10","dM":"2d6","gittata":"—","critico":"x3","tipo":"C","speciale":"—","eq":"Armi a due mani contundenti"},{"id":"percussore","nome":"Percussore","cat":"Armi da mischia a due mani","costo":"33 mo","dP":"1d6","dM":"2d4","gittata":"—","critico":"x4","tipo":"P","speciale":"Puntare","eq":"Armi a due mani perforanti"},{"id":"sparachiodi","nome":"Sparachiodi","cat":"Armi da tiro a due mani","costo":"32 mo","dP":"1d3","dM":"1d4","gittata":"9 m (x5)","critico":"19-20/x2","tipo":"P","speciale":"Ricarica (az. standard), Caricatore","eq":"Armi da tiro a due mani perforanti"}],"mechanus":{"intro":["Ogni inventore ha dei magneti posti sulla cintura ai quali appende i propri mechanus. Come azione standard che provoca attacchi di opportunità, un inventore può posizionare un mechanus nel proprio spazio e questo agirà come da programmazione. I mechanus sono dotati di cingoli, piedi chiodati, pattini, galleggianti, sci e in alcuni casi rotori per librarsi in aria e per questo ignorano le penalità al movimento dovute ai terreni difficili e possono planare persino sull'acqua. I mechanus sono rapidissimi e dall'aspetto simile a giocattoli e per questo motivo non provocano mai attacchi di opportunità per il muoversi e non possono essere attaccati durante le fasi concitate di un combattimento. I mechanus non minacciano mai i nemici entro la loro portata.","L'inventore segue la progressione standard di un incantatore con livelli massimi 6, applicata ai mechanus. Il numero di mechanus creabili al giorno scala con il livello e il bonus di Intelligenza."],"elenco":[{"id":"criogenico","nome":"Criogenico","liv":1,"consumabile":false,"testo":"Questo mechanus emette tramite una turbina un getto congelante in una linea di 9 m. Le creature nell'area subiscono 1d4 danni da freddo per livello di inventore (massimo 5d4); un Tiro Salvezza su Riflessi dimezza il danno. I fuochi grandi come un fuoco da campo o inferiori si estinguono se investiti dal getto."},{"id":"dissuasore","nome":"Dissuasore","liv":1,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore per 1 minuto per livello di inventore. Il mechanus minaccia i nemici tramite dei pungoli elettrificati ai fini del fiancheggiamento (ma non per gli attacchi di opportunità), facendo sì che l'inventore non possa essere fiancheggiato."},{"id":"droni_assassini","nome":"Droni assassini","liv":1,"consumabile":false,"testo":"Man mano che l'inventore acquisisce esperienza, è in grado di costruire più droni, di dimensioni inferiori ma ugualmente efficaci: l'inventore rilascia quindi un mechanus più uno addizionale ogni due livelli oltre il 1° (massimo 8 droni al 15° livello). Questi mechanus dotati di piccoli rotori e di una lama al plasma, volano verso un bersaglio entro 30 m infliggendogli 1d4+1 danni da forza. I mechanus non mancano mai il proprio bersaglio, eccetto se questo gode di occultamento totale. I mechanus possono attaccare il medesimo bersaglio o bersagli diversi."},{"id":"elettrificante","nome":"Elettrificante","liv":1,"consumabile":false,"testo":"Questo mechanus si muove verso un bersaglio entro 15 m ed effettua tramite un cavo elettrico un attacco di contatto in mischia usando il bonus di attacco base dell'inventore + bonus di Intelligenza. Se l'attacco colpisce, la vittima subisce 1d6 danni da elettricità per livello di inventore (massimo 5d6). Il mechanus ottiene bonus +3 al tiro per colpire se l'avversario indossa un'armatura di metallo o impugna un'arma di metallo."},{"id":"generatore_di_campo","nome":"Generatore di campo","liv":1,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore per 1 minuto per livello di inventore. Il mechanus genera un debole campo di forza personale che fornisce all'inventore bonus di scudo +2 alla CA. Questo bonus aumenta di +1 al 6° livello e ogni 6 ulteriori livelli (massimo +5 al 18° livello). Inoltre, il campo nega gli effetti dell'incantesimo Dardo incantato e simili effetti di proiettili di forza. Questo bonus si cumula con quello di scudi fisici, esoscheletri e altri effetti."},{"id":"ingrassatore","nome":"Ingrassatore","liv":1,"consumabile":false,"testo":"Questo mechanus si muove fino a 15 m e, tramite una pompa, ricopre una superficie adiacente di 3 m quadrati con una patina di olio scivoloso. L'effetto è identico a quello dell'incantesimo Unto. L'olio permane per 1 minuto per livello di inventore."},{"id":"lanciarazzi","nome":"Lanciarazzi","liv":1,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore. Come azione standard, l'inventore può ordinare al mechanus di scagliare un missile contro un bersaglio entro 30 m, effettuando un attacco di contatto a distanza usando il bonus di attacco base dell'inventore + bonus di Intelligenza. Se l'attacco colpisce, la vittima subisce 1d6 danni da fuoco + 1d6 ogni 4 livelli (massimo 4d6 al 13° livello) ed è abbagliata per 1 round. Il mechanus può scagliare un numero di missili pari a 1 + bonus di Intelligenza, dopodiché si disattiva."},{"id":"musicante","nome":"Musicante","liv":1,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore per 1 minuto per livello di inventore. Emettendo un'ispirante fanfara, il mechanus fornisce a tutti gli alleati entro 15 m bonus morale +1 ai tiri per colpire. Questo è un effetto di [influenza mentale] e [uditivo]."},{"id":"occultante","nome":"Occultante","liv":1,"consumabile":false,"testo":"Questo mechanus emette da un bocchettone un denso vapore grigio di raggio di 6 m e alto 6 m centrato sull'inventore. Il vapore permane per 1 minuto per livello di inventore. Il vapore oscura ogni visuale, compresa la Scurovisione. All'interno del vapore, le creature entro un raggio di 1,5 m godono di occultamento e quelle oltre 1,5 m godono di occultamento totale. Un vento moderato disperde il vapore in 4 round mentre uno forte in 1 round."},{"id":"puntatore","nome":"Puntatore","liv":1,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore e proietta un raggio laser innocuo verso i punti vulnerabili dei nemici affrontati dall'inventore. L'inventore ottiene un bonus cognitivo di +2 ai successivi due tiri per colpire in mischia o a distanza. Questo bonus aumenta di +1 al 3° livello e ogni 3 ulteriori livelli (massimo +8 al 18° livello). Inoltre, nessuno di questi due colpi è mai soggetto ad alcuna probabilità di mancare. Questo mechanus si disattiva quando l'inventore ha effettuato i due attacchi o dopo che sono trascorsi 3 round, a seconda dell'evento che si verifica per primo."},{"id":"sentinella","nome":"Sentinella","liv":1,"consumabile":false,"testo":"Una volta attivato, questo mechanus resta immobile e sorveglia un'area di 6 m attorno a sé per 8 ore. Quando una creatura non alleata di taglia minuscola o superiore entra nell'area sorvegliata, il mechanus emette un fischio acuto percepibile fino a 18 m. Occorre ridurre la distanza di 3 m per ogni eventuale porta chiusa frapposta e di 6 m per ogni eventuale parete. In condizioni di silenzio, il suono può essere udito fino ad una distanza di 54 m. Le creature sotto l'effetto dell'incantesimo Silenzio o simili non possono udire il fischio."},{"id":"sigillante","nome":"Sigillante","liv":1,"consumabile":false,"testo":"Questo mechanus si muove verso una porta, un cancello, una finestra o un'imposta entro 15 m e, grazie a dei punteruoli meccanici, la sigilla per 1 minuto per livello di inventore. Una creatura che tenti di forzare il varco così bloccato vedrà la CD della consueta prova aumentata di 5 (se la prova riesce, il mechanus viene distrutto)."},{"id":"analizzatore","nome":"Analizzatore","liv":1,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore ed effettua una scansione di una creatura in vista entro 18 m. L'inventore ottiene bonus +5 alle prove di Conoscenze pertinenti per identificare la creatura analizzata, e può effettuare la prova anche senza addestramento. In base al risultato della prova, l'inventore ottiene un bonus cognitivo ai tiri per colpire e ai danni contro la creatura analizzata per 1 minuto per livello di inventore, in base alla seguente tabella: CD 10 + DV creatura: +1 ai tiri per colpire e ai danni; CD 15 + DV creatura: +2 ai tiri per colpire e ai danni; CD 20 + DV creatura: +3 ai tiri per colpire e ai danni. L'inventore può avere una sola creatura analizzata alla volta. Attivare il mechanus su una nuova creatura termina l'effetto sulla precedente. Questo mechanus si disattiva al termine della durata o quando la creatura analizzata muore."},{"id":"faro_mobile","nome":"Faro mobile","liv":1,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore o ricevendo ordini di movimento come azione di movimento (fino a 9 m/round). Emette luce normale in un raggio di 9 m e luce fioca per altri 9 m. La luce non innesca le vulnerabilità delle creature alla luce solare. Il mechanus si disattiva dopo 10 minuti per livello di inventore."},{"id":"saltatore","nome":"Saltatore","liv":1,"consumabile":false,"testo":"L'inventore lancia a terra questo mechanus e lo attiva come azione di movimento; tramite dei pistoni meccanici, viene catapultato fino a 9 m + 1,5 m ogni 2 livelli (massimo 24 m al 19° livello) in una direzione orizzontale, atterrando in piedi senza subire danni da caduta da quel salto specifico. Il mechanus si disattiva dopo l'utilizzo."},{"id":"assordante","nome":"Assordante","liv":2,"consumabile":false,"testo":"Questo mechanus si muove entro 30 m ed emette un forte boato in un'area di 3 m di raggio. Le creature nell'area subiscono 1d8 danni sonori + 1d8 ogni 4 livelli oltre il 4° (massimo 4d8 al 16° livello); le creature dotate di udito devono superare un Tiro Salvezza su Tempra o essere stordite per 1 round."},{"id":"congelante","nome":"Congelante","liv":2,"consumabile":false,"testo":"Questo mechanus si muove verso un bersaglio entro 30 m e tramite un sifone a raffreddamento lo ricopre con uno strato di brina infliggendogli 1d4 danni da freddo per livello di inventore (massimo 10d4) e rendendolo barcollante per 1 round + 1 ogni quattro livelli oltre il 4°. La vittima può superare un Tiro Salvezza su Tempra per dimezzare i danni e negare la condizione barcollante."},{"id":"esilarante","nome":"Esilarante","liv":2,"consumabile":false,"testo":"Questo mechanus si muove verso un bersaglio entro 15 m e lo investe con un getto di gas esilarante. La vittima deve superare un Tiro Salvezza su Tempra o iniziare a ridere convulsamente per 1 round per livello di inventore, finendo prona. Finché ride, la vittima non può compiere azioni, ma non è considerata indifesa. Nel suo turno successivo, come azione di round completo la vittima in preda al riso può tentare un nuovo Tiro Salvezza per mettere fine all'effetto. Trattenere il fiato non serve, ma le creature che non hanno bisogno di respirare non subiscono gli effetti del vapore. Le creature immuni ai veleni ottengono bonus +4 al Tiro Salvezza."},{"id":"killer_cercatore","nome":"Killer-cercatore","liv":2,"consumabile":false,"testo":"Questo mechanus simile a una siringa si scaglia tramite dei rotori verso un bersaglio entro 120 m. Il mechanus effettua un attacco di contatto a distanza usando il bonus di attacco base dell'inventore + bonus di Intelligenza. Se l'attacco colpisce, la vittima viene inoculata con sostanze chimiche nocive e subisce 2d6 danni da acido. Le sostanze bruciano all'interno della vittima e questa, per 1 round extra ogni tre livelli, subisce altri 2d6 danni all'inizio del proprio turno."},{"id":"inceneritore","nome":"Inceneritore","liv":2,"consumabile":false,"testo":"Questo mechanus si muove fino a 15 m quando l'inventore lo dirige verbalmente usando un'azione di movimento, altrimenti rimane immobile. Se entra in uno spazio occupato da una creatura, termina il proprio movimento e tramite due fiamme ossidriche le infligge 3d6 danni da fuoco. La vittima può superare un Tiro Salvezza su Riflessi per negare i danni. Le creature che entrano nello spazio del mechanus vengono attaccate. Il mechanus si disattiva dopo 1 round per livello di inventore o se si allontana a più di 30 m dall'inventore."},{"id":"intrappolante","nome":"Intrappolante","liv":2,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e ricopre un'area di 4,5 m di raggio con un nugolo di filamenti chimici appiccicosi. L'effetto è identico a quello dell'incantesimo Ragnatela, eccetto che i filamenti permangono per 10 minuti per livello di inventore."},{"id":"intercettatore","nome":"Intercettatore","liv":2,"consumabile":false,"testo":"Questo mechanus si muove verso un alleato entro 30 m e si muove restando nel suo spazio. Il mechanus è in grado di deviare le munizioni e le armi da lancio, scagliando contro di esse sfere metalliche con estrema precisione. Per rappresentare ciò, l'alleato protetto guadagna RD 10/magia contro le armi a distanza. Il mechanus si disattiva dopo 1 ora per livello di inventore o quando ha prevenuto un totale di 10 danni per livello di inventore (massimo 100)."},{"id":"marcatore","nome":"Marcatore","liv":2,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m ed esplode impregnando con una resina fluorescente un'area di 3 m di raggio. Le creature invisibili coperte di resina diventano visibili e, se non superano un Tiro Salvezza su Riflessi, sono anche offuscate 20%. La resina permane per 1 round per livello di inventore prima di evaporare."},{"id":"olografico","nome":"Olografico","liv":2,"consumabile":false,"testo":"Questo mechanus dotato di rotori vola fino a 100 m e proietta entro 20 m da sé l'immagine di un oggetto o di una creatura di taglia compresa tra piccola e grande, comprensiva di rumori (ma non discorsi). Nel turno dell'inventore il mechanus può spostare la proiezione fino a 9 m dando l'illusione del suo movimento. Le creature che interagiscono con la proiezione (toccandola, esaminandola o vedendola interagire in modo impossibile con l'ambiente) possono superare un Tiro Salvezza su Volontà per riconoscerla come illusione. Il mechanus si disattiva dopo 1 minuto per livello di inventore. Questo è un effetto di [illusione: finzione]."},{"id":"planante","nome":"Planante","liv":2,"consumabile":false,"testo":"Questo mechanus ha la forma di un aquilone. All'attivazione, anziché farlo cadere a terra, l'inventore afferra il mechanus e lo tiene sopra la testa, planando orizzontalmente fino a 1,5 m in qualsiasi direzione per ogni metro di caduta, alla velocità di 18 m per round. Il mechanus non può guadagnare altezza, trasportare altre creature o essere usato se si sta indossando un'armatura pesante o un esoscheletro pesante. Il mechanus si disattiva quando l'inventore tocca terra o dopo 1 minuto per livello di inventore."},{"id":"porta_sciame","nome":"Porta-sciame","liv":2,"consumabile":false,"testo":"Questo mechanus tondeggiante si muove fino a 15 m per poi rilasciare decine di nanobot. I nanobot funzionano come uno Sciame di ratti, con i tratti dei costrutti e l'aggiunta del danno-sciame pari a 1d6 + 1 ogni 3 livelli di inventore oltre il 3° (massimo 1d6+5 al 18°). All'attivazione, l'inventore indica una direzione: lo sciame si muove sempre verso il nemico più vicino all'inventore in quella direzione, ignorando gli alleati. I nanobot si disattivano dopo 5 round o se vengono distrutti."},{"id":"scassinatore","nome":"Scassinatore","liv":2,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e tenta di scassinare un varco chiuso a chiave. Per farlo, occorre effettuare una prova di livello di inventore +10 contro la CD della serratura. Se si ha successo, il mechanus apre fino a due metodi di chiusura. Può anche aprire porte segrete, scatole o forzieri, sia chiusi a chiave che dotati di trappole a scatto. È anche in grado di allentare nodi e aprire catenacci (ammesso che servano a tenere chiuse delle porte). Se il mechanus viene usato per aprire una porta soggetta all'incantesimo Serratura arcana, l'incantesimo in questione non viene rimosso, ma semplicemente sospeso per 10 minuti. In qualunque altro caso, le porte non si richiuderanno né si bloccheranno di nuovo allo scadere dell'incantesimo. Il mechanus non è in grado di sollevare cancelli sbarrati o simili impedimenti (come una saracinesca) e non può agire su corde, piante rampicanti e così via."},{"id":"localizzatore","nome":"Localizzatore","liv":2,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore e, tramite un complesso sistema di rilevatori, individua la direzione (ma non la distanza esatta) di un oggetto o di una creatura nota all'inventore entro un raggio di 120 m + 12 m per livello. L'inventore deve aver visto direttamente l'oggetto o la creatura almeno una volta in passato. Materiali densi come pietra spessa o piombo bloccano il rilevamento. Il mechanus si disattiva dopo 1 minuto per livello di inventore."},{"id":"crampi_elettro_muscolari","nome":"Crampi elettro-muscolari","liv":2,"consumabile":false,"testo":"Questo mechanus si scaglia verso un bersaglio vivente entro 15 m ed effettua un attacco di contatto in mischia usando il bonus di attacco base dell'inventore + bonus di Intelligenza. Se l'attacco colpisce, la vittima subisce 2d6 danni da elettricità non letali e deve superare un Tiro Salvezza su Tempra o essere paralizzata per 1 round. Le creature con il sottotipo costrutto o non-morto sono immuni a questo effetto."},{"id":"ponte_estensibile","nome":"Ponte estensibile","liv":2,"consumabile":false,"testo":"Questo mechanus si attiva tramite un comando vocale e si dispiega estendendo una passerella metallica rigida lunga fino a 1,5 m per livello di inventore (massimo 18 m) e larga 1,5 m. La passerella può sostenere fino a 200 kg per metro di lunghezza e parte dalla casella dell'inventore in una direzione a sua scelta. Il ponte permane per 1 ora per livello di inventore o finché l'inventore non lo richiama come azione standard. L'inventore non può creare un nuovo ponte estensibile finché il precedente è ancora attivo."},{"id":"accecante","nome":"Accecante","liv":3,"consumabile":false,"testo":"Questo mechanus si scaglia tramite dei rotori verso un bersaglio entro 15 m e lo investe con un getto ustionante infliggendogli 1d6 danni da acido per livello (massimo 10d6) (si prenda nota del danno inflitto). Se il bersaglio ha organi visivi non protetti (solitamente occhi), il getto lo rende anche accecato. La vittima può superare un Tiro Salvezza su Riflessi per dimezzare i danni e negare la condizione accecato. Nel secondo e nel terzo round di effetto, l'incantesimo infligge metà del danno inflitto nel primo round (questo danno è dimezzato una seconda volta se il bersaglio ha superato il Tiro Salvezza nel primo round). Se il bersaglio trascorre un intero round a lavare l'area interessata, l'effetto ha termine."},{"id":"appestante","nome":"Appestante","liv":3,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e da un bocchettone emette un denso vapore verdastro di raggio di 6 m e alto 6 m. Il vapore permane per 1 round per livello di inventore. Il vapore oscura ogni visuale compresa la Scurovisione. All'interno del vapore, le creature entro un raggio di 1,5 m godono di occultamento e quelle oltre 1,5 m godono di occultamento totale. Un vento moderato disperde il vapore in 4 round mentre uno forte in 1 round. Inoltre, il vapore è nauseabondo e le creature al suo interno devono superare un Tiro Salvezza su Tempra o essere nauseate finché vi rimangono e per 1 round dopo che ne sono uscite. Chi supera il Tiro Salvezza ma rimane all'interno della nube deve continuare ad effettuarlo ogni round nel turno dell'inventore. Trattenere il fiato non serve, ma le creature che non hanno bisogno di respirare non sono nauseate. Questo è un effetto di [veleno]."},{"id":"dirottatore","nome":"Dirottatore","liv":3,"consumabile":false,"testo":"Questo mechanus si muove verso un costrutto entro 15 m e si attacca al suo corpo, iniziando a generare un campo di interferenza. Il costrutto deve superare un Tiro Salvezza su Tempra o essere confuso per 1 round per livello di inventore."},{"id":"estintore","nome":"Estintore","liv":3,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e, tramite una pompa circolare, getta una polvere ignifuga in un cubo con lato 30 m. La polvere spegne tutti i fuochi non magici e può dissolvere eventuali incantesimi basati sul fuoco superando una prova di dissolvere (1d20 +1 per livello di inventore, massimo +15). La CD per dissolvere questi incantesimi è di 11 + il livello dell'incantatore che ha lanciato l'incantesimo. Le creature con il sottotipo fuoco che si trovano all'interno dell'area subiscono 1d6 danni per livello di inventore (massimo 10d6). In alternativa, il mechanus può ridirigere tutta la polvere su un singolo oggetto magico che crei o controlli il fuoco. L'oggetto perde tutte le sue proprietà magiche basate sul fuoco per 1d4 ore, a meno che chi lo impugna non superi un Tiro Salvezza su Volontà (gli artefatti sono immuni a questo effetto)."},{"id":"folgorante","nome":"Folgorante","liv":3,"consumabile":false,"testo":"Questo mechanus dotato di piccoli rotori si muove restando fino a un massimo di 9 sopra l'inventore. Una volta per round, come azione standard l'inventore può ordinare al mechanus di scagliare entro 30 m una scarica elettrica che infligge 3d6 danni da elettricità. I bersagli possono superare un Tiro Salvezza su Riflessi per dimezzare il danno. Il mechanus si disattiva dopo 1 minuto per livello di inventore o dopo che ha scagliato 10 scariche elettriche. Se ci si trova all'aperto e in un'area interessata da una tempesta, se sta piovendo, se ci sono vento o nuvole minacciose o condizioni di caldo-umido, ciascuna scarica infligge 3d10 danni da elettricità, anziché 3d6."},{"id":"frustatore","nome":"Frustatore","liv":3,"consumabile":false,"testo":"Questo mechanus dotato di piccoli rotori vola verso una casella entro 30 m ed estroflette una sottile catena d'adamantio con portata 3 m con la quale può compiere ogni turno una manovra di Riposizionare, Sbilanciare, Sporco trucco (intralciato) o Trascinare, con un BMC pari al livello di inventore + bonus di Intelligenza. Come azione di movimento l'inventore può ordinare al mechanus di muoversi fino a 9 m. Il mechanus si disattiva dopo 1 round per livello di inventore."},{"id":"idrante","nome":"Idrante","liv":3,"consumabile":false,"testo":"Questo mechanus emette un flusso d'acqua ad alta pressione che si abbatte su tutte le creature e gli oggetti in una linea di 15 m o finché non colpisce qualcosa che non può spostare. Questo flusso può spingere oggetti mobili e creature di qualunque taglia, effettuando una manovra in combattimento e applicando il risultato ad ogni creatura od oggetto attraversato. Il BMC per questa spinta è pari al livello di inventore + bonus di Intelligenza. Il movimento provocato da questa spinta non provoca attacchi di opportunità. Il getto permette anche di effettuare una prova di Forza per sfondare porte od oggetti ancorati e il getto ha una Forza pari al livello di inventore + bonus di Intelligenza."},{"id":"impallinatore","nome":"Impallinatore","liv":3,"consumabile":false,"testo":"Da un portello nel petto questo mechanus emette una salva di frammenti metallici in un cono di 9 m infliggendo alle creature nell'area 1d8 danni perforanti ogni due livelli (massimo 5d8). Le vittime possono superare un Tiro Salvezza su Riflessi per dimezzare i danni."},{"id":"narcotizzante","nome":"Narcotizzante","liv":3,"consumabile":false,"testo":"Questo mechanus si muove verso un bersaglio entro 15 m ed effettua tramite un ago un attacco di contatto in mischia usando il bonus di attacco base dell'inventore + bonus di Intelligenza. Se l'attacco colpisce, la vittima viene inoculata con una sostanza soporifera che infligge 1d6 danni non letali per round, per 1 round/livello di inventore (massimo 10). Inoltre, se colpita la vittima deve superare un Tiro Salvezza su Tempra o essere anche inferma."},{"id":"riflettore","nome":"Riflettore","liv":3,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore proiettando una luce di intensità pari a quella del giorno in un raggio di 15 m. Tale illuminazione aumenta il livello della luce per altri 18 m di un grado (buio diviene luce fioca, luce fioca diviene luce normale, luce normale diviene luce intensa). Il mechanus emette uno spettro di radiazioni ultraviolette analogo alla luce solare, e per questo attiva le vulnerabilità alla luce solare di vampiri e creature simili. Se gli viene ordinato come azione di movimento, il mechanus può spegnere o riaccendere la luce. Il mechanus non emette luce in un'area di oscurità magica. Il mechanus si disattiva dopo 10 minuti per livello di inventore."},{"id":"sciame_diserbante","nome":"Sciame diserbante","liv":3,"consumabile":false,"testo":"Questo nugolo di piccoli mechanus dotati di razzi vola in alto e tratta con un liquido diserbante un'area di raggio compreso tra 30 m e 150 m o un semicerchio di raggio compreso tra 30 m e 60 m. Dopo 1 minuto di trattamento ininterrotto, la vegetazione nell'area si rimpicciolisce a circa un terzo delle sue normali dimensioni, districandosi e rendendo il passaggio più agevole. Inoltre, questo diserbante dissolve automaticamente qualunque incantesimo od effetto che aumenta la vegetazione (come Crescita vegetale, Intralciare, Muro di spine, ecc.). Il diserbante non ha effetto sulle creature vegetali."},{"id":"scivolante","nome":"Scivolante","liv":3,"consumabile":false,"testo":"Questo mechanus si muove fino a 15 m e da un bocchettone emette un getto scivoloso che ricopre per 1 minuto per livello di inventore il terreno in un'area di 6 m di raggio. Lo strato scivoloso limita il movimento a un quarto del normale e le creature che iniziano il proprio turno su di esso o che vi si muovono sopra devono superare un Tiro Salvezza su Riflessi o finire prone (massimo un tiro per turno). Le creature prone che cercano di rialzarsi devono superare prima un Tiro Salvezza su Riflessi o una prova di Acrobazia con la stessa CD del mechanus. Le creature che usano un'azione di round completo per rialzarsi lo fanno senza dover superare alcuno Tiro Salvezza o prova di Acrobazia."},{"id":"spia","nome":"Spia","liv":3,"consumabile":false,"testo":"Questo mechanus dotato di rotori e grande come un mandarino si muove fino a 30 m verso un punto in vista. Tramite degli auricolari, il mechanus trasmette quindi i suoni e le conversazioni in un'area di 9 m quadrati attorno a sé. Se ci sono più fonti sonore nell'area, si può effettuare una prova di Percezione con CD 20 per focalizzarsi su una specifica."},{"id":"stordifuoco","nome":"Stordifuoco","liv":3,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e detona in una luce e suono accecanti in un'area di 6 m di raggio. Le creature nell'area devono superare un Tiro Salvezza su Riflessi o essere accecate e assordate per 1 round + 1 round ogni 4 livelli di inventore oltre il 3° (massimo 5 round al 19°). Chi supera il Tiro Salvezza è solamente abbagliato per 1 round. Le creature con il sottotipo costrutto o le creature prive sia di vista che di udito sono immuni."},{"id":"disturbatore_di_mira","nome":"Disturbatore di mira","liv":3,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore e proietta un campo di interferenza ottica e acustica per 1 minuto per livello di inventore. L'inventore e gli alleati entro 1,5 m da lui ottengono occultamento (probabilità di mancare 20%) contro gli attacchi a distanza. Le creature in grado di vedere le creature invisibili o dotate di sensi non-visivi (come la percezione tellurica o l'olfatto) ignorano questo effetto."},{"id":"generatore_di_campo_elettrostatico","nome":"Generatore di campo elettrostatico","liv":3,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore per 1 minuto per livello di inventore. Quando una creatura colpisce l'inventore con un attacco senz'armi, un attacco naturale o effettua contro di lui una manovra di Lottare, il mechanus scarica una scossa elettrica che infligge 1d6 danni da elettricità + 1 ogni 2 livelli di inventore (massimo 1d6+10 al 20°). Inoltre, la creatura deve superare un Tiro Salvezza su Tempra o essere accecata per 1 round. Le creature con il sottotipo costrutto o non-morto sono immuni all'effetto secondario."},{"id":"addensante","nome":"Addensante","liv":4,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e da un bocchettone emette un denso vapore verdastro di raggio di 6 m e alto 6 m. Il vapore permane per 1 round per livello di inventore. Il vapore oscura ogni visuale compresa la Scurovisione. All'interno del vapore, le creature entro un raggio di 1,5 m godono di occultamento e quelle oltre 1,5 m godono di occultamento totale. Un vento molto forte disperde il vapore in 1 round. Inoltre, qualsiasi creatura che provi a muoversi all'interno del vapore avanza alla metà della velocità normale, e tutti i suoi tiri per colpire e per i danni in mischia subiscono penalità -2. Questo vapore impedisce di effettuare attacchi con armi a distanza (a parte i raggi magici e simili) e di compiere passi di 1,5 m."},{"id":"anti_urto","nome":"Anti-urto","liv":4,"consumabile":false,"testo":"Questo mechanus viene attivato come azione immediata tramite un comando vocale. Il mechanus crea una cupola di forza sopra l'inventore. Se il fondo della cupola si trova su una superficie piana, tutta la cupola è considerata impermeabile. Qualsiasi oggetto o liquido che cada sulla cupola rimbalza o vi scorre sopra. Questo mechanus viene utilizzato solitamente per guadagnare tempo durante valanghe, inondazioni e crolli, ma può dimostrarsi utile anche durante imboscate e oggetti in caduta. Se la cupola subisce anche 1 solo danno dovuto a un attacco nemico, scompare al termine del turno."},{"id":"generatore_di_tempesta","nome":"Generatore di tempesta","liv":4,"consumabile":false,"testo":"Questo mechanus genera costantemente un denso vapore attorno a sé e appare simile a una nuvola grigia che galleggia a 1,5 m di altezza. Quando viene attivato, questo mechanus dotato di rotori vola entro 30 m, mentre nei round successivi vola a una velocità di 9 m se diretto attivamente dall'inventore come azione di movimento, altrimenti resta fermo. Se entra in uno spazio che contiene una creatura, tramite dei folgoratori le infligge 6d6 danni da elettricità + 1d6 ogni 2 livelli oltre il 7° (massimo 12d6 al 19° livello) e si ferma per quel turno. Le creature che terminano il proprio movimento nella stessa casella del mechanus subiscono i medesimi danni. Le vittime colpite dal mechanus possono superare un Tiro Salvezza su Riflessi per negare il danno ma quelle che falliscono il tiro vengono anche ricoperte di vapore e diventano offuscate 50% per 1 round (eccetto quelle in grado di vedere nell'oscurità). Il mechanus si disattiva dopo 1 round per livello di inventore o se si allontana oltre 60 m dall'inventore."},{"id":"esplosivo","nome":"Esplosivo","liv":4,"consumabile":true,"testo":"Si effettua un tiro per colpire contro un bersaglio tirando 1d20 + il livello di inventore + bonus di Intelligenza. Se l'attacco colpisce, si pilota questo mechanus volante dotato di rotori e lo si fa esplodere in un'area quadrata di 3 caselle di lato al cui interno c'è il bersaglio dell'attacco. Il bersaglio dell'attacco subisce automaticamente 5d10 danni contundenti senza Tiro Salvezza. Le altre creature nell'area subiscono i medesimi 5d10 danni contundenti, ma possono superare un Tiro Salvezza su Riflessi per dimezzarli. Le schegge dovute all'esplosione infliggono poi 5d4 danni taglienti a tutte le creature entro 6 m dal bersaglio (comprese le creature colpite dall'attacco iniziale); un Tiro Salvezza su Riflessi nega questo danno extra. Il mechanus viene distrutto dall'esplosione e non può essere riutilizzato."},{"id":"fustigatore","nome":"Fustigatore","liv":4,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m ed estroflette molteplici tubi gommosi che ghermiscono qualsiasi creatura in un raggio di 6 m. Tutta l'area d'effetto viene considerata terreno difficile e ogni creatura al suo interno o che vi entra è bersaglio di una manovra in combattimento all'inizio di ogni proprio turno, incluso il round in cui il mechanus estroflette i tubi. Per determinare il BMC dei tubi si usa il livello di inventore + bonus di Intelligenza. Ogni round si effettua un solo tiro e si applica il risultato a tutte le creature colpite. Quando un tubo afferra un nemico, gli infligge 1d6+4 danni contundenti e questi ottiene la condizione in lotta. I nemici afferrati non possono muoversi senza prima liberarsi. I tubi ricevono bonus +5 alle prove di lottare effettuate contro avversari che sono già in lotta, ma non possono muovere i nemici o immobilizzarli. Ad ogni round in cui i tubi superano la prova di lotta, infliggono altri 1d6+4 danni contundenti. La DMC dei tubi, al fine di liberarsi dalla lotta, è pari a 10 + il livello di inventore + bonus di Intelligenza. Il mechanus si disattiva dopo 1 round per livello di inventore."},{"id":"lanciafiamme_a_getto","nome":"Lanciafiamme a getto","liv":4,"consumabile":false,"testo":"Questo mechanus emette un getto infuocato in un cono di 9 m o in una linea di 18 m, a scelta. Le creature colpite subiscono 1d6 danni da fuoco per livello di inventore (massimo 12d6). Le vittime possono superare un Tiro Salvezza su Riflessi per dimezzare il danno."},{"id":"lanciafiamme_rotante","nome":"Lanciafiamme rotante","liv":4,"consumabile":false,"testo":"All'attivazione, anziché cadere a terra, il mechanus resta sospeso con dei rotori sopra la testa dell'inventore. All'inizio del turno successivo dell'inventore, tramite un augello il mechanus infligge 1d8 danni da fuoco + 1d8 ogni 4 livelli oltre il 7° (massimo 4d8 al 19°) a tutte le creature entro 9 m ad eccezione dell'inventore. Le vittime possono superare un Tiro Salvezza su Riflessi per dimezzare il danno; le creature oltre i 4,5 m ottengono bonus +4 al Tiro Salvezza. Il mechanus si disattiva dopo 1 round per livello di inventore."},{"id":"marcitore","nome":"Marcitore","liv":4,"consumabile":false,"testo":"Questo mechanus si muove verso un vegetale o una creatura vegetale entro 15 m e lo inonda con una sostanza diserbante infliggendogli 1d6 danni per livello di inventore (massimo 15d6). Le creature vegetali possono superare un Tiro Salvezza su Tempra per dimezzare i danni. La sostanza tossica non ha effetto sul suolo o sulla vegetazione circostante."},{"id":"repellente","nome":"Repellente","liv":4,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore ed emette degli ultrasuoni in un'area di raggio 3 m per livello di inventore. I parassiti con un numero di Dadi Vita inferiore a un terzo del livello di inventore non possono oltrepassare l'area di ultrasuoni mentre gli altri parassiti possono oltrepassarla superando un Tiro Salvezza su Volontà. I parassiti all'interno dell'area subiscono comunque 2d6 danni sonori all'inizio del loro turno, il che è sufficiente a far desistere la maggior parte dei parassiti più piccoli. Il mechanus si disattiva dopo 10 minuti per livello di inventore."},{"id":"tonante","nome":"Tonante","liv":4,"consumabile":false,"testo":"Tramite un potente altoparlante, questo mechanus emette un boato in un cono di 9 m. Qualsiasi creatura all'interno del cono viene assordata per 2d6 round e subisce 5d6 danni sonori. Le vittime possono superare un Tiro Salvezza su Riflessi per non essere assordate e dimezzare i danni. Qualsiasi oggetto fragile o di cristallo o qualsiasi creatura cristallina subisce 1d6 danni sonori per livello di inventore (massimo 15d6). Alle creature cristalline è concesso un Tiro Salvezza su Tempra per dimezzare i danni, e le creature che tengono in mano oggetti fragili possono impedire che questi siano danneggiati superando un Tiro Salvezza su Riflessi. Il boato non può penetrare l'incantesimo Silenzio o simili."},{"id":"demolitore","nome":"Demolitore","liv":4,"consumabile":false,"testo":"Questo mechanus si muove fino a 15 m e si attacca a una superficie solida (parete, porta, soffitto, statua, mobile pesante). Tramite trapani e perforatori, infligge automaticamente 6d6 danni alla struttura ogni round per 1 round per livello di inventore, ignorando la Durezza di materiali fino a 8 (ferro). Contro materiali con Durezza superiore, il mechanus infligge danni dimezzati. Il mechanus può essere staccato dalla superficie come azione standard provocando attacchi di opportunità, oppure si disattiva quando la struttura viene distrutta."},{"id":"pulsatore","nome":"Pulsatore","liv":4,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e detona in un'onda d'urto in un'area di 4,5 m di raggio. Le creature nell'area subiscono 1d6 danni contundenti per livello di inventore (massimo 10d6) e devono superare un Tiro Salvezza su Tempra o essere spinte 3 m lontano dal centro dell'esplosione e finire prone. Un Tiro Salvezza su Riflessi superato dimezza il danno e nega lo spostamento. Gli oggetti non assicurati e di peso inferiore a 25 kg vengono spinti automaticamente."},{"id":"convertitore","nome":"Convertitore","liv":4,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore per 1 minuto per livello di inventore. Una volta per round, quando l'inventore è bersaglio di un incantesimo di livello pari a metà livello di inventore o inferiore, può tentare di assorbirlo come azione immediata. Il mechanus effettua una prova di dissolvere (1d20 + il livello di inventore, massimo +15) contro CD 11 + il livello dell'incantatore. Se la prova riesce, l'incantesimo viene annullato e il mechanus si disattiva immediatamente; se fallisce, l'incantesimo ha effetto normale ma il mechanus rimane attivo. Il mechanus si disattiva dopo aver tentato di assorbire 3 incantesimi."},{"id":"antimagia","nome":"Antimagia","liv":5,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore, emettendo un campo di antimagia personale che fornisce RI 12 + il livello di inventore (massimo RI 25 al 13° livello). Il mechanus si disattiva dopo 1 round per livello di inventore."},{"id":"antisommossa","nome":"Antisommossa","liv":5,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore ed estroflette due pali tra cui si crea un campo di forza alto 3 m. Il mechanus si sposta in modo da rimanere sempre tra l'inventore e un nemico a scelta, indipendentemente da dove esso si muova o dai tentativi di aggirarlo, offrendo così una copertura parziale (bonus +4 alla CA) contro l'avversario. Nulla può ingannare il mechanus, che continua a spostarsi davanti al nemico incurante dell'oscurità, dell'invisibilità o di qualsiasi altro tentativo di nascondersi. Il mechanus ha tanti Punti Ferita quanti ne ha l'inventore in piena salute e ha CA 20 (+11 naturale, -1 taglia). Il mechanus subisce danni normalmente ma gran parte degli effetti magici che non provocano danni non hanno effetto su di lui. Non è in grado di spingere attraverso un Muro di forza o di entrare in un Campo antimagia. Il mechanus effettua Tiri Salvezza come quelli dell'inventore. Gli incantesimi come Disintegrazione o Dissolvi magie effettuati con successo distruggono il mechanus. Qualsiasi creatura che pesi fino a 1.000 kg e che tenti di farsi strada spingendo oltre il mechanus viene ridotta a metà della sua normale velocità mentre le creature più pesanti lo attraversano normalmente, sebbene i loro attacchi siano ancora influenzati. Dirigere il mechanus contro un nuovo avversario richiede un'azione di movimento. Il mechanus si disattiva dopo 1 round per livello di inventore."},{"id":"costrittore","nome":"Costrittore","liv":5,"consumabile":false,"testo":"Questo mechanus si muove verso un bersaglio entro 12 m, estroflette delle cinghie elastiche e tenta di bloccarlo effettuando una manovra in combattimento contro la sua DMC. Il BMC del mechanus è pari al livello di inventore + bonus di Intelligenza. La manovra non provoca attacchi di opportunità e se ha successo il bersaglio diventa trattenuto. Questo stato è simile alla condizione in lotta, salvo che la vittima può muoversi alla sua velocità. La costrizione non impone di effettuare prove di Concentrazione per usare capacità che richiedono appunto Concentrazione e il bersaglio non può eseguire azioni che richiedano l'uso di una o più mani (tra cui lanciare incantesimi che prevedono componenti somatiche o materiali). Dopo essere stato trattenuto per 1 minuto, il bersaglio può effettuare un Tiro Salvezza aggiuntivo contro un eventuale effetto di [compulsione], [maledizione] o [paura]. L'inventore sceglie l'effetto contro cui il bersaglio riceve il Tiro Salvezza extra, che tuttavia si applica solo agli effetti con durata non istantanea. Il Tiro Salvezza aggiuntivo può essere usato solo una volta. Una creatura può liberarsi dalla costrizione effettuando una prova di manovra in combattimento o di Artista della fuga con CD 10 + livello di inventore + bonus di Intelligenza. Il mechanus si disattiva dopo 1 round per livello di inventore."},{"id":"droni_folgoranti","nome":"Droni folgoranti","liv":5,"consumabile":false,"testo":"Questa coppia di mechanus dotati di piccoli rotori vola verso due diverse caselle entro 30 m e a un massimo di 18 m l'una dall'altra. Una volta giunti a destinazione, tra i due si genera un arco di fulmini che infligge a ogni creatura in linea tra di loro 1d6 danni da elettricità per livello di inventore (massimo 15d6). Le vittime possono superare un Tiro Salvezza su Riflessi per dimezzare il danno. L'arco elettrico non si crea se non c'è una linea di effetto tra i due droni."},{"id":"guardiano","nome":"Guardiano","liv":5,"consumabile":false,"testo":"Il mechanus è dotato di un rifrattore visivo che lo rende permanentemente invisibile. Il mechanus resta fermo, sorveglia il luogo in cui è stato posizionato e aziona una sirena nel momento in cui una creatura di taglia piccola o più grande si avvicina a meno di 9 m da lui (quanti sono già entro 9 m da lui al momento dell'attivazione possono muoversi nell'area, ma se si allontanano, al loro ritorno attivano comunque la sirena). Il mechanus è in grado di vedere le creature invisibili ed eteree. Non reagisce alle finzioni, ma lo fa con le illusioni ombra. Se un intruso si avvicina entro 1,5 m dal mechanus, quest'ultimo disattiva la sirena e attacca una volta per round con un aculeo (bonus di attacco pari al livello di inventore + bonus di Intelligenza; 2d6+3 danni perforanti, +1d6 ogni 4 livelli oltre il 9° fino a un massimo di 4d6+3 al 17° livello). Il mechanus è sempre considerato preparato ad attaccare con l'aculeo, per cui colpisce con il suo primo attacco nel turno dell'intruso. L'aculeo è equivalente a un'arma magica in termini di superare eventuali RD. Il mechanus non può essere attaccato a sua volta. Il mechanus si disattiva dopo 1 ora per livello di inventore, dopo 1 round per livello di inventore una volta che ha azionato la sirena o se l'inventore si allontana a più di 30 m da lui."},{"id":"pirocorridore","nome":"Pirocorridore","liv":5,"consumabile":false,"testo":"Questo mechanus si muove fino a 18 m rilasciando sul suo percorso una scia di olio incendiato che permane per 1 round per livello di inventore. Le creature che attraversano la scia o che iniziano il proprio turno su di essa subiscono 1d6 danni da fuoco per livello di inventore (massimo 15d6); un Tiro Salvezza su Riflessi dimezza il danno. Una creatura può subire questi danni una sola volta per round."},{"id":"purificante","nome":"Purificante","liv":5,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore e, tramite potenti sifoni, aspira in un raggio di 6 m qualsiasi gas, vapore nocivo, malattia aerobica, veleni da inalazione e gli incantesimi come Nube maleodorante, Nube mortale, ecc. Il mechanus si disattiva dopo 1 ora per livello di inventore."},{"id":"sifone_assassino","nome":"Sifone assassino","liv":5,"consumabile":false,"testo":"Questo mechanus si muove verso un bersaglio entro 12 m e, tramite un potentissimo aspiratore, inizia a risucchiare l'aria attorno ad esso, facendolo soffocare rapidamente. Il mechanus è dotato di un rifrattore visivo che lo rende permanentemente invisibile. La vittima può effettuare un Tiro Salvezza su Tempra per resistere al risucchio d'aria. Se il tiro riesce, è barcollante per 1 round mentre annaspa in cerca di aria. Se il tiro fallisce, comincia immediatamente a soffocare. Nel suo turno successivo, la vittima cade priva di sensi ed è ridotta a 0 Punti Ferita. Due round dopo, muore. Ad ogni round, la vittima può ritardare gli effetti di 1 round superando un Tiro Salvezza su Tempra, ma il risucchio continua per 3 round, ed ogni volta che il bersaglio fallisce il Tiro Salvezza su Tempra si sposta di un passo avanti verso l'asfissia. Trattenere il fiato non serve, ma le creature che non hanno bisogno di respirare non subiscono gli effetti del mechanus. Il mechanus si disattiva se il bersaglio supera il primo Tiro Salvezza o 3 round dopo l'attivazione."},{"id":"velenifero","nome":"Velenifero","liv":5,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e da un bocchettone emette un denso vapore nero di raggio di 6 m e alto 6 m. Il vapore permane per 1 minuto per livello di inventore. Il vapore oscura ogni visuale compresa la Scurovisione. All'interno del vapore, le creature entro un raggio di 1,5 m godono di occultamento e quelle oltre 1,5 m godono di occultamento totale. Il vapore non viene spazzato dal vento ma si allontana per 3 m a round, scivolando lungo le pendenze o in piano in una direzione scelta dall'inventore. Dato che il vapore è più pesante dell'aria, si abbassa al livello più basso sul terreno, e riesce ad infiltrarsi in tane o buchi di ogni genere. Il vapore non penetra i liquidi. Il vapore è altamente velenoso e uccide automaticamente qualunque creatura vivente con un numero di Dadi Vita pari a 3 o inferiore. Le creature viventi con un numero di Dadi Vita compreso tra 4 e 6 muoiono se non superano un Tiro Salvezza su Tempra. Se il tiro riesce, subiscono comunque 1d4 danni a Costituzione alla fine di ogni proprio turno in cui si trovano nel vapore. Le creature viventi con 6 o più Dadi Vita subiscono 1d4 danni a Costituzione alla fine di ogni proprio turno in cui si trovano nel vapore ma possono superare un Tiro Salvezza su Tempra per dimezzare questo danno. Trattenere il fiato non serve, ma le creature che non hanno bisogno di respirare e quelle immuni agli effetti di [veleno] non vengono uccise dal vapore."},{"id":"disturbatore_mentale","nome":"Disturbatore mentale","liv":5,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore ed emette un campo di interferenza in un raggio di 6 m per 1 round per livello di inventore. Tutte le creature ostili nell'area che tentano di lanciare un incantesimo o usare una capacità magica devono superare una prova di Concentrazione con CD pari alla CD del mechanus + il livello dell'incantesimo. In caso di fallimento, l'incantesimo è perso senza effetto. Inoltre, una volta per round come azione immediata, l'inventore può forzare un nemico nel raggio che sta lanciando un incantesimo a ripetere la prova di Concentrazione con CD aumentata di 5."},{"id":"generatore_di_gravita","nome":"Generatore di gravità","liv":5,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e crea un campo gravitazionale localizzato in un cilindro di 6 m di raggio e 18 m di altezza per 1 round per livello di inventore. Le creature volanti all'interno dell'area devono superare un Tiro Salvezza su Riflessi all'inizio di ogni loro turno o precipitare a terra subendo i normali danni da caduta. Le creature non volanti all'interno dell'area subiscono i seguenti effetti: velocità dimezzata, penalità -2 ai tiri per colpire, ai danni e alle prove di Forza e Destrezza. Le creature con il sottotipo aria sono immuni a questo effetto."},{"id":"camera_di_stasi","nome":"Camera di stasi","liv":5,"consumabile":false,"testo":"Questo mechanus si muove verso un bersaglio entro 9 m e lo avvolge in un guscio di forza paralizzante. La vittima deve superare un Tiro Salvezza su Tempra o essere paralizzata per 1 round + 1 round ogni 3 livelli di inventore oltre il 9° (massimo 4 round al 18°). Chi supera il Tiro Salvezza è solamente barcollante per 1 round. Una creatura paralizzata dalla camera di stasi è completamente protetta da tutti i danni e gli effetti esterni durante la durata, ma non può effettuare alcuna azione né essere bersaglio di alleati. Le creature immuni alla paralisi sono immuni a questo effetto."},{"id":"singolarita","nome":"Singolarità","liv":6,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e collassa in un piccolo punto gravitazionale instabile. Per 1 round per livello di inventore, una singolarità di 1,5 m di diametro si manifesta nella casella selezionata. All'inizio del turno di ogni creatura entro 9 m dalla singolarità, questa deve superare un Tiro Salvezza su Tempra o essere trascinata di 3 m verso il centro (movimento che non provoca attacchi di opportunità). Le creature che terminano il loro turno entro 1,5 m dalla singolarità subiscono 6d10 danni da forza e devono superare un Tiro Salvezza su Riflessi o essere stordite per 1 round; il TS dimezza il danno. Gli oggetti non assicurati di peso inferiore a 100 kg vengono attratti automaticamente. Le creature con il sottotipo costrutto o le creature di taglia colossale sono immuni allo spostamento ma non ai danni."},{"id":"disintegratore_atomico","nome":"Disintegratore atomico","liv":6,"consumabile":false,"testo":"Si effettua un tiro per colpire a distanza contro un bersaglio entro 30 m tirando 1d20 + il livello di inventore + bonus di Intelligenza. Se l'attacco colpisce, un raggio di energia disintegrante perfora il bersaglio infliggendo 2d6 danni da forza per livello di inventore (massimo 40d6 al 20° livello). La vittima può superare un Tiro Salvezza su Tempra per dimezzare il danno. Se il bersaglio viene ridotto a 0 PF o meno da questo attacco, viene completamente disintegrato, lasciando solo polvere fine; le creature disintegrate in questo modo non possono essere riportate in vita se non tramite Resurrezione Pura, Desiderio o Miracolo. Gli oggetti non magici colpiti dal raggio (fino a un cubo di 3 m di lato) vengono automaticamente disintegrati; gli oggetti magici devono superare un Tiro Salvezza su Tempra o essere disintegrati."},{"id":"olomega","nome":"Olomega","liv":6,"consumabile":false,"testo":"Questo mechanus si muove restando nello spazio dell'inventore e proietta un'illusione di area gigantesca, fino a un cubo di 18 m di lato, comprensiva di immagini, suoni, odori e sensazioni tattili (ma non discorsi coerenti). L'inventore controlla mentalmente l'illusione, che si muove fino a 9 m per round come azione gratuita. L'illusione può rappresentare creature, edifici, terreni o eventi naturali. Le creature che interagiscono con l'illusione (toccandola, esaminandola con cura, o attaccandola) possono superare un Tiro Salvezza su Volontà per riconoscerla come tale; le creature che osservano l'illusione comportarsi in modo impossibile o palesemente irreale ottengono un Tiro Salvezza spontaneo. Una volta che una creatura ha riconosciuto l'illusione, può comunicarlo agli alleati che ottengono bonus +4 al loro Tiro Salvezza. Il mechanus si disattiva dopo 1 minuto per livello di inventore. Questo è un effetto di [illusione: finzione]."},{"id":"sciame_distruttivo","nome":"Sciame distruttivo","liv":6,"consumabile":false,"testo":"Questo mechanus si attiva rilasciando una nube di nanobot industriali in un'area di 4,5 m di raggio entro 30 m. I nanobot funzionano come uno Sciame di ratti con i tratti dei costrutti, dimensione Grande, danno-sciame pari a 4d6 + bonus di Intelligenza dell'inventore, e attacco di distrazione (TS Tempra CD mechanus o nauseato 1 round). All'inizio del turno dell'inventore, come azione gratuita questi può ordinare allo sciame di muoversi fino a 9 m verso una direzione o creatura. Se non riceve ordini, lo sciame si muove verso il nemico più vicino all'inventore. Lo sciame si disattiva dopo 1 round per livello di inventore o se ridotto a 0 PF."},{"id":"replicatore_quantico","nome":"Replicatore quantico","liv":6,"consumabile":false,"testo":"Questo mechanus si attiva creando una copia olografica solida dell'inventore in una casella adiacente. La copia ha le medesime statistiche dell'inventore (compresi equipaggiamento attivo, modifiche di tecno-armi/esoscheletri, talenti, capacità di classe), Punti Ferita pari a metà di quelli dell'inventore in piena salute, e segue ordini telepatici. Le azioni della copia si svolgono nel turno dell'inventore (azione di movimento per ordinarla); può effettuare attacchi, lanciare incantesimi (se l'inventore può) e usare capacità di classe, ad eccezione di: creare nuovi mechanus, gadget o meraviglie; usare Riparazioni; usare Replicatore quantico. La copia condivide il pool di cariche dell'inventore con tecno-armi ed esoscheletri. Se la copia subisce danni, questi non si trasferiscono all'inventore. Il mechanus si disattiva dopo 1 minuto per livello di inventore o se la copia viene ridotta a 0 PF."},{"id":"generatore_di_muro_di_forza","nome":"Generatore di muro di forza","liv":6,"consumabile":false,"testo":"Questo mechanus si muove fino a 30 m e crea un muro di forza pura. L'inventore può configurare il muro come una parete piana fino a 1,5 m² per livello di inventore, oppure come sfera o emisfero con raggio fino a 30 cm per ogni 2 livelli di inventore. Il muro funziona come l'incantesimo Muro di forza: è invisibile, non può essere danneggiato da attacchi normali, blocca tutti gli effetti corporei e la maggior parte di quelli incorporei. Il muro permane per 1 round per livello di inventore o finché non viene dissolto da Disintegrazione, Sfera Annientatrice o un effetto equivalente; Dissolvi magie non ha effetto sul muro. Il mechanus rimane attivo per la durata del muro e si disattiva quando il muro viene dissolto o termina."}],"conosciuti":[[4],[6],[8],[8,4],[10,6],[10,8],[10,8,4],[10,10,6],[10,10,8],[10,10,8,4],[10,10,10,6],[10,10,10,8],[10,10,10,8,4],[10,10,10,10,6],[10,10,10,10,8],[10,10,10,10,8,2],[10,10,10,10,8,2],[10,10,10,10,8,4],[10,10,10,10,8,4],[10,10,10,10,8,6]],"alGiorno":[[1],[2],[3],[3,1],[4,2],[4,3],[4,3,1],[4,4,2],[5,4,3],[5,4,3,1],[5,4,4,2],[5,5,4,3],[5,5,4,3,1],[5,5,4,4,2],[5,5,5,4,3],[5,5,5,4,3,1],[5,5,5,4,4,2],[5,5,5,5,4,2],[5,5,5,5,5,3],[5,5,5,5,5,3]]},"tecno":{"regole":[{"nome":"Costruzione","testo":"Costruire una tecno-arma richiede 8 ore di lavoro giornaliero, più 1 ora aggiuntiva per ogni aggiornamento già effettuato. Un inventore ha bisogno di un'arma di base dalla quale partire, la quale deve essere un'arma di buona fattura, perfetta o magica. Quando si smantella una tecno-arma, si recupera automaticamente l'arma di base, inclusi eventuali incantamenti che possedeva."},{"nome":"Cariche","testo":"Ogni tecno-arma viene creata con un numero di cariche pari a metà livello di inventore + bonus di Intelligenza dell'inventore. Le cariche si ripristinano automaticamente all'alba di ogni giorno."},{"nome":"Modifiche","testo":"Per attivare una modifica, un inventore deve spendere 1 carica della tecno-arma. Salvo diversamente indicato, una modifica resta attiva per 1 minuto. Salvo diversamente indicato, attivare una modifica richiede un'azione gratuita all'inizio del proprio turno."},{"nome":"Modifiche passive","testo":"Queste modifiche non necessitano di alcuna azione per essere attivate, ma è la tecno-arma stessa che lo fa in maniera autonoma spendendo normalmente la carica. L'attivazione automatica può essere disabilitata o riabilitata come azione veloce."},{"nome":"Nodi","testo":"Ogni modifica necessita di un numero definito di nodi (indicato tra parentesi dopo il nome) per essere installata. Un inventore non può installare su una tecno-arma più nodi del proprio bonus di Intelligenza."}],"mods":[{"id":"chip_di_combattimento_assistito","nome":"Chip di combattimento assistito","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto la tecno-arma fornisce all'inventore bonus meccanico +1 ai tiri per colpire e ai tiri per i danni."},{"id":"chip_di_reazione_assistita","nome":"Chip di reazione assistita","nodi":1,"stadio":0,"passiva":true,"sempre":false,"testo":"Quando l'inventore tira l'iniziativa, la tecno-arma si attiva automaticamente spendendo 1 carica e fornisce bonus meccanico +3 alla prova. Questa modifica si attiva una sola volta per combattimento."},{"id":"magneti_graviton","nome":"Magneti “Graviton”","nodi":1,"stadio":0,"passiva":false,"sempre":true,"testo":"Solo armi da lancio. La tecno-arma è sempre dotata di campi magnetici controllati che, dopo essere stata scagliata, la fanno ritornare automaticamente nella mano dell'inventore alla fine del turno. La modifica non funziona se la tecno-arma viene scagliata oltre 3 incrementi di gittata, se non c'è una linea di effetto tra l'inventore e l'arma, o se si trova in un'area di antimagia.","solo":"armi da lancio"},{"id":"spray_fluorescente","nome":"Spray fluorescente","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Solo armi a distanza. Quando viene attivata questa modifica, per 1 minuto le munizioni della tecno-arma sono ricoperte di vernice fluorescente. Le creature colpite dagli attacchi vengono marcate: non possono più beneficiare di invisibilità, occultamento, oscurità o effetti come Velo per 1 minuto. Inoltre, l'inventore ottiene bonus +2 ai tiri per colpire a distanza contro tali creature per la stessa durata.","solo":"armi a distanza"},{"id":"sistema_di_estrazione_rapida","nome":"Sistema di estrazione rapida","nodi":1,"stadio":0,"passiva":false,"sempre"
