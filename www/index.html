:false,"testo":"Quando viene attivata questa modifica, per 1 minuto l'inventore può estrarre o riporre la tecno-arma come azione gratuita. Inoltre, può scambiare la tecno-arma da una mano all'altra come azione veloce."},{"id":"modulo_silenziatore","nome":"Modulo silenziatore","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Solo armi a distanza. Quando viene attivata questa modifica, per 1 minuto gli attacchi a distanza effettuati con la tecno-arma non comportano penalità alle prove di Furtività dell'inventore. Inoltre, le creature che subiscono un attacco da parte della tecno-arma silenziata devono superare una prova di Percezione con CD pari alla CD del mechanus per individuare la direzione dell'attacco.","solo":"armi a distanza"},{"id":"sensore_di_prossimita","nome":"Sensore di prossimità","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto l'inventore non è considerato colto alla sprovvista durante il primo round di combattimento. Inoltre, ottiene bonus +2 alle prove di Percezione passiva e bonus cumulativo +1 alle prove di Iniziativa (che si cumula con bonus di altre fonti)."},{"id":"agganciamento_al_bersaglio","nome":"Agganciamento al bersaglio","nodi":1,"stadio":1,"passiva":false,"sempre":false,"testo":"Solo armi a distanza. Quando viene attivata questa modifica, per 1 minuto la tecno-arma nega qualsiasi probabilità di mancare il bersaglio dovuta a occultamento, occultamento totale o effetti di Velo e simili.","solo":"armi a distanza"},{"id":"chip_di_combattimento_assistito_superiore","nome":"Chip di combattimento assistito superiore","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto la tecno-arma fornisce all'inventore bonus meccanico +2 ai tiri per colpire e ai tiri per i danni. Incompatibile con la modifica Chip di combattimento assistito.","incompat":["chip_di_combattimento_assistito"]},{"id":"elettrodi","nome":"Elettrodi","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto gli attacchi effettuati con la tecno-arma infliggono +1d6 danni da elettricità. Incompatibile con le modifiche Generatore di fiamma e Refrigeratore.","incompat":["generatore_di_fiamma","refrigeratore"]},{"id":"emettitore_di_ronzio_krauser","nome":"Emettitore di ronzio “Krauser”","nodi":1,"stadio":1,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto la prima vittima colpita dalla tecno-arma vede aumentate di 5 le CD delle proprie prove di Concentrazione. Una creatura può essere bersagliata da questo effetto una sola volta ogni 24 ore."},{"id":"generatore_di_fiamma","nome":"Generatore di fiamma","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto gli attacchi effettuati con la tecno-arma infliggono +1d6 danni da fuoco. Incompatibile con le modifiche Elettrodi e Refrigeratore.","incompat":["elettrodi","refrigeratore"]},{"id":"invertitore_di_proto_flusso","nome":"Invertitore di proto-flusso","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto gli attacchi effettuati con la tecno-arma infliggono danno pieno alle creature fumose, semicorporee o incorporee."},{"id":"lama_a_catena","nome":"Lama a catena","nodi":1,"stadio":1,"passiva":false,"sempre":false,"testo":"Solo armi da mischia taglienti. Quando viene attivata questa modifica, per 1 minuto la minaccia di critico della tecno-arma viene raddoppiata (es. 20/x2 diventa 19-20/x2, 19-20/x2 diventa 17-20/x2). Questo effetto non si cumula con altre capacità simili (come il talento Critico migliorato o la proprietà Acuminata).","solo":"armi da mischia taglienti"},{"id":"pistone_a_scoppio","nome":"Pistone a scoppio","nodi":1,"stadio":1,"passiva":false,"sempre":false,"testo":"Solo armi da mischia contundenti. Quando viene attivata questa modifica, per 1 minuto la minaccia di critico della tecno-arma viene raddoppiata. Questo effetto non si cumula con altre capacità simili.","solo":"armi da mischia contundenti"},{"id":"propulsore_trans_elicoidale","nome":"Propulsore trans-elicoidale","nodi":1,"stadio":1,"passiva":false,"sempre":false,"testo":"Solo armi perforanti. Quando viene attivata questa modifica, per 1 minuto la minaccia di critico della tecno-arma viene raddoppiata. Questo effetto non si cumula con altre capacità simili.","solo":"armi perforanti"},{"id":"refrigeratore","nome":"Refrigeratore","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto gli attacchi effettuati con la tecno-arma infliggono +1d6 danni da freddo. Incompatibile con le modifiche Elettrodi e Generatore di fiamma.","incompat":["elettrodi","generatore_di_fiamma"]},{"id":"rivestimento_in_gomma_scudo","nome":"Rivestimento in gomma-scudo","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto la tecno-arma viene ricoperta di uno strato di gomma rinforzata. Gli attacchi effettuati con la tecno-arma infliggono +1d6 danni, ma tutti i danni inflitti (sia quelli base sia quelli extra) diventano danni non letali. Incompatibile con la proprietà Pietosa.","incompatSpeciale":"Pietosa"},{"id":"mirino_robo_telescopico","nome":"Mirino robo-telescopico","nodi":1,"stadio":1,"passiva":false,"sempre":false,"testo":"Solo armi a distanza. Quando viene attivata questa modifica, per 1 minuto l'incremento di gittata della tecno-arma aumenta di 3 m e i bonus di copertura dei bersagli vengono dimezzati (la copertura totale rimane efficace).","solo":"armi a distanza"},{"id":"stabilizzatore_giroscopico","nome":"Stabilizzatore giroscopico","nodi":1,"stadio":1,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto l'inventore ignora le penalità ai tiri per colpire dovute al movimento (proprio o di una cavalcatura), inclusa la penalità -4 per attaccare a distanza durante una carica."},{"id":"contrappesi_minerva","nome":"Contrappesi “Minerva”","nodi":2,"stadio":2,"passiva":false,"sempre":false,"testo":"Solo armi a due mani da mischia o a distanza a due mani. Quando viene attivata questa modifica, per 1 minuto la tecno-arma viene considerata di una taglia superiore ai fini del calcolo dei dadi di danno. Inoltre, l'inventore ottiene bonus +1 alle manovre di Spingere effettuate con la tecno-arma per ogni 4 livelli di inventore.","solo":"armi a due mani da mischia o a distanza a due mani"},{"id":"crio_vaporizzatore","nome":"Crio-vaporizzatore","nodi":2,"stadio":2,"passiva":false,"sempre":false,"testo":"Richiede modifica Refrigeratore installata. Quando viene attivata questa modifica, per 1 minuto i colpi critici inflitti dalla tecno-arma rilasciano una nube congelante: la vittima subisce 1d10 danni extra da freddo e deve superare un Tiro Salvezza su Tempra o vedersi dimezzata la velocità per 1 round.","richiede":["refrigeratore"]},{"id":"elettro_vaporizzatore","nome":"Elettro-vaporizzatore","nodi":2,"stadio":2,"passiva":false,"sempre":false,"testo":"Richiede modifica Elettrodi installata. Quando viene attivata questa modifica, per 1 minuto i colpi critici inflitti dalla tecno-arma rilasciano una scarica elettrostatica: la vittima subisce 1d10 danni extra da elettricità e deve superare un Tiro Salvezza su Tempra o essere frastornata per 1 round.","richiede":["elettrodi"]},{"id":"innesto_a_spinta","nome":"Innesto a spinta","nodi":1,"stadio":2,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto, immediatamente dopo aver inflitto danni con la tecno-arma, l'inventore può effettuare un passo di 1,5 m come azione gratuita. Tutti i successivi tiri per colpire fino alla fine del turno subiscono penalità -2. Incompatibile con la proprietà Avanzante.","incompatSpeciale":"Avanzante"},{"id":"piro_vaporizzatore","nome":"Piro-vaporizzatore","nodi":2,"stadio":2,"passiva":false,"sempre":false,"testo":"Richiede modifica Generatore di fiamma installata. Quando viene attivata questa modifica, per 1 minuto i colpi critici inflitti dalla tecno-arma fanno divampare la vittima: subisce 1d10 danni extra da fuoco e prende fuoco, subendo 1d6 danni da fuoco per round per 1d4 round (la vittima può spegnersi tirandosi a terra con un'azione di round completo, oppure con TS Riflessi all'inizio dei propri turni).","richiede":["generatore_di_fiamma"]},{"id":"mira_termica","nome":"Mira termica","nodi":1,"stadio":2,"passiva":false,"sempre":false,"testo":"Solo armi a distanza. Quando viene attivata questa modifica, per 1 minuto l'inventore ignora qualsiasi occultamento dovuto a fumo, foschia, oscurità naturale, polvere o effetti simili. Non funziona contro occultamento dovuto a effetti magici come Velo o Oscurità profonda.","solo":"armi a distanza"},{"id":"modulo_concussivo","nome":"Modulo concussivo","nodi":1,"stadio":2,"passiva":false,"sempre":false,"testo":"Solo armi da mischia. Quando viene attivata questa modifica, per 1 minuto una volta per round, immediatamente dopo aver inflitto danni con la tecno-arma, l'inventore può effettuare gratuitamente una manovra di Sbilanciare o Spingere contro il bersaglio colpito, senza provocare attacchi di opportunità.","solo":"armi da mischia"},{"id":"campo_arcano_soppressore","nome":"Campo arcano-soppressore","nodi":3,"stadio":3,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto ogni colpo inflitto a una creatura riduce di 1 la sua Resistenza agli Incantesimi (cumulativo). I colpi critici riducono la RI di un valore pari al moltiplicatore di critico dell'arma. La riduzione persiste finché la modifica è attiva e termina quando si disattiva."},{"id":"caricatore_robotizzato","nome":"Caricatore robotizzato","nodi":3,"stadio":3,"passiva":true,"sempre":false,"testo":"Solo armi da fuoco. Quando questa modifica è installata, la tecno-arma spende automaticamente 1 carica e fornisce all'inventore il 75% di probabilità di ignorare l'inceppamento dell'arma quando si verifica.","solo":"armi da fuoco"},{"id":"sintetizzatore_tattico","nome":"Sintetizzatore tattico","nodi":3,"stadio":3,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto una volta per round, come azione gratuita, l'inventore può sostituire una modifica attualmente attiva con un'altra modifica installata sulla tecno-arma. La modifica scelta non consuma cariche aggiuntive e dura per il tempo rimanente della modifica sostituita."},{"id":"agganciamento_al_bersaglio_superiore","nome":"Agganciamento al bersaglio superiore","nodi":3,"stadio":4,"passiva":false,"sempre":false,"testo":"Solo armi a distanza. Quando viene attivata questa modifica, per 1 minuto, una volta per round, l'inventore può ripetere un tiro per colpire fallito con la tecno-arma.","solo":"armi a distanza"},{"id":"risuonatore_di_forza","nome":"Risuonatore di forza","nodi":3,"stadio":4,"passiva":false,"sempre":false,"testo":"Quando viene attivata questa modifica, per 1 minuto gli attacchi effettuati con la tecno-arma vengono convertiti in danni da forza e ignorano qualsiasi Riduzione del Danno non magica. La tecno-arma può colpire normalmente le creature incorporee senza probabilità di mancare. Incompatibile con la modifica Invertitore di proto-flusso.","incompat":["invertitore_di_proto_flusso"]}],"optional":[{"id":"chip_di_combattimento_a_distanza","nome":"Chip di combattimento a distanza","req":1,"testo":"L'inventore apprende come installare un chip che fornisce all'inventore un talento di combattimento a distanza per un'arma scelta dall'inventore. Può scegliere tra: Arma focalizzata, Mira letale, Tiro lontano, Tiro rapido, Tiro ravvicinato, Tiro preciso. L'inventore deve soddisfare normalmente i requisiti del talento scelto."},{"id":"chip_di_combattimento_in_mischia","nome":"Chip di combattimento in mischia","req":1,"testo":"L'inventore apprende come installare un chip che fornisce un talento di combattimento in mischia per un'arma a scelta. Può scegliere tra: Arma accurata, Arma focalizzata, Attacco poderoso, Incalzare, Riflessi in combattimento. L'inventore deve soddisfare normalmente i requisiti del talento scelto."},{"id":"chip_di_combattimento_disonesto","nome":"Chip di combattimento disonesto","req":1,"testo":"L'inventore apprende come installare un chip che fornisce un talento di manovra migliorata per un'arma a scelta. Può scegliere tra: Fintare in combattimento, Riposizionare migliorato, Rubare migliorato, Sbilanciare migliorato, Sporco trucco migliorato, Trascinare migliorato. Al 8° livello di inventore o superiore, l'inventore può invece scegliere la versione superiore della manovra (Fintare migliorato, Riposizionare superiore, ecc.). L'inventore deve soddisfare normalmente i requisiti del talento scelto."},{"id":"compensatore_per_tecno_armi","nome":"Compensatore per tecno-armi","req":6,"testo":"L'inventore apprende come installare un compensatore di precisione sulle proprie tecno-armi. Una volta per combattimento, come azione gratuita, l'inventore può ripetere un tiro per colpire fallito con una propria tecno-arma."},{"id":"modulo_d_impatto_sdeng","nome":"Modulo d'impatto “Sdeng”","req":6,"testo":"L'inventore apprende come installare un modulo che amplifica l'impatto delle armi contundenti. Quando l'inventore mette a segno un colpo critico con una propria tecno-arma contundente, può spendere 1 carica come azione gratuita per costringere la vittima a superare un Tiro Salvezza su Tempra o essere barcollante per 1d3 round."},{"id":"modulo_di_penetrazione_da_cantiere","nome":"Modulo di penetrazione da cantiere","req":4,"testo":"L'inventore apprende come installare un modulo perforante. Le proprie tecno-armi ignorano 5 punti di Riduzione del Danno di base (es. una RD 10/magia diventa RD 5/magia contro gli attacchi della tecno-arma). Questo effetto non si applica alle Riduzioni del Danno che richiedono uno specifico tipo di materiale o allineamento (come RD/adamantio o RD/buono)."},{"id":"modulo_esplosivo_buum","nome":"Modulo esplosivo “Buum”","req":8,"testo":"L'inventore apprende come installare un piccolo carica esplosivo sulle munizioni delle proprie tecno-armi a distanza. Una volta per round, dopo aver inflitto danni con un attacco a distanza, l'inventore può spendere 1 carica e usare un'azione veloce per far detonare il proiettile sul bersaglio: tutte le creature entro 1,5 m dal bersaglio (incluso lo stesso) subiscono 1d6 danni da fuoco per ogni 2 livelli di inventore (massimo 10d6 al 20° livello). Un Tiro Salvezza su Riflessi dimezza il danno."},{"id":"rasoi_modello_shark","nome":"Rasoi modello “Shark”","req":4,"testo":"L'inventore apprende come installare lame seghettate sulle proprie tecno-armi taglienti. Quando viene attivato come modifica (1 carica, azione gratuita), per 1 minuto le proprie tecno-armi infliggono sanguinamento 1 per ogni 2 livelli di inventore (massimo 10) sulle creature colpite. Il sanguinamento si cumula con altri sanguinamenti dello stesso tipo (massimo 10)."},{"id":"riciclatore_energetico_per_tecno_armi","nome":"Riciclatore energetico per tecno-armi","req":1,"testo":"L'inventore apprende come installare un riciclatore che recupera parte dell'energia dispersa. Le proprie tecno-armi ottengono 2 cariche giornaliere extra."},{"id":"unita_di_ripercussione","nome":"Unità di ripercussione","req":14,"testo":"L'inventore apprende come installare un sistema di ricarica meccanizzato che consente colpi extra. Come parte di un'azione di attacco completo con una propria tecno-arma, l'inventore può effettuare un attacco extra usando il proprio Bonus di Attacco Base massimo. Dopo aver utilizzato questa capacità, deve attendere 1 turno completo prima di poterla riutilizzare."},{"id":"modulo_di_intimidazione_tonante","nome":"Modulo di intimidazione “Tonante”","req":6,"testo":"L'inventore apprende come installare un sistema acustico intimidatorio. Quando l'inventore colpisce per la prima volta una creatura con una propria tecno-arma (consumando 1 carica), la vittima deve superare un Tiro Salvezza su Volontà o essere scossa per 1 round ogni 3 livelli di inventore (massimo 6 round). Una creatura può essere bersagliata da questo effetto una sola volta ogni 24 ore. Questo è un effetto di [paura]."},{"id":"trasformatore_di_carica","nome":"Trasformatore di carica","req":10,"testo":"L'inventore apprende come installare un trasformatore di carica avanzato. Una volta per turno, l'inventore può attivare due modifiche contemporaneamente con una sola azione gratuita, ma spendendo 2 cariche invece di 1."}]},"automaton":{"regole":[{"nome":"Costruzione","testo":"Costruire un automaton richiede 16 ore di lavoro giornaliero, più 2 ore aggiuntive per ogni aggiornamento già effettuato. Il modello scelto al momento della costruzione (Destructor, Defensor, o Sagittar) non può essere modificato successivamente; per cambiare modello, l'inventore deve smantellare l'automaton e costruirne uno nuovo."},{"nome":"Caratteristiche generali","testo":"Gli automaton non sono intelligenti e non parlano. Sono costrutti e immuni agli effetti di [paura], [influenza mentale: charme, compulsione, finzione, trama e morale], [morte], [paralisi], [sonno], [stordimento], [veleno], [malattia], [sanguinamento], [affaticamento], [risucchio di energia] e a qualsiasi effetto che richieda un Tiro Salvezza su Tempra (a meno che si applichi anche agli oggetti o non sia innocuo). Gli automaton non subiscono danni non letali, danni alle caratteristiche e risucchi di caratteristiche. Hanno velocità su terreno 6 m e affondano automaticamente nei liquidi (falliscono automaticamente le prove di Nuotare). Non possono essere usati come cavalcature. Un automaton non subisce Ferite gravi, ma è considerato barcollante a 0 o meno Punti Ferita (questa condizione non può essere prevenuta o rimossa in alcun modo) e viene distrutto a -15 Punti Ferita."},{"nome":"Istruzioni per l'uso","testo":"Un inventore comanda il proprio automaton usando un trasmettitore vocale integrato nella sua dotazione. Il giocatore può gestire l'automaton come un personaggio. Se all'inizio del proprio turno l'automaton si trova fuori dal raggio del trasmettitore (30 m al 1° livello, esteso con gli aggiornamenti), diviene confuso. Un automaton non può usare armi all'infuori di quella base in dotazione, né indossare armature. Può usare le proprie mani per manipolare l'ambiente circostante in modo basilare (aprire una porta, piegare delle sbarre, sollevare un peso, ecc.)."},{"nome":"Incantare armi e scocca","testo":"L'arma e la scocca (che conta come un'armatura pesante) di un automaton possono essere incantate dall'inventore stesso, facendo riferimento al livello dell'inventore per il limite degli incantamenti. Armi e scocche non necessitano di essere perfette per ottenere un incantamento, ma necessitano di almeno un bonus di potenziamento +1 prima di poter ottenere una capacità speciale, come di consueto. Una volta ricevuto un incantamento, questo sarà associato permanentemente all'arma o alla scocca e, una volta recuperato in seguito a uno smantellamento o una razzia, resterà legato all'arma o alla scocca in questione e potrà essere riutilizzato solamente per incantare parti identiche di altri automaton, anche se di modello diverso."}],"tabella":[{"liv":3,"dv":3,"bonusPF":5,"forDes":0,"bab":"+2","tempra":3,"rif":1,"vol":3,"ca":{"destructor":15,"defensor":18,"sagittar":13}},{"liv":4,"dv":3,"bonusPF":0,"forDes":0,"bab":"+3","tempra":4,"rif":1,"vol":4,"ca":{"destructor":16,"defensor":19,"sagittar":14}},{"liv":5,"dv":4,"bonusPF":5,"forDes":0,"bab":"+3","tempra":4,"rif":1,"vol":4,"ca":{"destructor":17,"defensor":20,"sagittar":15}},{"liv":6,"dv":5,"bonusPF":0,"forDes":0,"bab":"+4","tempra":5,"rif":2,"vol":5,"ca":{"destructor":18,"defensor":21,"sagittar":16}},{"liv":7,"dv":6,"bonusPF":5,"forDes":1,"bab":"+5","tempra":5,"rif":2,"vol":5,"ca":{"destructor":19,"defensor":22,"sagittar":17}},{"liv":8,"dv":6,"bonusPF":0,"forDes":1,"bab":"+6/+1","tempra":5,"rif":2,"vol":5,"ca":{"destructor":20,"defensor":23,"sagittar":18}},{"liv":9,"dv":7,"bonusPF":5,"forDes":1,"bab":"+6/+1","tempra":6,"rif":2,"vol":6,"ca":{"destructor":22,"defensor":26,"sagittar":20}},{"liv":10,"dv":8,"bonusPF":0,"forDes":2,"bab":"+7/+2","tempra":6,"rif":3,"vol":6,"ca":{"destructor":23,"defensor":27,"sagittar":21}},{"liv":11,"dv":9,"bonusPF":5,"forDes":2,"bab":"+8/+3","tempra":6,"rif":3,"vol":6,"ca":{"destructor":23,"defensor":28,"sagittar":21}},{"liv":12,"dv":9,"bonusPF":0,"forDes":3,"bab":"+9/+4","tempra":7,"rif":3,"vol":7,"ca":{"destructor":24,"defensor":29,"sagittar":22}},{"liv":13,"dv":10,"bonusPF":5,"forDes":3,"bab":"+9/+4","tempra":7,"rif":3,"vol":7,"ca":{"destructor":24,"defensor":30,"sagittar":22}},{"liv":14,"dv":11,"bonusPF":0,"forDes":3,"bab":"+10/+5","tempra":8,"rif":4,"vol":8,"ca":{"destructor":25,"defensor":32,"sagittar":23}},{"liv":15,"dv":12,"bonusPF":5,"forDes":4,"bab":"+11/+6/+1","tempra":8,"rif":4,"vol":8,"ca":{"destructor":27,"defensor":34,"sagittar":25}},{"liv":16,"dv":12,"bonusPF":0,"forDes":4,"bab":"+12/+7/+2","tempra":8,"rif":4,"vol":8,"ca":{"destructor":28,"defensor":36,"sagittar":26}},{"liv":17,"dv":13,"bonusPF":5,"forDes":5,"bab":"+12/+7/+2","tempra":9,"rif":4,"vol":9,"ca":{"destructor":29,"defensor":37,"sagittar":27}},{"liv":18,"dv":14,"bonusPF":0,"forDes":5,"bab":"+13/+8/+3","tempra":9,"rif":5,"vol":9,"ca":{"destructor":31,"defensor":38,"sagittar":28}},{"liv":19,"dv":15,"bonusPF":5,"forDes":5,"bab":"+14/+9/+4","tempra":9,"rif":5,"vol":9,"ca":{"destructor":31,"defensor":38,"sagittar":29}},{"liv":20,"dv":15,"bonusPF":0,"forDes":6,"bab":"+15/+10/+5","tempra":10,"rif":5,"vol":10,"ca":{"destructor":32,"defensor":39,"sagittar":30}}],"modelli":{"destructor":{"nome":"Destructor","car":{"For":18,"Des":12,"Cos":null,"Int":null,"Sag":10,"Car":1},"righe":["Caratteristiche: For 18, Des 12, Cos —, Int —, Sag 10, Car 1.","Attacco in mischia: Schianto idraulico (1d10 danni contundenti; 19-20/x2). L'arma può essere incantata smantellando armi magiche da mischia a due mani.","Chip di combattimento 9-B: L'automaton ottiene il talento Attacco poderoso."]},"defensor":{"nome":"Defensor","car":{"For":16,"Des":12,"Cos":null,"Int":null,"Sag":10,"Car":1},"righe":["Caratteristiche: For 16, Des 12, Cos —, Int —, Sag 10, Car 1.","Attacco in mischia: Schianto meccanico (1d6 danni contundenti; 20/x2). L'arma può essere incantata smantellando armi magiche da mischia a una mano.","Chip di difesa V-54: L'automaton ottiene il talento Guardia del corpo (non deve soddisfarne i requisiti) e può usarlo un numero di volte per round pari al bonus di Intelligenza dell'inventore."]},"sagittar":{"nome":"Sagittar","car":{"For":12,"Des":18,"Cos":null,"Int":null,"Sag":10,"Car":1},"righe":["Caratteristiche: For 12, Des 18, Cos —, Int —, Sag 10, Car 1.","Attacco in mischia: Schianto (1d3 danni contundenti; 20/x2). Lo schianto del Sagittar non può ricevere incantamenti.","Attacco a distanza: Sparaculei (1d8 danni perforanti; 20/x3); gittata 30 m (x5). L'arma può essere incantata smantellando armi magiche da tiro.","Chip di combattimento 42-A: L'automaton aggiunge metà bonus di Destrezza ai tiri per i danni con le armi a distanza e ottiene il talento Mira letale."]}},"voci":[{"id":"trasmettitore_vocale","nome":"Trasmettitore vocale","stadio":0,"modelli":["destructor","defensor","sagittar"],"opzionale":false,"incantamenti":null,"testo":"L'inventore può comandare verbalmente l'automaton fino a 30 m di distanza, anche bisbigliando."},{"id":"incantamenti_funzionalita_di_base","nome":"Incantamenti (Funzionalità di base)","stadio":0,"modelli":["destructor","defensor","sagittar"],"opzionale":false,"incantamenti":1,"testo":"L'arma e la scocca dell'automaton possono ottenere ciascuna un massimo di incantamenti pari a +1."},{"id":"aumento_di_taglia","nome":"Aumento di taglia","stadio":1,"modelli":["destructor","defensor","sagittar"],"opzionale":true,"incantamenti":null,"testo":"Se lo desidera, l'inventore può aumentare la taglia dell'automaton a grande. Se ciò accade, l'automaton ottiene basetta da 4 caselle, portata 3 m, +2 Forza (taglia), −2 Destrezza, −1 CA, −1 ai tiri per colpire, −2 Furtività e −2 Volare, +2 BMC e +2 DMC (taglia) e un bonus di +10 Punti Ferita. Il danno base degli attacchi cambia di conseguenza."},{"id":"pistoni_rinforzati","nome":"Pistoni rinforzati","stadio":1,"modelli":["destructor"],"opzionale":false,"incantamenti":null,"testo":"I pistoni dell'automaton vengono potenziati con servo-meccanismi avanzati. La Forza dell'automaton aumenta di ulteriori +2 (cumulativo con il bonus For/Des della tabella) e il danno dello Schianto idraulico aumenta di un grado del dado (1d10 → 2d6)."},{"id":"protocollo_di_difesa_b_24","nome":"Protocollo di difesa B-24","stadio":1,"modelli":["defensor"],"opzionale":false,"incantamenti":null,"testo":"L'automaton ottiene il talento Riflessi in combattimento."},{"id":"sistema_di_ricarica_accelerata","nome":"Sistema di ricarica accelerata","stadio":1,"modelli":["sagittar"],"opzionale":false,"incantamenti":null,"testo":"L'automaton ottiene il talento Tiro rapido (non deve soddisfarne i requisiti) e può effettuare un colpo extra a BAB massimo con lo Sparaculei come parte di un'azione di attacco completo. Inoltre, la gittata dello Sparaculei aumenta di 6 m."},{"id":"incantamenti_aggiornamento_1","nome":"Incantamenti (Aggiornamento #1)","stadio":1,"modelli":["destructor","defensor","sagittar"],"opzionale":false,"incantamenti":2,"testo":"Le armi e la scocca dell'automaton possono ottenere ciascuna un massimo di incantamenti pari a +2."},{"id":"trasmettitore_vocale_a_lungo_raggio","nome":"Trasmettitore vocale a lungo raggio","stadio":2,"modelli":["destructor","defensor","sagittar"],"opzionale":false,"incantamenti":null,"testo":"La portata del trasmettitore vocale dell'automaton diventa 100 m."},{"id":"protocollo_di_combattimento_n_78","nome":"Protocollo di combattimento N-78","stadio":2,"modelli":["destructor","sagittar"],"opzionale":false,"incantamenti":null,"testo":"L'automaton ottiene bonus +4 ai tiri per confermare le minacce di critico e la sua minaccia di critico aumenta di 1 (es. 20/x2 diventa 19-20/x2, 19-20/x2 diventa 18-20/x2)."},{"id":"protocollo_di_salvaguardia_q_12","nome":"Protocollo di salvaguardia Q-12","stadio":2,"modelli":["defensor"],"opzionale":false,"incantamenti":null,"testo":"Una volta per round, come azione immediata, se l'inventore subisce un colpo critico mentre si trova adiacente al Defensor, può trasferire al Defensor il danno extra del critico. I danni normali rimangono all'inventore; il danno extra colpisce il Defensor."},{"id":"incantamenti_aggiornamento_2","nome":"Incantamenti (Aggiornamento #2)","stadio":2,"modelli":["destructor","defensor","sagittar"],"opzionale":false,"incantamenti":3,"testo":"Le armi e la scocca dell'automaton possono ottenere ciascuna un massimo di incantamenti pari a +3."},{"id":"s_c_s_sistema_di_coscienza_simulata","nome":"S.C.S. (Sistema di Coscienza Simulata)","stadio":3,"modelli":["destructor","defensor","sagittar"],"opzionale":false,"incantamenti":null,"testo":"L'inventore installa un Sistema di Coscienza Simulata sull'automaton, conferendogli un punteggio di Intelligenza pari a 10. L'automaton può ora parlare e agire in base alla propria volontà, ma restando sempre fedele alle istruzioni del proprio creatore. L'automaton ottiene talenti appropriati ai suoi Dadi Vita e 2 punti abilità per Dado Vita, considerando qualsiasi abilità in cui l'inventore abbia gradi come abilità di classe."},{"id":"scocca_rinforzata","nome":"Scocca rinforzata","stadio":3,"modelli":["destructor","defensor","sagittar"],"opzionale":false,"incantamenti":null,"testo":"La scocca dell'automaton viene ricostruita con leghe avanzate stratificate di acciaio e adamantio. L'automaton ottiene RD 10/adamantio."},{"id":"incantamenti_aggiornamento_finale","nome":"Incantamenti (Aggiornamento finale)","stadio":3,"modelli":["destructor","defensor","sagittar"],"opzionale":false,"incantamenti":5,"testo":"Le armi e la scocca dell'automaton possono ottenere ciascuna un massimo di incantamenti pari a +5."}],"optional":[{"id":"aculei_differenziati","nome":"Aculei differenziati","req":1,"modelli":["sagittar"],"prereq":[],"testo":"L'inventore apprende come rifornire lo sparaculei dei propri automaton modello Sagittar con dardi a testa piatta e a mezzaluna. L'automaton può decidere quale tipo di danno infliggere con lo sparaculei (tagliente, perforante o contundente)."},{"id":"armi_retrattili","nome":"Armi retrattili","req":1,"modelli":["destructor"],"prereq":[],"testo":"L'inventore impara come dotare i propri automaton modello Destructor di lame e punte retrattili sul dorso delle braccia. L'automaton può decidere quale tipo di danno infliggere con lo schianto idraulico (tagliente, perforante o contundente)."},{"id":"cannone_demolitore","nome":"Cannone demolitore","req":10,"modelli":["sagittar"],"prereq":[],"testo":"L'inventore apprende come installare un piccolo obice sul petto o sulla spalla dei propri automaton modello Sagittar. L'automaton può azionare il cannone come azione standard, per infliggere 1d6 danni contundenti e perforanti per Dado Vita posseduto (massimo 10d6) a tutti i bersagli in una linea di 12 m. Le vittime possono superare un Tiro Salvezza su Riflessi per dimezzare il danno. Dopo aver azionato il cannone, si deve attendere 3 round prima di poterlo fare nuovamente."},{"id":"modulo_di_difesa_istrice","nome":"Modulo di difesa “Istrice”","req":6,"modelli":["destructor","defensor","sagittar"],"prereq":[],"testo":"L'inventore impara come dotare il corpo dei propri automaton di fessure pneumatiche. Come azione veloce l'automaton può far uscire o rientrare da queste fessure delle punte acuminate. Se le punte sono fuori, quando un avversario colpisce l'automaton con un attacco naturale o un colpo senz'armi o effettua contro di lui una manovra di Lottare, subisce 2d4 danni perforanti. Inoltre, gli attacchi in mischia dell'automaton infliggono 2 danni extra e sono di tipo perforante oltre al normale tipo."},{"id":"modulo_overdrive_alpha","nome":"Modulo “Overdrive Alpha”","req":8,"modelli":["destructor"],"prereq":[],"testo":"Una volta al giorno, come azione veloce l'inventore può attivare il modulo tramite il trasmettitore vocale, fornendo all'automaton bonus +3 ai tiri per colpire e ai danni con lo schianto idraulico e bonus di potenziamento +3 m alla velocità su terreno. L'effetto dura 1 + metà bonus di Intelligenza dell'inventore round. Dopo, l'automaton diventa barcollante per 1 minuto."},{"id":"modulo_overdrive_beta","nome":"Modulo “Overdrive Beta”","req":8,"modelli":["defensor"],"prereq":[],"testo":"Una volta al giorno, come azione veloce l'inventore può attivare il modulo, fornendo all'automaton bonus di schivare +2 alla CA e il talento Mobilità. L'effetto dura 1 + metà bonus di Intelligenza dell'inventore round. Dopo, l'automaton diventa barcollante per 1 minuto."},{"id":"modulo_overdrive_gamma","nome":"Modulo “Overdrive Gamma”","req":8,"modelli":["sagittar"],"prereq":[],"testo":"Una volta al giorno, come azione veloce l'inventore può attivare il modulo, fornendo all'automaton bonus +3 ai tiri per colpire e ai danni con lo sparaculei. L'effetto dura 1 + metà bonus di Intelligenza dell'inventore round. Dopo, l'automaton diventa barcollante per 1 minuto."},{"id":"propulsori","nome":"Propulsori","req":1,"modelli":["destructor","defensor","sagittar"],"prereq":[],"testo":"L'inventore impara come dotare le piante dei piedi dei propri automaton di sfiati propulsivi. L'automaton ottiene bonus alle prove di Acrobazia (saltare) e di Scalare pari a metà livello di inventore. Inoltre, ottiene una velocità di Nuotare di 1,5 m."},{"id":"protocollo_sfida_d_acciaio","nome":"Protocollo “Sfida d'acciaio”","req":4,"modelli":["defensor"],"prereq":[],"testo":"L'inventore apprende come installare uno speciale protocollo difensivo sui propri automaton modello Defensor. Come azione standard l'automaton può erompere in una provocazione diretta a una creatura entro 18 m con un punteggio di Intelligenza pari a 3 o superiore. Questo è un effetto di [compulsione], [visivo] e [uditivo]. Il bersaglio deve effettuare un Tiro Salvezza su Volontà con CD 10 + metà livello di inventore + metà Dadi Vita dell'automaton. Una creatura provocata ottiene bonus di +1 al Tiro Salvezza per ogni nemico diverso dall'automaton da cui è minacciata. Se il tiro fallisce, per un numero di round pari a 2 + 1 ogni 5 punti di fallimento, la vittima deve concentrarsi sull'automaton attaccandolo in mischia e avvicinandosi o caricandolo se fuori portata. La creatura può avvicinarsi scegliendo il proprio percorso. Se dispone di mezzi adatti, invece di avvicinarsi o attaccare in mischia, la creatura può attaccarlo a distanza (non può scagliare sassi o oggetti improvvisati). Un automaton può avere una sola creatura provocata alla volta. La provocazione fallisce o ha termine se alla creatura viene impedito di attaccare l'automaton o se attaccarlo fosse troppo controproducente. Se supera il tiro, una vittima diventa immune al protocollo per 24 ore."},{"id":"riparazione_automatica","nome":"Riparazione automatica","req":6,"modelli":["destructor","defensor","sagittar"],"prereq":[],"testo":"L'automaton è dotato di un sistema di auto-riparazione integrato. All'inizio del turno dell'automaton, se questo ha subito danni nel turno precedente, recupera 1d6 + bonus di Intelligenza dell'inventore Punti Ferita. Questa capacità non funziona se l'automaton si trova a 0 PF o meno."},{"id":"rinforzi_antiurto_f1","nome":"Rinforzi antiurto F1","req":6,"modelli":["destructor","defensor","sagittar"],"prereq":[],"testo":"Il corpo dell'automaton è rinforzato in punti critici. L'automaton ottiene il 25% di probabilità di ignorare il danno extra dei colpi critici e dei danni da precisione."},{"id":"rinforzi_antiurto_f2","nome":"Rinforzi antiurto F2","req":10,"modelli":["destructor","defensor","sagittar"],"prereq":["rinforzi_antiurto_f1"],"testo":"La probabilità di ignorare il danno extra dei colpi critici e dei danni da precisione sale al 50%."},{"id":"rinforzi_antiurto_f3","nome":"Rinforzi antiurto F3","req":14,"modelli":["destructor","defensor","sagittar"],"prereq":["rinforzi_antiurto_f2"],"testo":"La probabilità di ignorare il danno extra dei colpi critici e dei danni da precisione sale al 75%."},{"id":"rinforzi_antiurto_f4","nome":"Rinforzi antiurto F4","req":18,"modelli":["destructor","defensor","sagittar"],"prereq":["rinforzi_antiurto_f3"],"testo":"L'automaton diventa completamente immune al danno extra dei colpi critici e dei danni da precisione. Inoltre, la sua DMC contro le manovre di Sbilanciare e Spingere aumenta di 4."},{"id":"modulo_di_osservazione","nome":"Modulo di osservazione","req":4,"modelli":["destructor","defensor","sagittar"],"prereq":[],"testo":"L'automaton è dotato di sensori avanzati. Considera Percezione e Sopravvivenza (cercare tracce) come abilità di classe e ottiene bonus di competenza pari a metà livello di inventore a queste abilità. Inoltre, l'automaton non è considerato colto alla sprovvista durante il primo round di combattimento."},{"id":"modulo_di_assistenza_tattica","nome":"Modulo di assistenza tattica","req":10,"modelli":["destructor","defensor","sagittar"],"prereq":[],"testo":"L'automaton è programmato per coordinarsi tatticamente con l'inventore. Quando si trova adiacente all'inventore, entrambi ottengono bonus +2 al fiancheggiamento (cumulativo con il bonus standard di +2, per un totale di +4). Inoltre, l'inventore può usare l'automaton come fonte di fiancheggiamento anche se quest'ultimo non minaccia normalmente la creatura."}]},"eso":{"armature":[{"id":"corpetto_imbottito","tipo":"L","nome":"Corpetto imbottito","ca":1,"maxDes":6,"pen":0,"speciale":""},{"id":"corpetto_di_cuoio","tipo":"L","nome":"Corpetto di cuoio","ca":2,"maxDes":5,"pen":0,"speciale":""},{"id":"corpetto_di_legno","tipo":"L","nome":"Corpetto di legno","ca":3,"maxDes":3,"pen":-2,"speciale":"Galleggiante"},{"id":"corpetto_di_cuoio_borchiato","tipo":"L","nome":"Corpetto di cuoio borchiato","ca":3,"maxDes":5,"pen":-1,"speciale":""},{"id":"giaco_di_maglia","tipo":"L","nome":"Giaco di maglia","ca":4,"maxDes":4,"pen":-2,"speciale":""},{"id":"corazza_a_strisce","tipo":"P","nome":"Corazza a strisce","ca":8,"maxDes":0,"pen":-7,"speciale":"Scomoda"},{"id":"corazza_di_bande","tipo":"P","nome":"Corazza di bande","ca":9,"maxDes":0,"pen":-6,"speciale":"Scomoda"},{"id":"mezza_armatura","tipo":"P","nome":"Mezza armatura","ca":9,"maxDes":1,"pen":-7,"speciale":"Scomoda"},{"id":"mezza_armatura_flessibile","tipo":"P","nome":"Mezza armatura flessibile","ca":9,"maxDes":1,"pen":-7,"speciale":"Scomoda, Flessibile"},{"id":"armatura_completa","tipo":"P","nome":"Armatura completa","ca":10,"maxDes":1,"pen":-6,"speciale":"Scomoda"}],"regole":[{"nome":"Costruzione","testo":"Costruire un esoscheletro richiede un numero di ore di lavoro giornaliero pari a 16 + 2 per ogni aggiornamento. Un inventore ha bisogno di un'armatura dalla quale partire, detta armatura base, la quale deve essere un'armatura leggera perfetta o magica (per costruire un esoscheletro leggero) o un'armatura pesante perfetta o magica (per costruire un esoscheletro pesante). Quando si smantella un esoscheletro, si recupera automaticamente l'armatura base. Un esoscheletro mantiene le statistiche e le capacità speciali dell'armatura base. Un esoscheletro pesa il doppio dell'armatura base."},{"nome":"Cariche","testo":"Ogni esoscheletro viene creato con un numero di cariche pari a metà livello di inventore + bonus di Intelligenza dell'inventore. Le cariche si ripristinano automaticamente all'alba di ogni giorno."},{"nome":"Istruzioni per l'uso","testo":"Per usare un esoscheletro, un inventore deve essere competente nell'uso dell'armatura base. Un inventore ottiene Competenza nelle armature pesanti come talento bonus, ma può beneficiarne solamente quando pilota un esoscheletro pesante. Un esoscheletro fornisce i propri benefici e capacità solo mentre viene indossato."},{"nome":"Modifiche","testo":"Per attivare una modifica, un inventore deve spendere 1 carica dell'esoscheletro. Salvo diversamente indicato, una modifica resta attiva per 1 minuto. Salvo diversamente indicato, attivare una modifica richiede un'azione gratuita all'inizio del proprio turno."},{"nome":"Modifiche passive","testo":"Queste modifiche non necessitano di alcuna azione per essere attivate, ma è l'esoscheletro stesso che lo fa in maniera autonoma spendendo normalmente la carica. L'attivazione automatica può essere disabilitata o riabilitata come azione veloce."},{"nome":"Nodi","testo":"Ogni modifica necessita di un numero definito di nodi (indicato tra parentesi) per essere installata. Un inventore non può installare su un esoscheletro più nodi del proprio bonus di Intelligenza."},{"nome":"Taglia","testo":"Gli esoscheletri hanno sempre una taglia media. Un inventore di taglia piccola all'interno di un esoscheletro diventa di taglia media e ottiene −1 CA, −1 ai tiri per colpire, −2 Furtività, +2 BMC e +2 DMC."},{"nome":"Slot oggetti","testo":"Il pilota continua ad avere i propri slot oggetto, poiché li indossa normalmente sotto l'esoscheletro."},{"nome":"Portellone","testo":"L'esoscheletro ha un vano di accesso sul retro azionabile con una leva. Entrare o uscire da un esoscheletro necessita di un'azione di round completo."},{"nome":"Vano oggetti","testo":"L'inventore non può indossare nello slot “spalle” oggetti più ingombranti di un mantello. Per sopperire a ciò, un esoscheletro è dotato di piccoli vani di stoccaggio sulle gambe e sui fianchi, capaci di contenere 32 oggetti “zaino” più altri 10 a “portata di mano”. Le azioni necessarie a recuperare questi oggetti restano invariate."}],"mods":[{"id":"armatura_migliorata","nome":"Armatura migliorata","nodi":0,"stadio":0,"tipo":"C","sempre":true,"passiva":false,"auto":true,"testo":"L'armatura utilizzata come base per un esoscheletro vede il proprio bonus di armatura alla CA aumentato di 1 e la penalità alle prove ridotta di 1."},{"id":"bombole_d_ossigeno","nome":"Bombole d'ossigeno","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 ora, l'esoscheletro fornisce all'inventore aria respirabile in qualsiasi ambiente (subacqueo, sottoterra, atmosfere tossiche, nube velenosa, vuoto). Non protegge dalle altre conseguenze ambientali (pressione, temperatura, ecc.). Le bombole devono essere ricaricate all'alba.","tipo":"C"},{"id":"allarme_di_prossimita_L","nome":"Allarme di prossimità","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore ottiene i benefici del talento Mobilità (non deve soddisfarne i requisiti).","tipo":"L"},{"id":"campo_anti_contatto","nome":"Campo anti-contatto","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore aggiunge il bonus di Intelligenza alla CA di contatto (la CA di contatto non può mai superare la normale CA).","tipo":"C"},{"id":"galleggianti","nome":"Galleggianti","nodi":1,"stadio":0,"passiva":true,"sempre":false,"testo":"Quando l'esoscheletro è immerso in acqua o liquidi simili fino alla vita, attiva automaticamente cuscinetti d'aria: per 10 minuti l'inventore non affonda e ottiene velocità di Nuotare 3 m, dopodiché la modifica si disattiva. Non può trasportare altre creature di taglia piccola o superiore.","tipo":"C"},{"id":"modulo_mimetico_adattivo_L","nome":"Modulo mimetico adattivo","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 ora, le prove di Sopravvivenza per seguire le tracce dell'inventore subiscono penalità −5 e l'inventore stesso ottiene bonus di circostanza +5 a Furtività. Incompatibile con la capacità Irrintracciabile.","tipo":"L","incompatSpeciale":"Irrintracciabile"},{"id":"motore_potenziato_L","nome":"Motore potenziato","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 ora l'inventore ottiene bonus di potenziamento +3 m alla velocità.","tipo":"L"},{"id":"potenziamento_strutturale_2_L","nome":"Potenziamento strutturale +2","nodi":1,"stadio":0,"passiva":false,"sempre":true,"testo":"L'inventore ottiene bonus di potenziamento +2 a Destrezza. Più potenziamenti strutturali non si cumulano.","tipo":"L"},{"id":"reattori_plantari_L","nome":"Reattori plantari","nodi":1,"stadio":0,"passiva":true,"sempre":false,"testo":"Quando l'inventore cade, l'esoscheletro attiva getti controllati: l'inventore ignora i primi 18 m della caduta, dopodiché la modifica si disattiva fino all'alba. Non può trasportare altre creature.","tipo":"L"},{"id":"stimolanti_surrenali_L","nome":"Stimolanti surrenali","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Come azione gratuita, l'inventore può spendere 1 carica per ottenere eludere (vedi privilegi di classe del ladro) contro un singolo attacco ad area o a soffio.","tipo":"L"},{"id":"copertura_oleosa_P","nome":"Copertura oleosa","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore ottiene bonus di circostanza +8 alle prove per resistere alla lotta altrui e a quelle di Artista della fuga. La penalità di armatura si applica normalmente. Incompatibile con la capacità Scivolosa.","tipo":"P","incompatSpeciale":"Scivolosa"},{"id":"potenziamento_strutturale_2_P","nome":"Potenziamento strutturale +2","nodi":1,"stadio":0,"passiva":false,"sempre":true,"testo":"L'inventore ottiene bonus di potenziamento +2 a Forza. Più potenziamenti strutturali non si cumulano.","tipo":"P"},{"id":"scocca_anti_abrasione_P","nome":"Scocca anti-abrasione","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore ottiene RD 3/contundente o perforante. Incompatibile con la capacità Dello zombie.","tipo":"P","incompatSpeciale":"Dello zombie"},{"id":"scocca_anti_perforazione_P","nome":"Scocca anti-perforazione","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore ottiene RD 3/contundente o tagliente. Incompatibile con la capacità Del rigonfio.","tipo":"P","incompatSpeciale":"Del rigonfio"},{"id":"scocca_anti_urto_P","nome":"Scocca anti-urto","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore ottiene RD 3/tagliente o perforante. Incompatibile con la capacità Dello scheletro.","tipo":"P","incompatSpeciale":"Dello scheletro"},{"id":"servoarmi_potenziati_P","nome":"Servoarmi potenziati","nodi":1,"stadio":0,"passiva":false,"sempre":false,"testo":"Per 1 minuto, i servoarmi dell'esoscheletro pesante amplificano la forza fisica dell'inventore. Le manovre di Disarmare, Lottare, Riposizionare, Sbilanciare e Spingere ottengono bonus +4 al BMC. Inoltre, l'inventore può sollevare il doppio del proprio peso massimo trasportabile.","tipo":"P"},{"id":"sistema_difensivo_d_emergenza_P","nome":"Sistema difensivo d'emergenza","nodi":1,"stadio":0,"passiva":true,"sempre":false,"testo":"Quando l'inventore diventa privo di sensi, nauseato, stordito o immobilizzato, l'esoscheletro attiva placche aggiuntive: l'inventore ottiene RD 8/— finché non perde tale condizione (massimo 1 minuto), dopodiché la modifica si disattiva. Si cumula con qualsiasi altra RD. Non si attiva se l'inventore è in grado di effettuare azioni standard. Incompatibile con la capacità Assicurante.","tipo":"P","incompatSpeciale":"Assicurante"},{"id":"campo_isolante","nome":"Campo isolante","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Una volta al giorno, per 1 minuto, l'inventore ottiene immunità energetica contro un tipo di energia a scelta tra fuoco, freddo ed elettricità. Incompatibile con la capacità Immunità energetica.","tipo":"C","incompatSpeciale":"Immunità energetica"},{"id":"generatore_di_campo_difensivo","nome":"Generatore di campo difensivo","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'esoscheletro genera un campo di forza protettivo attorno all'inventore. L'inventore ottiene bonus di deviazione +2 alla CA. Questo bonus aumenta di +1 al 14° livello e +1 al 18° livello (massimo +4).","tipo":"C"},{"id":"potenziamento_strutturale_4","nome":"Potenziamento strutturale +4","nodi":2,"stadio":1,"passiva":false,"sempre":true,"testo":"Bonus di potenziamento +4 a Destrezza (esoscheletro leggero) o +4 a Forza (esoscheletro pesante). Non si cumula con i potenziamenti strutturali precedenti.","tipo":"C"},{"id":"scudo_antimagia","nome":"Scudo antimagia","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore ottiene bonus di fortuna +4 alla CA contro attacchi di capacità magiche e incantesimi (inclusi attacchi di contatto) e contro gli attacchi delle creature evocate. Incompatibile con la capacità Schiva incantesimi.","tipo":"C","incompatSpeciale":"Schiva incantesimi"},{"id":"crono_polarizzatore_L","nome":"Crono-polarizzatore","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"Una volta al giorno, per 3 round l'inventore ottiene gli effetti dell'incantesimo Velocità. Incompatibile con la capacità Velocità.","tipo":"L","incompatSpeciale":"Velocità"},{"id":"modulo_di_trasporto_P","nome":"Modulo di trasporto","nodi":2,"stadio":1,"passiva":false,"sempre":false,"testo":"L'esoscheletro pesante può trasportare un alleato consenziente di taglia piccola o media in un alloggiamento sulla schiena. L'alleato è considerato in copertura parziale (+4 alla CA) durante il trasporto e può attaccare in mischia o a distanza, ma non può lanciare incantesimi con componenti somatiche. La velocità dell'inventore è ridotta del 25% mentre trasporta un alleato. L'alleato può salire o scendere come azione di movimento.","tipo":"P"},{"id":"stimpack_P","nome":"Stimpack","nodi":2,"stadio":1,"passiva":true,"sempre":false,"testo":"Una volta al giorno, quando un attacco sta per ridurre l'inventore a meno di 0 Punti Ferita, l'esoscheletro inietta antidolorifici tramite aghi sterili curandolo di 2d8+5 danni, dopodiché la modifica si disattiva. Incompatibile con la capacità Assicurante.","tipo":"P","incompatSpeciale":"Assicurante"},{"id":"modulo_di_riparazione_attiva","nome":"Modulo di riparazione attiva","nodi":3,"stadio":2,"passiva":false,"sempre":false,"testo":"Una volta al giorno, come azione veloce l'inventore può attivare il modulo. Per 1 minuto per livello di inventore, all'inizio del proprio turno l'inventore recupera 2d6 + bonus di Intelligenza Punti Ferita. La modifica si disattiva quando l'inventore raggiunge i Punti Ferita massimi o al termine della durata.","tipo":"C"},{"id":"potenziamento_strutturale_6","nome":"Potenziamento strutturale +6","nodi":3,"stadio":2,"passiva":false,"sempre":true,"testo":"Bonus di potenziamento +6 a Destrezza (esoscheletro leggero) o +6 a Forza (esoscheletro pesante). Non si cumula con i potenziamenti strutturali precedenti.","tipo":"C"},{"id":"modulo_di_occultamento_L","nome":"Modulo di occultamento","nodi":3,"stadio":2,"passiva":false,"sempre":false,"testo":"Tre volte al giorno, per 2 round l'inventore ottiene occultamento 33% grazie a un generatore di disturbo ottico.","tipo":"L"},{"id":"servoarmi_propulsivi_L","nome":"Servoarmi propulsivi","nodi":3,"stadio":2,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore può effettuare attacchi senz'armi e da lotta con la potenza di un esoscheletro pesante. Gli attacchi senz'armi infliggono 1d8 danni contundenti + bonus di Forza, e le manovre di Lottare ottengono bonus +4 al BMC. Inoltre, l'inventore può eseguire un'azione di carica anche in spazi ristretti o terreno difficile.","tipo":"L"},{"id":"trivelle_excavator_L","nome":"Trivelle “Excavator”","nodi":3,"stadio":2,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore ottiene velocità di Scavare 3 m attraverso terreno malleabile (terra, sabbia, argilla). Il terreno ricade dietro di lui e la galleria non può essere usata da altri. Le trivelle attive forniscono bonus +4 ai Tiri Salvezza contro frane, valanghe, crolli e simili.","tipo":"L"},{"id":"airbag_a_schiuma_espansa_P","nome":"Airbag a schiuma espansa","nodi":3,"stadio":2,"passiva":true,"sempre":false,"testo":"Una volta al giorno, quando l'inventore subisce un colpo critico o danni da precisione in mischia, l'esoscheletro ignora il relativo danno extra, dopodiché la modifica si disattiva. Se l'attacco è sia critico che da precisione, l'inventore sceglie quale ignorare. Incompatibile con la capacità Denegante.","tipo":"P","incompatSpeciale":"Denegante"},{"id":"campo_refrattario_P","nome":"Campo refrattario","nodi":3,"stadio":2,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'esoscheletro emette un campo di forza respingente: l'inventore ottiene RD 5/magia. Incompatibile con la capacità Invulnerabilità.","tipo":"P","incompatSpeciale":"Invulnerabilità"},{"id":"campo_occultante_predator","nome":"Campo occultante “Predator”","nodi":3,"stadio":3,"passiva":false,"sempre":false,"testo":"Quando un nemico lo dichiara come bersaglio di un attacco, come azione immediata l'inventore può spendere 1 carica dell'esoscheletro per ottenere per quel turno occultamento totale nei confronti di tale nemico. Questa modifica non impedisce al nemico di mirare normalmente verso l'inventore. L'incantesimo Visione del vero rivela la locazione effettiva dell'inventore.","tipo":"C"},{"id":"sistema_di_volo_a_getto_L","nome":"Sistema di volo a getto","nodi":3,"stadio":3,"passiva":false,"sempre":false,"testo":"Per 1 minuto, l'inventore ottiene velocità di Volare 12 m (manovrabilità media). L'attivazione richiede 1 carica + 1 carica ogni minuto aggiuntivo. Se l'esoscheletro esaurisce le cariche durante il volo, l'inventore plana per 1 round prima di iniziare a cadere normalmente. Incompatibile con la capacità Alata.","tipo":"L","incompatSpeciale":"Alata"},{"id":"corazza_adamantina_P","nome":"Corazza adamantina","nodi":3,"stadio":3,"passiva":false,"sempre":false,"testo":"La scocca dell'esoscheletro pesante viene rinforzata con leghe avanzate stratificate. Finché l'esoscheletro ha almeno 1 carica, l'inventore ottiene RD 10/—. Quando l'inventore subisce 30 o più danni in un singolo round mentre questa modifica è attiva, l'esoscheletro spende automaticamente 1 carica per mantenere la RD attiva nel round successivo. Se l'esoscheletro è privo di cariche, la modifica si disattiva fino all'alba successiva.","tipo":"P"}],"optional":[{"id":"braccia_idrauliche_modello_x_2","nome":"Braccia idrauliche modello x-2","req":1,"solo":null,"prereq":[],"richiedeMod":null,"testo":"L'inventore apprende come innestare sugli esoscheletri servobraccia specifiche per i lavori pesanti, che consentono di compiere attacchi più potenti ma imprecisi. L'inventore ottiene il talento Attacco poderoso (non deve soddisfarne i requisiti)."},{"id":"imbottitura_deluxe","nome":"Imbottitura deluxe","req":1,"solo":"P","prereq":[],"richiedeMod":null,"testo":"L'inventore impara come realizzare cabine più comode per gli esoscheletri pesanti. L'inventore ignora la qualità Scomoda degli esoscheletri pesanti e può persino dormirvi restandovi in piedi per tutta la durata del riposo."},{"id":"intercapedini_di_raccolta_vapore","nome":"Intercapedini di raccolta vapore","req":1,"solo":null,"prereq":[],"richiedeMod":null,"testo":"Come azione standard l'inventore può spendere 2 cariche dell'esoscheletro per liberare il vapore raccolto attraverso bocchettoni. Se ciò accade, l'aria nelle caselle adiacenti all'inventore viene investita da un getto pressurizzato incandescente che infligge 1d6 danni da fuoco ogni due livelli di inventore alle creature colpite. Le vittime possono superare un Tiro Salvezza su Riflessi per dimezzare il danno. Una volta usato questo optional, si deve attendere 12 ore prima di poterlo usare nuovamente."},{"id":"propulsori","nome":"Propulsori","req":1,"solo":null,"prereq":[],"richiedeMod":null,"testo":"L'inventore impara come installare due bocchettoni energetici sui palmi delle mani e sotto i piedi degli esoscheletri, i quali consentono di propellersi tramite getti controllati. L'inventore ottiene bonus alle prove di Acrobazia (saltare) e di Scalare pari a metà livello di inventore."},{"id":"riciclatore_energetico_per_esoscheletri","nome":"Riciclatore energetico per esoscheletri","req":1,"solo":null,"prereq":[],"richiedeMod":null,"testo":"L'inventore apprende come installare questo speciale apparecchio, il quale recupera parte dell'energia dispersa, fornendo agli esoscheletri 2 cariche giornaliere extra."},{"id":"rinforzi_salvavita_f1","nome":"Rinforzi salvavita F1","req":6,"solo":null,"prereq":[],"richiedeMod":null,"testo":"L'inventore impara come rinforzare la scocca degli esoscheletri al fine di aumentare la protezione degli organi vitali. L'inventore ottiene il 25% di probabilità di ignorare il danno extra causato da colpi critici e danni da precisione."},{"id":"rinforzi_salvavita_f2","nome":"Rinforzi salvavita F2","req":10,"solo":null,"prereq":["rinforzi_salvavita_f1"],"richiedeMod":null,"testo":"La probabilità di ignorare il danno extra causato da colpi critici e danni da precisione sale al 50%."},{"id":"rinforzi_salvavita_f3","nome":"Rinforzi salvavita F3","req":14,"solo":null,"prereq":["rinforzi_salvavita_f2"],"richiedeMod":null,"testo":"La probabilità di ignorare il danno extra causato da colpi critici e danni da precisione sale al 75%."},{"id":"rinforzi_salvavita_f4","nome":"Rinforzi salvavita F4","req":18,"solo":null,"prereq":["rinforzi_salvavita_f3"],"richiedeMod":null,"testo":"La protezione raggiunge il 100%: l'inventore diventa completamente immune al danno extra causato da colpi critici e danni da precisione."},{"id":"scocca_titan","nome":"Scocca “Titan”","req":8,"solo":"P","prereq":[],"richiedeMod":null,"testo":"L'inventore apprende come costruire esoscheletri pesanti di taglia grande. Occupano uno spazio di 3 m e hanno portata naturale di 3 m. Rispetto a una taglia media, l'inventore ottiene +2 Forza (taglia), −2 Destrezza, −1 CA, −1 ai tiri per colpire, −2 Furtività e −2 Volare, +2 BMC e +2 DMC (taglia). Se l'inventore possiede già un esoscheletro pesante quando acquisisce questo optional, può modificarne subito la taglia con 8 ore di lavoro."},{"id":"sistema_di_comunicazione_a_lungo_raggio","nome":"Sistema di comunicazione a lungo raggio","req":6,"solo":null,"prereq":[],"richiedeMod":null,"testo":"L'inventore impara come installare nell'esoscheletro un complesso sistema di trasmissione. L'inventore può comunicare verbalmente con un alleato che possieda un esoscheletro, automaton, tecno-arma o gadget creato da lui stesso entro un raggio di 1,5 km per livello di inventore. La comunicazione funziona anche attraverso muri e pareti, ma non attraverso piombo o effetti antimagia. Il sistema non funziona se uno dei due dispositivi è privo di cariche."},{"id":"modulo_di_immersione","nome":"Modulo di immersione","req":12,"solo":null,"prereq":[],"richiedeMod":"bombole_d_ossigeno","testo":"L'inventore apprende come dotare l'esoscheletro di un sistema di immersione completo che funziona in combinazione con le Bombole d'ossigeno. Mentre l'esoscheletro ha installata e attiva la modifica Bombole d'ossigeno, l'inventore ottiene velocità di Nuotare pari a metà della sua velocità su terreno, Scurovisione 18 m in ambiente subacqueo, e l'esoscheletro è resistente alla pressione idrostatica fino a 300 m di profondità."},{"id":"sintetizzatore_di_sopravvivenza","nome":"Sintetizzatore di sopravvivenza","req":6,"solo":null,"prereq":[],"richiedeMod":null,"testo":"L'esoscheletro è dotato di un sistema avanzato di supporto vitale. Finché l'esoscheletro ha almeno 1 carica, l'inventore non ha bisogno di mangiare o bere (il sistema produce nutrienti basilari sufficienti), ottiene i benefici dell'incantesimo Contrastare elementi, e ottiene immunità ai danni non letali da fame, sete e ambienti naturali estremi (caldo/freddo non magici fino a −30°C / +50°C)."}]},"gadget":{"regole":[{"nome":"Costruzione","testo":"Salvo diversamente indicato, costruire un gadget non necessita di spesa e richiede 8 ore di lavoro giornaliero. Un inventore può possedere un solo gadget per tipo, indipendentemente dal fatto che lo usi lui o un alleato. Salvo diversamente indicato, i gadget hanno Durezza 10 e 20 Punti Ferita."},{"nome":"Ingombro","testo":"Un inventore ha dei magneti sulla cintura ai quali appendere i propri gadget, comprimibili fino a un quarto del loro volume. Il valore di ingombro indica il numero di spazi “a portata di mano” o dello zaino necessari. Solo i gadget a portata di mano possono essere usati. I gadget privi di valore di ingombro non vengono trasportati e il loro utilizzo è descritto a parte."},{"nome":"Posizionamento e recupero","testo":"Prelevare un gadget dagli oggetti a portata di mano è parte dell'azione utilizzata per attivarlo."},{"nome":"Attivazione","testo":"Salvo diversamente indicato, attivare un gadget richiede un'azione standard che provoca attacchi di opportunità. Recuperare un gadget da terra e/o rimetterlo nella cintura necessita di un'azione di movimento che provoca attacchi di opportunità."},{"nome":"Ricarica o attivazioni","testo":"Alcuni gadget hanno un numero limitato di attivazioni al giorno oppure necessitano di essere ricaricati dopo aver consumato carburante o energia. Per ricaricare, l'inventore deve impiegare il tempo indicato e non può camminare o compiere altre azioni durante la ricarica (che provoca attacchi di opportunità ogni round)."}],"elenco":[{"id":"t_e_s_trappola_esplosiva_spider","nome":"T.E.S. (Trappola Esplosiva Spider)","cat":"Combattimento e armi sperimentali","sub":"Trappole e armi da fuoco","req":1,"reqExtra":null,"testo":"Ingombro 1. Ricarica: 10 minuti (solo se scariche). Una volta al giorno, l'inventore può deporre questa mina meccanica a quattro zampe che si nasconde nel terreno per un massimo di 6 ore. Quando un nemico entra entro 9 m dalla T.E.S., questa si attacca alle sue gambe ed esplode, infliggendogli automaticamente 1d6 danni da fuoco per livello di inventore (massimo 6d6). Tutte le creature entro 3 m subiscono il medesimo danno, ma possono superare un Tiro Salvezza su Riflessi per dimezzarlo. La T.E.S. può essere scoperta tramite una prova di Percezione con CD 20 + bonus di Intelligenza dell'inventore. La T.E.S. ha CA 15, Durezza 5 e 10 Punti Ferita. Miglioria al 12° livello: l'inventore può deporre due T.E.S. al giorno.","sperimentale":false,"migliorie":[12]},{"id":"lanciagranate_r_92","nome":"Lanciagranate R-92","cat":"Combattimento e armi sperimentali","sub":"Trappole e armi da fuoco","req":10,"reqExtra":"dote Competenza nelle armi sperimentali","testo":"Arma da fuoco a due mani. Infligge 5d6 danni contundenti e perforanti in un'area di esplosione di 1,5 m, critico ad un punteggio x3. Gittata 9 m (incrementi x5), gittata minima 6 m. Il tamburo contiene 6 granate. Dopo ogni colpo è richiesta un'azione standard per ruotare il tamburo (con il talento Ricarica rapida diventa un'azione di movimento). Il Lanciagranate R-92 non può essere utilizzato tramite la dote Gadget for dummies. Ha Durezza 10 e 20 Punti Ferita. L'inventore ottiene gratuitamente la competenza nell'uso di quest'arma. Eccezione: diversamente dalle altre armi sperimentali, il Lanciagranate R-92 non è limitato a 1 attivazione al giorno (è considerato un'arma da fuoco vera e propria).","sperimentale":true,"migliorie":[]},{"id":"elettro_carabina_shock","nome":"Elettro-carabina “Shock”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":4,"reqExtra":null,"testo":"L'inventore scaglia entro 15 m una scarica elettrica, più una scarica aggiuntiva ogni 3 livelli oltre il 4° (massimo 3 scariche al 10° livello). Ogni scarica è un attacco di contatto a distanza che infligge 3d6 danni da elettricità. Le scariche possono essere dirette contro lo stesso bersaglio o contro bersagli diversi, purché questi siano entro 9 m l'uno dall'altro.","sperimentale":true,"migliorie":[]},{"id":"pistola_lanciafiamme_soffio_di_drago","nome":"Pistola lanciafiamme “Soffio di drago”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":1,"reqExtra":null,"testo":"L'inventore emette dalla pistola un cono di fuoco di 4,5 m, infliggendo 1d4 danni da fuoco per livello di inventore (massimo 5d4) alle creature nell'area. Un Tiro Salvezza su Riflessi dimezza il danno. I materiali infiammabili nell'area prendono fuoco automaticamente.","sperimentale":true,"migliorie":[]},{"id":"tuono_pistola_reoni_silver_thunder","nome":"Tuono-pistola “Reoni Silver thunder”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":1,"reqExtra":null,"testo":"L'inventore scaglia un boato acustico devastante contro una creatura entro 15 m, infliggendole 1d4 danni sonori per livello di inventore (massimo 5d4). La vittima è inoltre frastornata per 1 round. Un Tiro Salvezza su Tempra dimezza il danno e nega la condizione frastornato.","sperimentale":true,"migliorie":[]},{"id":"drone_firestorm","nome":"Drone “Firestorm”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":6,"reqExtra":null,"testo":"L'inventore lancia il drone, che estroflette una mitragliatrice e dei rotori, volando fino a 9 m di altezza. Il drone si muove verso un punto entro 30 m e satura un'area di 6 m di raggio con proiettili al Fosforo-17, infliggendo 1d6 danni da fuoco per livello di inventore (massimo 10d6) a tutte le creature nell'area. Un Tiro Salvezza su Riflessi dimezza il danno. Dopo l'attacco, il drone torna automaticamente dall'inventore.","sperimentale":true,"migliorie":[]},{"id":"cannone_idraulico_slime","nome":"Cannone idraulico “Slime”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":8,"reqExtra":"dote Competenza nelle armi sperimentali o Cellule energetiche Argus","testo":"Ricarica: 1 caricatore al giorno (capacità 3 colpi). L'inventore scaglia un raggio melmoso acido che colpisce automaticamente tutte le creature in una linea di 12 m, infliggendo 6d6 danni da acido. Un Tiro Salvezza su Riflessi dimezza il danno. Il raggio conta come attacco ad area contro gli sciami.","sperimentale":true,"migliorie":[]},{"id":"shotgun_devastator","nome":"Shotgun “Devastator”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":8,"reqExtra":null,"testo":"L'inventore scaglia una salva di proiettili in adamantio in un cono di 9 m, infliggendo automaticamente 5d8 danni contundenti e perforanti alle creature nell'area. Un Tiro Salvezza su Riflessi dimezza il danno.","sperimentale":true,"migliorie":[]},{"id":"lanciabrina_blizzard","nome":"Lanciabrina “Blizzard”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":10,"reqExtra":null,"testo":"L'inventore emette dal cannone un cono di brina congelante di 18 m, infliggendo 1d4 danni da freddo per livello di inventore (massimo 15d4) e rendendo le vittime barcollanti per 2 round. Un Tiro Salvezza su Riflessi dimezza il danno e nega la condizione barcollante.","sperimentale":true,"migliorie":[]},{"id":"bio_cannone_acid_rain","nome":"Bio-cannone “Acid rain”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":12,"reqExtra":null,"testo":"L'inventore scaglia un'esplosione acida in un cilindro di 6 m di raggio e 6 m di altezza, centrato entro 30 m, infliggendo 1d6 danni da acido per livello di inventore (massimo 15d6) a tutte le creature nell'area. Un Tiro Salvezza su Riflessi dimezza il danno.","sperimentale":true,"migliorie":[]},{"id":"fucile_gauss_railgun","nome":"Fucile gauss “Railgun”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":14,"reqExtra":null,"testo":"L'inventore accelera un proiettile in adamantio fino a velocità ipersoniche, scagliandolo entro 90 m. L'attacco è un tiro per colpire di contatto a distanza, usando il Bonus di Attacco Base + bonus di Intelligenza. Se l'attacco colpisce, il bersaglio subisce 2d6 danni perforanti per livello di inventore (massimo 30d6 al 15° livello). Il proiettile ignora qualsiasi Riduzione del Danno e qualsiasi copertura inferiore a totale. Inoltre, il proiettile attraversa il bersaglio: tutte le creature in linea retta dietro di esso (e fino a 9 m oltre) subiscono metà del danno, con un Tiro Salvezza su Riflessi per dimezzarlo ulteriormente.","sperimentale":true,"migliorie":[]},{"id":"cannone_al_plasma_solaris","nome":"Cannone al plasma “Solaris”","cat":"Combattimento e armi sperimentali","sub":"Armi sperimentali","req":16,"reqExtra":null,"testo":"L'inventore scaglia un'onda di energia combinata di fuoco ed elettricità in una linea di 24 m o in un cono di 12 m (scelta all'attivazione). Infligge 10d6 danni da fuoco e 10d6 danni da elettricità, più 1d6 di entrambi per ogni livello oltre il 16° (massimo 14d6 fuoco + 14d6 elettricità al 20° livello). Un Tiro Salvezza su Riflessi dimezza entrambi i tipi di danno. Le creature che falliscono il Tiro Salvezza e che non sono immuni né al fuoco né all'elettricità sono inoltre abbagliate per 1d4 round.","sperimentale":true,"migliorie":[]},{"id":"ragno_meccanico","nome":"Ragno meccanico","cat":"Costrutti e compagni meccanici","sub":"","req":1,"reqExtra":null,"testo":"Ingombro 1. Ricarica: 5 minuti. Costrutto di 15 cm, autonomia 30 minuti, radiocomando con portata 30 m. Velocità su terreno e di scalare 3 m. Può lanciare un piccolo mortaretto entro 6 m che produce suoni udibili fino a 18 m per 3 round (un Tiro Salvezza su Volontà consente di capire l'inganno). Può trasportare fino a 0,5 kg. Ha CA 15, Durezza 5 e 10 Punti Ferita. Miglioria al 5° livello: il ragno meccanico ottiene arnesi da scasso perfetti integrati e può effettuare prove di Disattivare congegni utilizzando i parametri dell'inventore.","sperimentale":false,"migliorie":[5]},{"id":"servitore_meccanico","nome":"Servitore meccanico","cat":"Costrutti e compagni meccanici","sub":"","req":1,"reqExtra":null,"testo":"Ricarica: 8 ore di inattività. Costrutto umanoide di 75 cm con 4 braccia, autonomia 16 ore. Segue automaticamente l'inventore restando entro 2 caselle da lui e può reggere fino a 10 kg per livello di inventore. È in grado di allestire campi (giacigli, fuochi, tende, pasti), effettuare pulizia e manutenzione di equipaggiamento e armi. Ha CA 10, Durezza 5 e 15 Punti Ferita.","sperimentale":false,"migliorie":[]},{"id":"uccello_meccanico","nome":"Uccello meccanico","cat":"Costrutti e compagni meccanici","sub":"","req":6,"reqExtra":null,"testo":"Ingombro 1. Ricarica: 10 minuti. Volatile meccanico di taglia minuscola dotato di un serbatoio per 10 unità di energia (1 unità per uso, vola fino a 2 km al minuto). Può memorizzare 3 coordinate o destinazioni note all'inventore e registrare una frase di massimo 30 parole. Sui suoi controlli ha quattro pulsanti: Azione (vola verso una destinazione e ripete la frase registrata), Memorizza (registra una nuova destinazione), Registra (registra una nuova frase), Ascolta (trasmette ciò che sente). Premendo Azione una seconda volta, l'uccello torna al punto di partenza. Ha CA 15, Durezza 10 e 10 Punti Ferita. Miglioria al 6° livello: si aggiunge il pulsante Spia, che consente all'uccello di compiere una ripresa audiovisiva di 15 minuti dall'alto.","sperimentale":false,"migliorie":[6]},{"id":"torretta_automatica","nome":"Torretta automatica","cat":"Costrutti e compagni meccanici","sub":"","req":4,"reqExtra":null,"testo":"Ingombro 2. Ricarica: 5 minuti. Cilindro di 30 cm cubi a riposo che, una volta dispiegato, raggiunge 50 cm di altezza (taglia minuscola). Possiede una batteria da 10 minuti e un caricatore da 30 sfere. Gittata 30 m. Attacca usando il Bonus di Attacco Base dell'inventore + bonus di Intelligenza ai tiri per colpire, infliggendo 1d6 danni contundenti + metà bonus di Intelligenza ai tiri per i danni. La torretta ha il talento Tiro preciso. Ha CA 10, Durezza 10 e 20 Punti Ferita. Migliorie progressive: al 5° livello ottiene Tiro ravvicinato. Al 7° livello ottiene Mira letale e +40 Punti Ferita. All'11° livello ottiene Tiro preciso migliorato. Al 15° livello ottiene Mira inesorabile e +50 Punti Ferita.","sperimentale":false,"migliorie":[5,7,11,15]},{"id":"zimbello_meccanico","nome":"Zimbello meccanico","cat":"Costrutti e compagni meccanici","sub":"","req":1,"reqExtra":null,"testo":"Sagoma di legno e metallo di 2 m con la figura scelta dall'inventore al momento della costruzione. Una volta attivato, si agita per 1 minuto e attira automaticamente le creature con Intelligenza pari o inferiore a 3 entro 15 m. Le creature attratte devono superare un Tiro Salvezza su Volontà o avvicinarsi e attaccare lo zimbello. Può attirare un massimo di 2 creature alla volta. Ha CA 10, Durezza 10 e 10 Punti Ferita.","sperimentale":false,"migliorie":[]},{"id":"sentinella_meccanica","nome":"Sentinella meccanica","cat":"Costrutti e compagni meccanici","sub":"","req":5,"reqExtra":null,"testo":"Ingombro 2. Ricarica: 5 minuti. Costrutto stazionario di 60 cm con sensori a 360°. L'inventore la piazza in una casella come azione standard, e da quel momento sorveglia un raggio di 12 m per 8 ore. La Sentinella ha Percezione pari al livello di inventore + bonus di Intelligenza + 5. Può “registrare” alleati (toccandoli o vedendoli muoversi nelle vicinanze al momento del piazzamento) in modo da non considerarli intrusioni. All'intrusione di una creatura non registrata, attiva uno tra tre allarmi (scelti al momento del piazzamento): silenzioso (trasmette un segnale al Sistema di comunicazione a lungo raggio dell'inventore entro 1,5 km per livello), sonoro (fischio acuto udibile entro 60 m), luminoso (lampeggia visibile entro 6 m). Ha CA 12, Durezza 10 e 25 Punti Ferita. Miglioria al 9° livello: la Sentinella ottiene un caricatore di freccette al veleno blando (6 colpi, attacchi con BAB + bonus di Intelligenza, 1d4 danni perforanti + Tiro Salvezza su Tempra o barcollante per 1 round).","sperimentale":false,"migliorie":[9]},{"id":"molle_a_pressione_elastica","nome":"Molle a pressione elastica","cat":"Movimento e veicoli","sub":"","req":1,"reqExtra":null,"testo":"Ingombro: nessuno (montate sotto le calzature). 3 attivazioni al giorno. Come azione veloce, l'inventore ottiene bonus di potenziamento +10 a una singola prova di Acrobazia (saltare). Se le calzature dell'inventore vengono rotte, le molle vengono distrutte.","sperimentale":false,"migliorie":[],"usi":3},{"id":"propulsori_natatori","nome":"Propulsori natatori","cat":"Movimento e veicoli","sub":"","req":1,"reqExtra":null,"testo":"Ingombro: nessuno (montati su cinghie attorno ai polpacci). 3 attivazioni al giorno. Come azione veloce, l'inventore ottiene bonus di potenziamento +10 a una singola prova di Nuotare. Se l'inventore preferisce un effetto prolungato, l'attivazione fornisce un bonus +10 a Nuotare per un massimo di 1 ora.","sperimentale":false,"migliorie":[],"usi":3},{"id":"scarponi_meccanici_da_scalata","nome":"Scarponi meccanici da scalata","cat":"Movimento e veicoli","sub":"","req":1,"reqExtra":null,"testo":"Ingombro: occupano lo slot oggetto piedi. 3 attivazioni al giorno. Come azione veloce, l'inventore ottiene bonus di potenziamento +10 a una singola prova di Scalare. Se l'inventore preferisce un effetto prolungato, l'attivazione fornisce un bonus +10 a Scalare per un massimo di 1 ora. Non utilizzabile in combinazione con l'optional Propulsori per esoscheletri.","sperimentale":false,"migliorie":[],"usi":3},{"id":"destriero_meccanico","nome":"Destriero meccanico","cat":"Movimento e veicoli","sub":"","req":8,"reqExtra":null,"testo":"Costruzione: 56 ore + 750 mo di materiali. Costrutto cavalcabile che funziona tramite l'abilità Cavalcare. L'inventore ottiene i talenti Combattere in sella e Cavallerizzo come talenti bonus (solo in arcione). Velocità su terreno 15 m. Autonomia 8 ore. Può trasportare l'inventore e fino a 100 kg di carico aggiuntivo. Ha CA 10, Durezza 10 e 40 Punti Ferita.","sperimentale":false,"migliorie":[]},{"id":"monoruota_sleppen_frappen","nome":"Monoruota “Sleppen Frappen”","cat":"Movimento e veicoli","sub":"","req":8,"reqExtra":"Pilotare mezzi terrestri 6 gradi","testo":"Costruzione: 112 ore. Veicolo monoposto auto-alimentato di taglia grande, con basetta di 2 caselle. Velocità su terreno 18 m, può correre (velocità x4). La monoruota non possiede attacchi propri. Pilotare mezzi terrestri si utilizza al posto di Cavalcare per controllarla. Talenti bonus: Combattere in sella, Oltrepassare migliorato, Carica devastante (solo se l'inventore è in arcione). Carica perforante: quando l'inventore esegue una carica con la monoruota, infligge 2d6 + bonus di Forza danni contundenti automatici al bersaglio (oltre al normale attacco). Dopo aver risolto la carica, può continuare il movimento per la velocità rimanente. Utilizzabile una volta per round. Stabilizzatore giroscopico: equilibrio automatico, +5 alle prove di Acrobazia (rimanere in piedi o in sella) e ai Tiri Salvezza contro effetti che farebbero cadere o sbilanciare. Attraversa terreno difficile con −25% di velocità invece che a metà. Statistiche: CA 12, Durezza 10 e 100 Punti Ferita.","sperimentale":false,"migliorie":[]},{"id":"vascello_sottomarino","nome":"Vascello sottomarino","cat":"Movimento e veicoli","sub":"","req":10,"reqExtra":"Pilotare imbarcazioni 6 gradi","testo":"Costruzione: 112 ore. Ricarica: 8 ore. Imbarcazione di 12 m × 3 m × 3 m, con 1 posto di guida, 1 posto lanciasiluri e 3 posti passeggeri. Velocità di Nuotare 18 m, profondità massima 300 m. Il lanciasiluri è un'arma da fuoco che infligge 6d6 danni perforanti e contundenti, con ricarica di un'azione di round completo. Spostarsi tra postazioni richiede un'azione di round completo. Autonomia 16 ore. Ha CA 16, Durezza 10 e 200 Punti Ferita.","sperimentale":false,"migliorie":[]},{"id":"zaino_a_reazione","nome":"Zaino a reazione","cat":"Movimento e veicoli","sub":"","req":20,"reqExtra":null,"testo":"Ingombro: occupa lo slot oggetto spalle. Una volta al giorno, come azione gratuita l'inventore può attivare lo zaino e ottenere per 3 round velocità di Volare 9 m con manovrabilità buona.","sperimentale":false,"migliorie":[]},{"id":"attrezzo_multifunzione","nome":"Attrezzo multifunzione","cat":"Utility e strumenti","sub":"","req":1,"reqExtra":null,"testo":"Ingombro 1. Normalmente assume la forma di una scatola di 20 cm cubici, ma può essere manipolato come azione di movimento per assumere una delle seguenti forme: asta pieghevole, bussola, campanella, carrucola, cesoie, corno da segnalazione, cote per affilare, cubo per punte, fischietto, magnete, metro a piombo, pala pieghevole, piccone pieghevole, piede di porco, pinze estendibili, sega portatile, sfondaporte, specchio, trapano a manovella.","sperimentale":false,"migliorie":[]},{"id":"braccia_ausiliarie","nome":"Braccia ausiliarie","cat":"Utility e strumenti","sub":"","req":1,"reqExtra":null,"testo":"Ingombro: nessuno (montate su bretelle alla schiena). Due braccia meccaniche auto-ricaricanti, indossabili o rimovibili in 1 minuto. Recuperare un oggetto dallo zaino diventa un'azione di movimento invece che di round completo. Posizionare una Torretta automatica diventa un'azione di movimento invece che standard. Miglioria al 6° livello: le braccia ausiliarie possono posizionare un Lombrico d'ottone, un Ragno meccanico, una Sentinella meccanica, una T.E.S. o una Torretta automatica come azione di movimento senza provocare attacchi di opportunità; il recupero diventa un'azione veloce senza attacchi di opportunità.","sperimentale":false,"migliorie":[6]},{"id":"scanner","nome":"Scanner","cat":"Utility e strumenti","sub":"","req":1,"reqExtra":null,"testo":"Ingombro: nessuno (occhiali integrati). Ricarica: 8 ore di inattività. Cariche: 3 + bonus di Intelligenza. Lo Scanner può avere una sola funzione attiva alla volta. L'attivazione di una funzione costa 1 carica. Le funzioni disponibili scalano con il livello di inventore.\nFunzioni disponibili al 1° livello:\nAnalisi biometrica: lo Scanner rileva la presenza di creature viventi (o l'assenza di vita) all'interno di un raggio di 18 m. Indica la posizione approssimativa e il numero di creature viventi, ma non la loro identità o capacità. Funziona attraverso pareti sottili (meno di 30 cm di pietra o 60 cm di legno), ma viene bloccato da metalli densi e piombo.\nAnalisi tossicologica: lo Scanner rileva la presenza di veleni e malattie in un raggio di 18 m. Può essere utilizzato su una sostanza specifica (cibo, bevanda, oggetto sospetto) per determinare se contiene veleno o agenti patogeni, e in caso affermativo identificarne il tipo con una prova di Conoscenze (natura) o Conoscenze (scientifiche).\nRadar pericoli ambientali: per 1 ora, lo Scanner avvisa l'inventore di trappole, terreni instabili, gas tossici, radiazioni e altri pericoli ambientali nelle vicinanze. L'inventore ottiene bonus di competenza +3 ai propri Tiri Salvezza contro tali pericoli e +2 ai Tiri Salvezza degli alleati nelle vicinanze.\nScan arcano: lo Scanner rileva la presenza di magia attiva in un raggio di 18 m. Funziona come l'incantesimo Individuazione del magico, consentendo all'inventore di determinare il numero di aure magiche, la loro potenza e (con un round di concentrazione) la scuola di magia. Funziona anche attraverso ostacoli sottili.\nImpulso di ricerca: lo Scanner emette un impulso che evidenzia passaggi nascosti, porte segrete e meccanismi celati. L'inventore ottiene bonus di competenza +4 alle prove di Percezione per trovare passaggi segreti nell'area circostante per 10 minuti.\nFunzioni aggiuntive al 5° livello:\nScan di realtà alterata: lo Scanner rileva la presenza di illusioni in un raggio di 18 m. Funziona come l'incantesimo Individuazione delle illusioni. L'inventore vede attraverso le illusioni di tipo finzione (Velo, Immagine maggiore, ecc.) e può vedere la realtà sottostante. Le illusioni di tipo trama si rivelano come tali, ma non vengono dissolte.\nScan mutagenico: lo Scanner rileva la presenza di aberrazioni in un raggio di 18 m. Indica la posizione approssimativa e il numero di aberrazioni presenti, e (con un round di concentrazione) fornisce informazioni sulla loro natura specifica tramite una prova di Conoscenze (dungeon) con bonus +5.\nScan zoo-vegetale: lo Scanner cerca c
