di Forza","val":3,"nuova":false,"testo":"Una volta al giorno, il portatore emette un muro di forza lungo 6 m e alto 3 m che blocca tutti gli attacchi frontali. Attivo finché lo scudo è sollevato o dopo 5 round."},{"id":"deflettente_3","nome":"Deflettente","val":3,"nuova":false,"testo":"Tre volte al giorno, ventiquattro placche di metallo orbitano attorno al portatore fornendo a lui e agli alleati entro 3 m un bonus di deviazione alla CA pari al bonus di potenziamento. Dura 1 minuto. Solo scudi metallici."},{"id":"fortificazione_moderata_3","nome":"Fortificazione Moderata","val":3,"nuova":false,"testo":"Il portatore ha il 50% di ignorare i danni extra da critici e attacchi di precisione."},{"id":"repellente_3","nome":"Repellente","val":3,"nuova":false,"testo":"Tre volte al giorno, come azione standard: i nemici che possono vedere lo scudo superano un TS su Volontà (CD 5 + ½ DV + bonus totale) o non possono avvicinarsi entro 4,5 m per 3 round [compulsione]."},{"id":"resistenza_agli_incantesimi_15_3","nome":"Resistenza agli Incantesimi 15","val":3,"nuova":false,"testo":"Il portatore ottiene RI 15."},{"id":"svanente_3","nome":"Svanente","val":3,"nuova":false,"testo":"Una volta al giorno, il portatore lancia Svanire come capacità magica."},{"id":"terrificante_3","nome":"Terrificante","val":3,"nuova":false,"testo":"Tre volte al giorno, come azione veloce: i nemici entro 6 m sono spaventati (TS Volontà CD 2 + ½ DV + bonus totale, altrimenti scossi 1 round)."},{"id":"tocco_fantasma_3","nome":"Tocco Fantasma","val":3,"nuova":false,"testo":"Lo scudo fornisce il proprio bonus di potenziamento e di scudo contro attacchi di creature incorporee."},{"id":"esplodente_3","nome":"Esplodente","val":3,"nuova":true,"testo":"Una volta al giorno, come azione standard il portatore può lanciare lo scudo in avanti con forza esplosiva: l'arma esplode in un cono di 6 m infliggendo 6d6 danni contundenti (TS Riflessi CD 10 + ½ DV + bonus potenziamento per dimezzare). Lo scudo ritorna al portatore al termine del round."},{"id":"fortezza_dell_anima_3","nome":"Fortezza dell'Anima","val":3,"nuova":true,"testo":"Il portatore ottiene RI 15 specificatamente contro effetti di [influenza mentale], [controllo] e [compulsione], aggiuntiva rispetto a qualsiasi altra RI posseduta e non cumulabile."},{"id":"pararinforzato_3","nome":"Pararinforzato","val":3,"nuova":true,"testo":"Ogni volta che il portatore ottiene Deviazione delle Frecce con questo scudo, il proiettile deviato viene rispedito verso l'attaccante con un tiro per colpire pari all'attacco originale."},{"id":"proiettile_di_scudo_3","nome":"Proiettile di Scudo","val":3,"nuova":true,"testo":"Come azione veloce, tre volte al giorno il portatore può proiettare lo scudo come un raggio di energia: raggio di 9 m, 4d6 danni di forza (TS Riflessi per dimezzare). Lo scudo ritorna immediatamente."},{"id":"scudo_della_negazione_3","nome":"Scudo della Negazione","val":3,"nuova":true,"testo":"Una volta al giorno, come azione immediata, il portatore può negare un'intera azione di un nemico adiacente (come Contrastare azione, senza richiedere azione preparata)."},{"id":"scudo_paralizzante_3","nome":"Scudo Paralizzante","val":3,"nuova":true,"testo":"Come azione immediata, tre volte al giorno, quando il portatore blocca un attacco fisico, può inviare una scarica di energia paralitica attraverso l'arma dell'attaccante: TS su Tempra (CD 10 + ½ DV + bonus potenziamento) o paralizzato 1 round."},{"id":"tessuto_di_forza_3","nome":"Tessuto di Forza","val":3,"nuova":true,"testo":"Lo scudo proietta una rete di forza attorno al portatore: qualsiasi attacco di grapple, lottare o inghiottire contro il portatore soffre penalità –4 al tiro."},{"id":"resistenza_agli_incantesimi_17_4","nome":"Resistenza agli Incantesimi 17","val":4,"nuova":false,"testo":"Il portatore ottiene RI 17."},{"id":"riflettente_4","nome":"Riflettente","val":4,"nuova":false,"testo":"Una volta al giorno, il portatore può riflettere un incantesimo verso l'incantatore come per Riflettere Incantesimo."},{"id":"barriera_assoluta_4","nome":"Barriera Assoluta","val":4,"nuova":true,"testo":"Una volta a settimana, come azione immediata, il portatore può rendere lo scudo completamente impenetrabile per 1 round: nessun attacco, incantesimo, o effetto può colpire il portatore da davanti (180°). Lo scudo non fornisce bonus CA per quel round."},{"id":"grandine_di_scudo_4","nome":"Grandine di Scudo","val":4,"nuova":true,"testo":"Come azione di round completo, una volta al giorno, il portatore può moltiplicare lo scudo in dieci copie fantasma che si lanciano in tutte le direzioni: ogni creatura entro 6 m riceve un attacco separato (tiro per colpire base del portatore, danni 2d6+bonus potenziamento)."},{"id":"incarnazione_dello_scudo_4","nome":"Incarnazione dello Scudo","val":4,"nuova":true,"testo":"Lo scudo diventa parte del portatore: non può essere disarmato o rimosso contro la sua volontà. Il portatore non subisce penalità al tiro per colpire per l'uso dello scudo in attacco e può effettuare attacchi con lo scudo come azione libera una volta per round."},{"id":"rifugio_di_scudo_4","nome":"Rifugio di Scudo","val":4,"nuova":true,"testo":"Una volta al giorno, come azione standard, il portatore può creare una cupola di forza di raggio 3 m che dura 3 round. Chiunque all'interno beneficia di CA 25 contro gli attacchi provenienti dall'esterno."},{"id":"scudo_della_resurrezione_4","nome":"Scudo della Resurrezione","val":4,"nuova":true,"testo":"Una volta a settimana, se il portatore viene ridotto a 0 PF mentre impugna questo scudo, lo scudo si attiva automaticamente curandolo di 4d8+20 PF. Lo scudo diventa non funzionante fino al prossimo riposo."},{"id":"sigillo_di_protezione_4","nome":"Sigillo di Protezione","val":4,"nuova":true,"testo":"Il portatore può incidere un sigillo protettivo su questo scudo che dura 24 ore: qualsiasi creatura che superi la guardia del portatore e lo colpisca subisce 2d8 danni di forza come reazione immediata."},{"id":"determinazione_5","nome":"Determinazione","val":5,"nuova":false,"testo":"Una volta a settimana, quando i PF del portatore scendono da 0 a –1, lo scudo lo cura automaticamente di tutti i danni; l'eventuale eccedenza viene applicata normalmente."},{"id":"fortificazione_pesante_5","nome":"Fortificazione Pesante","val":5,"nuova":false,"testo":"Il portatore ha il 75% di ignorare i danni extra da critici e attacchi di precisione."},{"id":"resistenza_agli_incantesimi_19_5","nome":"Resistenza agli Incantesimi 19","val":5,"nuova":false,"testo":"Il portatore ottiene RI 19."},{"id":"schermo_temporale_5","nome":"Schermo Temporale","val":5,"nuova":false,"testo":"Una volta al giorno, come azione standard il portatore diventa invulnerabile a tutti gli attacchi, incantesimi, capacità ed effetti (sia dannosi che benefici) fino all'inizio del suo prossimo round."},{"id":"paladino_scudo_5","nome":"Paladino Scudo","val":5,"nuova":true,"testo":"Lo scudo è un'entità senziente (Intelligenza e Saggezza 14, Carisma 16, Int. magica/comunicazione telepatica). Una volta al giorno può agire autonomamente per 5 round per proteggere il portatore anche se questi è privo di sensi."},{"id":"sacrificio_ultimo_5","nome":"Sacrificio Ultimo","val":5,"nuova":true,"testo":"Se il portatore viene ucciso (ridotto a –(DV) PF), lo scudo si distrugge per riportarlo in vita con 1 PF, come Resurrezione ma senza bisogno di un incantatore. Dopo questo effetto lo scudo si dissolve permanentemente."},{"id":"scudo_della_perfezione_5","nome":"Scudo della Perfezione","val":5,"nuova":true,"testo":"Il portatore ottiene RD 10/–, RI 19, Libertà di Movimento, e immunità agli effetti di [paura], [confusione] e [influenza mentale]. Questi effetti non si cumulano con altre capacità dello stesso scudo."},{"id":"supremazia_della_difesa_5","nome":"Supremazia della Difesa","val":5,"nuova":true,"testo":"Ogni round, il portatore può scegliere di non attaccare per ottenere +4 CA (bonus di schivare), +4 a tutti i TS e Indurimento (riduzione 5 danni da qualsiasi fonte) per quel round."},{"id":"vincolo_d_acciaio_5","nome":"Vincolo d'Acciaio","val":5,"nuova":true,"testo":"Il portatore e lo scudo sono legati anima-oggetto: il portatore ottiene RE 20 a tutti i tipi e RI 19. Se lo scudo viene distrutto, il portatore perde queste capacità ma lo scudo si riforma dopo 30 giorni. Tabelle complete con nuove aggiunte (★) Tutte le capacità speciali applicabili alle armi da mischia, dalla più semplice alla più potente. Come per armature e scudi, la somma dei valori equivalenti delle capacità non può superare il bonus di potenziamento dell'arma. Le capacità contrassegnate con ★ sono nuove."}],"mischia":[{"id":"accumula_incantesimi_1","nome":"Accumula Incantesimi","val":1,"nuova":false,"testo":"Un incantatore può immagazzinare un singolo incantesimo con bersaglio di 3° liv. o inferiore. Quando il portatore infligge danni può lanciare l'incantesimo sulla vittima come azione immediata."},{"id":"affilata_1","nome":"Affilata","val":1,"nuova":false,"testo":"L'intervallo di minaccia dell'arma raddoppia. Solo armi taglienti."},{"id":"alleanza_1","nome":"Alleanza","val":1,"nuova":false,"testo":"Come azione gratuita a inizio turno, il portatore trasferisce parte o tutto il bonus di potenziamento a un'arma di una creatura in vista (non cumulabile con il potenziamento di quella creatura)."},{"id":"anatema_1","nome":"Anatema","val":1,"nuova":false,"testo":"Tira 1d12 per il tipo nemico. Contro di essi il bonus di potenziamento è migliore di +2 e l'arma infligge 2d6 danni extra."},{"id":"anatema_delle_illusioni_1","nome":"Anatema delle Illusioni","val":1,"nuova":false,"testo":"Il portatore ignora le probabilità di mancare da effetti di [illusione] (inclusi spostamenti). Una volta al giorno, dopo un colpo, può tentare una prova di dissoluzione (1d20+10) contro ogni illusione attiva su di sé."},{"id":"ancorante_1","nome":"Ancorante","val":1,"nuova":false,"testo":"Quando l'arma colpisce, come azione veloce il portatore inibisce la capacità di teletrasportarsi del bersaglio per 10 minuti."},{"id":"anti_incantesimo_1","nome":"Anti-incantesimo","val":1,"nuova":false,"testo":"Come azione gratuita quando deve superare un TS contro un incantesimo, il portatore trasferisce parte o tutto il bonus di potenziamento come bonus cumulabile al tiro. Dura fino al turno successivo."},{"id":"astuzia_1","nome":"Astuzia","val":1,"nuova":false,"testo":"In caso di minaccia di critico, il portatore ottiene +4 al tiro di conferma se ha 5+ gradi in Conoscenze per identificare il tipo di creatura (+6 se ha 15+)."},{"id":"benedetta_1","nome":"Benedetta","val":1,"nuova":false,"testo":"L'arma conta come allineata Bene. Tre volte al giorno, il portatore può confermare automaticamente minacce di critico contro nemici malvagi per 1 round."},{"id":"berserker_1","nome":"Berserker","val":1,"nuova":false,"testo":"Il portatore infligge 1d8 danni extra mentre è in ira."},{"id":"bramosa_1","nome":"Bramosa","val":1,"nuova":false,"testo":"Il portatore può estrarre l'arma come azione gratuita e ottiene +2 all'Iniziativa. L'arma infligge 2 danni extra nel primo round di ogni combattimento."},{"id":"cercacuore_1","nome":"Cercacuore","val":1,"nuova":false,"testo":"Il portatore ignora la probabilità di mancare per occultamento contro la maggior parte dei bersagli viventi (non contro aberrazioni, melme, vegetali, elementali o creature notoriamente prive di cuore)."},{"id":"colpo_d_ombra_1","nome":"Colpo d'Ombra","val":1,"nuova":false,"testo":"Una volta al giorno, fino alla fine del turno il portatore allunga la portata dell'arma di 1,5 m. Il primo attacco nega il bonus di Destrezza alla CA del bersaglio."},{"id":"concussiva_1","nome":"Concussiva","val":1,"nuova":false,"testo":"L'intervallo di minaccia raddoppia. Solo armi contundenti."},{"id":"coraggiosa_1","nome":"Coraggiosa","val":1,"nuova":false,"testo":"Il portatore ottiene bonus +4 morale ai TS contro [paura]."},{"id":"corrosiva_1","nome":"Corrosiva","val":1,"nuova":false,"testo":"L'arma infligge 1d6 danni da acido extra. Incompatibile con Folgorante, Gelida, Infuocata, Sonica."},{"id":"crudele_1","nome":"Crudele","val":1,"nuova":false,"testo":"Quando colpisce una creatura scossa/spaventata/in preda al panico, la rende inferma 1 round. Se uccide o stordisce, il portatore ottiene 5 PF temporanei (10 min)."},{"id":"da_caccia_1","nome":"Da Caccia","val":1,"nuova":false,"testo":"L'arma infligge 4 danni extra contro i nemici prescelti del possessore."},{"id":"delineante_1","nome":"Delineante","val":1,"nuova":false,"testo":"Quando colpisce, per 1 round delinea con Luminescenza i bersagli occultati magicamente o soprannaturalmente."},{"id":"difensiva_1","nome":"Difensiva","val":1,"nuova":false,"testo":"Come azione gratuita a inizio turno, il portatore trasferisce parte o tutto il bonus di potenziamento alla propria CA come bonus cumulabile. Dura fino al turno successivo."},{"id":"disincantante_1","nome":"Disincantante","val":1,"nuova":false,"testo":"Ogni volta che l'arma colpisce un nemico con RI, quella RI è ridotta di 2 punti in modo cumulabile per 1 round."},{"id":"dissolvente_1","nome":"Dissolvente","val":1,"nuova":false,"testo":"Come Accumula Incantesimi ma solo per Dissolvi Magie. La prova di livello di incantatore ottiene bonus pari al bonus di potenziamento dell'arma."},{"id":"esplosione_celestiale_1","nome":"Esplosione Celestiale","val":1,"nuova":false,"testo":"In caso di critico contro una creatura malvagia, infligge 3d6 danni extra. Se fallisce un TS (CD 10 + ½ DV + bonus totale), è accecata 1 round."},{"id":"essiccante_1","nome":"Essiccante","val":1,"nuova":false,"testo":"L'arma infligge 1d4 danni extra alle creature viventi (1d8 contro vegetali, melme ed elementali [acqua])."},{"id":"estingui_fuoco_1","nome":"Estingui Fuoco","val":1,"nuova":false,"testo":"Il portatore può estinguere un fuoco non magico di taglia media o inferiore. Infligge 1d6 danni extra contro creature con il sottotipo [fuoco]. Bonus +2 ai TS contro effetti di fuoco."},{"id":"flagello_draconico_1","nome":"Flagello Draconico","val":1,"nuova":false,"testo":"L'arma infligge 1d8 danni extra a draghi, draconici e coboldi."},{"id":"folgorante_1","nome":"Folgorante","val":1,"nuova":false,"testo":"L'arma infligge 1d6 danni da elettricità extra. Incompatibile con Corrosiva, Gelida, Infuocata, Sonica."},{"id":"fortuita_1","nome":"Fortuita","val":1,"nuova":false,"testo":"Una volta per round, quando il portatore colpisce con un attacco di opportunità, può effettuare un secondo attacco di opportunità contro lo stesso nemico con penalità –5."},{"id":"fortunosa_1","nome":"Fortunosa","val":1,"nuova":false,"testo":"Una volta al giorno, il portatore può ripetere un tiro per colpire fallito."},{"id":"frastornante_1","nome":"Frastornante","val":1,"nuova":false,"testo":"In caso di critico, la vittima è frastornata per 5 round (TS Volontà per porre fine all'effetto ogni turno, CD 10 + ½ DV + bonus totale)."},{"id":"gelida_1","nome":"Gelida","val":1,"nuova":false,"testo":"L'arma infligge 1d6 danni da freddo extra. Incompatibile con Corrosiva, Folgorante, Infuocata, Sonica."},{"id":"guardiana_1","nome":"Guardiana","val":1,"nuova":false,"testo":"Come azione gratuita a inizio turno, il portatore trasferisce parte o tutto il bonus di potenziamento ai TS come bonus cumulabile. Dura fino al turno successivo."},{"id":"immorale_1","nome":"Immorale","val":1,"nuova":false,"testo":"Gli attacchi infliggono 2d6 danni extra ai nemici e 1d6 al portatore."},{"id":"impalamento_1","nome":"Impalamento","val":1,"nuova":false,"testo":"Tre volte al giorno, come azione veloce il prossimo attacco del turno è effettuato come attacco di contatto."},{"id":"impetuosa_1","nome":"Impetuosa","val":1,"nuova":false,"testo":"L'arma infligge 2d6 danni extra quando il portatore effettua una carica in arcione."},{"id":"incalzare_rafforzato_1","nome":"Incalzare Rafforzato","val":1,"nuova":false,"testo":"L'arma concede Incalzare per un attacco extra se il primo va a segno, purché l'avversario successivo sia adiacente. Quell'attacco non può essere sul primo avversario."},{"id":"infuocata_1","nome":"Infuocata","val":1,"nuova":false,"testo":"L'arma infligge 1d6 danni da fuoco extra. Incompatibile con Corrosiva, Folgorante, Gelida, Sonica."},{"id":"isolante_1","nome":"Isolante","val":1,"nuova":false,"testo":"Il portatore può toccare superfici cariche elettricamente senza danni. Infligge 1d6 danni extra contro creature [aria]. Bonus +2 ai TS contro effetti [aria] o [elettricità]."},{"id":"lancio_1","nome":"Lancio","val":1,"nuova":false,"testo":"L'arma ottiene un incremento di gittata +3 m e può essere lanciata."},{"id":"marina_1","nome":"Marina","val":1,"nuova":false,"testo":"Il portatore ottiene bonus a Nuotare pari al doppio del bonus di potenziamento e non subisce penalità sott'acqua a tiri per colpire e danni (come Libertà di Movimento)."},{"id":"mascheramento_1","nome":"Mascheramento","val":1,"nuova":false,"testo":"Come azione standard, l'arma muta forma apparendo come un oggetto simile. Solo Visione del Vero ne rivela la natura. Si rivela se usata in attacco (sopprime per 1 min)."},{"id":"menomante_1","nome":"Menomante","val":1,"nuova":false,"testo":"In caso di critico, infligge danni extra: +1d6 per ×2, +2d6 per ×3, +3d6 per ×4."},{"id":"minacciosa_1","nome":"Minacciosa","val":1,"nuova":false,"testo":"Quando il portatore è adiacente a una creatura attaccata ai fianchi da un alleato, il bonus di fiancheggiamento di tutti gli alleati aumenta di +2."},{"id":"neutralizzante_1","nome":"Neutralizzante","val":1,"nuova":false,"testo":"Il portatore può trasformare fino a 4,5 L di acido al giorno in acqua. L'arma infligge 1d6 danni extra contro creature [terra]. Bonus +2 ai TS contro [acido] o [terra]."},{"id":"planare_1","nome":"Planare","val":1,"nuova":false,"testo":"L'arma ignora 5 punti di RD degli esterni."},{"id":"precisione_letale_1","nome":"Precisione Letale","val":1,"nuova":false,"testo":"Il portatore migliora di 1d6 il danno dei propri attacchi di precisione già esistenti."},{"id":"rallentante_1","nome":"Rallentante","val":1,"nuova":false,"testo":"Un critico costringe la vittima a superare un TS su Tempra (CD 5 + ½ DV + bonus totale) o è rallentata 1d3 round. Immuni al freddo non vengono rallentate; vulnerabili al fuoco raddoppiano i round."},{"id":"richiamabile_1","nome":"Richiamabile","val":1,"nuova":false,"testo":"Come azione veloce, il portatore teletrasporta l'arma nelle proprie mani (max 15 m). L'arma deve essere in suo possesso per almeno 24 ore."},{"id":"risonante_1","nome":"Risonante","val":1,"nuova":false,"testo":"Quando l'arma colpisce, emette un «ding» che fornisce a tutti gli alleati +1 morale ai tiri per colpire fino al turno successivo del portatore (non cumulabile per attacchi multipli)."},{"id":"rissosa_1","nome":"Rissosa","val":1,"nuova":false,"testo":"Il portatore ottiene bonus alle manovre in combattimento pari al bonus di potenziamento."},{"id":"scongelante_1","nome":"Scongelante","val":1,"nuova":false,"testo":"Il portatore può rimuovere il ghiaccio da un oggetto di taglia media o inferiore. L'arma infligge 1d6 danni extra contro creature [freddo]. Bonus +2 ai TS contro [freddo]."},{"id":"sonica_1","nome":"Sonica","val":1,"nuova":false,"testo":"L'arma infligge 1d6 danni sonori extra. Incompatibile con Corrosiva, Folgorante, Gelida, Infuocata."},{"id":"spezza_carica_1","nome":"Spezza-carica","val":1,"nuova":false,"testo":"Quando il portatore subisce una carica, può effettuare un attacco di opportunità. Se colpisce, l'attaccante supera un TS su Tempra (CD 5 + ½ DV + bonus totale) o finisce prono e termina il turno."},{"id":"tocco_fantasma_1","nome":"Tocco Fantasma","val":1,"nuova":false,"testo":"La capacità di ridurre del 50% i danni corporei delle creature incorporee non si applica a questa arma. Può essere usata dalle creature incorporee."},{"id":"tonante_1","nome":"Tonante","val":1,"nuova":false,"testo":"Infligge 1d8 danni sonori extra per critico (2d8 per ×3, 3d8 per ×4). Chi subisce il critico supera un TS su Tempra (CD 10 + ½ DV + bonus totale) o è assordato per 1 ora."},{"id":"trascinante_1","nome":"Trascinante","val":1,"nuova":false,"testo":"Cinque volte al giorno, quando colpisce, il portatore può spostare la vittima di 1 casella."},{"id":"troglodita_1","nome":"Troglodita","val":1,"nuova":false,"testo":"Quando il portatore entra in ira impugnando l'arma, l'ira dura 3 turni extra."},{"id":"vampirica_1","nome":"Vampirica","val":1,"nuova":false,"testo":"Il primo colpo per round su un bersaglio vivente ripristina PF pari alla metà dei danni inflitti (max = DV del portatore; max 2 PF/DV/giorno). Solo creature viventi o non morti beneficiano. L'arma deve essere posseduta 24 ore."},{"id":"agganciatrice_1","nome":"Agganciatrice","val":1,"nuova":true,"testo":"In caso di colpo critico, l'arma lega il bersaglio al portatore: per 3 round, il bersaglio non può allontanarsi a più di 3 m dal portatore senza superare un TS su Tempra (CD 10 + ½ DV + bonus totale)."},{"id":"beffarda_1","nome":"Beffarda","val":1,"nuova":true,"testo":"Ogni volta che il portatore manca un attacco, il bersaglio subisce comunque 1 danno psichico (non ridotto da RD) per la frustrazione inaspettata."},{"id":"cacciasangue_1","nome":"Cacciasangue","val":1,"nuova":true,"testo":"L'arma può percepire le creature ferite (PF inferiori al 50% del massimo) entro 9 m, permettendo al portatore di individuarne la posizione anche se invisibili o nascoste."},{"id":"cangiante_1","nome":"Cangiante","val":1,"nuova":true,"testo":"L'arma può cambiare apparenza e tipo (da spada a mazza, da ascia a lancia) come azione veloce, mantenendo le stesse statistiche di base. Solo armi della stessa categoria di peso."},{"id":"catalizzatrice_1","nome":"Catalizzatrice","val":1,"nuova":true,"testo":"Tre volte al giorno, quando il portatore usa un'abilità di classe basata su un tiro (come Attacco furtivo), l'arma amplifica l'effetto: ottiene +1d6 ai danni extra."},{"id":"destrorsa_1","nome":"Destrorsa","val":1,"nuova":true,"testo":"Se il portatore combatte con due armi, la penalità ai tiri per colpire con questa arma è ridotta di 1."},{"id":"esplodente_1","nome":"Esplodente","val":1,"nuova":true,"testo":"Una volta al giorno, come azione veloce, il portatore può caricare l'arma di energia esplosiva: il prossimo attacco, se colpisce, genera un'esplosione di 1,5 m che infligge 2d6 danni dello stesso tipo dell'arma a tutte le creature nell'area (TS Riflessi per dimezzare)."},{"id":"fastidiosa_1","nome":"Fastidiosa","val":1,"nuova":true,"testo":"Ogni volta che l'arma colpisce un bersaglio, questi subisce penalità –1 cumulativa (max –3) a tutte le azioni di concentrazione per il resto del combattimento."},{"id":"frantumante_1","nome":"Frantumante","val":1,"nuova":true,"testo":"Quando l'arma colpisce un'armatura o uno scudo (attacco diretto all'oggetto), riduce il bonus di potenziamento dell'oggetto di 1 per 1 round (non permanente). Solo armi contundenti."},{"id":"glaciale_1","nome":"Glaciale","val":1,"nuova":true,"testo":"L'arma infligge 1d4 danni extra da freddo e rallenta il primo movimento della vittima per 1 round (il suo prossimo movimento dimezza la velocità). Non cumulabile con Gelida."},{"id":"lucentissima_1","nome":"Lucentissima","val":1,"nuova":true,"testo":"L'arma emette luce intensa (come torcia) che non può essere soppressa magicamente. I non morti nell'aura di luce (6 m) subiscono penalità –1 ai tiri per colpire."},{"id":"paziente_1","nome":"Paziente","val":1,"nuova":true,"testo":"Per ogni round consecutivo in cui il portatore non attacca e si limita a difendersi, accumula un bonus +1 al prossimo attacco (massimo +4). Il bonus si azzera dopo il primo attacco."},{"id":"persecutrice_1","nome":"Persecutrice","val":1,"nuova":true,"testo":"Tre volte al giorno, il portatore designa un bersaglio (azione gratuita): l'arma infligge 1d6 danni extra contro quel solo bersaglio per 1 minuto. Può avere solo un bersaglio designato alla volta."},{"id":"risonante_superiore_1","nome":"Risonante Superiore","val":1,"nuova":true,"testo":"Come Risonante ma il bonus ai tiri per colpire degli alleati è +2, dura fino all'inizio del prossimo turno e si applica anche ai TS. Non richiede la capacità base Risonante."},{"id":"sbilanciante_1","nome":"Sbilanciante","val":1,"nuova":true,"testo":"Ogni colpo di questa arma riduce la stabilità del bersaglio: questi subisce –1 cumulativo (massimo –3) alla DMC contro manovre di Sbilanciare e Spingere per 1 round."},{"id":"sorprendente_1","nome":"Sorprendente","val":1,"nuova":true,"testo":"La prima volta per combattimento che il portatore attacca un nemico, questi è considerato privo del bonus di Destrezza alla CA (come per un attacco furtivo). Richiede che il portatore non abbia ancora attaccato quel nemico."},{"id":"tessitrice_di_ombre_1","nome":"Tessitrice di Ombre","val":1,"nuova":true,"testo":"Tre volte al giorno, quando l'arma infligge danni, crea un'ombra residua: per 1 round il bersaglio ha occultamento 20% verso tutti eccetto il portatore."},{"id":"anarchica_2","nome":"Anarchica","val":2,"nuova":false,"testo":"L'arma conta come allineata Caos e infligge un Livello Negativo permanente a qualsiasi creatura legale che la impugni (scompare rimuovendo l'arma). Infligge 2d6 danni extra ai nemici legali."},{"id":"assiomatica_2","nome":"Assiomatica","val":2,"nuova":false,"testo":"L'arma conta come allineata Legge e infligge un Livello Negativo permanente a creature caotiche che la impugnino. Infligge 2d6 danni extra ai nemici caotici."},{"id":"aura_energetica_2","nome":"Aura Energetica","val":2,"nuova":false,"testo":"L'arma infligge 1d6 danni extra di un tipo di energia a scelta (acido, elettricità, fuoco, freddo). Il portatore può cambiare tipo come azione standard. Incompatibile con Corrosiva, Folgorante, Gelida, Infuocata, Sonica."},{"id":"avanzante_2","nome":"Avanzante","val":2,"nuova":false,"testo":"Una volta per round, quando il portatore infligge danni in mischia, come azione veloce può effettuare un passo di 1,5 m (non conta ai fini del movimento ordinario né dei passi normali)."},{"id":"consunzione_2","nome":"Consunzione","val":2,"nuova":false,"testo":"L'arma infligge 1d8 danni da energia negativa extra alle creature viventi. Non cura i non morti."},{"id":"debilitante_2","nome":"Debilitante","val":2,"nuova":false,"testo":"In caso di critico, l'arma infligge 1 Livello Negativo alla vittima (scompare dopo 1 ora)."},{"id":"del_colpo_sfocato_2","nome":"Del Colpo Sfocato","val":2,"nuova":false,"testo":"Cinque volte al giorno, l'arma nega il bonus di Destrezza alla vittima al primo attacco contro di lei in quel round."},{"id":"della_collisione_2","nome":"Della Collisione","val":2,"nuova":false,"testo":"L'arma infligge 3 danni extra."},{"id":"della_vista_cieca_2","nome":"Della Vista Cieca","val":2,"nuova":false,"testo":"Tre volte al giorno, come azione standard il portatore chiede all'arma la posizione dei nemici: per 1 minuto, a inizio turno può superare una prova di Percezione (udito) CD 10. Se riesce, ottiene Vista cieca 9 m per quel round."},{"id":"distruzione_2","nome":"Distruzione","val":2,"nuova":false,"testo":"I non morti colpiti superano un TS su Volontà (CD 2 + ½ DV + bonus totale) o sono distrutti (max una volta per round dalla stessa arma)."},{"id":"esplosione_corrosiva_2","nome":"Esplosione Corrosiva","val":2,"nuova":false,"testo":"Come Corrosiva. In caso di critico, infligge danni extra da acido: +1d10 per ×2, +2d10 per ×3, +3d10 per ×4."},{"id":"esplosione_di_fiamme_2","nome":"Esplosione di Fiamme","val":2,"nuova":false,"testo":"Come Infuocata. In caso di critico, infligge danni extra da fuoco: +1d10 per ×2, +2d10 per ×3, +3d10 per ×4."},{"id":"esplosione_di_ghiaccio_2","nome":"Esplosione di Ghiaccio","val":2,"nuova":false,"testo":"Come Gelida. In caso di critico, infligge danni extra da freddo: +1d10 per ×2, +2d10 per ×3, +3d10 per ×4."},{"id":"esplosione_folgorante_2","nome":"Esplosione Folgorante","val":2,"nuova":false,"testo":"Come Folgorante. In caso di critico, infligge danni extra da elettricità: +1d10 per ×2, +2d10 per ×3, +3d10 per ×4."},{"id":"furia_innata_2","nome":"Furia Innata","val":2,"nuova":false,"testo":"Ogni volta che l'arma infligge danni, il suo bonus di potenziamento aumenta di +1 verso quel nemico (max +5). Azzera alla morte del nemico, se si attacca un altro o dopo 1 ora."},{"id":"gloriosa_2","nome":"Gloriosa","val":2,"nuova":false,"testo":"L'arma irradia Luce diurna quando estratta (non sopprimibile). Ogni creatura attaccata in mischia è abbagliata automaticamente fino al turno successivo. In caso di critico, la vittima è accecata (TS Tempra CD 5 + ½ DV + bonus totale per ridurre a 1 round)."},{"id":"impatto_2","nome":"Impatto","val":2,"nuova":false,"testo":"L'arma infligge danni come di una categoria di taglia superiore. Le manovre di Spingere ottengono bonus pari al bonus di potenziamento. Solo armi non leggere."},{"id":"impulso_vitale_2","nome":"Impulso Vitale","val":2,"nuova":false,"testo":"Il portatore ottiene bonus ai TS contro Necromanzia pari al bonus di potenziamento. Ogni fonte di PF temporanei viene amplificata di quel valore. L'intervallo di minaccia critica raddoppia contro i non morti. In caso di critico, emette energia positiva: +1d8 per ×2, +2d8 per ×3, +3d8 per ×4 (danni o cura al portatore)."},{"id":"incendiaria_2","nome":"Incendiaria","val":2,"nuova":false,"testo":"Come Infuocata, ma fa prendere automaticamente fuoco le vittime di un colpo critico."},{"id":"negante_2","nome":"Negante","val":2,"nuova":false,"testo":"Ogni volta che l'arma infligge danni a un nemico con RD/caos, male, bene, legge o magia, riduce quel valore di 5 per 1 round. Non cumulabile."},{"id":"parante_2","nome":"Parante","val":2,"nuova":false,"testo":"Il portatore ottiene bonus cognitivo +1 alla CA e +1 ai TS."},{"id":"posta_2","nome":"Posta","val":2,"nuova":false,"testo":"Come azione standard, il portatore studia una creatura entro 18 m: quando la attacca, infligge 1d6 danni da precisione extra per ogni round di studio (max 1d6/bonus potenziamento). Solo il primo colpo. Max una creatura studiata alla volta."},{"id":"rinvigorente_2","nome":"Rinvigorente","val":2,"nuova":false,"testo":"Quando il portatore uccide un nemico: se affaticato, rimuove tale condizione; se esausto, diventa affaticato; altrimenti ottiene +2 morale ai tiri per colpire e +3 m alla velocità fino alla fine del prossimo turno."},{"id":"sacra_2","nome":"Sacra","val":2,"nuova":false,"testo":"Come Anarchica ma allineata Bene: Livello Negativo alle creature malvagie e 2d6 danni extra ai nemici malvagi."},{"id":"sacrilega_2","nome":"Sacrilega","val":2,"nuova":false,"testo":"Come Anarchica ma allineata Male: Livello Negativo alle creature buone e 2d6 danni extra ai nemici buoni."},{"id":"sprezzante_2","nome":"Sprezzante","val":2,"nuova":false,"testo":"L'arma rimane in mano anche se il portatore è in preda al panico, stordito o privo di sensi. Bonus ai TS per porre fine a incantesimi con TS multipli. Con talenti Riflessi/Tempra/Volontà migliorati: extra usi giornalieri pari al bonus di potenziamento."},{"id":"trasmutante_2","nome":"Trasmutante","val":2,"nuova":false,"testo":"Se l'arma colpisce un nemico con RD, all'inizio del turno successivo si trasforma assumendo le proprietà per superare quella RD per 1 minuto o finché non colpisce una creatura con RD diversa."},{"id":"vampirica_superiore_2","nome":"Vampirica Superiore","val":2,"nuova":false,"testo":"Come Vampirica ma recupera max 5 PF/DV/giorno."},{"id":"cattura_anima_2","nome":"Cattura Anima","val":2,"nuova":true,"testo":"In caso di critico contro una creatura con TS su Volontà fallito (CD 10 + ½ DV + bonus totale), un frammento dell'anima è catturato nell'arma: la vittima subisce penalità –2 a tutti i tiri per 1 ora."},{"id":"corrosiva_potenziata_elementale_2","nome":"Corrosiva Potenziata / Elementale","val":2,"nuova":true,"testo":"Come la relativa capacità elementale (Corrosiva, Gelida, Folgorante, Infuocata o Sonica) ma infligge 1d8 danni extra invece di 1d6. Inoltre, il danno di quel tipo persiste: la vittima subisce 1d8 danni dello stesso tipo all'inizio di ogni suo turno per un numero di round pari al bonus di potenziamento dell'arma. Non cumulabile con la rispettiva capacità base."},{"id":"dissanguante_critico_2","nome":"Dissanguante Critico","val":2,"nuova":true,"testo":"In caso di critico, la vittima subisce un effetto di [sanguinamento] pari al dado di danno dell'arma (es. 1d8 per una spada lunga) per 3 round. Questo sanguinamento si cumula con altri."},{"id":"eco_d_attacco_2","nome":"Eco d'Attacco","val":2,"nuova":true,"testo":"Ogni volta che il portatore effettua un attacco con questa arma e manca, il prossimo attacco contro lo stesso bersaglio guadagna +1 cumulativo (max +4). Il bonus si azzera se il portatore attacca un bersaglio diverso."},{"id":"frantumante_incantesimi_2","nome":"Frantumante Incantesimi","val":2,"nuova":true,"testo":"Ogni colpo riuscito riduce di 1 round la durata di qualsiasi incantesimo benefico attivo sul bersaglio (a scelta del portatore). Questo effetto non si applica a capacità magiche innate."},{"id":"mirino_perfetto_2","nome":"Mirino Perfetto","val":2,"nuova":true,"testo":"Il portatore può spendere 1 round in assenza di attacchi (azione di puntare) per ottenere il colpo seguente come se avesse piena concentrazione: il prossimo tiro per colpire ottiene bonus +4 e ignora copertura (ma non copertura totale)."},{"id":"rubaforza_2","nome":"Rubaforza","val":2,"nuova":true,"testo":"In caso di critico, la vittima perde 1d4 punti di Forza temporaneamente (recuperati dopo 10 min). Il portatore guadagna questi punti di Forza per la stessa durata."},{"id":"sigillo_del_caos_2","nome":"Sigillo del Caos","val":2,"nuova":true,"testo":"Ogni attacco riuscito applica un sigillo instabile al bersaglio. Al terzo sigillo applicato entro 1 round, il bersaglio è confuso per 1 round (TS Volontà CD 10 + ½ DV + bonus totale per negare). I sigilli si azzerano."},{"id":"striatura_corrosiva_2","nome":"Striatura Corrosiva","val":2,"nuova":true,"testo":"Tre volte al giorno, l'arma lascia una striatura magica sul bersaglio colpito: per 3 round, qualsiasi danno fisico che il bersaglio subisce è aumentato di 2."},{"id":"colpo_prismatico_3","nome":"Colpo Prismatico","val":3,"nuova":false,"testo":"In caso di critico, il bersaglio è soggetto a Spruzzo Prismatico."},{"id":"estenuante_3","nome":"Estenuante","val":3,"nuova":false,"testo":"In caso di critico, il portatore può rinunciare al danno extra per rendere la vittima esausta. Immune ai critici = immune all'effetto."},{"id":"implacabile_3","nome":"Implacabile","val":3,"nuova":false,"testo":"Le vittime subiscono 2 danni da sanguinamento/turno per 5 round (cumulativo). Fermabile con Sopravvivenza CD 15 o Professione (cerusico) CD 10 o cura magica. Mentre attivo, la cura magica richiede una prova di livello di incantatore CD 15. Conta come adamantio contro aberrazioni per la RD."},{"id":"mietitrice_eterea_3","nome":"Mietitrice Eterea","val":3,"nuova":false,"testo":"Come Tocco Fantasma. Il portatore è in grado di vedere le creature invisibili."},{"id":"nullificante_3","nome":"Nullificante","val":3,"nuova":false,"testo":"Ogni volta che l'arma infligge danni a una creatura con RI, la RI è ridotta di 1 per 1 minuto (non cumulabile). In caso di critico, ridotta di un ammontare pari al moltiplicatore di critico."},{"id":"riposizionante_3","nome":"Riposizionante","val":3,"nuova":false,"testo":"Bonus +4 alle manovre di Riposizionare. In caso di critico, il portatore può tentare Riposizionare come azione gratuita senza provocare attacchi di opportunità."},{"id":"rubaincantesimi_3","nome":"Rubaincantesimi","val":3,"nuova":false,"testo":"In caso di minaccia di critico, il portatore può rinunciare al tiro di conferma per sapere automaticamente quali effetti magici sono attivi sul bersaglio. Può poi effettuare una prova di livello (arma + bonus totale vs CD 11 + livello effetto) per rubare un effetto per 1 minuto. Per ×3 può rubarne due, per ×4 tre."},{"id":"velocita_3","nome":"Velocità","val":3,"nuova":false,"testo":"Se il portatore attacca solo con quest'arma, può effettuare un attacco extra come azione di round completo."},{"id":"agonizzante_3","nome":"Agonizzante","val":3,"nuova":true,"testo":"In caso di critico, la vittima subisce penalità –4 alla CA e ai TS per 3 round di dolore estremo (TS Tempra CD = 10 + ½ DV + bonus totale per ridurre a –2 per 1 round)."},{"id":"annientatrice_3","nome":"Annientatrice","val":3,"nuova":true,"testo":"Ogni colpo riuscito su un costrutto o non morto infligge danni extra da forza pari a 1d6 × bonus di potenziamento dell'arma, che bypassano qualsiasi RD o RE."},{"id":"cancellante_3","nome":"Cancellante","val":3,"nuova":true,"testo":"In caso di critico, rimuove completamente un effetto benefico a scelta del portatore attivo sul bersaglio (senza possibilità di TS)."},{"id":"destabilizzante_3","nome":"Destabilizzante","val":3,"nuova":true,"testo":"Ogni colpo riuscito riduce il punteggio di Destrezza del bersaglio di 1 (recuperato dopo 1 ora o con cura magica). Massimo –6 dalla stessa arma in 24 ore."},{"id":"drago_interiore_3","nome":"Drago Interiore","val":3,"nuova":true,"testo":"L'arma canalizza il potere dei draghi: ogni attacco riuscito ha il 10% di emettere un soffio del tipo scelto al momento della sintonia (area 3 m di raggio, 3d6 danni, TS Riflessi per dimezzare)."},{"id":"eruzione_di_forza_3","nome":"Eruzione di Forza","val":3,"nuova":true,"testo":"In caso di critico, l'arma emette un'onda di forza cieca: tutte le creature entro 3 m dal bersaglio (escluso il portatore) subiscono 2d8 danni di forza e sono spostate di 1,5 m (TS Riflessi per resistere)."},{"id":"marchio_del_predatore_3","nome":"Marchio del Predatore","val":3,"nuova":true,"testo":"L'arma marca il primo bersaglio colpito in ogni combattimento. Contro quel bersaglio il portatore ottiene sempre vantaggio (ritira un tiro per colpire e prende il migliore) e il bersaglio non ottiene il bonus di Destrezza alla CA."},{"id":"nervo_esposto_3","nome":"Nervo Esposto","val":3,"nuova":true,"testo":"In caso di critico, il bersaglio è soggetto a dolore acuto: per 2 round non può usare azioni standard che richiedano concentrazione (incantesimi, capacità speciali con requisiti di concentrazione)."},{"id":"plagio_3","nome":"Plagio","val":3,"nuova":true,"testo":"Una volta al giorno, dopo aver colpito con successo, l'arma può copiare l'ultima capacità speciale usata dal bersaglio. Il portatore può usarla una volta entro 1 minuto, come se fosse una sua capacità di classe con CD basata sul proprio bonus."},{"id":"umbrale_3","nome":"Umbrale","val":3,"nuova":true,"testo":"L'arma infligge metà dei danni come danno da ombra che bypassa la RE e la RD normale. Il danno da ombra non può essere curato da effetti di luce o energie positive."},{"id":"danzante_4","nome":"Danzante","val":4,"nuova":false,"testo":"Come azione standard, l'arma combatte da sola per 4 round usando il bonus di attacco base del portatore. Non compie attacchi di opportunità. Il portatore non è considerato armato. Cade dopo 4 round; può essere ripresa come azione gratuita se si ha una mano libera (poi non può danzare per altri 4 round)."},{"id":"duello_4","nome":"Duello","val":4,"nuova":false,"testo":"Il portatore ottiene bonus +4 all'Iniziativa se impugna l'arma. Bonus +2 alle prove di Fintare e +2 alla CD per Fintare contro il portatore. Solo armi usabili con Arma Accurata."},{"id":"energia_luminosa_4","nome":"Energia Luminosa","val":4,"nuova":false,"testo":"L'arma è in gran parte di luce (non influisce sul peso). Fornisce luce come torcia. Contro gli attacchi del portatore, il bonus di armatura e scudo alla CA (incluso il potenziamento) non contano. Non può ferire non morti, costrutti e oggetti."},{"id":"vomita_maledizioni_4","nome":"Vomita Maledizioni","val":4,"nuova":false,"testo":"In caso di critico, la vittima subisce penalità –4 ai tiri per colpire e ai TS per 1 minuto [maledizione]."},{"id":"cattura_essenza_4","nome":"Cattura Essenza","val":4,"nuova":true,"testo":"Ogni volta che l'arma uccide un bersaglio vivente, il portatore assorbe la sua forza vitale: recupera PF pari ai DV della creatura uccisa (massimo una volta per round) e ottiene bonus +1 a tutti i tiri per 1 minuto."},{"id":"dimensionale_4","nome":"Dimensionale","val":4,"nuova":true,"testo":"L'arma può colpire creature su un piano adiacente: una volta al giorno come azione veloce il portatore può effettuare un attacco in mischia contro una creatura eterea o incorporea entro 3 m come se fosse corporea."},{"id":"flagello_dei_re_4","nome":"Flagello dei Re","val":4,"nuova":true,"testo":"L'arma riconosce il potere e lo sovverte: contro creature con capacità di comando (come Sfida, Aura del Paladino, ecc.), il portatore ottiene bonus +2 ai tiri per colpire e danni, e quelle capacità sono soppresse per 1 round dopo ogni colpo."},{"id":"negazione_totale_4","nome":"Negazione Totale","val":4,"nuova":true,"testo":"L'arma bypassa tutte le forme di immunità ai danni fisici non derivanti dall'allineamento o da costrutti/non morti (es. RD/–, RD/Adamantio, RD/Magia). Contro costrutti e non morti, l'effetto è dimezzato."},{"id":"sigillo_del_berserk_4","nome":"Sigillo del Berserk","val":4,"nuova":true,"testo":"In caso di critico, il bersaglio è soggetto a una furia incontrollabile per 2 round: deve attaccare la creatura più vicina (indipendentemente dall'alleanza), non può usare incantesimi o capacità che richiedano concentrazione. TS su Volontà per negare."},{"id":"sterminasogni_4","nome":"Sterminasogni","val":4,"nuova":true,"testo":"L'arma infligge danni extra ai bersagli che hanno dormito nelle ultime 8 ore: +2d6 danni psichici. Questi danni non possono essere ridotti da RI o RE e causano anche penalità –1 a Saggezza per 24 ore (non permanente)."},{"id":"vorpal_5","nome":"Vorpal","val":5,"nuova":false,"testo":"Dopo un 20 naturale confermato come critico, l'arma stacca la testa dell'avversario (se ne ha una). Solo armi taglienti."},{"id":"volante_5","nome":"Volante","val":5,"nuova":false,"testo":"Come Danzante ma l'arma può essere inviata contro nemici entro 18 m durante il periodo di danza."},{"id":"apocalisse_5","nome":"Apocalisse","val":5,"nuova":true,"testo":"Una volta a settimana, come azione standard, il portatore può scatenare tutta la potenza dell'arma: effettua un attacco contro tutti i nemici entro 9 m (separati). Ogni colpo riuscito infligge il massimo del danno possibile e applica automaticamente una condizione casuale (1d6: 1=accecato, 2=assordato, 3=nauseato, 4=stordito, 5=spaventato, 6=paralizzato) per 3 round."},{"id":"dissolvi_esistenza_5","nome":"Dissolvi Esistenza","val":5,"nuova":true,"testo":"In caso di critico contro un non morto o un costrutto, la creatura deve superare un TS su Tempra (CD 20 + ½ DV + bonus totale) o essere immediatamente distrutta. Contro creature viventi, il critico riduce permanentemente di 2 i DV della vittima (recuperabili solo con Rigenerare o simile)."},{"id":"fato_inevitabile_5","nome":"Fato Inevitabile","val":5,"nuova":true,"testo":"Una volta al mese, il portatore può dichiarare un «attacco del destino»: il tiro per colpire è automaticamente 20, si ripetono i dadi che mostrano 1 o 2 (una volta sola) e l'attacco bypassa qualsiasi immunità (eccetto immunità divine). L'arma poi diventa non potenziata per 7 giorni."},{"id":"morte_sussurrata_5","nome":"Morte Sussurrata","val":5,"nuova":true,"testo":"Due volte al giorno, quando l'arma infligge danni a un bersaglio con PF inferiori al 25% del massimo, questi deve superare un TS su Tempra (CD 20 + ½ DV + bonus totale) o morire istantaneamente. Effetto [morte]. Immune ai non morti e ai costrutti."},{"id":"sigillo_dell_eroe_5","nome":"Sigillo dell'Eroe","val":5,"nuova":true,"testo":"L'arma riconosce il portatore come campione: una volta al giorno il portatore può agire due volte nel proprio turno (raddoppiando le azioni, non le azioni immediate o libere). Dopo questo uso, il portatore è affaticato per 1 ora."},{"id":"tessitore_di_destino_5","nome":"Tessitore di Destino","val":5,"nuova":true,"testo":"Due volte al giorno, dopo aver conosciuto l'esito di un qualsiasi tiro d20 (prima che gli effetti siano applicati), il portatore può dichiarare che l'esito è invertito (successo diventa fallimento o viceversa)."},{"id":"ultima_lama_5","nome":"Ultima Lama","val":5,"nuova":true,"testo":"Quando il portatore è a 0 PF o meno ma ancora in piedi, l'arma amplifica la sua determinazione: ottiene bonus +5 a tutti i tiri per colpire, i danni sono massimizzati e non può essere stordito. Questi bonus durano finché il portatore ha PF negativi o finché il combattimento finisce. Tabelle complete con nuove aggiunte (★) Le capacità seguenti si applicano ad archi, balestre, armi da fuoco e armi da lancio. Alcune capacità sono condivise con le armi da mischia, altre sono esclusive di questa categoria. Le capacità contrassegnate con ★ sono nuove."}],"distanza":[{"id":"adattiva_1","nome":"Adattiva","val":1,"nuova":false,"testo":"Il portatore può aggiungere il proprio bonus di Forza ai danni dell'arma. Solo archi."},{"id":"affidabile_1","nome":"Affidabile","val":1,"nuova":false,"testo":"L'arma ignora un Inceppamento, ma massimo una volta al minuto. Solo armi da fuoco."},{"id":"alleanza_1","nome":"Alleanza","val":1,"nuova":false,"testo":"Come azione gratuita a inizio turno, il portatore trasferisce parte o tutto il bonus di potenziamento a un'arma di una creatura in vista (non cumulabile)."},{"id":"anatema_1","nome":"Anatema","val":1,"nuova":false,"testo":"Tira 1d12 per il tipo nemico. Contro di essi il bonus di potenziamento è migliore di +2 e l'arma infligge 2d6 danni extra."},{"id":"anti_incantesimo_1","nome":"Anti-incantesimo","val":1,"nuova":false,"testo":"Come azione gratuita, trasferisce parte o tutto il bonus di potenziamento come bonus a un TS contro un incantesimo. Dura fino al turno successivo."},{"id":"astuzia_1","nome":"Astuzia","val":1,"nuova":false,"testo":"Minaccia di critico: bonus +4 al tiro di conferma se ha 5+ gradi in Conoscenze per il tipo della creatura (+6 se 10+)."},{"id":"benedetta_1","nome":"Benedetta","val":1,"nuova":false,"testo":"Conta come allineata Bene. Tre volte al giorno, conferma automaticamente minacce di critico contro nemici malvagi."},{"id":"corrosiva_1","nome":"Corrosiva","val":1,"nuova":false,"testo":"Infligge 1d6 danni da acido extra. Incompatibile con Folgorante, Gelida, Infuocata, Sonica."},{"id":"crudele_1","nome":"Crudele","val":1,"nuova":false,"testo":"Quando colpisce una creatura scossa/spaventata, la rende inferma 1 round. Se la uccide o stordisce, il portatore ottiene 5 PF temporanei."},{"id":"da_caccia_1","nome":"Da Caccia","val":1,"nuova":false,"testo":"Infligge 4 danni extra contro i nemici prescelti."},{"id":"delineante_1","nome":"Delineante","val":1,"nuova":false,"testo":"Quando colpisce, per 1 round delinea con Luminescenza i bersagli occultati magicamente."},{"id":"esplosione_celestiale_1","nome":"Esplosione Celestiale","val":1,"nuova":false,"testo":"In caso di critico contro un nemico malvagio, infligge 3d6 danni extra. TS Tempra o accecato 1 round."},{"id":"essiccante_1","nome":"Essiccante","val":1,"nuova":false,"testo":"Infligge 1d4 danni extra alle creature viventi (1d8 contro vegetali, melme ed elementali [acqua])."},{"id":"flagello_draconico_1","nome":"Flagello Draconico","val":1,"nuova":false,"testo":"Infligge 1d8 danni extra a draghi, draconici e coboldi."},{"id":"folgorante_1","nome":"Folgorante","val":1,"nuova":false,"testo":"Infligge 1d6 danni da elettricità extra. Incompatibile con Corrosiva, Gelida, Infuocata, Sonica."},{"id":"fortunata_1","nome":"Fortunata","val":1,"nuova":false,"testo":"Una volta al giorno, il portatore può ripetere un tiro per colpire fallito."},{"id":"gelida_1","nome":"Gelida","val":1,"nuova":false,"testo":"Infligge 1d6 danni da freddo extra. Incompatibile con Corrosiva, Folgorante, Infuocata, Sonica."},{"id":"infuocata_1","nome":"Infuocata","val":1,"nuova":false,"testo":"Infligge 1d6 danni da fuoco extra. Incompatibile con Corrosiva, Folgorante, Gelida, Sonica."},{"id":"mascheramento_1","nome":"Mascheramento","val":1,"nuova":false,"testo":"Come azione standard, l'arma muta forma. Si rivela se usata."},{"id":"munizioni_infinite_1","nome":"Munizioni Infinite","val":1,"nuova":false,"testo":"L'arma si ricarica automaticamente con munizioni comuni. Le munizioni speciali possono essere caricate normalmente. Le munizioni comuni svaniscono se rimosse o dopo essere sparate. Solo archi e balestre."},{"id":"planare_1","nome":"Planare","val":1,"nuova":false,"testo":"Ignora 5 punti di RD degli esterni."},{"id":"potenza_arcana_1","nome":"Potenza Arcana","val":1,"nuova":false,"testo":"Come azione veloce, il portatore può sacrificare uno slot incantesimo per bonus ai danni del prossimo attacco pari a 1d4 per livello."},{"id":"precisione_letale_1","nome":"Precisione Letale","val":1,"nuova":false,"testo":"Migliora di 1d6 il danno degli attacchi di precisione già esistenti."},{"id":"ricercante_1","nome":"Ricercante","val":1,"nuova":false,"testo":"Le munizioni virano verso il bersaglio, negando qualsiasi probabilità di mancare per occultamento. Bisogna mirare nella casella giusta."},{"id":"richiamabile_1","nome":"Richiamabile","val":1,"nuova":false,"testo":"Come azione veloce, teletrasporta l'arma nelle proprie mani (max 15 m; deve essere posseduta 24 ore)."},{"id":"ritornante_1","nome":"Ritornante","val":1,"nuova":false,"testo":"Dopo ogni attacco l'arma torna al portatore (azione gratuita per afferrarla). Solo armi da lancio."},{"id":"sonica_1","nome":"Sonica","val":1,"nuova":false,"testo":"Infligge 1d6 danni sonori extra. Incompatibile con Corrosiva, Folgorante, Gelida, Infuocata."},{"id":"tonante_1","nome":"Tonante","val":1,"nuova":false,"testo":"In caso di critico: 1d8 danni sonori extra (2d8 per ×3, 3d8 per ×4). TS Tempra o assordato 1 ora."},{"id":"calibrata_1","nome":"Calibrata","val":1,"nuova":true,"testo":"Il portatore può scegliere di regolare la potenza del colpo: può infliggere danni non letali con un'arma a distanza senza penalità al tiro per colpire."},{"id":"dardeggiante_1","nome":"Dardeggiante","val":1,"nuova":true,"testo":"Il raggio di portata dell'arma aumenta di 50% (es. un arco lungo con portata 30 m diventa 45 m). Questo non influenza gli incrementi multipli di gittata."},{"id":"dispersione_1","nome":"Dispersione","val":1,"nuova":true,"testo":"Una volta al giorno, come azione di round completo, il portatore può sparare in dispersione: effettua attacchi contro tutte le creature in un cono di 9 m, usando il tiro per colpire normale per ognuna."},{"id":"implacabile_a_distanza_1","nome":"Implacabile a Distanza","val":1,"nuova":true,"testo":"Le vittime colpite subiscono 1 danno da sanguinamento/turno per 3 round. Fermabile con Professione (cerusico) CD 10 o cura magica."},{"id":"sensibile_1","nome":"Sensibile","val":1,"nuova":true,"testo":"L'arma può «sentire» i bersagli attraverso ostacoli leggeri (vegetazione, nebbia, fumo): riduce le penalità per copertura parziale di 2."},{"id":"silenziosa_1","nome":"Silenziosa","val":1,"nuova":true,"testo":"I colpi di questa arma non producono suono. Il portatore non rivela la propria posizione sparando. Solo per balestre e archi."},{"id":"tracciante_1","nome":"Tracciante","val":1,"nuova":true,"testo":"Le munizioni lasciano una scia visibile di luce per 1 round dopo il colpo, permettendo al portatore di sapere esattamente dove hanno colpito (anche se il bersaglio non è visibile). Non si applica a munizioni speciali."},{"id":"turbocaricata_1","nome":"Turbocaricata","val":1,"nuova":true,"testo":"Una volta per round, il portatore può caricare e sparare più velocemente: aggiunge un attacco extra con penalità –4 al tiro per colpire durante un'azione di round completo (solo per armi da fuoco)."},{"id":"anarchica_2","nome":"Anarchica","val":2,"nuova":false,"testo":"Allineata Caos: Livello Negativo permanente a creature legali. 2d6 danni extra ai nemici legali."},{"id":"ancorante_2","nome":"Ancorante","val":2,"nuova":false,"testo":"Quando colpisce, come azione veloce inibisce la capacità di teletrasportarsi del bersaglio per 10 minuti."},{"id":"assiomatica_2","nome":"Assiomatica","val":2,"nuova":false,"testo":"Allineata Legge: Livello Negativo permanente a creature caotiche. 2d6 danni extra ai nemici caotici."},{"id":"aura_energetica_2","nome":"Aura Energetica","val":2,"nuova":false,"testo":"Infligge 1d6 danni extra di un tipo di energia scelto (cambiabile come azione standard). Incompatibile con Corrosiva, Folgorante, Gelida, Infuocata, Sonica."},{"id":"consunzione_2","nome":"Consunzione","val":2,"nuova":false,"testo":"Infligge 1d8 danni da energia negativa extra alle creature viventi. Non cura i non morti."},{"id":"debilitante_2","nome":"Debilitante","val":2,"nuova":false,"testo":"In caso di critico, infligge 1 Livello Negativo alla vittima (scompare dopo 1 minuto)."},{"id":"della_collisione_2","nome":"Della Collisione","val":2,"nuova":false,"testo":"Infligge 3 danni extra."},{"id":"della_vista_cieca_2","nome":"Della Vista Cieca","val":2,"nuova":false,"testo":"Tre volte al giorno: per 1 minuto a inizio turno può superare Percezione (udito) CD 10 per ottenere Vista cieca 9 m per quel round."},{"id":"designante_inferiore_2","nome":"Designante Inferiore","val":2,"nuova":false,"testo":"L'arma designa il bersaglio: tutti gli alleati del portatore ottengono +2 morale ai tiri per colpire e ai danni contro quel bersaglio per 1 round. Non cumulabile."},{"id":"esplosione_corrosiva_2","nome":"Esplosione Corrosiva","val":2,"nuova":false,"testo":"Come Corrosiva. Critico: +1d10 per ×2, +2d10 per ×3, +3d10 per ×4."},{"id":"esplosione_di_fiamme_2","nome":"Esplosione di Fiamme","val":2,"nuova":false,"testo":"Come Infuocata. Critico: +1d10 per ×2, +2d10 per ×3, +3d10 per ×4."},{"id":"esplosione_di_ghiaccio_2","nome":"Esplosione di Ghiaccio","val":2,"nuova":false,"testo":"Come Gelida. Critico: +1d10 per ×2, +2d10 per ×3, +3d10 per ×4."},{"id":"esplosione_folgorante_2","nome":"Esplosione Folgorante","val":2,"nuova":false,"testo":"Come Folgorante. Critico: +1d10 per ×2, +2d10 per ×3, +3d10 per ×4."},{"id":"incendiaria_2","nome":"Incendiaria","val":2,"nuova":false,"testo":"Come Infuocata ma i bersagli di un critico prendono automaticamente fuoco."},{"id":"negante_2","nome":"Negante","val":2,"nuova":false,"testo":"Ogni colpo su nemici con RD/caos, male, bene, legge o magia riduce quel valore di 5 per 1 round. Non cumulabile."},{"id":"posta_2","nome":"Posta","val":2,"nuova":false,"testo":"Come azione di movimento, studia una creatura entro 36 m: danni da precisione extra pari a 1d6/round di studio (max 1d6/bonus potenziamento) al primo colpo a segno."},{"id":"sacra_2","nome":"Sacra","val":2,"nuova":false,"testo":"Allineata Bene: Livello Negativo alle creature malvagie. 2d6 danni extra ai nemici malvagi."},{"id":"sacrilega_2","nome":"Sacrilega","val":2,"nuova":false,"testo":"Allineata Male: Livello Negativo alle creature buone. 2d6 danni extra ai nemici buoni."},{"id":"trasmutante_2","nome":"Trasmutante","val":2,"nuova":false,"testo":"Se colpisce un nemico con RD, all'inizio del turno successivo si trasforma per superare quella RD per 1 minuto."},{"id":"baluardo_arcano_2","nome":"Baluardo Arcano","val":2,"nuova":true,"testo":"Una volta al giorno, come azione immediata, quando il portatore sarebbe colpito da un incantesimo, l'arma proietta uno schermo di forza che assorbe fino a 20 danni magici."},{"id":"catapulta_di_energia_2","nome":"Catapulta di Energia","val":2,"nuova":true,"testo":"Come azione di round completo, una volta al giorno, il portatore può sparare un colpo concentrato di energia pura: 6d8 danni di forza a un bersaglio entro gittata normale (nessun TS per dimezzare). L'arma non può sparare nel round successivo."},{"id":"esplosiva_2","nome":"Esplosiva","val":2,"nuova":true,"testo":"Una volta al giorno, le munizioni esplodono all'impatto: area di esplosione di 3 m, danni 3d6 del tipo dell'arma (TS Riflessi per dimezzare, CD 10 + ½ DV + bonus totale)."},{"id":"perforante_magia_2","nome":"Perforante Magia","val":2,"nuova":true,"testo":"Le munizioni di questa arma riducono la RI del bersaglio di 5 (non si cumula con altre capacità che riducono la RI)."},{"id":"scacco_matto_2","nome":"Scacco Matto","val":2,"nuova":true,"testo":"In caso di critico, il bersaglio è vincolato dalla posizione: non può effettuare reazioni né attacchi di opportunità per 1 round, e qualsiasi tentativo di muoversi richiede un TS su Tempra (CD 10 + ½ DV + bonus totale) o fallisce."},{"id":"tiro_multiplo_perfetto_2","nome":"Tiro Multiplo Perfetto","val":2,"nuova":true,"testo":"Quando il portatore effettua più attacchi in un round completo, la penalità al tiro per colpire per gli attacchi multipli è ridotta di 1 per ogni attacco (es. –4/–8 diventa –3/–7)."},{"id":"tracciante_magico_2","nome":"Tracciante Magico","val":2,"nuova":true,"testo":"Tre volte al giorno, quando il portatore colpisce con questa arma, il bersaglio è marcato per 1 ora: il portatore ottiene +2 ai tiri per colpire contro quel bersaglio e può individuarne la posizione esatta anche se nascosto o invisibile."},{"id":"colpo_agile_3","nome":"Colpo Agile","val":3,"nuova":false,"testo":"L'arma non provoca attacchi di opportunità quando fa fuoco."},{"id":"nullificante_3","nome":"Nullificante","val":3,"nuova":false,"testo":"Ogni colpo su creature con RI riduce la RI di 1 per 1 minuto (max bonus totale dell'arma). Critico: riduzione pari al moltiplicatore di critico."},{"id":"seconda_possibilita_3","nome":"Seconda Possibilità","val":3,"nuova":false,"testo":"Quando l'arma manca il bersaglio, come azione gratuita il portatore può ripetere il tiro. Dopo l'utilizzo, bisogna attendere 1d3 round."},{"id":"cecchino_dell_oscurita_3","nome":"Cecchino dell'Oscurità","val":3,"nuova":true,"testo":"Il portatore ignora le penalità al tiro per colpire dovute a oscurità, luce fioca, nebbia o occultamento totale. L'arma «vede» dove mirare attraverso qualsiasi ostacolo visivo non fisico."},{"id":"controllo_del_campo_3","nome":"Controllo del Campo","val":3,"nuova":true,"testo":"Come azione standard, una volta al giorno il portatore può dichiarare una zona di controllo di 9 m di raggio: qualsiasi creatura nemica che entri o si muova all'interno di questa zona subisce un attacco di opportunità dalla distanza (un solo attacco gratuito)."},{"id":"eco_ballistico_3","nome":"Eco Ballistico","val":3,"nuova":true,"testo":"Quando il portatore effettua un attacco mancato, l'eco del colpo può riattaccare: tira 1d6; con risultato 5-6, il colpo rimbalza e colpisce automaticamente il bersaglio per metà dei danni."},{"id":"miglioramento_continuo_3","nome":"Miglioramento Continuo","val":3,"nuova":true,"testo":"Per ogni round consecutivo in cui il portatore spara allo stesso bersaglio (minimo 2), guadagna +1 ai tiri per colpire e danni cumulativi (max +4). Il bonus si azzera se cambia bersaglio."},{"id":"penetrazione_critica_3","nome":"Penetrazione Critica","val":3,"nuova":true,"testo":"In caso di critico, il colpo attraversa il bersaglio e può colpire un secondo bersaglio su una linea retta entro 9 m con tiro per colpire separato (danni ridotti della metà)."},{"id":"ricarica_rapida_3","nome":"Ricarica Rapida","val":3,"nuova":true,"testo":"Il portatore può ricaricare l'arma come azione veloce invece che come azione di movimento. Solo balestre e armi da fuoco."},{"id":"soppressione_3","nome":"Soppressione","val":3,"nuova":true,"testo":"Ogni colpo riuscito applica un effetto di soppressione al bersaglio: per 1 round, il bersaglio deve superare un TS su Volontà (CD 10 + ½ DV + bonus totale) o non potrà effettuare azioni di movimento verso il portatore."},{"id":"tiro_curvo_3","nome":"Tiro Curvo","val":3,"nuova":true,"testo":"Il portatore può ignorare la copertura parziale (non totale) del bersaglio: le munizioni curvano leggermente la traiettoria per colpire angoli impossibili. Solo archi."},{"id":"designante_superiore_4","nome":"Designante Superiore","val":4,"nuova":false,"testo":"Designa il bersaglio: tutti gli alleati ottengono +4 morale ai tiri per colpire e +6 ai danni contro quel bersaglio per 1 round."},{"id":"energia_luminosa_4","nome":"Energia Luminosa","val":4,"nuova":false,"testo":"L'arma è in gran parte di luce (non influisce sul peso). Irradia luce come torcia. Contro gli attacchi del portatore, il bonus CA di armatura e scudo non conta. Non può ferire non morti, costrutti e oggetti."},{"id":"velocita_4","nome":"Velocità","val":4,"nuova":false,"testo":"Se il portatore attacca solo con quest'arma, può effettuare un attacco extra come azione di round completo."},{"id":"vomita_maledizioni_4","nome":"Vomita Maledizioni","val":4,"nuova":false,"testo":"In caso di critico, la vittima subisce –4 ai tiri per colpire e ai TS per 1 minuto [maledizione]."},{"id":"barriera_di_proiettili_4","nome":"Barriera di Proiettili","val":4,"nuova":true,"testo":"Come azione standard, una volta al giorno il portatore crea una barriera di proiettili di forza attorno a sé (raggio 3 m): qualsiasi attacco a distanza contro il portatore ha il 25% di essere deviato e ri-diretto verso l'attaccante."},{"id":"catapulta_critica_4","nome":"Catapulta Critica","val":4,"nuova":true,"testo":"In caso di critico, l'arma scaglia il proiettile con tale forza da causare un'onda d'urto: tutte le creature entro 1,5 m dal punto d'impatto subiscono metà dei danni del colpo critico (TS Riflessi per negare)."},{"id":"colpo_dell_angelo_4","nome":"Colpo dell'Angelo","val":4,"nuova":true,"testo":"Una volta al giorno, come azione standard il portatore può scagliare un colpo guidato dall'alto: l'attacco non può mancare (automaticamente centrato) e bypassa qualsiasi forma di copertura, inclusa quella totale. I danni sono massimizzati."},{"id":"freccia_dell_oblio_4","nome":"Freccia dell'Oblio","val":4,"nuova":true,"testo":"In caso di critico, il bersaglio perde i ricordi degli ultimi 10 minuti: non ricorda di essere in combattimento e non agisce per 1 round, trattando tutti come neutri finché non viene attaccato di nuovo. TS Volontà per negare."},{"id":"silenziatore_totale_4","nome":"Silenziatore Totale","val":4,"nuova":true,"testo":"Qualsiasi attacco con questa arma è assolutamente silenzioso e non lascia tracce: il portatore non può essere localizzato per direzione del colpo. Inoltre, il primo attacco per round ha il 50% di sorprendere il bersaglio (negazione del bonus Dex)."},{"id":"turno_impossibile_4","nome":"Turno Impossibile","val":4,"nuova":true,"testo":"Come azione di round completo, una volta al giorno, il portatore può scagliare un proiettile che curva impossibilmente: può colpire qualsiasi bersaglio entro gittata massima dell'arma indipendentemente da qualsiasi ostacolo fisico (eccetto barriere di forza)."},{"id":"vigile_4","nome":"Vigile","val":4,"nuova":true,"testo":"Il portatore può effettuare attacchi di opportunità con quest'arma a distanza (entro gittata normale): può reagire agli avversari che si muovono o effettuano azioni entro gittata come se fosse in mischia."},{"id":"colpo_del_destino_5","nome":"Colpo del Destino","val":5,"nuova":true,"testo":"Una volta a settimana, il portatore può effettuare il «Colpo del Destino»: un attacco a distanza che colpisce automaticamente qualsiasi bersaglio entro gittata massima, bypassando qualsiasi immunità, RD o RE, e infliggendo il massimo possibile dei danni. L'arma poi non può essere usata per 24 ore."},{"id":"freccia_dell_eternita_5","nome":"Freccia dell'Eternità","val":5,"nuova":true,"testo":"Le munizioni di questa arma persistono nel tempo: non svaniscono dopo l'impatto ma rimangono fisicamente presenti. Inoltre, ogni bersaglio colpito da questa arma porta un marchio permanente che permette al portatore di localizzarlo esattamente finché è sul medesimo piano."},{"id":"occhio_dell_universo_5","nome":"Occhio dell'Universo","val":5,"nuova":true,"testo":"Il portatore vede tutto nel raggio di gittata massima come se stesse gua function tocca(a){
  const out=new Set();
  for(const c of ARCH[a].capacita)for(const s of [c.sost,c.mod]){
    if(!s)continue;
    if(/^Riparazioni/.test(s))out.add('riparazioni');
    else if(/^Fabbro/.test(s))out.add('fabbro');
    else if(/^Mechanus/.test(s))out.add('mechanus');
    else if(/^Tecno-armi/.test(s))out.add('tecno');
    else if(/^Automaton/.test(s))out.add('automaton');
    else if(/^Esoscheletri/.test(s))out.add('eso');
    else if(/^Aggiornamento finale/.test(s))out.add('aggfinale');
    else if(/^Gadget/.test(s))(s.match(/\d+/g)||[]).forEach(n=>out.add('slot'+n));
  }
  return out;
}

/* ---------- esoscheletri ---------- */
function esoTipi(){if(!haEso())return [];return has('cibernetico')?['L','P']:[S.esoTipo];}
function esoMods(t){const e=S.esos[t];return (e.mods||[]).filter(id=>EMOD[id]&&EMOD[id].stadio<=stadioE()&&(EMOD[id].tipo==='C'||EMOD[id].tipo===t));}
function scoperteMax(){return has('cibernetico')?[3,7,11,15,19].filter(x=>x<=lv()).length:0;}
function innestiMax(){return has('cibernetico')?[6,12,18].filter(x=>x<=lv()).length:0;}
function esoAttive(t){ // modifiche installate + scoperte (senza nodi)
  const s=esoMods(t).slice();
  for(const x of S.scoperte.slice(0,scoperteMax()))if(x&&x.tipo===t&&EMOD[x.id]&&!s.includes(x.id))s.push(x.id);
  return s;
}
function potStrutt(t){let b=0;for(const id of esoAttive(t)){const m=/potenziamento_strutturale_(\d)/.exec(id);if(m)b=Math.max(b,+m[1]);}return b;}
const caricheEso=()=>Math.max(0,Math.floor(lv()/2)+INT()+(hasOpt('eso:riciclatore_energetico_per_esoscheletri')?2:0));
const caricheTecno=()=>Math.max(0,Math.floor(lv()/2)+INT()+(hasOpt('tecno:riciclatore_energetico_per_tecno_armi')?2:0)+(has('ingegnere_da_campo')?1:0));

/* ---------- scheda dell'inventore ---------- */
function indossa(){const t=S.gioco.indossa;return esoTipi().includes(t)?t:'';}
function tagliaBase(){const t=indossa();if(t==='P'&&hasOpt('eso:scocca_titan'))return 'Grande';if(t)return 'Media';return S.taglia;}
function taglIa(){return tagliaPiu(tagliaBase(),effSomma('inv','taglia'));}
function calcInv(){
  const L=lv(),t=indossa(),row=D.tabella[L-1];
  const c={...S.car};const note=[];
  if(t){const p=potStrutt(t);if(p){if(t==='L')c.Des=S.car.Des+p;else c.For=S.car.For+p;note.push('Potenziamento strutturale +'+p+' a '+(t==='L'?'Destrezza':'Forza'));}
    if(tagliaBase()==='Grande'){c.For+=2;c.Des-=2;}}
  for(const k of CAR)c[k]+=effCar('inv',k);
  if(has('androide')&&L>=20&&S.iper)c[S.iper]+=2;
  const M=Object.fromEntries(CAR.map(k=>[k,mod(c[k])]));
  const tg=TAGLIA[taglIa()];
  let arm=null;
  if(t){const e=S.esos[t],a=ARM[e.armatura];if(a)arm={nome:'Esoscheletro '+(t==='L'?'leggero':'pesante')+' ('+a.nome+')',ca:a.ca+1+sintArmatura(),maxDes:a.maxDes,pen:Math.min(0,a.pen+1)};}
  else{const a=ARM[S.armaturaNormale];if(a&&a.tipo==='L')arm={nome:a.nome,ca:a.ca+sintArmatura(),maxDes:a.maxDes,pen:a.pen};}
  const desCA=arm?Math.min(M.Des,arm.maxDes):M.Des;
  const att=new Set(S.gioco.attiviE);
  let defl=0;
  if(t&&esoAttive(t).includes('generatore_di_campo_difensivo')&&att.has('generatore_di_campo_difensivo'))defl=L>=18?4:L>=14?3:2;
  const scudo=(+S.scudo||0)+((+S.scudo||0)?sintScudo():0),alt=+S.bonus.ca||0;
  const ca=10+(arm?arm.ca:0)+desCA+tg.ca+scudo+defl+alt+effSomma('inv','ca');
  let contatto=10+desCA+tg.ca+defl+effSomma('inv','caCont');
  if(t&&esoAttive(t).includes('campo_anti_contatto')&&att.has('campo_anti_contatto'))contatto=Math.min(ca,contatto+Math.max(0,M.Int));
  const impr=ca-Math.max(0,desCA)-effSomma('inv','ca')+effSomma('inv','caImpr');
  const bab=babList(row.bab);
  const pfBase=8+5*(L-1)+M.Cos*L;
  const pf=S.pfMan!==''&&S.pfMan!=null?+S.pfMan:pfBase;
  let vel=(S.taglia==='Piccola'&&!t)?6:9;
  if(t==='P'||(t&&arm&&ARM[S.esos[t].armatura]&&ARM[S.esos[t].armatura].tipo==='P'))vel=6;
  if(t==='L'&&esoAttive('L').includes('motore_potenziato_L')&&att.has('motore_potenziato_L'))vel+=3;
  if(has('androide')&&L>=20)vel+=6;
  vel+=effSomma('inv','vel');
  return {c,M,tg,taglia:taglIa(),arm,ca,contatto,impr,defl,bab,pf,pfBase,row,note,vel,pfTemp:effSomma('inv','pfTemp'),
    ts:{tempra:row.tempra+M.Cos+(+S.bonus.tempra||0)+effSomma('inv','T'),rif:row.rif+M.Des+(+S.bonus.rif||0)+effSomma('inv','R'),vol:row.vol+M.Sag+(+S.bonus.vol||0)+effSomma('inv','V')},
    bmc:bab[0]+M.For+tg.bmc+effSomma('inv','bmc'),dmc:10+bab[0]+M.For+M.Des+tg.bmc+effSomma('inv','dmc'),
    iniz:M.Des+effSomma('inv','iniz')};
}

/* ---------- tecno-arma ---------- */
function armaT(){
  const T=S.tecno;
  if(T.arma&&ARN[T.arma]){const a=ARN[T.arma];
    const cat=/leggere/.test(a.cat)?'leggera':/una mano/.test(a.cat)?'una':/tiro/.test(a.cat)?'tiro':'due';
    return {nome:a.nome,dP:a.dP,dM:a.dM,critico:a.critico,tipo:a.tipo,cat,lancio:/Da lancio/.test(a.speciale),fuoco:false,dueMani:cat==='due'||/due mani/.test(a.cat),speciale:a.speciale,gittata:a.gittata};}
  const m=T.man;return {nome:m.nome||'Arma',dP:stepD(m.dado,-1),dM:m.dado,critico:m.critico||'x2',tipo:m.tipo||'C',cat:m.cat,lancio:!!m.lancio,fuoco:!!m.fuoco,dueMani:m.cat==='due'||(m.cat==='tiro'&&!!m.dueMani),speciale:'',gittata:m.gittata||'—'};
}
function mischia(w){return w.cat!=='tiro'&&!w.fuoco;}
function soloOk(m,w){
  if(!m.solo)return true;const s=m.solo;
  if(s==='armi da lancio')return w.lancio;
  if(s==='armi a distanza')return w.cat==='tiro'||w.lancio||w.fuoco;
  if(s==='armi da mischia taglienti')return mischia(w)&&/T/.test(w.tipo);
  if(s==='armi da mischia contundenti')return mischia(w)&&/C/.test(w.tipo);
  if(s==='armi perforanti')return /P/.test(w.tipo);
  if(s.startsWith('armi a due mani'))return w.dueMani;
  if(s==='armi da mischia')return mischia(w);
  if(s==='armi da fuoco')return w.fuoco;
  return true;
}
function modsT(){return (S.tecno.mods||[]).filter(id=>TMOD[id]&&TMOD[id].stadio<=stadioT());}
function nodiUsati(ids,T){return ids.reduce((s,id)=>s+(T[id].nodi||0),0);}
function modOk(m,installate,T,w){
  if(w&&!soloOk(m,w))return 'solo '+m.solo;
  for(const x of (m.incompat||[]))if(installate.includes(x))return 'incompatibile con '+(T[x]?T[x].nome:x);
  for(const x of installate)if((T[x].incompat||[]).includes(m.id))return 'incompatibile con '+T[x].nome;
  for(const x of (m.richiede||[]))if(!installate.includes(x))return 'richiede '+(T[x]?T[x].nome:x);
  return '';
}
function specialista(){if(!has('ingegnere_da_campo')||lv()<3)return 0;return 1+Math.floor((lv()-3)/4);}
function calcTecno(inv){
  const w=armaT(),T=S.tecno,L=lv(),att=new Set(S.gioco.attiviT),inst=modsT();
  const on=id=>inst.includes(id)&&att.has(id);
  const tg=taglIa();
  const np=passiTaglia(tg);let dado=np===-1?w.dP:stepD(w.dM,np);
  if(on('contrappesi_minerva'))dado=stepD(dado,1);
  const usaDes=w.cat==='tiro'||w.fuoco||T.accurata;
  let colp=effSomma('inv','tpc')+(usaDes?inv.M.Des:inv.M.For)+sintArma()+inv.tg.txc+specialista()+(+S.bonus.colpire||0);
  let dan=effSomma('inv','danni')+sintArma()+specialista()+(+S.bonus.danni||0);
  const forD=(w.cat==='tiro'&&!w.lancio)||w.fuoco?0:(w.dueMani&&mischia(w)?Math.floor(inv.M.For*1.5):inv.M.For);
  dan+=forD;
  const ext=[];
  if(on('chip_di_combattimento_assistito_superiore')){colp+=2;dan+=2;}else if(on('chip_di_combattimento_assistito')){colp+=1;dan+=1;}
  if(on('elettrodi'))ext.push('+1d6 elettricità');
  if(on('generatore_di_fiamma'))ext.push('+1d6 fuoco');
  if(on('refrigeratore'))ext.push('+1d6 freddo');
  if(on('rivestimento_in_gomma_scudo'))ext.push('+1d6, tutto non letale');
  if(on('risuonatore_di_forza'))ext.push('danni da forza');
  let crit=w.critico;
  if((on('lama_a_catena')&&soloOk(TMOD.lama_a_catena,w))||(on('pistone_a_scoppio')&&soloOk(TMOD.pistone_a_scoppio,w))||(on('propulsore_trans_elicoidale')&&soloOk(TMOD.propulsore_trans_elicoidale,w)))crit=raddoppiaMinaccia(crit);
  const bab=inv.bab.map(b=>b+colp);
  return {w,dado,colp,dan,bab,ext:ext.filter(Boolean),crit,usaDes};
}
function raddoppiaMinaccia(c){
  const m=/^(\d+)(?:-20)?\/(x\d)$/.exec(c)||/^(x\d)$/.exec(c);
  let lo=20,mul='x2';
  if(/^x\d$/.test(c)){mul=c;}else{const k=/^(\d+)-20\/(x\d)$/.exec(c);if(k){lo=+k[1];mul=k[2];}else{const k2=/^20\/(x\d)$/.exec(c);if(k2)mul=k2[1];}}
  const r=21-lo;const nl=21-2*r;return nl+'-20/'+mul;
}

/* ---------- automaton ---------- */
function autRow(){return D.automaton.tabella[Math.max(0,lv()-3)];}
function autOpt(id){return hasOpt('automaton:'+id)&&(OPTK['automaton:'+id].modelli||[]).includes(S.aut.modello);}
function calcAut(){
  const L=lv(),r=autRow(),A=S.aut,M0=D.automaton.modelli[A.modello],st=stadioA(),alpha=has('mechautarca'),att=new Set(S.gioco.attiviT);
  const opt=alpha&&L>=20&&A.optimus;
  const tgB=opt?'Enorme':(st>=1&&A.grande)?'Grande':'Media';
  const tg=tagliaPiu(tgB,effSomma('aut','taglia'));
  let For=M0.car.For+r.forDes,Des=M0.car.Des+r.forDes;
  const pist=A.modello==='destructor'&&st>=1;
  if(pist)For+=2;
  if(tgB==='Grande'){For+=2;Des-=2;}
  if(tgB==='Enorme')For+=4;
  For+=effCar('aut','For');Des+=effCar('aut','Des');
  const mF=mod(For),mD=mod(Des),T=TAGLIA[tg];
  const ab=autBonus();
  let ca=r.ca[A.modello]+T.ca+ab+effSomma('aut','ca');
  if(alpha&&L>=10)ca+=1;
  const od=S.gioco.overdriveOn;
  if(A.modello==='defensor'&&od&&autOpt('modulo_overdrive_beta'))ca+=2;
  let pf=10+6*(r.dv-1);
  for(const x of D.automaton.tabella)if(x.liv<=L)pf+=+x.bonusPF||0;
  if(tgB==='Grande')pf+=10;if(tgB==='Enorme')pf+=20;
  const temp=alpha&&L>=5?L:0;
  const bab=babList(r.bab);
  const bonusTxc=T.txc+(alpha?1:0)+ab+effSomma('aut','tpc');
  const bonusDan=(alpha&&L>=5?2:0)+ab+effSomma('aut','danni');
  const att2=[];
  const n78=st>=2&&A.modello!=='defensor';
  const critUp=c=>{if(!n78)return c;const k=/^(\d+)-20\/(x\d)$/.exec(c);if(k)return (+k[1]-1)+'-20/'+k[2];const k2=/^20\/(x\d)$/.exec(c);return k2?'19-20/'+k2[1]:c;};
  const odA=od&&A.modello==='destructor'&&autOpt('modulo_overdrive_alpha')?3:0;
  const odG=od&&A.modello==='sagittar'&&autOpt('modulo_overdrive_gamma')?3:0;
  const istrice=autOpt('modulo_di_difesa_istrice')&&S.gioco.istrice?2:0;
  if(A.modello==='destructor'){
    const d=stepD(pist?'2d6':'1d10',passiTaglia(tg));
    att2.push({nome:'Schianto idraulico',txc:bab.map(b=>b+mF+bonusTxc+odA),dan:d+sg(Math.floor(mF*1.5)+bonusDan+odA+istrice).replace('+0',''),crit:critUp('19-20/x2'),tipo:autOpt('armi_retrattili')?'C, P o T':'C',nota:'a due mani'});
  }else if(A.modello==='defensor'){
    const d=stepD('1d6',passiTaglia(tg));
    att2.push({nome:'Schianto meccanico',txc:bab.map(b=>b+mF+bonusTxc),dan:d+sg(mF+bonusDan+istrice).replace('+0',''),crit:'20/x2',tipo:'C',nota:'a una mano'});
  }else{
    const d=stepD('1d3',passiTaglia(tg));
    att2.push({nome:'Schianto',txc:bab.map(b=>b+mF+T.txc+(alpha?1:0)),dan:d+sg(mF+(alpha&&L>=5?2:0)+istrice).replace('+0',''),crit:'20/x2',tipo:'C',nota:'non incantabile'});
    const ric=st>=1;const lista=bab.map(b=>b+mD+bonusTxc+odG);if(ric)lista.unshift(bab[0]+mD+bonusTxc+odG);
    att2.push({nome:'Sparaculei',txc:lista,dan:stepD('1d8',passiTaglia(tg))+sg(Math.floor(mD/2)+bonusDan+odG).replace('+0',''),crit:critUp('20/x3'),tipo:autOpt('aculei_differenziati')?'P, C o T':'P',nota:'gittata '+(30+(ric?6:0))+' m (x5)'+(ric?' · colpo extra con attacco completo':'')});
  }
  let vel=6+(alpha?3:0)+(odA&&od?3:0)+effSomma('aut','vel');
  let portata={Grande:3,Enorme:4.5,Mastodontica:6,Colossale:9}[tg]||1.5;if(alpha)portata+=1.5;
  const bmc=bab[0]+mF+T.bmc+effSomma('aut','bmc'),dmc=10+bab[0]+mF+mD+T.bmc+effSomma('aut','dmc');
  const inc=ab;
  return {r,M0,tg,For,Des,mF,mD,ca,pf,temp,bab,att:att2,vel,portata,bmc,dmc,inc,st,alpha,
    ts:{tempra:r.tempra+effSomma('aut','T'),rif:r.rif+mD+effSomma('aut','R'),vol:r.vol+effSomma('aut','V')},pfTempEff:effSomma('aut','pfTemp'),rd:st>=3?'RD 10/adamantio':'',ri:alpha&&L>=10?11+L:0};
}

function problemaScelta(n,x){
  if(!x)return '';
  const altri=Object.entries(S.scelte).filter(([k,v])=>+k!==n&&+k<=lv()&&scelta(+k)&&v.k===x.k&&v.id===x.id);
  if(x.k==='gadget'){const g=GAD[x.id];if(!g)return 'gadget sconosciuto';if(g.req>n)return 'richiede il '+ORD(g.req)+' livello';if(altri.length||gadgetBonus().some(b=>b.id===x.id))return 'già posseduto';
    if(/Pilotare/.test(g.reqExtra||''))return '';return '';}
  if(x.k==='dote'){const d=DOTE[x.id];if(!d)return 'dote sconosciuta';if(d.req>n)return 'richiede il '+ORD(d.req)+' livello';if(altri.length||(has('skitari')&&x.id==='competenza_nelle_armi_sperimentali'))return 'già scelta';
    for(const p of d.prereq){const ok=Object.entries(S.scelte).some(([k,v])=>+k<n&&scelta(+k)&&v.k==='dote'&&v.id===p);if(!ok)return 'richiede '+(DOTE[p]?DOTE[p].nome:p);}return '';}
  if(x.k==='optional'){const o=OPTK[x.id];if(!o)return 'optional sconosciuto';if(o.req>n)return 'richiede il '+ORD(o.req)+' livello';if(altri.length)return 'già scelto';
    if(o.ramo==='tecno'&&!haTecno())return 'l\'archetipo non ha tecno-armi';if(o.ramo==='automaton'&&perde('automaton'))return 'l\'archetipo non ha automaton';if(o.ramo==='eso'&&perde('eso'))return 'l\'archetipo non ha esoscheletri';
    for(const p of o.prereq||[]){const ok=Object.entries(S.scelte).some(([k,v])=>+k<n&&scelta(+k)&&v.k==='optional'&&v.id===o.ramo+':'+p);if(!ok)return 'richiede '+p.replace(/_/g,' ');}return '';}
  return '';
}
function rigaSlot(s){
  if(s.arch){const a=ARCH[s.arch];const c=a.capacita.find(c=>(c.sost||'').includes(s.liv+'°'));
    return '<div class="slot"><span class="lv">'+ORD(s.liv)+'</span><div><span class="note">Sostituito da </span><b>'+esc(c?c.nome:a.nome)+'</b> <span class="tag">'+esc(a.nome)+'</span></div></div>';}
  const x=S.scelte[s.liv];const pb=problemaScelta(s.liv,x);
  let o='<option value="">— scegli —</option>';
  const val=x?x.k+'|'+x.id:'';
  const opzG=D.gadget.elenco.map(g=>'<option value="gadget|'+g.id+'"'+(val==='gadget|'+g.id?' selected':'')+(g.req>s.liv?' disabled':'')+'>'+esc(g.nome)+(g.req>1?' ('+ORD(g.req)+')':'')+'</option>').join('');
  if(s.tipo==='gadget')o+=opzG;
  else{
    o+='<optgroup label="Gadget">'+opzG+'</optgroup>';
    for(const r of ['tecno','automaton','eso'])o+='<optgroup label="Optional — '+RAMO_N[r]+'">'+OPT.filter(p=>p.ramo===r).map(p=>'<option value="optional|'+p.key+'"'+(val==='optional|'+p.key?' selected':'')+(p.req>s.liv?' disabled':'')+'>'+esc(p.nome)+(p.req>1?' ('+ORD(p.req)+')':'')+'</option>').join('')+'</optgroup>';
    o+='<optgroup label="Doti da inventore">'+D.doti.map(d=>'<option value="dote|'+d.id+'"'+(val==='dote|'+d.id?' selected':'')+(d.req>s.liv?' disabled':'')+'>'+esc(d.nome)+(d.req>1?' ('+ORD(d.req)+')':'')+'</option>').join('')+'</optgroup>';
  }
  return '<div class="slot'+(pb?' bad':'')+'"><span class="lv">'+ORD(s.liv)+'</span><div><select data-slot="'+s.liv+'" aria-label="Scelta del '+ORD(s.liv)+' livello">'+o+'</select>'+(pb?'<div class="note warnT">'+esc(pb)+'</div>':'')+'</div></div>';
}

    '<div class="note" style="margin-top:6px">'+(C.usaDes?'Destrezza':'Forza')+' al tiro per colpire'+(specialista()?' · Specialista delle tecno-armi '+sg(specialista()):'')+'. Le modifiche attive si accendono dalla scheda In gioco.</div></div>';
  h+=pannelloCap('tecno',(w.cat==='tiro'||w.fuoco)?'distanza':'mischia',sintArma(),'Capacità speciali dell\'arma',true);

    for(const m of el){

      h+='<div class="opt'+(i&&pb?' bad':'')+(blocco?' dim':'')+'"><input type="checkbox" data-tm="'+m.id+'" aria-label="Installa '+esc(m.nome)+'"'+(i?' checked':'')+((blocco||(!i&&(pb||troppi)))?' disabled':'')+'>'+

    }
    h+='</div></div>';

  const op=D.tecno.optional.filter(o=>hasOpt('tecno:'+o.id));
  h+='<div class="card"><h2>Optional appresi</h2>'+(op.length?op.map(o=>det(esc(o.nome),rich(o.testo))).join(''):'<div class="note">Nessuno. Gli optional si scelgono ai livelli pari nella scheda Inventore.</div>')+'</div>';

    '<div class="txt note" style="margin-top:8px">'+D.automaton.modelli[A.modello].righe.map(rich).join('')+'</div>'+
