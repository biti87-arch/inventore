reature animali o vegetali specifiche in un raggio di 18 m. L'inventore indica al sistema una specie (descrivendola o pensandola intensamente per 1 round) e lo Scanner segnala la posizione approssimativa di ogni esemplare di tale specie nell'area.\nFunzioni aggiuntive al 10° livello:\nAmplificazione sonora: lo Scanner amplifica i suoni provenienti da un'area di 9 m di raggio fino a una distanza di 18 m, consentendo all'inventore di udirli con chiarezza per 5 minuti. Può essere usato per origliare conversazioni distanti, identificare creature da rumori specifici o monitorare un'area senza essere visti.\nAnalisi psicometrica: lo Scanner analizza lo stato mentale di una creatura entro 18 m. Rileva disturbi mentali, dipendenze, effetti di ammaliamento o controllo mentale, e fornisce all'inventore informazioni su tali condizioni. La creatura analizzata non si accorge dell'analisi.\nCardiofrequenzimetro: lo Scanner monitora i parametri vitali di una creatura entro 18 m per 1 minuto, rilevando le variazioni associate alla menzogna. La creatura analizzata può superare un Tiro Salvezza su Volontà per nascondere le proprie reazioni biologiche, ma in caso di fallimento l'inventore sa con certezza se le risposte alle proprie domande sono veritiere o menzognere.","sperimentale":false,"migliorie":[],"cariche":"3 + bonus di Intelligenza"},{"id":"manipolatore_gravitonico","nome":"Manipolatore gravitonico","cat":"Utility e strumenti","sub":"","req":4,"reqExtra":null,"testo":"Ingombro 1. Pistola di 20 cm a due mani con batteria illimitata per la funzione base. Come azione standard, l'inventore può muovere un oggetto non custodito di peso fino a 2,5 kg, entro 9 m, fino a 6 m al round. L'oggetto cade se viene allontanato oltre 9 m dall'inventore. Può essere usato per operazioni di precisione con una prova di Intelligenza CD minima 15 (azionare una leva, girare una chiave, sciogliere un nodo semplice). Miglioria al 7° livello: una volta al giorno, per 1 minuto, l'inventore può effettuare 3 attacchi telecinetici. Può effettuare manovre di Lottare (compresa Immobilizzare), Spingere o Sbilanciare entro 18 m, usando il livello di inventore al posto del BMC e Intelligenza al posto di Forza o Destrezza. Le manovre non provocano attacchi di opportunità. Miglioria al 9° livello: una volta al giorno, l'inventore può lanciare fino a 15 oggetti non custoditi (entro 18 m, tutti entro 3 m l'uno dall'altro) contro un bersaglio entro 24 m. Peso totale massimo 150 kg. L'inventore effettua un attacco per ogni oggetto (BAB + Intelligenza). Le armi infliggono il danno standard senza bonus di Forza; gli altri oggetti infliggono 1 danno per ogni 10 kg di peso o 1d6 se duri/appuntiti. Miglioria all'11° livello: la miglioria al 9° livello può essere usata anche per lanciare creature viventi (un Tiro Salvezza su Volontà nega l'effetto; la Resistenza agli Incantesimi si applica).","sperimentale":false,"migliorie":[7,9,11]},{"id":"oculus_pro","nome":"Oculus pro","cat":"Utility e strumenti","sub":"","req":4,"reqExtra":null,"testo":"Sistema di mira integrato montato sull'occhio. L'inventore applica metà del proprio bonus di Destrezza ai tiri per i danni con il primo attacco di ogni turno effettuato utilizzando tecno-armi a distanza.","sperimentale":false,"migliorie":[]},{"id":"lente_analitica","nome":"Lente analitica","cat":"Utility e strumenti","sub":"","req":5,"reqExtra":null,"testo":"Ingombro: nessuno (monocolo magnetico). Cariche: 3 + bonus di Intelligenza. Come azione di movimento, l'inventore spende 1 carica per analizzare un oggetto, una creatura o un fenomeno entro 9 m per 1 minuto, ottenendo uno dei seguenti effetti a scelta: Identificare oggetti magici: può effettuare prove di Conoscenze (ingegneria) al posto di Sapienza magica per identificare oggetti magici, ottenendo bonus +5. Analisi tattica: ottiene bonus cognitivo +2 ai tiri per colpire e alla CA contro la creatura analizzata per 1 minuto. Lettura strutturale: ottiene bonus +5 alle prove di Conoscenze (ingegneria) per identificare un punto debole in una struttura, oggetto o costrutto; il primo attacco effettuato contro tale punto ignora 5 punti di Durezza.","sperimentale":false,"migliorie":[],"cariche":"3 + bonus di Intelligenza"},{"id":"valigia_quantica_salvaspazio","nome":"Valigia quantica salvaspazio","cat":"Utility e strumenti","sub":"","req":8,"reqExtra":null,"testo":"Una valigia che, tramite bombardamento di quanti, restringe gli oggetti contenuti a una frazione del loro volume. La valigia può contenere fino a 250 kg di oggetti. Se la valigia viene rotta, tutto il contenuto va perduto. Le creature viventi possono essere contenute per un massimo di 10 minuti, dopodiché soffocano. Trovare un oggetto specifico nella valigia richiede un'azione di movimento. Gli oggetti magici al suo interno non conferiscono i loro benefici a chi li trasporta.","sperimentale":false,"migliorie":[]},{"id":"voltometro_a_campo_logico","nome":"Voltometro a campo logico","cat":"Utility e strumenti","sub":"","req":8,"reqExtra":null,"testo":"Cariche: 3 + 2 × bonus di Intelligenza. Dispositivo a forma di uovo metallico delle dimensioni di un'arancia. Come azione di movimento, l'inventore lo aziona spendendo 1 carica (la durata non deve essere consecutiva). Quando è attivo, gli alleati entro 3 m dall'inventore possono ripetere i Tiri Salvezza falliti contro incantesimi (anche lanciati come capacità magica), attacchi a soffio e con lo sguardo.","sperimentale":false,"migliorie":[],"cariche":"3 + 2 × bonus di Intelligenza"},{"id":"fiamma_ossidrica","nome":"Fiamma ossidrica","cat":"Esplorazione e ambiente","sub":"","req":1,"reqExtra":null,"testo":"Ingombro 1. Ricarica: 5 minuti. Serbatoio: 4 unità. Può essere usata per chiudere un varco con cardini metallici, aumentando di 10 la CD per sfondarlo (1 minuto e 1 unità di carburante). Può anche essere usata in senso opposto per indebolire una saldatura, riducendo la CD di sfondamento di 10. Senza carburante funziona come un acciarino e una candela (spenta solo da venti molto forti). Funziona anche sott'acqua.","sperimentale":false,"migliorie":[]},{"id":"lombrico_d_ottone","nome":"Lombrico d'ottone","cat":"Esplorazione e ambiente","sub":"","req":1,"reqExtra":null,"testo":"Ingombro 2. Ricarica: 5 minuti. Cilindro di 20 × 10 cm. Una volta attivato, cade a terra e si espande in un tubo flessibile. Può essere usato per scavare una trincea attorno all'inventore (una creatura di taglia media o inferiore) oppure in una linea di 9 m. L'area scavata diventa terreno difficile e offre copertura parziale. Funziona solo su terreni morbidi (terra, sabbia, fango). Miglioria al 6° livello: funziona anche su terreni solidi come roccia o pavimentazione.","sperimentale":false,"migliorie":[6]},{"id":"ripulitore_automatico","nome":"Ripulitore automatico","cat":"Esplorazione e ambiente","sub":"","req":1,"reqExtra":null,"testo":"Ingombro 1. Giara da 2 litri con rubinetto e tubo di aspirazione lungo 5 m. Risucchia l'acqua attraverso il tubo, filtrando veleni, malattie e impurità e producendo acqua potabile. Miglioria al 6° livello: può essere usato per aspirare gas e veleni aerei in un'area di 6 m di raggio e 6 m di altezza. Può dissolvere incantesimi di tipo Nube (effetto identico a Dissolvere mirato di Dissolvi magie); se il tentativo di dissolvere fallisce, il ripulitore diventa inutilizzabile per 4 ore. Dopo aver aspirato gas o Nube, va svuotato (10 minuti).","sperimentale":false,"migliorie":[6]},{"id":"sega_circolare","nome":"Sega circolare / Motosega “Xecchon GT 23 Demolisher”","cat":"Esplorazione e ambiente","sub":"","req":1,"reqExtra":null,"testo":"Ingombro 2 (o arma a due mani con la miglioria). Ricarica: 5 minuti. Serbatoio: 5 unità. Una unità consente di tagliare 1 m² di legno o metallo in 2d6 round. Sui metalli particolarmente spessi (come acciaio rinforzato), c'è il 5% di probabilità di danneggiamento del gadget per ogni round di utilizzo. La sega è rumorosa e udibile a distanza. Miglioria al 4° livello: aggiungendo una seconda catena di 70 cm, il gadget diventa la motosega “Demolisher”, un'arma da guerra a due mani (danno 3d6 in taglia media, critico 18-20/x2, T tagliente, qualità Letale). La motosega può essere usata come arma base per costruire una tecno-arma.","sperimentale":false,"migliorie":[4]},{"id":"tuta_ambientale","nome":"Tuta ambientale","cat":"Esplorazione e ambiente","sub":"","req":4,"reqExtra":null,"testo":"Tuta indossabile sopra il corpo e l'equipaggiamento. La velocità dell'inventore viene dimezzata e l'inventore affonda nei liquidi. In cambio, ottiene bonus +4 ai Tiri Salvezza contro effetti di [malattia], [veleno da inalazione], gas (compresi gli incantesimi Nube), radiazioni, caldo e freddo ambientali, schizzi/pioggia/vapore (come Geyser e Pioggia acida).","sperimentale":false,"migliorie":[]},{"id":"trapano_portatile_pneumatic","nome":"Trapano portatile “Pneumatic”","cat":"Esplorazione e ambiente","sub":"","req":5,"reqExtra":null,"testo":"Ingombro 2. Ricarica: 5 minuti (ricarica pressione). Serbatoio: 6 unità. Una unità consente di praticare un foro del diametro di 5 cm in 1 m di pietra, mattone o metallo in 3 round (10 round per metallo spesso o adamantio). Può essere utilizzato per spiare attraverso le pareti, far passare una corda, posizionare esplosivi o creare brecce. Due unità consentono di praticare un foro abbastanza grande da far passare una creatura di taglia piccola attraverso 1 m di pietra in 1 minuto (taglia media: 2 minuti). È rumoroso e udibile a 30 m. Miglioria al 9° livello: il consumo di carburante è dimezzato e i tempi sono dimezzati. Inoltre, una unità consente di usare il trapano come arma in mischia (azione standard, attacco di contatto in mischia con BAB + bonus di Intelligenza): 2d6 danni perforanti, ignora 5 punti di Durezza e Riduzione del Danno non magica.","sperimentale":false,"migliorie":[9]}]},"doti":[{"id":"amante_delle_armi_da_fuoco","nome":"Amante delle armi da fuoco","cat":"Combattimento e armi","req":1,"prereq":[],"testo":"L'inventore ottiene la competenza con un'arma da fuoco avanzata a scelta. Inoltre, ottiene Pistolero amatoriale come talento bonus (deve soddisfarne i requisiti)."},{"id":"competenza_nelle_armi_sperimentali","nome":"Competenza nelle armi sperimentali","cat":"Combattimento e armi","req":1,"prereq":[],"testo":"L'inventore ottiene la competenza nell'uso di tutte le armi sperimentali (l'Elettro-carabina “Shock”, la Pistola lanciafiamme “Soffio di drago”, la Tuono-pistola “Reoni Silver thunder”, il Drone “Firestorm”, il Cannone idraulico “Slime”, lo Shotgun “Devastator”, il Lanciabrina “Blizzard”, il Lanciagranate R-92, il Bio-cannone “Acid rain”, il Fucile gauss “Railgun” e il Cannone al plasma “Solaris”). Senza questa dote, un inventore non può attivare alcuna arma sperimentale."},{"id":"tecniche_d_assedio_e_abbattimento","nome":"Tecniche d'assedio e abbattimento","cat":"Combattimento e armi","req":1,"prereq":[],"testo":"L'inventore ottiene la competenza con le macchine d'assedio. Inoltre, i tempi di assemblaggio delle macchine d'assedio sotto la sua supervisione vengono dimezzati. Infine, quando opera una macchina d'assedio, tutti gli operatori possono puntarla o ricaricarla come azione di movimento, anziché di round completo."},{"id":"punizione_del_creatore","nome":"Punizione del creatore","cat":"Combattimento e armi","req":1,"prereq":[],"testo":"Come azione standard l'inventore può spendere 1 uso di riparazioni ed effettuare un attacco in mischia con un'arma contro un costrutto. Se l'attacco colpisce, supera qualsiasi RD posseduta dalla vittima e infligge un danno extra pari alle cure offerte dalla capacità riparazioni."},{"id":"cellule_energetiche_argus","nome":"Cellule energetiche Argus","cat":"Mechanus","req":1,"prereq":[],"testo":"L'inventore acquisisce il brevetto della cellula energetica Argus, un generatore di energia miniaturizzato in grado di potenziare i mechanus. Durante la creazione, l'inventore può inserire una cellula Argus in un mechanus per aumentare di 1 la CD dei Tiri Salvezza da esso provocati. Si ha a disposizione un numero di cellule al giorno pari al bonus di Intelligenza."},{"id":"mechanus_extra","nome":"Mechanus extra","cat":"Mechanus","req":1,"prereq":[],"testo":"L'inventore ottiene 1 mechanus costruibile in più al giorno, di qualsiasi livello a lui disponibile."},{"id":"mechanus_potenziati","nome":"Mechanus potenziati","cat":"Mechanus","req":1,"prereq":[],"testo":"La CD dei Tiri Salvezza provocati dai mechanus creati dall'inventore aumenta di 1."},{"id":"mechanus_potenziati_superiore","nome":"Mechanus potenziati superiore","cat":"Mechanus","req":1,"prereq":["mechanus_potenziati"],"testo":"La CD dei Tiri Salvezza provocati dai mechanus creati dall'inventore aumenta di 1. Questo bonus si cumula con quello fornito dalla dote da inventore Mechanus potenziati."},{"id":"mechanus_ad_attivazione_vocale","nome":"Mechanus ad attivazione vocale","cat":"Mechanus","req":14,"prereq":[],"testo":"Una volta al giorno, tramite la voce l'inventore può attivare un mechanus creato come azione veloce. Un mechanus il cui “tempo di attivazione” sia più lungo di 1 round o di 1 azione di round completo non si può attivare vocalmente."},{"id":"attivare_mechanus_in_combattimento","nome":"Attivare mechanus in combattimento","cat":"Mechanus","req":1,"prereq":[],"testo":"L'inventore ottiene bonus +4 alle prove di Concentrazione effettuate per attivare un mechanus mentre “lancia sulla difensiva” o è in lotta."},{"id":"riparazioni_sicure","nome":"Riparazioni sicure","cat":"Riparazioni e meraviglie","req":1,"prereq":[],"testo":"L'inventore può effettuare le riparazioni senza provocare attacchi di opportunità."},{"id":"riparazioni_extra","nome":"Riparazioni extra","cat":"Riparazioni e meraviglie","req":1,"prereq":[],"testo":"L'inventore ottiene 2 utilizzi giornalieri extra di riparazioni."},{"id":"razziatore_provetto","nome":"Razziatore provetto","cat":"Riparazioni e meraviglie","req":1,"prereq":[],"testo":"L'inventore ottiene bonus +4 alle prove di Professione (fabbro) quando razzia un automaton ed è in grado di effettuare smantellamenti e razzie in 10 minuti, anziché in 1 ora."},{"id":"sistema_di_detonazione","nome":"Sistema di detonazione","cat":"Riparazioni e meraviglie","req":10,"prereq":[],"testo":"Durante la creazione, l'inventore può inserire un detonatore sul proprio automaton o sul proprio esoscheletro (solo uno dei due). Come azione standard, l'inventore può attivare il detonatore, a patto che questo si trovi entro 18 m da lui. La meraviglia viene immediatamente distrutta e l'esplosione infligge 10d4 danni da forza a tutte le creature entro 3 m. Le vittime possono superare un Tiro Salvezza su Riflessi per dimezzare il danno. Se il detonatore è installato su un esoscheletro, un istante prima della detonazione l'inventore può usare un sistema di espulsione che lo scaglia in una direzione casuale di 2d4 caselle (l'inventore atterra incolume subito dopo l'esplosione, risultandone immune). La CD della prova per razziare la meraviglia distrutta in questo modo aumenta di 6."},{"id":"fanatico_dei_gadget","nome":"Fanatico dei gadget","cat":"Gadget","req":1,"prereq":[],"testo":"Quando seleziona questa dote, l'inventore ottiene tre “ticket fanatico”. In qualsiasi momento, l'inventore può spendere un ticket per ridurre di 2 il livello minimo richiesto per ottenere gli upgrade di un gadget a scelta."},{"id":"gadget_for_dummies","nome":"Gadget for dummies","cat":"Gadget","req":4,"prereq":[],"testo":"L'inventore può passare 10 minuti a istruire un alleato sul funzionamento di uno specifico gadget, adattando nel frattempo tale gadget alle sue conoscenze e capacità. Dopo l'indottrinamento, l'alleato può utilizzare il gadget scelto fino all'alba del giorno seguente, come fosse l'inventore stesso. Si può usare questa dote una volta al giorno più una addizionale al 10° livello."},{"id":"fumo_e_scintille","nome":"Fumo e scintille","cat":"Mentali e difensive","req":1,"prereq":[],"testo":"L'inventore ha passato molto tempo a contatto con fuoco, fumi asfissianti e sostanze nocive. L'inventore ottiene bonus +4 ai Tiri Salvezza contro gli effetti di [abbagliamento], [veleno da inalazione], [infermità] e [nausea]."},{"id":"mente_pratica","nome":"Mente pratica","cat":"Mentali e difensive","req":8,"prereq":[],"testo":"Il costante lavoro con meccanica e razionalità ha affinato la capacità dell'inventore di razionalizzare a mente fredda e superare qualsiasi dubbio. Una volta al giorno, l'inventore può ottenere vantaggio in un Tiro Salvezza contro un effetto di [influenza mentale: charme, compulsione, finzione, trama e morale]."},{"id":"percepire_tecnologia","nome":"Percepire tecnologia","cat":"Mentali e difensive","req":1,"prereq":[],"testo":"L'inventore può rilevare la presenza (ma non la posizione) di costrutti e forgiati in un raggio di 9 m. Inoltre, percepisce automaticamente quando si trova nei pressi di luoghi in cui sono presenti congegni tecnologici, anche nascosti (cavi elettrici nei muri, telecamere, luce elettrica, ecc.)."},{"id":"officina_portatile","nome":"Officina portatile","cat":"Officina e gestione","req":6,"prereq":[],"testo":"L'inventore impara a lavorare in condizioni precarie. Può effettuare costruzioni, riparazioni complete o modifiche di meraviglie senza penalità anche in viaggio, in dungeon o in ambienti ostili (purché non sia attivamente in combattimento). Inoltre, i tempi di costruzione di gadget e mechanus vengono ridotti del 25%."},{"id":"multitasking_meccanico","nome":"Multitasking meccanico","cat":"Officina e gestione","req":10,"prereq":[],"testo":"L'inventore può controllare contemporaneamente più creazioni con maggiore efficienza. Quando ha contemporaneamente attivi un automaton e una torretta automatica (o un gadget costrutto controllabile come Ragno meccanico, Uccello meccanico, Sentinella meccanica), può dirigere uno di loro come azione veloce invece che di movimento/standard."}],"archetipi":[{"id":"ingegnere_da_campo","nome":"Ingegnere da campo","desc":"In combattimento gli inventori spesso non hanno il lusso di quel tempo necessario per intraprendere fantasiose strategie o pensare alla manutenzione di automaton ed esoscheletri. Un ingegnere da campo costruisce i propri marchingegni pensando alla loro resistenza e impara a usare le tecno-armi con efficacia. Sebbene gli ingegneri da campo siano più facilmente visibili sui campi di battaglia in mezzo ai comuni soldati, talvolta si uniscono a un gruppo di avventurieri, dove la loro abilità con le armi è preziosa quanto la loro capacità di mantenere in buono stato il proprio equipaggiamento in qualsiasi occasione.","note":[],"capacita":[{"nome":"Cauterizzare","testo":"Al 1° livello, una volta per turno, come azione standard che provoca attacchi di opportunità, un ingegnere da campo può curarsi un numero di danni pari a 1d6 + 1d6 ogni due livelli oltre il 1°. Un ingegnere da campo può curarsi in questo modo senza provocare attacchi di opportunità, dimezzando però il totale di danni curati. Si può usare questa capacità per un numero di volte al giorno pari a 2 + metà bonus di Intelligenza.","sost":"Riparazioni al 1° livello","liv":1},{"nome":"Batterie migliorate","testo":"Al 1° livello, le tecno-armi di un ingegnere da campo hanno 1 carica giornaliera extra. Inoltre, hanno il 50% di probabilità di ignorare i danneggiamenti dovuti a colpi critici o ai fallimenti critici.","sost":"Gadget al 1° livello","liv":1},{"nome":"Specialista delle tecno-armi","testo":"Al 3° livello, un ingegnere da campo ottiene bonus +1 ai tiri per colpire e ai danni con le tecno-armi. Questo bonus aumenta di +1 ogni quattro livelli oltre il 3° (+2 al 7°, +3 al 11°, +4 al 15°, +5 al 19°).","sost":"Automaton al 3° livello","liv":3},{"nome":"Esoscheletri da battaglia customizzati","testo":"Al 6° livello, quando un ingegnere da campo si trova all'interno di un esoscheletro modello leggero, ottiene Correre e Passo leggero come talenti bonus. Quando si trova all'interno di un esoscheletro modello pesante, ottiene Addestramento nelle armature fortificate come talento bonus.","sost":"Gadget, optional o dote da inventore al 6° livello","liv":6}],"perde":["riparazioni","automaton"],"slot":[1,6]},{"id":"mechautarca","nome":"Mechautarca","desc":"I mechautarchi sono geniali creatori di mechanus e di automaton che usano innovazioni tecnologiche ancora più sorprendenti di quelle che il mondo abbia conosciuto finora.","note":[],"capacita":[{"nome":"Mechanus perfezionati","testo":"Al 1° livello, un mechautarca può creare 1 mechanus aggiuntivo al giorno per ciascun livello di mechanus. Inoltre, i mechanus ottengono bonus +6 m al movimento e sono dotati automaticamente di Cellula energetica Argus (vedi doti da inventore: aumenta di 1 la CD dei Tiri Salvezza provocati).","sost":"Tecno-armi al 1° livello","liv":1},{"nome":"Automaton alpha","testo":"Un mechautarca è in grado di creare automaton superiori a quelli costruiti dagli altri inventori, detti “alpha”. L'automaton alpha presenta migliorie progressive ai seguenti livelli:\nAl 3° livello:\nBraccia telescopiche: l'automaton ottiene +1,5 m di portata. Locomozione potenziata: l'automaton alpha ottiene bonus meccanico +3 m alla velocità su terreno. Chip bellico: l'automaton alpha ottiene bonus meccanico +1 ai tiri per colpire.\nAl 5° livello:\nChip bellico avanzato: l'automaton alpha ottiene bonus meccanico +2 ai tiri per i danni. Generatore di scudi: l'automaton alpha ottiene un numero di Punti Ferita temporanei pari al livello di mechautarca. Questi punti non scompaiono e si ripristinano all'alba di ogni giorno. Alloggiamento trasporto: il mechautarca installa un sedile speciale sulla parte superiore dell'automaton (solitamente la spalla) e può quindi usarlo come cavalcatura. Un automaton alpha può essere cavalcato solo da un mechautarca di taglia inferiore rispetto alla propria. In alternativa, l'alloggiamento può essere utilizzato come vano stoccaggio con capienza di 1,5 m cubi.\nAl 10° livello:\nChip di allerta: l'automaton alpha ottiene bonus di schivare +1 alla CA. Piastre magi-refrattarie: l'automaton alpha ottiene una RI pari a 11 + livello di mechautarca. Sistema di agganciamento: come azione standard l'automaton alpha può focalizzarsi su un bersaglio entro 9 m. Entro la fine del suo prossimo turno, l'automaton alpha ottiene bonus cognitivo pari al livello di mechautarca al primo attacco effettuato contro il bersaglio scelto.\nAl 15° livello:\nSistemi di impedimento: la scocca dell'automaton alpha è costellata di fessure in grado di estroflettere punte telemetriche, getti di vapore incandescente e una vasta gamma di subdole minacce. Come azione veloce l'automaton può far sì che le caselle a lui adiacenti siano considerate terreno difficile fino all'inizio del prossimo turno del mechautarca. Metronomo integrato: quando l'automaton alpha colpisce una creatura, ottiene contro di essa bonus di circostanza cumulabile +1 ai tiri per i danni (massimo +5). Questo bonus si mantiene finché l'automaton alpha non manca la creatura o attacca un diverso bersaglio. Questo danno si moltiplica in caso di colpo critico.\nAl 20° livello:\nScocca “Optimus prime”: se lo desidera, un mechautarca può aumentare la taglia dell'automaton alpha a enorme. Se lo fa, l'automaton alpha ottiene basetta da 9 caselle, portata 4,5 m, +4 Forza, −2 CA, −2 ai tiri per colpire, +3 BMC e +3 DMC, −4 Furtività e un bonus di +20 Punti Ferita. Il danno degli attacchi cambia di conseguenza alla taglia. Questi bonus si sostituiscono a quelli ottenibili con l'Aggiornamento #1 (Aumento di taglia).","sost":"Esoscheletri al 5° livello","liv":3,"mod":"Automaton al 3° livello"}],"perde":["tecno","eso"],"slot":[]},{"id":"tecnomante","nome":"Tecnomante","desc":"Alcuni inventori arrivano a detestare talmente la magia, da sacrificare parti degli studi accademici al fine di ricercare sempre nuovi modi per contrastarla.","note":[],"capacita":[{"nome":"Odio per la magia","testo":"Al 1° livello, un tecnomante sostituisce Sapienza magica a Utilizzare oggetti magici come abilità di classe. Inoltre, non può mai lanciare incantesimi, neanche come capacità magica. Infine, ottiene +1 ai tiri per colpire e +2 ai danni contro gli incantatori, comprese le creature che lanciano incantesimi come capacità magica.","liv":1},{"nome":"Emettitore di campo logico","testo":"Al 1° livello, un tecnomante costruisce un emettitore di campo logico e questo è considerato una meraviglia. Un emettitore non ha statistiche ma, nel caso fortuito in cui dovesse andare perduto, richiederà un numero di ore di lavoro giornaliero pari a 16 per essere ricostruito; nel caso invece in cui dovesse rompersi richiederà un numero di ore di lavoro giornaliero pari a 4. Un emettitore occupa lo slot spalle.\nCome azione di movimento, un tecnomante può azionare l'emettitore per un numero di round al giorno pari a tre volte il bonus di Intelligenza. Questa durata non deve essere necessariamente consecutiva. Quando l'emettitore è attivo, proietta un campo logico e magnetico di 4,5 m di raggio che consente agli alleati nell'area di ripetere i Tiri Salvezza contro gli incantesimi falliti (anche quelli lanciati come capacità magica), gli attacchi a soffio e con lo sguardo.\n• Al 5° livello, il raggio dell'emettitore diventa 7,5 m.\n• Al 10° livello, l'emettitore può essere azionato come azione veloce e il raggio diventa 10,5 m.\n• Al 15° livello, quando un alleato supera un Tiro Salvezza contro uno degli effetti sopraindicati mentre si trova all'interno del campo logico, come azione immediata il tecnomante può spendere 2 round di utilizzo giornaliero dell'emettitore per ritorcere l'incantesimo o l'attacco al mittente (cioè anche l'attaccante ne subisce gli effetti, potendo effettuare gli eventuali Tiri Salvezza).\n• Al 20° livello, l'emettitore può essere azionato per un numero di round al giorno pari a cinque volte il bonus di Intelligenza.","sost":"Tecno-armi al 1° livello","liv":1},{"nome":"Accumulatori Tesla","testo":"Al 6° livello, un tecnomante installa sull'emettitore di campo logico degli speciali accumulatori energetici al fine di liberarne l'energia una volta ogni 4 round, infliggendo 1d6 danni da elettricità ogni due livelli di tecnomante a tutti i bersagli in una linea di 12 m. Le creature colpite possono effettuare un Tiro Salvezza su Riflessi per dimezzare il danno. Nelle giornate tempestose (solo quelle di origine naturale) o se nel round precedente il tecnomante ha subito danni da elettricità a causa di un attacco nemico, il dado di danno degli accumulatori Tesla diventa il d8 e la CD del Tiro Salvezza aumenta di 1.","sost":"Gadget, optional o dote da inventore al 6° livello","liv":6}],"perde":["tecno"],"slot":[6]},{"id":"skitari","nome":"Skitari","desc":"Gli skitarii sono truppe d'élite addestrate nelle varie accademie ed università degli inventori. Essi fungono da guardie del corpo per i ricercatori in missione oppure come scorta scientifica per chi è sufficientemente ricco da potersi permettere i loro servizi.","note":["Abilità di classe: può utilizzare Professione (ingegnere bellico) al posto di Professione (fabbro).","Competenze offensive: Competenza nelle armi semplici. Fucile, revolver."],"capacita":[{"nome":"Arma da fuoco","testo":"Al 1° livello, uno skitari ottiene un fucile o un revolver con 50 proiettili. Quest'arma è malconcia e non può essere venduta.","liv":1},{"nome":"Addestramento con le armi da fuoco","testo":"Al 1° livello, uno skitari ottiene il talento Ricarica rapida (armi da fuoco arcaiche, fucile, revolver). Inoltre, quando usa le palle di carta come munizioni, il valore di inceppamento dell'arma usata per attaccare non aumenta.","liv":1},{"nome":"Riparazioni ridotte","testo":"Al 1° livello, uno skitari può usare riparazioni per un numero di volte al giorno pari a bonus di Intelligenza, anziché 2 + bonus di Intelligenza.","mod":"Riparazioni al 1° livello","liv":1},{"nome":"Armi sperimentali","testo":"Al 1° livello, uno skitari ottiene la dote Competenza nelle armi sperimentali come dote bonus (non deve soddisfarne i requisiti) e i gadget Pistola lanciafiamme “Soffio di drago” e Tuono-pistola “Reoni Silver thunder”.","sost":"Fabbro esperto al 1° livello","liv":1},{"nome":"Maestria di armi sperimentali I","testo":"Al 1° livello, uno skitari conta come di un livello superiore per quanto riguarda l'attivazione delle armi sperimentali. Inoltre, può attivare ciascuna arma sperimentale in suo possesso due volte al giorno, attendendo almeno 1 ora tra un utilizzo e l'altro.","sost":"Mechanus al 1° livello","liv":1},{"nome":"Armi sperimentali progressive","testo":"Al 4° livello, uno skitari ottiene il gadget Elettro-carabina “Shock”. Al 6° livello, ottiene il gadget Drone “Firestorm”. All'8° livello, ottiene il gadget Shotgun “Devastator”. Al 10° livello, ottiene il gadget Lanciabrina “Blizzard”. Al 12° livello, ottiene il gadget Bio-cannone “Acid rain”.","sost":"Gadget, optional o dote da inventore al 4°, al 6°, all'8°, al 10° e al 12° livello","liv":4},{"nome":"Maestria di armi sperimentali II","testo":"Al 4° livello, la CD dei Tiri Salvezza provocati dalle armi sperimentali di uno skitari aumenta di 1. Inoltre, gli attacchi di uno skitari effettuati con l'elettro-carabina ottengono bonus +2 ai tiri per colpire.","liv":4},{"nome":"Maestria di armi sperimentali III","testo":"Al 7° livello, la CD dei Tiri Salvezza provocati dalle armi sperimentali di uno skitari aumenta ancora di 1 (totale +2).","liv":7},{"nome":"Maestria di armi sperimentali IV","testo":"Al 10° livello, uno skitari conta come di due livelli superiore per quanto riguarda l'attivazione delle armi sperimentali. Ciò aumenta di 2 anche il livello massimo dei danni inflitti dalle armi sperimentali.","liv":10},{"nome":"Maestria di armi sperimentali V","testo":"Al 13° livello, tre volte al giorno, per quel turno uno skitari può ottenere vantaggio nei tiri per colpire con l'elettro-carabina oppure può imporre svantaggio ai Tiri Salvezza imposti da una propria arma sperimentale a scelta.","liv":13},{"nome":"Maestria di armi sperimentali VI","testo":"Al 16° livello, uno skitari può attivare ciascuna arma sperimentale in suo possesso tre volte al giorno, attendendo 1 ora tra un utilizzo e l'altro.","liv":16}],"perde":["mechanus","fabbro"],"slot":[4,6,8,10,12]},{"id":"androide","nome":"Androide","desc":"Gli androidi sono inventori forgiati in grado di riparare il proprio corpo in maniera autonoma, grazie a un complesso sistema di nano-bot.","note":["Prerequisito razziale: solo personaggi forgiati possono prendere questo archetipo."],"capacita":[{"nome":"Sistema di autoriparazione","testo":"Al 1° livello, come azione veloce e senza compiere alcuna azione, un androide può spendere 1 uso di riparazioni per curarsi del massimo dei danni tramite suddetta capacità. Di contro, può usare riparazioni per un numero di volte al giorno pari a bonus di Intelligenza, anziché 2 + bonus di Intelligenza.","mod":"Riparazioni al 1° livello","liv":1},{"nome":"Nanobot integrati","testo":"Al 1° livello, il corpo dell'androide è permeato da nanobot riparatori passivi che potenziano la sua resilienza intrinseca. Tre volte al giorno, come azione veloce, l'androide può attivare i nanobot per ottenere Guarigione rapida 1 per 1 minuto. Inoltre, l'androide ottiene bonus +2 ai Tiri Salvezza contro effetti che lo renderebbero barcollante o frastornato (effetti che possono comunque colpirlo anche se non derivano dalle sue immunità razziali — ad esempio impatti contundenti pesanti, effetti sonici, sovraccarichi elettrici).","sost":"Fabbro esperto al 1° livello","liv":1},{"nome":"Modulo di scansione integrato","testo":"Al 5° livello, un androide possiede uno scanner permanentemente integrato in un occhio. Considera di possedere sempre un gadget Scanner attivo (con le funzioni del livello attuale dell'inventore), che non occupa alcuno slot e non può essere disarmato o rubato. Le sue cariche giornaliere sono pari a 3 + bonus di Intelligenza, ripristinate all'alba.","sost":"Gadget al 5° livello","liv":5},{"nome":"Sub-routine di emergenza","testo":"Al 10° livello, una volta al giorno, quando un attacco sta per ridurre l'androide a meno di 0 Punti Ferita, una sub-routine di emergenza si attiva automaticamente come azione immediata. L'androide ottiene 4d8 + livello di inventore Punti Ferita temporanei che durano 1 minuto (questi PF temporanei non subiscono il dimezzamento delle cure ai forgiati). Inoltre, è immune alla condizione morente per quel turno.","sost":"Gadget, optional o dote da inventore al 10° livello","liv":10},{"nome":"Coscienza distribuita","testo":"Al 14° livello, la coscienza di un androide è frammentata in più nuclei di elaborazione distribuiti per il corpo. L'androide ottiene vantaggio nei Tiri Salvezza contro effetti di [influenza mentale: charme e compulsione], anche se ha già altri benefici simili da scelte razziali o di classe. Inoltre, il suo tratto razziale Punti critici rinforzati viene potenziato: l'androide diventa completamente immune ai colpi furtivi, ai danni da precisione e ai danni extra dei colpi critici (i danni base degli attacchi colpiscono normalmente).","sost":"Gadget, optional o dote da inventore al 14° livello","liv":14},{"nome":"Iperevoluzione meccanica","testo":"Al 20° livello, all'apice della propria evoluzione, l'androide ha ottimizzato ogni componente del proprio corpo. Ottiene:\n• Bonus di potenziamento +2 a una caratteristica fisica a scelta (Forza, Destrezza o Costituzione)\n• Velocità su terreno permanente +6 m\n• RD 5/adamantio\n• Riparazioni: usi giornalieri pari a 2 × bonus di Intelligenza (non più solo bonus di Intelligenza)","sost":"Aggiornamento finale delle meraviglie al 20° livello","liv":20}],"soloForgiati":true,"perde":["fabbro"],"slot":[5,10,14]},{"id":"cibernetico","nome":"Cibernetico","desc":"I cibernetici si dedicano interamente allo studio degli esoscheletri, trascurando del tutto la costruzione di automaton e portando la propria simbiosi con la macchina a livelli senza precedenti. Per un cibernetico, l'esoscheletro non è uno strumento: è un'estensione del proprio corpo.","note":[],"capacita":[{"nome":"Doppio modello","testo":"Al 1° livello, un cibernetico può costruire e mantenere attivi simultaneamente un esoscheletro leggero E un esoscheletro pesante (anziché uno solo dei due). Non può però indossare entrambi contemporaneamente: deve scegliere quale usare cambiando equipaggiamento.","sost":"Mechanus al 1° livello","liv":1},{"nome":"Esoscheletri precoci","liv":3,"mod":"Esoscheletri al 5° livello","testo":"Al 3° livello, un cibernetico impara a costruire gli esoscheletri (Funzionalità di base)."},{"nome":"Scoperta sugli esoscheletri","testo":"Al 3° livello e ogni quattro livelli successivi (7°, 11°, 15°, 19°), un cibernetico ottiene una modifica per esoscheletro extra di un livello disponibile, da installare immediatamente, ignorando il limite di nodi della meraviglia (la modifica non occupa nodi).","sost":"Automaton al 3° livello","liv":3},{"nome":"Innesti permanenti","testo":"Al 6° livello, un cibernetico può effettuare innesti meccanici sul proprio corpo. Sceglie 1 modifica da Funzionalità di base dell'esoscheletro leggero o pesante (esclusi i Potenziamenti strutturali): tale modifica è sempre attiva su di lui anche quando non indossa un esoscheletro, senza consumare cariche, ma occupa permanentemente uno slot oggetto a scelta del GM in base al tema della modifica. Può scegliere un'altra modifica come innesto al 12° e al 18° livello.","sost":"Gadget, optional o dote da inventore al 6°, 12° e 18° livello","liv":6}],"perde":["mechanus","automaton"],"slot":[6,12,18]},{"id":"tecno_infiltratore","nome":"Tecno-infiltratore","desc":"Alcuni inventori comprendono che la vera potenza non si trova nelle armi o nei mostri di metallo, ma nella conoscenza e nell'invisibilità. Un tecno-infiltratore è uno specialista dei gadget di esplorazione, sabotaggio e infiltrazione, capace di muoversi nell'ombra grazie alla propria genialità meccanica.","note":[],"capacita":[{"nome":"Specialista dei costrutti minori","testo":"Al 1° livello, un tecno-infiltratore considera sempre di avere selezionato la miglioria al 5° livello sui propri gadget Ragno meccanico, Uccello meccanico e Lombrico d'ottone (anche se non ha ancora raggiunto il 5° livello), e ottiene questi tre gadget come parte iniziale della sua dotazione. Inoltre, le creature meccaniche controllate da remoto possono essere dirette come azione veloce invece che di movimento.","sost":"Tecno-armi al 1° livello","liv":1},{"nome":"Manipolazione esperta","testo":"Al 3° livello, un tecno-infiltratore ottiene tutte le migliorie del Manipolatore gravitonico (4°, 7°, 9° e 11°) al livello in cui lo apprende come gadget, indipendentemente dal proprio livello di inventore (purché ne soddisfi il requisito di livello base, cioè 4°). Inoltre, il manipolatore gravitonico può manipolare oggetti fino a 5 kg invece di 2,5 kg.","sost":"Automaton al 3° livello","liv":3},{"nome":"Sensori avanzati","testo":"Al 5° livello, lo Scanner di un tecno-infiltratore ha cariche pari a 5 + bonus di Intelligenza (anziché 3 + bonus di Intelligenza). Inoltre, le funzioni di Scanner inizialmente disponibili al 5° e 10° livello sono disponibili rispettivamente al 3° e 7° livello.","sost":"Esoscheletri al 5° livello","liv":5},{"nome":"Camuffamento tecnologico","testo":"All'8° livello, una volta al giorno, come azione standard, un tecno-infiltratore può attivare un campo di disturbo ottico personale. Per 1 minuto per livello di inventore, ottiene occultamento totale (probabilità di mancare 50%) finché non effettua un attacco; dopo un attacco l'occultamento scende a 20% per il resto della durata. La modifica si dissolve completamente se l'inventore lancia un incantesimo o attiva una capacità AoE.","sost":"Gadget, optional o dote da inventore all'8° livello","liv":8}],"perde":["tecno","automaton","eso"],"slot":[8]}],"correzioni":["Tabella di classe: aggiunto Gadget al 9° livello","Androide: Sub-routine sostituisce Gadget, optional o dote al 10°","Androide: Coscienza distribuita al 14°, sostituisce Gadget, optional o dote al 14°","Skitari: Armi sperimentali progressive sostituiscono Gadget, optional o dote","Mechautarca: Automaton alpha modifica Automaton al 3°","Mechautarca: capacità rinominata Mechanus perfezionati","Cibernetico: Esoscheletri precoci al 3° (modifica Esoscheletri al 5°)","Privilegio Gadget riscritto (dispari fino all'11°, pari: gadget, optional o dote)","Motosega Demolisher: danno 3d6, critico 18-20/x2"]};
const AR = {"armatura":[{"id":"accumula_incantesimi_1","nome":"Accumula Incantesimi","val":1,"nuova":false,"testo":"Permette a un incantatore di immagazzinare un singolo incantesimo a contatto di 3° livello o inferiore. Quando una creatura colpisce il portatore con un attacco in mischia, l'armatura può lanciare su di lei l'incantesimo come azione immediata."},{"id":"acida_1","nome":"Acida","val":1,"nuova":false,"testo":"Infligge ogni round 2d4 danni da acido agli avversari in lotta col portatore."},{"id":"agile_1","nome":"Agile","val":1,"nuova":false,"testo":"Il portatore ottiene bonus +1 ai Tiri Salvezza su Riflessi."},{"id":"amara_1","nome":"Amara","val":1,"nuova":false,"testo":"Le creature che tentano manovre di lottare tramite morso, o attaccano con morso il portatore, devono superare un TS su Tempra (CD 5 + ½ DV portatore + bonus totale armatura) o fallire automaticamente. Se il portatore viene inghiottito, la creatura deve superare il TS ogni turno o essere nauseata 1 round. Effetto [veleno]."},{"id":"ammortizzante_1","nome":"Ammortizzante","val":1,"nuova":false,"testo":"Il portatore ignora i primi 15 m di caduta."},{"id":"anti_contatto_1","nome":"Anti-contatto","val":1,"nuova":false,"testo":"L'armatura fornisce il proprio bonus di potenziamento anche contro gli attacchi di contatto, inclusi quelli di creature incorporee."},{"id":"antiemorragica_1","nome":"Antiemorragica","val":1,"nuova":false,"testo":"Il portatore è immune agli effetti di [sanguinamento] e ha il 50% di sanare immediatamente le emorragie da ferite gravi."},{"id":"anti_penetrazione_1","nome":"Anti-penetrazione","val":1,"nuova":false,"testo":"Il portatore ottiene RD 5/contundente o tagliente."},{"id":"assicurante_1","nome":"Assicurante","val":1,"nuova":false,"testo":"Il portatore ottiene RD 8/– mentre è privo di sensi, nauseato, stordito o immobilizzato. Questa RD si cumula con qualsiasi altra. Non funziona se il portatore può agire normalmente in quelle condizioni."},{"id":"bilanciata_1","nome":"Bilanciata","val":1,"nuova":false,"testo":"Il portatore ottiene +4 alla DMC contro manovre di Oltrepassare e +4 ad Acrobazia (equilibrio). Solo armature leggere e medie."},{"id":"campione_1","nome":"Campione","val":1,"nuova":false,"testo":"Il portatore ottiene bonus sacro +2 alla CA contro gli attacchi dell'avversario scelto tramite Sfida o Punire il Male (o equivalenti)."},{"id":"del_comando_1","nome":"Del Comando","val":1,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +2 a Diplomazia e ogni alleato entro 9 m ottiene +1 morale ai TS su Volontà."},{"id":"dentellata_1","nome":"Dentellata","val":1,"nuova":false,"testo":"Ogni volta che una creatura supera una manovra di Lottare contro il portatore, subisce 2d4 × bonus di potenziamento dell'armatura. Conta come chiodature per attacchi nel turno del portatore."},{"id":"difesa_energetica_1","nome":"Difesa Energetica","val":1,"nuova":false,"testo":"Una volta al giorno, come azione veloce il portatore sceglie un elemento: per 1 minuto chi lo tocca o colpisce senz'armi subisce 1d6+10 danni dell'elemento scelto."},{"id":"divora_magia_1","nome":"Divora Magia","val":1,"nuova":false,"testo":"Ogni volta che il portatore supera un TS contro un incantesimo o capacità magica, si cura di 5 × livello dell'incantesimo."},{"id":"flagello_ectoplasmico_1","nome":"Flagello Ectoplasmico","val":1,"nuova":false,"testo":"Ogni volta che il portatore viene colpito in mischia da una creatura incorporea, questa subisce 2d4 × bonus di potenziamento danni."},{"id":"fortificazione_leggera_1","nome":"Fortificazione Leggera","val":1,"nuova":false,"testo":"Il portatore ha il 25% di ignorare i danni extra da colpi critici e attacchi di precisione."},{"id":"galleggiante_1","nome":"Galleggiante","val":1,"nuova":false,"testo":"L'armatura non applica la penalità alle prove di Nuotare. Il portatore ottiene bonus di competenza +2 a Nuotare."},{"id":"illuminante_1","nome":"Illuminante","val":1,"nuova":false,"testo":"Come azione veloce, il portatore può fare brillare l'armatura come Luce diurna. Fino a 30 min/giorno, in incrementi di 10 min."},{"id":"immortalita_1","nome":"Immortalità","val":1,"nuova":false,"testo":"Il portatore ottiene RE (energia positiva o negativa) 10 e ha il 25% di ignorare i livelli negativi trasmessi tramite tocco."},{"id":"irrintracciabile_1","nome":"Irrintracciabile","val":1,"nuova":false,"testo":"Il portatore può non lasciare tracce mentre si muove, se lo desidera."},{"id":"mascheramento_1","nome":"Mascheramento","val":1,"nuova":false,"testo":"Come azione standard, l'armatura muta forma apparendo come normali abiti, conservando tutte le proprietà. Solo Visione del Vero ne rivela la natura."},{"id":"mobile_1","nome":"Mobile","val":1,"nuova":false,"testo":"Il portatore ottiene Mobilità come talento bonus."},{"id":"passo_veloce_1","nome":"Passo Veloce","val":1,"nuova":false,"testo":"Il portatore ottiene bonus di potenziamento +3 m alla velocità su terreno."},{"id":"psicoschermante_1","nome":"Psicoschermante","val":1,"nuova":false,"testo":"Una volta al giorno, il portatore ottiene bonus +5 a un TS contro un effetto di [influenza mentale]."},{"id":"resistenza_al_veleno_1","nome":"Resistenza al Veleno","val":1,"nuova":false,"testo":"Il portatore ottiene bonus di resistenza +3 ai TS contro effetti di [veleno]."},{"id":"richiamabile_1","nome":"Richiamabile","val":1,"nuova":false,"testo":"Come azione standard, se l'armatura è entro 15 m il portatore la richiama volando e la indossa istantaneamente."},{"id":"rincuorante_1","nome":"Rincuorante","val":1,"nuova":false,"testo":"Il portatore è immune agli effetti di [paura]; gli alleati entro 9 m ottengono bonus morale +4 ai TS contro tali effetti."},{"id":"schivadraghi_1","nome":"Schivadraghi","val":1,"nuova":false,"testo":"Il portatore ottiene Eludere contro gli attacchi a soffio. Solo armature leggere."},{"id":"sfocata_1","nome":"Sfocata","val":1,"nuova":false,"testo":"Tre volte al giorno, come azione standard il portatore ottiene Occultamento 20% per 5 round."},{"id":"specchio_1","nome":"Specchio","val":1,"nuova":false,"testo":"Può essere usata come specchio. Aiuta contro attacchi con lo sguardo: il portatore tira due volte la probabilità di incrociare lo sguardo del nemico. Fornisce bonus di potenziamento anche contro raggi. Solo armature metalliche."},{"id":"sprezzante_1","nome":"Sprezzante","val":1,"nuova":false,"testo":"Tira 1d12 per il tipo nemico. Contro di essi il bonus di potenziamento alla CA è migliore di +2 e l'armatura conferisce RD 2/– contro i loro attacchi."},{"id":"stamina_1","nome":"Stamina","val":1,"nuova":false,"testo":"Il portatore ottiene bonus +1 ai TS su Tempra."},{"id":"torneo_1","nome":"Torneo","val":1,"nuova":false,"testo":"Il portatore ottiene bonus +5 a Cavalcare."},{"id":"alacre_1","nome":"Alacre","val":1,"nuova":true,"testo":"Una volta al giorno, come azione veloce il portatore può agire come se beneficiasse di Iniziativa migliorata per 1 round, ottenendo +4 a Iniziativa retroattivamente al primo turno di combattimento."},{"id":"antipietrificante_1","nome":"Antipietrificante","val":1,"nuova":true,"testo":"Il portatore ottiene bonus di resistenza +4 ai TS contro effetti di [pietrificazione] e [paralisi]. Se pietrificato, ha il 25% di negare l'effetto ogni round."},{"id":"camaleontica_1","nome":"Camaleontica","val":1,"nuova":true,"testo":"Il colore e la texture dell'armatura si adattano automaticamente all'ambiente circostante: il portatore ottiene bonus di competenza +3 a Furtività (nascondersi) in ambienti naturali."},{"id":"coriacea_1","nome":"Coriacea","val":1,"nuova":true,"testo":"Ogni volta che il portatore subisce danni da un attacco fisico, riduce automaticamente di 1 il danno subito (minimo 0), indipendentemente da altre forme di RD."},{"id":"destabilizzante_1","nome":"Destabilizzante","val":1,"nuova":true,"testo":"Ogni volta che una creatura tenta una manovra di combattimento contro il portatore e fallisce, subisce penalità –1 a tutti i tiri per colpire per 1 round."},{"id":"doppiofondo_1","nome":"Doppiofondo","val":1,"nuova":true,"testo":"L'armatura dispone di un vano segreto in cui è possibile nascondere un oggetto di dimensioni massime pari a un'arma leggera. La CD per trovarlo con Percezione è 20 + bonus di potenziamento."},{"id":"equilibratrice_1","nome":"Equilibratrice","val":1,"nuova":true,"testo":"Il portatore non può essere sbilanciato da effetti di terreno magico o non-magico e ottiene bonus di competenza +2 ad Acrobazia in qualsiasi situazione."},{"id":"fono_schermante_1","nome":"Fono-schermante","val":1,"nuova":true,"testo":"Il portatore ottiene bonus di resistenza +3 ai TS contro effetti sonori o di [assordamento] e riduce di 1 round la durata di qualsiasi effetto di [assordamento] subito."},{"id":"incanalante_1","nome":"Incanalante","val":1,"nuova":true,"testo":"Se il portatore è un incantatore, può usare l'armatura come focus per incantesimi di tocco: l'incantesimo resta «in carica» nell'armatura per 1 round extra prima di dissolversi."},{"id":"confortevole_1","nome":"Confortevole","val":1,"nuova":true,"testo":"Riduce di 1 la penalità di armatura alle prove (minimo 0) e aumenta di 1 il limite massimo di destrezza consentito."},{"id":"agile_migliorata_2","nome":"Agile, Migliorata","val":2,"nuova":false,"testo":"Il portatore ottiene bonus +3 ai TS su Riflessi."},{"id":"anti_contusione_2","nome":"Anti-contusione","val":2,"nuova":false,"testo":"Il portatore ottiene RD 5/tagliente o perforante."},{"id":"anti_taglio_2","nome":"Anti-taglio","val":2,"nuova":false,"testo":"Il portatore ottiene RD 5/contundente o perforante."},{"id":"brillante_2","nome":"Brillante","val":2,"nuova":false,"testo":"Come azione standard, l'armatura irradia luce come una torcia. Una volta al giorno, può brillare come Luce diurna per 1 ora."},{"id":"curativa_2","nome":"Curativa","val":2,"nuova":false,"testo":"Una volta al giorno, quando i PF del portatore scendono da 0 a –1, l'armatura lo cura automaticamente di 2d8+5 danni."},{"id":"immunita_energetica_2","nome":"Immunità Energetica","val":2,"nuova":false,"testo":"Come azione standard, il portatore ottiene per 1 minuto immunità a un tipo di energia a scelta."},{"id":"intermittente_2","nome":"Intermittente","val":2,"nuova":false,"testo":"Una volta al giorno, il portatore lancia Intermittenza come capacità magica (durata 1 minuto)."},{"id":"ombra_2","nome":"Ombra","val":2,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +5 a Furtività (nascondersi)."},{"id":"radicante_2","nome":"Radicante","val":2,"nuova":false,"testo":"Il portatore ottiene +10 alla DMC contro manovre di Oltrepassare, Sbilanciare e Spingere."},{"id":"rapida_2","nome":"Rapida","val":2,"nuova":false,"testo":"Il portatore ottiene Mobilità come talento. Una volta al giorno, come azione veloce può muoversi alla propria velocità come azione di movimento."},{"id":"resistenza_agli_incantesimi_13_2","nome":"Resistenza agli Incantesimi 13","val":2,"nuova":false,"testo":"Il portatore ottiene RI 13."},{"id":"riposante_2","nome":"Riposante","val":2,"nuova":false,"testo":"Il portatore non è affaticato dopo aver dormito in armatura. Un incantatore necessita di sole 2 ore di riposo per preparare incantesimi."},{"id":"ritorsione_2","nome":"Ritorsione","val":2,"nuova":false,"testo":"Quando il portatore subisce 10+ danni da un attacco in mischia, infligge 1d6 danni all'attaccante (magici). Se l'attacco riduce i PF a meno di 0, infligge 4d6 danni."},{"id":"schiva_incantesimi_2","nome":"Schiva Incantesimi","val":2,"nuova":false,"testo":"Il portatore ottiene bonus di schivare +4 alla CA contro attacchi di incantesimi e capacità magiche."},{"id":"scivolosa_2","nome":"Scivolosa","val":2,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +5 ad Artista della Fuga."},{"id":"selvatica_2","nome":"Selvatica","val":2,"nuova":false,"testo":"Un druido conserva il bonus di armatura (incluso quello di potenziamento) anche in forma selvatica."},{"id":"stamina_migliorata_2","nome":"Stamina, Migliorata","val":2,"nuova":false,"testo":"Il portatore ottiene bonus +3 ai TS su Tempra. Richiede Stamina."},{"id":"stridente_2","nome":"Stridente","val":2,"nuova":false,"testo":"Tre volte al giorno, come azione immediata quando colpito in mischia, il portatore induce vibrazioni stridenti attraverso l'arma attaccante: l'attaccante supera un TS su Tempra (CD 5 + ½ DV + bonus totale armatura) o è frastornato per 1 round."},{"id":"titanica_2","nome":"Titanica","val":2,"nuova":false,"testo":"Il portatore è considerato di una categoria di taglia superiore per attacchi speciali che dipendono dalla taglia. Una volta al giorno, può aumentare la propria taglia per 1 minuto come Ingrandire persone. Può aggiungere il bonus di potenziamento a una prova di Forza, MC o DMC per round come azione gratuita. La penalità di armatura aumenta di un valore pari al bonus di potenziamento."},{"id":"accumulatrice_2","nome":"Accumulatrice","val":2,"nuova":true,"testo":"L'armatura assorbe parte dei danni magici subiti: ogni volta che il portatore supera un TS contro un incantesimo, accumula 1 «carica». Può spendere fino a 3 cariche per ottenere bonus +1 per carica a un TS successivo (massimo 3 cariche accumulate)."},{"id":"cinetica_2","nome":"Cinetica","val":2,"nuova":true,"testo":"Tre volte al giorno, quando il portatore viene colpito in mischia e supera un TS su Riflessi (CD 15), può deflettere parte del danno: riduce i danni fisici subiti di 1d6 × bonus di potenziamento."},{"id":"corazza_proiettante_2","nome":"Corazza Proiettante","val":2,"nuova":true,"testo":"Una volta al giorno, come azione standard il portatore può proiettare un'immagine illusoria di sé a 3 m di distanza per 3 round, causando il 20% di probabilità di mancare negli attacchi."},{"id":"disperdente_2","nome":"Disperdente","val":2,"nuova":true,"testo":"Ogni volta che il portatore supera un TS contro un effetto di area, riduce i danni subiti di un ulteriore 25% (cumulativo con Eludere e simili)."},{"id":"energetica_2","nome":"Energetica","val":2,"nuova":true,"testo":"Il portatore ottiene bonus +2 ai TS contro tutti i tipi di energia (acido, elettricità, fuoco, freddo, sonico). Questo bonus diventa +4 contro il tipo di energia a cui è più vulnerabile."},{"id":"gravitante_2","nome":"Gravitante","val":2,"nuova":true,"testo":"Il portatore ottiene RD 3/– contro attacchi a distanza fisici (frecce, pallottole, dardi). Non si applica contro armi da lancio esplosive o attacchi magici."},{"id":"infusa_2","nome":"Infusa","val":2,"nuova":true,"testo":"L'armatura contiene riserve di energia magica: una volta al giorno, quando un incantamento del portatore fallirebbe per qualsiasi ragione, l'armatura fornisce l'energia mancante e consente all'incantesimo di funzionare normalmente."},{"id":"nemesi_2","nome":"Nemesi","val":2,"nuova":true,"testo":"Il portatore può designare un tipo di creatura al momento della sintonia. Contro quel tipo, l'armatura fornisce bonus +2 ai TS e RD 2/– aggiuntiva."},{"id":"vendicativa_2","nome":"Vendicativa","val":2,"nuova":true,"testo":"Ogni round in cui il portatore viene colpito da almeno un attacco in mischia, accumula 1 «segno di vendetta» (massimo 5). Come azione veloce può spendere tutti i segni per ottenere bonus +1 per segno al tiro per colpire del prossimo attacco."},{"id":"acceca_nemesi_3","nome":"Acceca Nemesi","val":3,"nuova":false,"testo":"Tira 1d12 per il tipo nemico. Tre volte al giorno, per 1 minuto il portatore può rendersi invisibile a creature del tipo designato, eludendo anche Fiuto, Percezione tellurica e Vista cieca."},{"id":"adesiva_3","nome":"Adesiva","val":3,"nuova":false,"testo":"Il portatore ottiene velocità di scalare 6 m e bonus +2 alle manovre di Lottare, Riposizionare e Sbilanciare con armi naturali o senz'armi. Fino a 10 round/giorno non consecutivi. Incompatibile con Scivolosa."},{"id":"agile_superiore_3","nome":"Agile, Superiore","val":3,"nuova":false,"testo":"Il portatore ottiene +5 ai TS su Riflessi. Richiede Agile o Agile Migliorata."},{"id":"del_magus_3","nome":"Del Magus","val":3,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +4 alle prove di Concentrazione."},{"id":"dell_equilibrio_3","nome":"Dell'Equilibrio","val":3,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +10 ad Acrobazia (equilibrio)."},{"id":"distorcente_3","nome":"Distorcente","val":3,"nuova":false,"testo":"Una volta al giorno, come azione standard il portatore ottiene Occultamento 50% per 5 round."},{"id":"fortificazione_moderata_3","nome":"Fortificazione Moderata","val":3,"nuova":false,"testo":"Il portatore ha il 50% di ignorare i danni extra da colpi critici e attacchi di precisione."},{"id":"invulnerabilita_3","nome":"Invulnerabilità","val":3,"nuova":false,"testo":"Il portatore ottiene RD 5/magia."},{"id":"ombra_migliorata_3","nome":"Ombra Migliorata","val":3,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +10 a Furtività (nascondersi). Richiede Ombra."},{"id":"percettiva_3","nome":"Percettiva","val":3,"nuova":false,"testo":"Il portatore ottiene Vista cieca 1,5 m e Percezione cieca 18 m ogni volta che è accecato o non può vedere per oscurità totale."},{"id":"putrida_3","nome":"Putrida","val":3,"nuova":false,"testo":"Ogni creatura entro 3 m deve superare un TS su Tempra (CD 2 + ½ DV + bonus totale armatura) o essere inferma per 5 round [veleno]. Chi supera è immune per 24 ore. Il fetore può essere soppresso."},{"id":"resistenza_agli_incantesimi_15_3","nome":"Resistenza agli Incantesimi 15","val":3,"nuova":false,"testo":"Il portatore ottiene RI 15."},{"id":"ruggente_3","nome":"Ruggente","val":3,"nuova":false,"testo":"Ogni volta che il portatore subisce 10 o meno danni da un'arma a distanza, non subisce alcun danno: l'armatura rispedisce il colpo infliggendo quei danni al mittente. La testa di drago in rilievo fornisce +4 all'Iniziativa."},{"id":"scavatrice_3","nome":"Scavatrice","val":3,"nuova":false,"testo":"Il portatore ottiene velocità di Scavare 3 m attraverso qualsiasi suolo eccetto roccia solida. Richiede di trattenere il respiro."},{"id":"scivolosa_migliorata_3","nome":"Scivolosa Migliorata","val":3,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +10 ad Artista della Fuga. Richiede Scivolosa."},{"id":"spaventosa_3","nome":"Spaventosa","val":3,"nuova":false,"testo":"Tre volte al giorno, come azione veloce, il portatore rende spaventati i nemici entro 6 m (TS Volontà CD 2 + ½ DV + bonus totale armatura, altrimenti scossi 1 round)."},{"id":"stamina_superiore_3","nome":"Stamina, Superiore","val":3,"nuova":false,"testo":"Il portatore ottiene +5 ai TS su Tempra. Richiede Stamina o Stamina Migliorata."},{"id":"svanente_3","nome":"Svanente","val":3,"nuova":false,"testo":"Una volta al giorno, il portatore lancia Svanire come capacità magica."},{"id":"tocco_fantasma_3","nome":"Tocco Fantasma","val":3,"nuova":false,"testo":"L'armatura fornisce il proprio bonus di potenziamento e di armatura contro gli attacchi delle creature incorporee."},{"id":"ammantata_3","nome":"Ammantata","val":3,"nuova":true,"testo":"Il portatore ottiene un'aura protettiva entro 1,5 m: qualsiasi creatura alleata adiacente beneficia di copertura dal portatore contro gli attacchi a distanza (bonus +2 CA)."},{"id":"barriera_arcana_3","nome":"Barriera Arcana","val":3,"nuova":true,"testo":"Una volta al giorno, quando il portatore sarebbe colpito da un incantesimo, può attivare l'armatura come azione immediata: l'armatura assorbe fino a 30 danni da incantesimo prima di cessare l'effetto."},{"id":"cristallizzante_3","nome":"Cristallizzante","val":3,"nuova":true,"testo":"Ogni volta che una creatura colpisce il portatore con un critico, l'armatura proietta un'esplosione di cristalli di forza: la creatura subisce 2d6 danni di forza e deve superare un TS su Riflessi (CD = 10 + ½ DV portatore + bonus potenziamento) o essere rallentata 1 round."},{"id":"del_custode_3","nome":"Del Custode","val":3,"nuova":true,"testo":"Il portatore può designare fino a 2 creature adiacenti come 'protetti'. Qualsiasi attacco contro i protetti soffre –2 al tiro per colpire fintanto che il portatore è adiacente e non è privo di sensi."},{"id":"eco_difensivo_3","nome":"Eco Difensivo","val":3,"nuova":true,"testo":"L'armatura «ricorda» gli attacchi ricevuti: dopo aver subito lo stesso tipo di danno fisico per 3 round consecutivi, ottiene RD 2/– contro quel tipo per le successive 2 ore."},{"id":"fusione_elementale_3","nome":"Fusione Elementale","val":3,"nuova":true,"testo":"Al momento della sintonia il portatore sceglie un elemento (fuoco, freddo, elettricità, acido): ottiene RE 5 per quell'elemento e i propri attacchi senz'armi infliggono 1d4 danni extra di quell'elemento."},{"id":"tempra_d_acciaio_3","nome":"Tempra d'Acciaio","val":3,"nuova":true,"testo":"Il portatore ottiene bonus +2 ai TS su Tempra e non può essere portato a meno di –5 PF da un singolo attacco (il danno eccedente va perduto)."},{"id":"curativa_superiore_4","nome":"Curativa, Superiore","val":4,"nuova":false,"testo":"Due volte al giorno, quando i PF del portatore scendono da 0 a –1, l'armatura lo cura automaticamente di 3d8+15 danni. Richiede Curativa."},{"id":"denegante_4","nome":"Denegante","val":4,"nuova":false,"testo":"Una volta al giorno, il portatore può negare i danni extra di un colpo critico o di un attacco di precisione. Solo armature pesanti."},{"id":"martirio_4","nome":"Martirio","val":4,"nuova":false,"testo":"Una volta al giorno, come azione immediata, quando il portatore subisce danni da un critico, cura 1d8+9 PF a tutti gli alleati entro 18 m."},{"id":"ombra_superiore_4","nome":"Ombra Superiore","val":4,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +15 a Furtività (nascondersi). Richiede Ombra Migliorata."},{"id":"radiosa_4","nome":"Radiosa","val":4,"nuova":false,"testo":"Il portatore ottiene RE 10 contro tutti i tipi di energia."},{"id":"resistenza_agli_incantesimi_17_4","nome":"Resistenza agli Incantesimi 17","val":4,"nuova":false,"testo":"Il portatore ottiene RI 17."},{"id":"scivolosa_superiore_4","nome":"Scivolosa Superiore","val":4,"nuova":false,"testo":"Il portatore ottiene bonus di competenza +15 ad Artista della Fuga. Richiede Scivolosa Migliorata."},{"id":"terrificante_4","nome":"Terrificante","val":4,"nuova":false,"testo":"Come azione standard, il portatore rende in preda al panico i nemici entro 9 m (TS Volontà CD 10 + ½ DV + bonus totale armatura, altrimenti scossi 1 round). Chi supera è immune per 24 ore."},{"id":"annichilatrice_4","nome":"Annichilatrice","val":4,"nuova":true,"testo":"Tre volte al giorno, come azione immediata quando colpito da un attacco che infliggerebbe danni letali, il portatore può ridurre quei danni a 0. L'armatura deve «ricaricarsi» per 1 ora prima di poter usare di nuovo questa capacità."},{"id":"corazza_dell_aurora_4","nome":"Corazza dell'Aurora","val":4,"nuova":true,"testo":"Il portatore è circondato da un'aura luminosa (6 m): i non morti nell'aura subiscono penalità –2 ai tiri per colpire e ai TS. Una volta al giorno, l'aura esplode infliggendo 5d6 danni sacri ai non morti nell'area."},{"id":"eterea_4","nome":"Eterea","val":4,"nuova":true,"testo":"Una volta al giorno, come azione standard il portatore può diventare incorporeo per 3 round, come il potere Incorporea (+5) ma di durata inferiore. In questa forma può ancora attaccare con armi con Tocco Fantasma."},{"id":"fortezza_vivente_4","nome":"Fortezza Vivente","val":4,"nuova":true,"testo":"Il portatore tratta qualsiasi posizione difensiva come terreno vantaggio: ottiene +2 CA e +1 TS quando non si è mosso nel turno precedente (bonus di circostanza)."},{"id":"muro_di_scaglie_4","nome":"Muro di Scaglie","val":4,"nuova":true,"testo":"Come azione standard, una volta al giorno il portatore può creare un muro di scaglie metalliche: un muro lungo 6 m e alto 3 m con 60 PF e durezza 10. Il muro persiste per 5 round o finché non viene distrutto."},{"id":"scudo_della_volonta_4","nome":"Scudo della Volontà","val":4,"nuova":true,"testo":"Il portatore ottiene RI 17 contro effetti di [influenza mentale] e [compulsione] specificamente, indipendentemente da altri valori di RI. Questa RI si applica anche agli effetti che bypassano normalmente la RI."},{"id":"sigillo_del_sangue_4","nome":"Sigillo del Sangue","val":4,"nuova":true,"testo":"Quando il portatore viene ridotto a meno della metà dei PF massimi per la prima volta in un combattimento, l'armatura attiva un'aura di forza per 3 round: il portatore ottiene RD 10/– e RE 10 per tutti i tipi."},{"id":"velo_dell_acciaio_4","nome":"Velo dell'Acciaio","val":4,"nuova":true,"testo":"Il portatore è difficile da localizzare magicamente: tutti gli incantesimi di localizzazione e divinazione che lo riguardano falliscono automaticamente se il loro livello è inferiore al bonus di potenziamento dell'armatura."},{"id":"determinazione_5","nome":"Determinazione","val":5,"nuova":false,"testo":"Una volta a settimana, quando i PF del portatore scendono da 0 a –1, l'armatura lo cura automaticamente di tutti i danni; l'eventuale eccedenza viene applicata normalmente."},{"id":"fortificazione_pesante_5","nome":"Fortificazione Pesante","val":5,"nuova":false,"testo":"Il portatore ha il 75% di ignorare i danni extra da colpi critici e attacchi di precisione."},{"id":"giusta_5","nome":"Giusta","val":5,"nuova":false,"testo":"Come azione standard, una volta al giorno il portatore lancia Giusto Potere (10 round). L'armatura conta come allineata Bene e infligge un Livello Negativo permanente a qualsiasi creatura malvagia che la indossi (scompare solo rimuovendo l'armatura)."},{"id":"incorporea_5","nome":"Incorporea","val":5,"nuova":false,"testo":"Una volta al giorno, come azione standard il portatore diventa incorporeo per 5 round."},{"id":"iniqua_5","nome":"Iniqua","val":5,"nuova":false,"testo":"Come Giusta ma allineata Male: infligge Livello Negativo alle creature buone."},{"id":"intrasmutabile_5","nome":"Intrasmutabile","val":5,"nuova":false,"testo":"Una volta al giorno, il portatore può negare qualsiasi effetto di [metamorfosi] o [pietrificazione] subito."},{"id":"liberta_di_movimento_5","nome":"Libertà di Movimento","val":5,"nuova":false,"testo":"Il portatore beneficia costantemente degli effetti di Libertà di Movimento."},{"id":"resistenza_agli_incantesimi_19_5","nome":"Resistenza agli Incantesimi 19","val":5,"nuova":false,"testo":"Il portatore ottiene RI 19."},{"id":"sovversiva_5","nome":"Sovversiva","val":5,"nuova":false,"testo":"Come Giusta ma allineata Caos: invece di RD/Male il portatore ottiene RD 5/Legale e infligge Livello Negativo alle creature legali."},{"id":"vigilante_5","nome":"Vigilante","val":5,"nuova":false,"testo":"Come Giusta ma allineata Legge: invece di RD/Male il portatore ottiene RD 5/Caos e infligge Livello Negativo alle creature caotiche."},{"id":"ascensione_divina_5","nome":"Ascensione Divina","val":5,"nuova":true,"testo":"Una volta a settimana, come azione standard il portatore può assumere temporaneamente tratti del piano di allineamento dell'armatura per 1 minuto: ottiene +2 ai tiri per colpire e al danno, RD 10/magia e RE 15 a tutti i tipi di energia."},{"id":"cuore_dell_acciaio_5","nome":"Cuore dell'Acciaio","val":5,"nuova":true,"testo":"Il portatore ottiene immunità agli effetti di morte istantanea e ai Livelli Negativi. Inoltre, qualsiasi fonte di Guarigione rapida o Rigenerazione che lo colpisca funziona al doppio della sua efficacia normale."},{"id":"resurrezione_5","nome":"Resurrezione","val":5,"nuova":true,"testo":"Una volta sola: se il portatore viene ucciso, l'armatura si attiva automaticamente riportandolo in vita dopo 1d4 round con 1 PF. Dopo questo effetto l'armatura si distrugge."},{"id":"sigillo_divino_5","nome":"Sigillo Divino","val":5,"nuova":true,"testo":"L'armatura è inscindibile dall'anima del portatore: non può essere rubata, dissolvendosi magicamente e riapparendo al portatore entro 24 ore. Qualsiasi tentativo di distruggerla richiede prima di neutralizzare magicamente il legame (RI 19 dell'armatura stessa). Tabelle complete con nuove aggiunte (★) Le seguenti tabelle elencano tutte le capacità speciali disponibili per gli scudi. Le regole sul limite di valore totale si applicano identicamente come per le armature. Le capacità contrassegnate con ★ sono nuove."}],"scudo":[{"id":"accecante_1","nome":"Accecante","val":1,"nuova":false,"testo":"Due volte al giorno, come azione standard: tutte le creature entro 6 m (escluso il portatore) superano un TS su Riflessi (CD 5 + ½ DV + bonus totale) o sono accecate per 1d4 round."},{"id":"acido_1","nome":"Acido","val":1,"nuova":false,"testo":"Infligge ogni round 2d4 danni da acido agli avversari in lotta col portatore."},{"id":"anti_contatto_1","nome":"Anti-contatto","val":1,"nuova":false,"testo":"Lo scudo fornisce il proprio bonus di potenziamento anche contro attacchi di contatto, incluse creature incorporee."},{"id":"anti_penetrazione_1","nome":"Anti-penetrazione","val":1,"nuova":false,"testo":"Il portatore ottiene RD 5/contundente o tagliente."},{"id":"ariete_1","nome":"Ariete","val":1,"nuova":false,"testo":"Quando il portatore attacca con lo scudo durante una carica, aggiunge il bonus di potenziamento ai tiri per colpire e ai danni; se colpisce, come azione veloce può tentare una manovra di Spingere (+2 carica + bonus potenziamento). Solo scudi che effettuano attacchi."},{"id":"attirare_frecce_1","nome":"Attirare Frecce","val":1,"nuova":false,"testo":"Il portatore ottiene bonus di deviazione +1 contro attacchi a distanza. Gli attacchi a distanza entro 1,5 m dal portatore sono deviati verso di lui (se non ha copertura totale). Attivabile o disattivabile come azione standard."},{"id":"da_lancio_1","nome":"Da Lancio","val":1,"nuova":false,"testo":"Il portatore può lanciare lo scudo entro 9 m (danni 1d6 leggero / 1d8 pesante + Forza + bonus potenziamento). Lo scudo torna dopo ogni attacco. Finché è lanciato, non fornisce CA."},{"id":"dentellato_1","nome":"Dentellato","val":1,"nuova":false,"testo":"Ogni volta che una creatura supera una manovra di Lottare, subisce 2d4 × bonus di potenziamento dello scudo."},{"id":"difesa_energetica_1","nome":"Difesa Energetica","val":1,"nuova":false,"testo":"Una volta al giorno, come azione veloce: per 1 minuto chi tocca o colpisce il portatore senz'armi subisce 1d6+10 danni dell'elemento scelto."},{"id":"fortificazione_leggera_1","nome":"Fortificazione Leggera","val":1,"nuova":false,"testo":"Il portatore ha il 25% di ignorare i danni extra da critici e attacchi di precisione."},{"id":"guardia_1","nome":"Guardia","val":1,"nuova":false,"testo":"Come azione gratuita a inizio turno, il portatore trasferisce parte o tutto il bonus di potenziamento alla CA di una creatura adiacente fino al turno successivo o finché non si allontanano."},{"id":"illuminante_1","nome":"Illuminante","val":1,"nuova":false,"testo":"Come azione veloce, lo scudo brilla come Luce diurna. Fino a 30 min/giorno in incrementi di 10 min."},{"id":"psicoschermante_1","nome":"Psicoschermante","val":1,"nuova":false,"testo":"Una volta al giorno, bonus +5 a un TS contro un effetto di [influenza mentale]."},{"id":"radicante_1","nome":"Radicante","val":1,"nuova":false,"testo":"Il portatore ottiene +5 contro manovre di Oltrepassare, Sbilanciare e Spingere."},{"id":"resistenza_al_veleno_1","nome":"Resistenza al Veleno","val":1,"nuova":false,"testo":"Il portatore ottiene bonus di resistenza +3 ai TS contro [veleno]."},{"id":"richiamabile_1","nome":"Richiamabile","val":1,"nuova":false,"testo":"Come azione standard, se entro 15 m il portatore richiama lo scudo e lo impugna istantaneamente."},{"id":"rincuorante_1","nome":"Rincuorante","val":1,"nuova":false,"testo":"Il portatore è immune a [paura]; gli alleati entro 9 m ottengono bonus morale +4 ai TS."},{"id":"rinvigorente_1","nome":"Rinvigorente","val":1,"nuova":false,"testo":"Due volte al giorno, come azione standard il portatore ottiene 1d8+1 PF temporanei (svaniscono dopo 1 ora)."},{"id":"sfondamento_1","nome":"Sfondamento","val":1,"nuova":false,"testo":"Lo scudo infligge danni come un'arma di due categorie di taglia superiore ed è considerato arma +1 negli attacchi. Incompatibile con scudi piccoli e torre."},{"id":"specchio_1","nome":"Specchio","val":1,"nuova":false,"testo":"Può essere usato come specchio. Contro attacchi con lo sguardo: tira due volte la probabilità di incrociare lo sguardo del nemico. Fornisce bonus di potenziamento anche contro raggi. Solo scudi metallici."},{"id":"sprezzante_1","nome":"Sprezzante","val":1,"nuova":false,"testo":"Tira 1d12 per il tipo nemico. Contro di essi il bonus di potenziamento alla CA è migliore di +2 e lo scudo conferisce RD 2/– contro i loro attacchi."},{"id":"stamina_1","nome":"Stamina","val":1,"nuova":false,"testo":"Il portatore ottiene bonus +1 ai TS su Tempra."},{"id":"torneo_1","nome":"Torneo","val":1,"nuova":false,"testo":"Il portatore ottiene bonus +5 a Cavalcare."},{"id":"agile_da_scudo_1","nome":"Agile da Scudo","val":1,"nuova":true,"testo":"Il portatore ottiene bonus di schivare +1 alla CA contro attacchi in mischia quando impugna questo scudo e non ha usato azioni di movimento nel turno precedente."},{"id":"echeggiante_1","nome":"Echeggiante","val":1,"nuova":true,"testo":"Tre volte al giorno, quando lo scudo para un attacco (il portatore supera un TS su Riflessi con Deviazione Frecce o simile), emette un'onda sonora che infligge 1d4 × bonus di potenziamento danni sonori a tutte le creature entro 1,5 m."},{"id":"muraglia_1","nome":"Muraglia","val":1,"nuova":true,"testo":"Il portatore può usare lo scudo per bloccare un'intera casella adiacente: quella casella è considerata terreno difficile per i nemici che tentano di attraversarla. Effetto attivo finché il portatore rimane adiacente."},{"id":"parante_1","nome":"Parante","val":1,"nuova":true,"testo":"Una volta per round, come azione immediata, il portatore può usare lo scudo per ridurre i danni di un attacco in mischia di 1d6+bonus di potenziamento."},{"id":"provocante_1","nome":"Provocante","val":1,"nuova":true,"testo":"Il portatore può usare lo scudo per attirare l'attenzione dei nemici: come azione standard, un nemico entro 6 m deve superare un TS su Volontà (CD 10 + ½ DV + bonus potenziamento) o essere costretto ad attaccare il portatore nel prossimo turno."},{"id":"resonante_1","nome":"Resonante","val":1,"nuova":true,"testo":"Lo scudo vibra alla frequenza degli incantesimi nemici: il portatore ottiene bonus di competenza +2 ai TS contro incantesimi e capacità magiche."},{"id":"scudo_sacro_1","nome":"Scudo Sacro","val":1,"nuova":true,"testo":"Una volta al giorno, come azione standard il portatore può consacrare lo scudo: per 1 minuto, qualsiasi non morto che si trovi entro 3 m all'inizio del proprio turno subisce 1d6 danni sacri."},{"id":"animato_2","nome":"Animato","val":2,"nuova":false,"testo":"Come azione di movimento, lo scudo si anima per 4 round difendendo il portatore autonomamente (con tutti i bonus passivi). Non compie azioni attive autonomamente. Una volta ripreso, non può rianinarsi per 4 round. Incompatibile con scudi torre."},{"id":"anti_contusione_2","nome":"Anti-contusione","val":2,"nuova":false,"testo":"Il portatore ottiene RD 5/tagliente o perforante."},{"id":"anti_taglio_2","nome":"Anti-taglio","val":2,"nuova":false,"testo":"Il portatore ottiene RD 5/contundente o perforante."},{"id":"brillante_2","nome":"Brillante","val":2,"nuova":false,"testo":"Come azione standard, irradia luce come torcia. Una volta al giorno, può brillare come Luce diurna per 1 ora."},{"id":"deviazione_delle_frecce_2","nome":"Deviazione delle Frecce","val":2,"nuova":false,"testo":"Una volta per round, quando colpito da un'arma da tiro o lancio, il portatore può effettuare un TS su Riflessi (CD 20 + bonus potenziamento arma) per deviare l'attacco. Non funziona su armi eccezionali."},{"id":"guardia_superiore_2","nome":"Guardia Superiore","val":2,"nuova":false,"testo":"Come Guardia, ma il portatore può distribuire il bonus di potenziamento a qualsiasi numero di creature adiacenti. Richiede Guardia."},{"id":"immunita_energetica_2","nome":"Immunità Energetica","val":2,"nuova":false,"testo":"Come azione standard, per 1 minuto immunità a un tipo di energia a scelta."},{"id":"muro_ectoplasmico_2","nome":"Muro Ectoplasmico","val":2,"nuova":false,"testo":"Una volta al giorno, crea un muro di ectoplasma (3 m², o sfera con raggio 3 m, 20 PF, durezza 5). Blocca creature incorporee. Persiste 7 round."},{"id":"rapido_2","nome":"Rapido","val":2,"nuova":false,"testo":"Il portatore ottiene Mobilità. Una volta al giorno, come azione veloce può effettuare un'azione di movimento."},{"id":"resistenza_agli_incantesimi_13_2","nome":"Resistenza agli Incantesimi 13","val":2,"nuova":false,"testo":"Il portatore ottiene RI 13."},{"id":"soffio_del_dragone_2","nome":"Soffio del Dragone","val":2,"nuova":false,"testo":"Accumula cariche (1 per ogni 5 danni di un tipo di energia scelto subiti). Come azione standard, spende fino a 5 cariche per emettere un cono di 4,5 m (1d6/carica). TS su Riflessi per dimezzare. Max 5 cariche, svaniscono dopo 24 ore."},{"id":"stridente_2","nome":"Stridente","val":2,"nuova":false,"testo":"Tre volte al giorno, come azione immediata quando colpito in mischia: vibrazioni attraverso l'arma attaccante. L'attaccante supera un TS su Tempra (CD 5 + ½ DV + bonus totale) o è frastornato 1 round."},{"id":"cattura_incantesimi_2","nome":"Cattura Incantesimi","val":2,"nuova":true,"testo":"Una volta al giorno, come azione immediata quando il portatore sarebbe colpito da un incantesimo, lo scudo assorbe l'incantesimo (livello massimo pari al bonus di potenziamento). L'incantesimo è neutralizzato."},{"id":"coperta_di_forza_2","nome":"Coperta di Forza","val":2,"nuova":true,"testo":"Il portatore può estendere un campo di forza attorno allo scudo che funziona come uno scudo di taglia superiore (+1 bonus di scudo aggiuntivo) per 5 round al giorno."},{"id":"deflettore_magico_2","nome":"Deflettore Magico","val":2,"nuova":true,"testo":"Ogni incantesimo che colpisce lo scudo (TS su Riflessi riuscito) ha il 25% di essere riflesso verso la casella di origine."},{"id":"fortezza_dello_scudo_2","nome":"Fortezza dello Scudo","val":2,"nuova":true,"testo":"Quando il portatore usa l'azione difendersi (Combat Expertise o equivalente), il bonus CA ottenuto aumenta di 1 grazie allo scudo."},{"id":"muro_reattivo_2","nome":"Muro Reattivo","val":2,"nuova":true,"testo":"Una volta al giorno, come azione immediata, quando un alleato entro 9 m sarebbe colpito, il portatore può proiettare un campo di protezione: l'alleato ottiene copertura totale contro quell'attacco."},{"id":"ribaltante_2","nome":"Ribaltante","val":2,"nuova":true,"testo":"Quando il portatore supera con successo una manovra di Sbilanciare, lo scudo può essere usato come parte della manovra: il nemico sbilanciato subisce anche 1d6+bonus potenziamento danni contundenti."},{"id":"scudo_assorbente_2","nome":"Scudo Assorbente","val":2,"nuova":true,"testo":"Ogni round in cui il portatore subisce danni fisici da attacchi in mischia, lo scudo assorbe 2 danni (riduzione automatica), cumulandola con qualsiasi RD."},{"id":"scudo_del_guardiano_2","nome":"Scudo del Guardiano","val":2,"nuova":true,"testo":"Una volta al giorno, come azione immediata il portatore può trasferire su sé stesso tutto il danno che un alleato adiacente avrebbe subito da un singolo attacco."},{"id":"turbine_di_scudi_2","nome":"Turbine di Scudi","val":2,"nuova":true,"testo":"Come azione di round completo, il portatore può fare roteare lo scudo colpendo tutte le creature adiacenti con un attacco (tiro per colpire separato per ognuna, danni base dello scudo + bonus potenziamento)."},{"id":"vibrante_2","nome":"Vibrante","val":2,"nuova":true,"testo":"Ogni volta che il portatore blocca un attacco con una parata (tramite Deviazione Frecce o simili), lo scudo emette un campo vibrante: tutte le creature entro 1,5 m subiscono 1d4 × bonus di potenziamento danni sonori."},{"id":"barriera_di_forza_3","nome":"Barriera
