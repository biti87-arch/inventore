    kv('PF',pf,'10 + 6/DV + bonus'+(X.temp?' · +'+X.temp+' temp.':''))+kv('CA',X.ca)+kv('DV',X.r.dv)+kv('BAB',esc(X.r.bab))+
    kv('Tempra',sg(X.ts.tempra))+kv('Riflessi',sg(X.ts.rif))+kv('Volontà',sg(X.ts.vol))+
    kv('For',X.For,sg(X.mF))+kv('Des',X.Des,sg(X.mD))+kv('BMC / DMC',sg(X.bmc)+' / '+X.dmc)+kv('Velocità',X.vel+' m')+kv('Portata',String(X.portata).replace('.',',')+' m')+
    (X.ri?kv('RI',X.ri):'')+(X.rd?kv('RD','10/adam.'):'')+'</div>'+
    '<div class="atk" style="margin-top:10px">'+X.att.map(a=>'<div class="l"><span>'+esc(a.nome)+(a.nota?' <span class="note">'+esc(a.nota)+'</span>':'')+'</span><span>'+a.txc.map(sg).join('/')+' ('+esc(a.dan)+' '+esc(a.tipo)+'; '+esc(a.crit)+')</span></div>').join('')+'</div>'+
    '<div class="note" style="margin-top:6px">Gli attacchi dell\'automaton funzionano come armi: attacchi multipli secondo il BAB; lo schianto del Destructor è a due mani (1½ × For), gli altri usano la For intera. A 0 PF è <span class="cond">barcollante</span>, a −15 PF è distrutto. Car 1, immune a Tempra (salvo effetti su oggetti).</div></div>';
  h+=pannelloCap('autArma',A.modello==='sagittar'?'distanza':'mischia',X.inc,'Capacità speciali: '+(A.modello==='destructor'?'Schianto idraulico':A.modello==='defensor'?'Schianto meccanico':'Sparaculei'),true);
  h+=pannelloCap('autScocca','armatura',X.inc,'Capacità speciali: scocca',false);
  h+=cardModificatori('aut');
  // stadi

  for(let s=0;s<=3;s++){
    const v=D.automaton.voci.filter(x=>x.stadio===s&&x.modelli.includes(A.modello)&&!x.nome.startsWith('Incantamenti'));
    const blocco=s>st;
    h+='<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+STN[s]+'</h2><span class="tag'+(blocco?'':' acc')+'">'+(blocco?(s>=2&&L>=15?'solo specializzazione':'dal '+ORD(STADIO_AL[s])):'attivo')+'</span></div><div style="margin-top:8px">'+v.map(x=>det(esc(x.nome),rich(x.testo))).join('')+'</div></div>';

  const L=lv();
  if(!haEso())return '<div class="card"><h2>Esoscheletro</h2><p>L\'inventore impara a costruire gli esoscheletri al '+(has('cibernetico')?'3°':'5°')+' livello.</p></div>';
  const st=stadioE(),nm=nodiMaxE(),cib=has('cibernetico');
  let h='';
  if(!cib)h+='<div class="card"><h2>Tipo</h2><div class="seg">'+[['L','Leggero'],['P','Pesante']].map(([k,n])=>'<button data-et="'+k+'" aria-pressed="'+(S.esoTipo===k)+'">'+n+'</button>').join('')+'</div><div class="note" style="margin-top:6px">Un inventore può avere un solo esoscheletro: cambiare tipo significa smantellarlo e costruirne un altro.</div></div>';
  else h+='<div class="banner">Cibernetico: esoscheletro leggero e pesante attivi insieme (se ne indossa uno alla volta).</div>';

    const e=S.esos[t],inst=esoMods(t),usati=nodiUsati(inst,EMOD),a=ARM[e.armatura];
    h+='<div class="card"><h2>Esoscheletro '+(t==='L'?'leggero':'pesante')+'</h2><div class="grid">'+
      '<div class="field" style="grid-column:span 2"><label class="label" for="e-arm-'+t+'">Armatura base</label><select id="e-arm-'+t+'" data-earm="'+t+'"><option value="">— scegli —</option>'+D.eso.armature.filter(x=>x.tipo===t).map(x=>'<option value="'+x.id+'"'+(e.armatura===x.id?' selected':'')+'>'+esc(x.nome)+' (+'+x.ca+')</option>').join('')+'</select></div>'+
      '</div>'+
      (a?'<div class="kv" style="margin-top:10px">'+kv('Bonus armatura','+'+(a.ca+1+sintArmatura()),'base '+a.ca+' + 1 migliorata'+(sintArmatura()?' + '+sintArmatura()+' sintonia':''))+kv('Des max',sg(a.maxDes))+kv('Penalità',Math.min(0,a.pen+1))+kv('Cariche',caricheEso())+kv('Nodi',usati+'/'+nm)+(potStrutt(t)?kv('Potenziamento',sg(potStrutt(t)),t==='L'?'Destrezza':'Forza'):'')+'</div>'+(a.speciale?'<div class="note" style="margin-top:6px">Qualità: '+esc(a.speciale)+(/Scomoda/.test(a.speciale)&&hasOpt('eso:imbottitura_deluxe')?' (Scomoda ignorata: Imbottitura deluxe)':'')+'.</div>':''):'<div class="note" style="margin-top:8px">Scegli l\'armatura base (perfetta o magica).</div>')+'</div>';
    h+='<div class="nodi'+(usati>nm?' over':'')+'"><span>Nodi installati ('+(t==='L'?'leggero':'pesante')+')</span><b>'+usati+' / '+nm+'</b></div>';
    for(let s=0;s<=3;s++){
      const el=D.eso.mods.filter(m=>m.stadio===s&&(m.tipo==='C'||m.tipo===t));
      const blocco=s>st;
      h+='<details'+(s===st?' open':'')+'><summary><span>'+['Funzionalità di base','Aggiornamento del 10° livello','Aggiornamento del 15° livello','Aggiornamento del 20° livello'][s]+'</span><span class="tag'+(blocco?'':' acc')+'">'+(blocco?(s>=2&&L>=15?'solo specializzazione':'dal '+ORD(STADIO_EL[s])):'disponibile')+'</span></summary><div class="list" style="margin-top:8px">';
      for(const m of el){
        if(m.auto){h+='<div class="opt"><input type="checkbox" checked disabled aria-label="'+esc(m.nome)+'"><details style="border:0;padding:0;background:none"><summary><span>'+esc(m.nome)+' <span class="tag">sempre attiva</span></span></summary><div class="txt">'+rich(m.testo)+'</div></details><span class="tag cb">0 n</span></div>';continue;}
        const i=inst.includes(m.id);const scop=S.scoperte.slice(0,scoperteMax()).some(x=>x&&x.tipo===t&&x.id===m.id);
        const pb=blocco?'':modOk(m,inst.filter(x=>x!==m.id),EMOD,null);
        const troppi=!i&&usati+m.nodi>nm;
        h+='<div class="opt'+(i&&pb?' bad':'')+(blocco?' dim':'')+'"><input type="checkbox" data-em="'+t+'|'+m.id+'" aria-label="Installa '+esc(m.nome)+'"'+(i?' checked':'')+((blocco||(!i&&(pb||troppi)))?' disabled':'')+'>'+
          '<details style="border:0;padding:0;background:none"><summary><span>'+esc(m.nome)+(m.passiva?' <span class="tag">passiva</span>':'')+(m.sempre?' <span class="tag">sempre attiva</span>':'')+(scop?' <span class="tag acc">scoperta</span>':'')+'</span></summary><div class="txt">'+rich(m.testo)+(m.incompatSpeciale?'<p class="note">Non si combina con la capacità speciale '+esc(m.incompatSpeciale)+' dell\'armatura base.</p>':'')+'</div></details><span class="tag cb">'+m.nodi+' n</span></div>';
      }

  if(cib)h+='<div class="note">Cibernetico: i due esoscheletri contano come una sola armatura per la sintonia; le capacità speciali elencate valgono per entrambi.</div>';

    h+='<div class="card"><h2>Scoperte sugli esoscheletri</h2><div class="note" style="margin-bottom:8px">Al 3°, 7°, 11°, 15° e 19° livello: una modifica in più che non occupa nodi.</div><div class="list">'+
      [3,7,11,15,19].slice(0,sm).map((n,i)=>'<div class="slot"><span class="lv">'+ORD(n)+'</span><select data-scop="'+i+'">'+opzMod(S.scoperte[i],false)+'</select></div>').join('')+'</div></div>';
    if(im)h+='<div class="card"><h2>Innesti permanenti</h2><div class="note" style="margin-bottom:8px">Una modifica della Funzionalità di base (esclusi i potenziamenti strutturali) sempre attiva, anche senza esoscheletro.</div><div class="list">'+
      [6,12,18].slice(0,im).map((n,i)=>'<div class="slot"><span class="lv">'+ORD(n)+'</span><select data-inn="'+i+'">'+opzMod(S.innesti[i],true)+'</select></div>').join('')+'</div></div>';
  }
  const op=D.eso.optional.filter(o=>hasOpt('eso:'+o.id));
  h+='<div class="card"><h2>Optional appresi</h2>'+(op.length?op.map(o=>det(esc(o.nome),rich(o.testo))).join(''):'<div class="note">Nessuno. Gli optional si scelgono ai livelli pari nella scheda Inventore.</div>')+'</div>';
  h+='<div class="card"><h2>Regole</h2>'+D.eso.regole.map(r=>det(esc(r.nome),rich(r.testo))).join('')+'</div>';
  return h;
}

function gadTag(g){const L=lv();const m=g.migliorie.filter(x=>x<=L+(hasDote('fanatico_dei_gadget')?2:0));return m.length?'<span class="tag acc">migliorie: '+m.map(ORD).join(', ')+'</span>':'';}
function gadInfo(g){
  const r=[];
  if(g.req>1)r.push('Requisito: '+ORD(g.req)+' livello'+(g.reqExtra?', '+g.reqExtra:''));
  else if(g.reqExtra)r.push('Requisito: '+g.reqExtra);
  if(g.sperimentale){r.push('Arma sperimentale'+(hasDote('competenza_nelle_armi_sperimentali')?'':' — serve la dote Competenza nelle armi sperimentali'));
    if(has('skitari')){const L=lv();r.push('Skitari: conta come livello '+(L+(L>=10?2:1))+', '+(L>=16?3:2)+' attivazioni al giorno (1 ora tra una e l\'altra), CD '+(cd()+(L>=7?2:L>=4?1:0)));}
    else r.push('CD '+cd());}
  const ch=caricheGad(g);if(ch)r.push('Cariche: '+ch);
  if(g.usi)r.push(g.usi+' attivazioni al giorno');
  return r.length?'<p class="note">'+r.map(esc).join(' · ')+'</p>':'';
}
function caricheGad(g){
  const I=Math.max(0,INT());
  if(g.id==='scanner'){if(has('tecno_infiltratore')&&lv()>=5)return 5+I;return 3+I;}
  if(g.id==='lente_analitica')return 3+I;
  if(g.id==='voltometro_a_campo_logico')return 3+2*I;
  return 0;
}

/* =================== TAB IN GIOCO =================== */
function contatore(key,lab,max,sub){
  const G2=S.gioco;const used=Math.min(max,+(key.split('.').reduce((o,k)=>o?o[k]:0,G2))||0);const left=max-used;
  return '<div class="ctr"><div><b style="text-align:left;display:inline;min-width:0">'+esc(lab)+'</b>'+(sub?'<div class="note">'+sub+'</div>':'')+'<div class="bar"><i'+(left<=max/4?' class="low"':'')+' style="width:'+(max?left/max*100:0)+'%"></i></div></div>'+
    '<div class="pips"><button class="btn sm" data-ctr="'+key+'" data-d="1"'+(left<=0?' disabled':'')+' aria-label="Usa">−</button><b>'+left+'/'+max+'</b><button class="btn sm" data-ctr="'+key+'" data-d="-1"'+(used<=0?' disabled':'')+' aria-label="Recupera">+</button></div></div>';
}
function rGioco(){
  const L=lv(),Gg=S.gioco,I=calcInv();
  let h='<section class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Giornata</h2><button class="btn pri" id="alba">Nuova alba</button></div>';
  // PF
  const pf=dividiPF(I.pf);const fat=Gg.pfFat==null?pf.fat:Gg.pfFat,fer=Gg.pfFer==null?pf.fer:Gg.pfFer;
  h+='<div class="card"><h2>'+esc(S.nome)+'</h2><div class="grid">'+numIn('g-fat','Punti Fatica (max '+pf.fat+')',fat)+numIn('g-fer','Punti Ferita (max '+pf.fer+')',fer)+
    '<div class="field"><label class="label" for="g-dan">Danni subiti</label><input id="g-dan" type="number" inputmode="numeric" placeholder="0"></div></div>'+
    '<div class="note" style="margin-top:6px">I danni colpiscono prima i Punti Fatica.</div>';
  const es=esoTipi();
  if(es.length)h+='<div class="seg" style="margin-top:10px"><button data-ind="" aria-pressed="'+(!indossa())+'">Senza esoscheletro</button>'+es.map(t=>'<button data-ind="'+t+'" aria-pressed="'+(indossa()===t)+'">'+(t==='L'?'Leggero':'Pesante')+'</button>').join('')+'</div>';
  h+='<div class="kv" style="margin-top:10px">'+kv('CA',I.ca,'cont. '+I.contatto+' · impr. '+I.impr)+kv('Velocità',String(I.vel).replace('.',',')+' m','taglia '+I.taglia)+kv('Iniziativa',sg(I.iniz))+(I.pfTemp?kv('PF temporanei',I.pfTemp):'')+kv('For',I.c.For,sg(I.M.For))+kv('Des',I.c.Des,sg(I.M.Des))+kv('Tempra',sg(I.ts.tempra))+kv('Riflessi',sg(I.ts.rif))+kv('Volontà',sg(I.ts.vol))+kv('BMC / DMC',sg(I.bmc)+' / '+I.dmc)+'</div></div>';
  h+=cardModificatori('inv');
  // riserve
  h+='<div class="card"><h2>Riserve</h2><div class="list">';
  h+=contatore('rip',has('ingegnere_da_campo')?'Cauterizzare ('+dadiRip()+')':'Riparazioni ('+dadiRip()+')',usiRip(),has('ingegnere_da_campo')?'cura sé stesso; senza AdO la cura è dimezzata':'dimezzate su costrutti non propri');
  if(haTecno())h+=contatore('tecnoC','Cariche della tecno-arma',caricheTecno());
  for(const t of es)h+=contatore('esoC.'+t,'Cariche esoscheletro '+(t==='L'?'leggero':'pesante'),caricheEso());
  if(has('tecnomante'))h+=contatore('emett','Emettitore (round)',roundEmett());
  if(hasDote('cellule_energetiche_argus')&&!has('mechautarca'))h+=contatore('argus','Cellule Argus',Math.max(0,INT()));
  for(const x of gadgets()){const g=GAD[x.id];const c=caricheGad(g)||g.usi||(g.sperimentale?(has('skitari')?(L>=16?3:2):1):0);if(c)h+=contatore('gadget.'+g.id,g.nome,c,g.sperimentale&&!hasDote('competenza_nelle_armi_sperimentali')?'serve la dote Competenza nelle armi sperimentali':'');}
  h+='</div></div>';
  // mechanus
  if(haMech()){
    h+='<div class="card"><h2>Mechanus</h2><div class="list">';
    for(let l=1;l<=mechLivMax();l++)h+=contatore('mech.'+(l-1),'Mechanus di '+l+'° livello',mechGiorno(l),'CD '+cdMech(l)+' · conosciuti: '+(conosc(l).map(id=>MECH[id].nome).join(', ')||'nessuno'));
    if(hasDote('mechanus_extra'))h+=contatore('jolly','Mechanus extra (qualsiasi livello)',1);
    h+='</div></div>';
  }
  // tecno-arma in combattimento
  if(haTecno()){
    const C=calcTecno(I),inst=modsT().filter(id=>!TMOD[id].sempre);
    h+='<div class="card"><h2>Tecno-arma</h2><div class="atk"><div class="l"><span>'+esc(C.w.nome)+'</span><span>'+C.bab.map(sg).join('/')+' ('+C.dado+sg(C.dan).replace(/\+0$/,'')+(C.ext.length?' '+C.ext.join(', '):'')+'; '+esc(C.crit)+')</span></div></div>';
    if(inst.length)h+='<div class="label" style="margin-top:10px">Modifiche attive (1 carica, 1 minuto)</div><div class="chips" style="margin-top:6px">'+inst.map(id=>'<button class="chip" data-att="T|'+id+'" aria-pressed="'+Gg.attiviT.includes(id)+'">'+esc(TMOD[id].nome)+'</button>').join('')+'</div><div class="note" style="margin-top:6px">Accendere una modifica spende 1 carica.</div>';
    h+='</div>';
  }
  // esoscheletro in combattimento
  if(indossa()){
    const t=indossa(),inst=esoAttive(t).filter(id=>!EMOD[id].sempre&&!EMOD[id].auto);
    if(inst.length)h+='<div class="card"><h2>Esoscheletro '+(t==='L'?'leggero':'pesante')+'</h2><div class="chips">'+inst.map(id=>'<button class="chip" data-att="E|'+id+'" aria-pressed="'+Gg.attiviE.includes(id)+'">'+esc(EMOD[id].nome)+'</button>').join('')+'</div><div class="note" style="margin-top:6px">Accendere una modifica spende 1 carica.</div></div>';
  }
  if(has('cibernetico')&&S.innesti.filter(Boolean).length)h+='<div class="card"><h2>Innesti permanenti</h2><div class="note">'+S.innesti.filter(Boolean).map(x=>esc(EMOD[x.id]?EMOD[x.id].nome:x.id)).join(', ')+' — sempre attivi, senza cariche.</div></div>';
  // automaton
  if(haAut()){
    const X=calcAut();const cur=Gg.autPF==null?X.pf:Gg.autPF;const tmp=Gg.autTemp==null?X.temp:Gg.autTemp;
    h+='<div class="card"><h2>Automaton '+esc(X.M0.nome)+'</h2><div class="grid">'+numIn('g-apf','PF (max '+X.pf+')',cur)+(X.temp?numIn('g-atmp','PF temporanei',tmp):'')+
      '<div class="field"><label class="label" for="g-adan">Danni</label><input id="g-adan" type="number" inputmode="numeric" placeholder="0"></div></div>'+
      (cur<=0?'<div class="banner warn" style="margin-top:8px">A 0 PF o meno l\'automaton è <span class="cond">barcollante</span>; a −15 PF è distrutto.</div>':'')+
      '<div class="kv" style="margin-top:10px">'+kv('CA',X.ca)+kv('Tempra',sg(X.ts.tempra))+kv('Riflessi',sg(X.ts.rif))+kv('Volontà',sg(X.ts.vol))+'</div>'+
      '<div class="atk" style="margin-top:10px">'+X.att.map(a=>'<div class="l"><span>'+esc(a.nome)+'</span><span>'+a.txc.map(sg).join('/')+' ('+esc(a.dan)+'; '+esc(a.crit)+')</span></div>').join('')+'</div>';
    const odK={destructor:'modulo_overdrive_alpha',defensor:'modulo_overdrive_beta',sagittar:'modulo_overdrive_gamma'}[S.aut.modello];
    if(autOpt(odK))h+='<div class="row" style="margin-top:10px"><button class="chip" id="od" aria-pressed="'+!!Gg.overdriveOn+'">'+esc(OPTK['automaton:'+odK].nome)+' ('+(1+Math.floor(Math.max(0,INT())/2))+' round)</button><span class="note">'+(Gg.overdrive?'usato oggi':'1 al giorno')+'</span></div>';
    if(X.pfTempEff)h+='<div class="note" style="margin-top:6px">PF temporanei dai modificatori: '+X.pfTempEff+'.</div>';
    if(autOpt('modulo_di_difesa_istrice'))h+='<div class="row" style="margin-top:6px"><button class="chip" id="ist" aria-pressed="'+!!Gg.istrice+'">Punte “Istrice” fuori</button></div>';
    h+='</div>'+cardModificatori('aut');
  }
  h+='<div class="card"><h2>Appunti</h2><textarea id="g-note" style="width:100%;min-height:80px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit">'+esc(Gg.note)+'</textarea></div>';
  h+='</section>';
  main.innerHTML=h;
  bindModificatori();
  onAll('[data-ctr]','click',el=>{const ks=el.dataset.ctr.split('.');let o=S.gioco;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]];}const k=ks[ks.length-1];o[k]=Math.max(0,(+o[k]||0)+(+el.dataset.d));render();});
  on('alba','click',()=>conferma('Nuova alba: ripristinare cariche, usi e mechanus?','Ripristina',()=>{const g=S.gioco;Object.assign(g,{rip:0,mech:[0,0,0,0,0,0],jolly:0,argus:0,tecnoC:0,esoC:{L:0,P:0},emett:0,gadget:{},overdrive:0,overdriveOn:false,attiviT:[],attiviE:[],autTemp:null});render();}));
  on('g-fat','change',e=>{Gg.pfFat=+e.target.value;render();});
  on('g-fer','change',e=>{Gg.pfFer=+e.target.value;render();});
  on('g-dan','change',e=>{let d=+e.target.value||0;let f=fat,r=fer;if(d>0){const a=Math.min(Math.max(0,f),d);f-=a;r-=d-a;}else{r=Math.min(pf.fer,r-d);}Gg.pfFat=f;Gg.pfFer=r;render();});
  onAll('[data-ind]','click',el=>{Gg.indossa=el.dataset.ind;Gg.attiviE=[];render();});
  onAll('[data-att]','click',el=>{const [t,id]=el.dataset.att.split('|');const arr=t==='T'?Gg.attiviT:Gg.attiviE;const i=arr.indexOf(id);
    if(i>=0)arr.splice(i,1);else{arr.push(id);if(t==='T')Gg.tecnoC=Math.min(caricheTecno(),(+Gg.tecnoC||0)+1);else{const w=indossa();Gg.esoC[w]=Math.min(caricheEso(),(+Gg.esoC[w]||0)+1);}}
    render();});
  on('g-apf','change',e=>{Gg.autPF=+e.target.value;render();});
  on('g-atmp','change',e=>{Gg.autTemp=+e.target.value;render();});
  on('g-adan','change',e=>{const X=calcAut();let d=+e.target.value||0;let tmp=Gg.autTemp==null?X.temp:Gg.autTemp;let cur=Gg.autPF==null?X.pf:Gg.autPF;if(d>0){const a=Math.min(tmp,d);tmp-=a;d-=a;cur-=d;}else cur=Math.min(X.pf,cur-d);Gg.autTemp=tmp;Gg.autPF=cur;render();});
  on('od','click',()=>{if(!Gg.overdriveOn&&!Gg.overdrive){Gg.overdriveOn=true;Gg.overdrive=1;}else Gg.overdriveOn=false;render();});
  on('ist','click',()=>{Gg.istrice=!Gg.istrice;render();});
  on('g-note','change',e=>{Gg.note=e.target.value;save();});
}

/* ---------- modificatori ---------- */
function riassuntoEff(e){
  const p=[];
  for(const [k,l] of MODCAMPI)if(+e[k])p.push(l.replace(' (m)','').replace(' (passi)','')+' '+sg(+e[k])+(k==='vel'?' m':''));
  for(const k of CAR){const v=(+(e.car||{})[k]||0)+(+(e.carT||{})[k]||0);if(v)p.push(k+' '+sg(v));}
  return p.join(', ')||'nessun valore';
}
function cardModificatori(ch){
  const l=effLista(ch);
  return '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Modificatori'+(ch==='aut'?' dell\'automaton':'')+'</h2><button class="btn sm pri" data-modbtn="'+ch+'">Gestisci</button></div>'+
    (l.length?'<div class="chips" style="margin-top:8px">'+l.map((e,i)=>'<button class="chip" data-tog="'+ch+'|'+i+'" aria-pressed="'+!!e.attivo+'">'+esc(e.nome)+(e.perm?' · perm.':'')+'</button>').join('')+'</div><p class="note">Tocca un modificatore per attivarlo o disattivarlo. I valori li includono già.</p>':
     '<p class="note">Nessun modificatore. Aggiungi incantesimi, effetti o oggetti magici con Gestisci.</p>')+'</div>';
}
function bindModificatori(){
  onAll('[data-modbtn]','click',el=>apriModificatori(el.dataset.modbtn));
  onAll('[data-tog]','click',el=>{const [ch,i]=el.dataset.tog.split('|');const e=effLista(ch)[+i];e.attivo=!e.attivo;render();});
}
function apriModificatori(ch){
  const L2=effLista(ch);
  const blocco=perm=>{
    const l=L2.map((e,i)=>({e,i})).filter(x=>!!x.e.perm===perm);
    return '<h3 style="margin:14px 0 6px">'+(perm?'Permanenti (oggetti magici e simili)':'Temporanei (incantesimi ed effetti)')+'</h3><div class="list">'+
      (l.length?l.map(({e,i})=>'<div class="featRow"><label class="check" style="flex:1"><input type="checkbox" data-matt="'+i+'"'+(e.attivo?' checked':'')+'><span><b>'+esc(e.nome)+'</b><br><span class="note">'+esc(riassuntoEff(e))+'</span></span></label><button class="btn sm" data-med="'+i+'">Modifica</button></div>').join(''):'<p class="note">Nessuno.</p>')+
      '</div><button class="btn sm" data-mnuovo="'+(perm?1:0)+'" style="margin-top:8px">Aggiungi '+(perm?'permanente':'temporaneo')+'</button>';
  };
  modal('<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Modificatori'+(ch==='aut'?' dell\'automaton':' dell\'inventore')+'</h2><button class="btn sm" data-close>Chiudi</button></div><p class="note">Si sommano ai valori della scheda. Le tre CA sono separate: un bonus di deviazione va messo su tutte e tre, un bonus di armatura naturale su CA e impreparato. La taglia sposta anche i dadi di danno e i modificatori di taglia; le caratteristiche dovute al cambio di taglia si scelgono a mano.</p>'+blocco(false)+blocco(true)+
    (L2.some(e=>!e.perm&&e.attivo)?'<div class="row" style="margin-top:14px"><button class="btn" id="mspegni">Disattiva tutti i temporanei</button></div>':'')+'</div>');
  M.querySelectorAll('[data-matt]').forEach(x=>x.addEventListener('change',()=>{L2[+x.dataset.matt].attivo=x.checked;render();apriModificatori(ch);}));
  M.querySelectorAll('[data-med]').forEach(x=>x.addEventListener('click',()=>editaEffetto(ch,+x.dataset.med)));
  M.querySelectorAll('[data-mnuovo]').forEach(x=>x.addEventListener('click',()=>{L2.push({id:'e'+Date.now(),nome:x.dataset.mnuovo==='1'?'Nuovo oggetto':'Nuovo effetto',perm:x.dataset.mnuovo==='1',attivo:true,car:{},carT:{}});save();editaEffetto(ch,L2.length-1);}));
  const sp=document.getElementById('mspegni');if(sp)sp.addEventListener('click',()=>{L2.forEach(e=>{if(!e.perm)e.attivo=false;});render();apriModificatori(ch);});
}
function editaEffetto(ch,i){
  const e=effLista(ch)[i];e.car=e.car||{};e.carT=e.carT||{};
  const campi=ch==='aut'?MODCAMPI.filter(([k])=>!['caCont','caImpr','iniz'].includes(k)):MODCAMPI;
  const inp=(id,v,lab)=>'<div class="field"><label class="label" for="'+id+'">'+lab+'</label><input id="'+id+'" type="number" inputmode="numeric" value="'+(+v||0)+'"></div>';
  modal('<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+(e.perm?'Modificatore permanente':'Modificatore temporaneo')+'</h2><button class="btn sm" id="edOk">Fatto</button></div>'+
    '<div class="grid" style="margin-top:10px"><div class="field" style="grid-column:1/-1"><label class="label" for="ed-nome">Nome</label><input id="ed-nome" value="'+esc(e.nome)+'"></div>'+
    '<label class="check" style="grid-column:1/-1"><input type="checkbox" id="ed-att"'+(e.attivo?' checked':'')+'><span>Attivo</span></label>'+
    '<label class="check" style="grid-column:1/-1"><input type="checkbox" id="ed-perm"'+(e.perm?' checked':'')+'><span>Permanente (oggetto magico o effetto di lunga durata)</span></label></div>'+
    '<h3 style="margin:14px 0 6px">Valori</h3><div class="grid">'+campi.map(([k,l])=>inp('ed-'+k,e[k],l)).join('')+'</div>'+
    '<h3 style="margin:14px 0 6px">Caratteristiche dovute al cambio di taglia</h3><div class="grid">'+['For','Des','Cos'].map(k=>inp('ed-t'+k,e.carT[k],CAR_N[k])).join('')+'</div>'+
    '<h3 style="margin:14px 0 6px">Altre modifiche alle caratteristiche</h3><div class="grid">'+(ch==='aut'?['For','Des']:CAR).map(k=>inp('ed-c'+k,e.car[k],CAR_N[k])).join('')+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn pri" id="edOk2">Salva</button><button class="btn danger" id="edDel">Elimina</button></div></div>');
  const salva=()=>{
    e.nome=document.getElementById('ed-nome').value||'Senza nome';
    e.attivo=document.getElementById('ed-att').checked;e.perm=document.getElementById('ed-perm').checked;
    for(const [k] of campi)e[k]=+document.getElementById('ed-'+k).value||0;
    for(const k of ['For','Des','Cos'])e.carT[k]=+document.getElementById('ed-t'+k).value||0;
    for(const k of (ch==='aut'?['For','Des']:CAR))e.car[k]=+document.getElementById('ed-c'+k).value||0;
    render();apriModificatori(ch);
  };
  document.getElementById('edOk').addEventListener('click',salva);document.getElementById('edOk2').addEventListener('click',salva);
  document.getElementById('edDel').addEventListener('click',()=>{effLista(ch).splice(i,1);render();apriModificatori(ch);});
}

/* ---------- finestre ---------- */
const M=document.getElementById('modal');
function modal(h){M.innerHTML='<div class="overlay" role="dialog" aria-modal="true">'+h+'</div>';M.querySelector('.overlay').addEventListener('click',e=>{if(e.target.classList.contains('overlay')||e.target.hasAttribute('data-close'))closeModal();});}
function closeModal(){M.innerHTML='';}
function conferma(testo,ok,fn){modal('<div class="card"><p>'+esc(testo)+'</p><div class="row"><button class="btn danger" id="okC">'+ok+'</button><button class="btn" data-close>Annulla</button></div></div>');document.getElementById('okC').addEventListener('click',()=>{closeModal();fn();});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
